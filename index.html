            cm.innerHTML = html;
            showCtx(x, y);
        }

        async function deleteSelected() {
            const selectedCount = SYSTEM.selectedIcons.filter(id => id.startsWith('file-')).length;
            if (!(await SysDialog.confirm({ title: '删除', icon: 'uiDelete', danger: true, okText: '删除', message: `确定删除选中的 ${selectedCount} 项吗？` }))) return;
            const files = SYSTEM.selectedIcons.filter(id => id.startsWith('file-'))
                          .map(id => document.getElementById(id).dataset.filename);
            
            if(files.length === 0) return;
            let count = 0;
            let errorCount = 0;
            const done = () => {
                count++;
                if(count === files.length) {
                    refreshDesktop();
                    if(errorCount > 0) Notify.error('部分失败', `删除完成，但有 ${errorCount} 项失败`);
                    else Notify.success('已删除');
                }
            };
            files.forEach(f => {
                const path = SYSTEM.desktopPath + '/' + f;
                SYSTEM.fs.stat(path, (err, stats) => {
                    // 修复(#12)：必须先检查 err / stats，否则文件在删除过程中被并发删除时
                    // stats 为 undefined，访问 stats.isDirectory() 抛 TypeError，
                    // 整个批量删除卡死、永远不刷新桌面。
                    if(err || !stats) {
                        console.error('删除失败(无法访问):', f, err);
                        errorCount++;
                        done();
                        return;
                    }
                    const isDir = stats.isDirectory ? (typeof stats.isDirectory === 'function' ? stats.isDirectory() : stats.isDirectory) : false;
                    const cb = (e) => { if(e) { console.error('删除失败:', f, e); errorCount++; } done(); };
                    if(isDir) deleteFolderRecursive(path, cb); else SYSTEM.fs.unlink(path, cb);
                });
            });
        }

        // === 复制/剪切/粘贴功能实现 ===

        // 刷新所有可能受影响的窗口
        function refreshAllAffectedWindows(destPath, srcPaths, isCut) {
            // 刷新桌面
            refreshDesktop();
            
            // 收集所有需要刷新的路径
            // 修复(#15)：不再只取第一层子目录，而是收集目标目录本身及源项目的父目录，
            // 这样无论窗口打开在哪一层深度都能被正确刷新，不会显示过时内容。
            const pathsToRefresh = new Set();
            const parentOf = (p) => {
                const idx = p.lastIndexOf('/');
                return idx > 0 ? p.substring(0, idx) : (idx === 0 ? '/' : p);
            };

            // 目标路径本身就是要刷新的目录（文件会被放进 destPath 目录）
            if (destPath) pathsToRefresh.add(destPath);

            // 如果是剪切/移动操作，源项目的父目录也需要刷新
            if (isCut && srcPaths.length > 0) {
                srcPaths.forEach(srcPath => {
                    if (srcPath) pathsToRefresh.add(parentOf(srcPath));
                });
            }
            
            // 遍历所有打开的文件夹窗口，找到路径匹配的窗口并刷新
            const refreshedWindows = new Set();
            Object.keys(SYSTEM.folderWindowStates || {}).forEach(wId => {
                const state = SYSTEM.folderWindowStates[wId];
                if (state) {
                    // 检查这个窗口的路径是否在需要刷新的路径列表中
                    pathsToRefresh.forEach(path => {
                        // 如果窗口的 currentPath 等于目标路径的父目录
                        if (state.currentPath === path) {
                            if (!refreshedWindows.has(wId)) {
                                state.fileStats = {};
                                renderFolderContent(wId);
                                refreshedWindows.add(wId);
                            }
                        }
                    });
                }
            });
        }

        // 桌面选中项复制
        function copySelectedDesktopItems() {
            const selectedFiles = SYSTEM.selectedIcons.filter(id => id.startsWith('file-'));
            if (selectedFiles.length === 0) {
                Notify.info('未选择文件');
                return;
            }
            
            Clipboard.clear();
            Clipboard.setCutMode(false);
            
            selectedFiles.forEach(id => {
                const el = document.getElementById(id);
                if (el && el.dataset.filename) {
                    Clipboard.add({
                        path: SYSTEM.desktopPath + '/' + el.dataset.filename,
                        filename: el.dataset.filename,
                        type: 'copy'
                    });
                }
            });
            
            Notify.success('已复制', `已复制 ${Clipboard.getItems().length} 个项目到剪贴板`);
        }

        // 桌面选中项剪切
        function cutSelectedDesktopItems() {
            const selectedFiles = SYSTEM.selectedIcons.filter(id => id.startsWith('file-'));
            if (selectedFiles.length === 0) {
                Notify.info('未选择文件');
                return;
            }
            
            Clipboard.clear();
            Clipboard.setCutMode(true);
            
            selectedFiles.forEach(id => {
                const el = document.getElementById(id);
                if (el && el.dataset.filename) {
                    Clipboard.add({
                        path: SYSTEM.desktopPath + '/' + el.dataset.filename,
                        filename: el.dataset.filename,
                        type: 'cut'
                    });
                    // 添加视觉反馈 - 降低透明度
                    el.style.opacity = '0.5';
                }
            });
            
            Notify.success('已剪切', `已剪切 ${Clipboard.getItems().length} 个项目`);
        }

        // 粘贴到桌面（顺序处理，避免竞态条件）
        function pasteToDesktop() {
            if (!Clipboard.hasItems()) {
                Notify.info('剪贴板为空');
                return;
            }
            
            const items = Clipboard.getItems();
            const isCut = Clipboard.isCut;
            const srcPaths = items.map(i => i.path);
            let processedCount = 0;
            let errorCount = 0;
            
            // 顺序处理每个项目，避免同名文件竞态
            function processNext(index) {
                if (index >= items.length) {
                    // 所有项目处理完毕
                    if (isCut) {
                        Clipboard.clear();
                        document.querySelectorAll('.desktop-icon').forEach(el => el.style.opacity = '');
                        document.querySelectorAll('.folder-item, .folder-grid-item').forEach(el => el.style.opacity = '');
                    }
                    refreshAllAffectedWindows(SYSTEM.desktopPath, srcPaths, isCut);
                    if (errorCount > 0) {
                        Notify.error('部分失败', `成功 ${processedCount} 个，失败 ${errorCount} 个`);
                    } else {
                        Notify.success('粘贴成功', `已${isCut ? '移动' : '复制'} ${processedCount} 个项目`);
                    }
                    return;
                }
                
                const item = items[index];
                const destPath = SYSTEM.desktopPath + '/' + item.filename;
                
                // 检查目标是否已存在（复制时只要目标存在就生成新名称，剪切时源!=目标才生成）
                SYSTEM.fs.stat(destPath, (err) => {
                    if (!err && (isCut ? destPath !== item.path : true)) {
                        // 目标已存在，生成新名称（参考青丝OS数字叠加方式）
                        const dotIdx = item.filename.lastIndexOf('.');
                        let newName;
                        let counter = 1;
                        if (dotIdx > 0) {
                            const baseName = item.filename.substring(0, dotIdx);
                            const ext = item.filename.substring(dotIdx);
                            newName = baseName + ' (' + counter + ')' + ext;
                        } else {
                            newName = item.filename + ' (' + counter + ')';
                        }
                        
                        const checkAndRename = () => {
                            const newPath = SYSTEM.desktopPath + '/' + newName;
                            SYSTEM.fs.stat(newPath, (err) => {
                                if (!err) {
                                    counter++;
                                    const dotIdx2 = item.filename.lastIndexOf('.');
                                    if (dotIdx2 > 0) {
                                        const baseName = item.filename.substring(0, dotIdx2);
                                        const ext = item.filename.substring(dotIdx2);
                                        newName = baseName + ' (' + counter + ')' + ext;
                                    } else {
                                        newName = item.filename + ' (' + counter + ')';
                                    }
                                    checkAndRename();
                                } else {
                                    performPaste(item.path, newPath, isCut, () => {
                                        processNext(index + 1);
                                    });
                                }
                            });
                        };
                        checkAndRename();
                    } else {
                        performPaste(item.path, destPath, isCut, () => {
                            processNext(index + 1);
                        });
                    }
                });
            }
            
            function performPaste(srcPath, destPath, isCut, done) {
                if (isCut) {
                    // JISHENG FS move：同一存储内 rename，跨存储（如桌面 → /opfs）自动 复制（保留日期）+ 删除源
                    SYSTEM.jfs.move(srcPath, destPath).then(() => {
                        processedCount++;
                        done();
                    }, (err) => {
                        console.error('剪切失败:', err);
                        errorCount++;
                        done();
                    });
                } else {
                    SYSTEM.fs.stat(srcPath, (err, stats) => {
                        if (err) {
                            errorCount++;
                            done();
                            return;
                        }
                        if (stats.isDirectory()) {
                            copyFolderRecursive(srcPath, destPath, (err) => {
                                if (err) {
                                    console.error('复制文件夹失败:', err);
                                    errorCount++;
                                } else {
                                    processedCount++;
                                }
                                done();
                            });
                        } else {
                            SYSTEM.fs.readFile(srcPath, (err, data) => {
                                if (err) {
                                    errorCount++;
                                    done();
                                    return;
                                }
                                SYSTEM.fs.writeFile(destPath, data, (err) => {
                                    if (err) {
                                        console.error('写入文件失败:', err);
                                        errorCount++;
                                    } else {
                                        // 复制时保留原始修改时间
                                        if (stats.mtime && SYSTEM.fs.utimes) {
                                            try { SYSTEM.fs.utimes(destPath, stats.mtime, stats.mtime, () => {}); } catch(e) {}
                                        }
                                        processedCount++;
                                    }
                                    done();
                                });
                            });
                        }
                    });
                }
            }
            
            processNext(0);
        }

        // 修改时间是跨后端文件元数据的一部分，不能因为一次复制、移动或浏览器不支持
        // utimes 而被“写入时刻”覆盖。OPFS 本身没有设置 lastModified 的原生 API，因此
        // 先同步写入 JISHENG OS 的持久化 mtimeCache（展示/排序/下次启动均以它为准），
        // 再尽力回写底层文件系统。底层回写失败不视为日期丢失。
        function preserveMtime(path, mtime, callback) {
            const done = typeof callback === 'function' ? callback : function() {};
            const ms = mtime instanceof Date ? mtime.getTime() : Number(mtime);
            if (!Number.isFinite(ms) || ms <= 0) { done(); return; }
            const date = new Date(ms);
            try {
                if (SYSTEM.setMtimeCache) SYSTEM.setMtimeCache(path, date);
            } catch (err) { console.warn('保存修改时间元数据失败:', err); }
            if (!SYSTEM.fs || typeof SYSTEM.fs.utimes !== 'function') { done(); return; }
            try {
                // SYSTEM.fs.utimes 已被内核包装：即使 OPFS/IndexedDB 返回 ENOTSUP，缓存日期仍保留。
                SYSTEM.fs.utimes(path, date, date, () => done());
            } catch (_) { done(); }
        }

        function copyFilePreservingMtime(srcPath, destPath, sourceMtime, callback) {
            // JISHENG FS：根卷内复制在一个事务里完成（读源 → 写目标 → 回写日期），不经过内存缓冲转换。
            if (SYSTEM.fs && typeof SYSTEM.fs._copyFile === 'function' && !SYSTEM.fs._route(srcPath).backend && !SYSTEM.fs._route(destPath).backend) {
                const ms = sourceMtime instanceof Date ? sourceMtime.getTime() : Number(sourceMtime);
                const valid = Number.isFinite(ms) && ms > 0 ? ms : 0;
                SYSTEM.fs._copyFile(srcPath, destPath, valid).then(() => {
                    if (valid) { try { SYSTEM.setMtimeCache(destPath, valid); } catch (_) {} }
                    callback(null);
                }, err => callback(err));
                return;
            }
            SYSTEM.fs.readFile(srcPath, (readErr, data) => {
                if (readErr) { callback(readErr); return; }
                SYSTEM.fs.writeFile(destPath, data, writeErr => {
                    if (writeErr) { callback(writeErr); return; }
                    preserveMtime(destPath, sourceMtime, () => callback(null));
                });
            });
        }

        // 递归复制文件夹：每个文件和每一层目录都在复制完成后回写源修改日期。
        // 这是 IndexedDB ↔ OPFS 专用迁移和普通跨目录复制共用的唯一实现，避免日期逻辑分叉。
        function copyFolderRecursive(srcPath, destPath, callback) {
            // JISHENG FS：根卷 → 根卷 的整棵树复制在引擎里分段完成（每段一个事务），日期规则与下面的逐项实现相同。
            if (SYSTEM.jfs && SYSTEM.fs._isNativeTree(srcPath) && SYSTEM.fs._isNativeTree(destPath)) {
                SYSTEM.jfs._copyTreeNative(srcPath, destPath).then(result => callback(result.firstError || null), err => callback(err));
                return;
            }
            const isDir = stats => !!stats && (typeof stats.isDirectory === 'function' ? stats.isDirectory() : stats.isDirectory);
            SYSTEM.fs.stat(srcPath, (sourceStatErr, sourceStats) => {
                if (sourceStatErr || !sourceStats) { callback(sourceStatErr || new Error('无法读取源文件夹')); return; }
                const sourceDirMtime = sourceStats.mtime || null;
                SYSTEM.fs.mkdir(destPath, mkdirErr => {
                    if (!mkdirErr) { copyFolderContents(); return; }
                    // 目标已存在时允许合并，但类型不同必须终止。
                    SYSTEM.fs.stat(destPath, (destStatErr, destStats) => {
                        if (destStatErr || !isDir(destStats)) { callback(mkdirErr); return; }
                        copyFolderContents();
                    });
                });

                function finish(err) {
                    // 目录时间必须最后恢复，避免后续创建子项再次把目录日期刷成当前时间。
                    preserveMtime(destPath, sourceDirMtime, () => callback(err || null));
                }

                function copyFolderContents() {
                    SYSTEM.fs.readdir(srcPath, (readDirErr, files) => {
                        if (readDirErr) { finish(readDirErr); return; }
                        if (!files || files.length === 0) { finish(null); return; }
                        let pending = files.length;
                        let firstError = null;
                        const completeOne = err => {
                            if (err && !firstError) firstError = err;
                            if (--pending === 0) finish(firstError);
                        };
                        files.forEach(file => {
                            const childSource = srcPath + '/' + file;
                            const childDest = destPath + '/' + file;
                            SYSTEM.fs.stat(childSource, (childStatErr, childStats) => {
                                if (childStatErr || !childStats) { completeOne(childStatErr || new Error('无法读取源项目')); return; }
                                if (isDir(childStats)) {
                                    copyFolderRecursive(childSource, childDest, completeOne);
                                } else {
                                    copyFilePreservingMtime(childSource, childDest, childStats.mtime || null, completeOne);
                                }
                            });
                        });
                    });
                }
            });
        }

        // 构建侧边栏：两个内部后端始终并列显示，让用户可以明确决定文件放入哪里。
        function buildFolderSidebar(windowId) {
            const state = SYSTEM.folderWindowStates && SYSTEM.folderWindowStates[windowId];
            const currentPath = state ? state.currentPath : SYSTEM.desktopPath;
            const isIndexedDB = isPathInStorage(currentPath, 'indexeddb');

            const regex = new RegExp('(' + safeQuery + ')', 'gi');
            return safeText.replace(regex, '<span class="search-highlight">$1</span>');

        function escapeHtml(str) {

        function escapeAttr(str) {

        // 格式化文件大小

        function isLocalMountedPath(path) {
            const norm = String(path || '/').replace(/\\/g, '/').replace(/\/+/g, '/').replace(/\/$/, '') || '/';
            const folders = Object.values(SYSTEM.mountedFolders || {}).concat(Object.values(SYSTEM.localFolders || {}));
            return folders.some(info => {
                if (!info) return false;
                const mountPath = String(info.mountPath || ('/mnt/local/' + info.name)).replace(/\\/g, '/').replace(/\/+/g, '/').replace(/\/$/, '') || '/';
                return norm === mountPath || norm.startsWith(mountPath + '/');

            if (bytes === 0 || bytes == null) return '--';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';

            if (!mtime) return '--';

        };
        // 返回图标内部 path 片段（兼容 <svg class="icon-svg" viewBox="0 0 24 24">${iconBody(name)}</svg> 模式）
        function iconBody(name){ return ICONS[name] || ICONS.fileGeneric; }
        // 返回完整 <svg> 字符串；extra 为附加 class（如 sm/lg/xl 或 tb-notify-icon）
        function icon(name, extra){

        }

        // 将静态 HTML 中带有 data-icon 的元素注入为集中式 SVG 图标
        function injectStaticIcons() {
            document.querySelectorAll('[data-icon]').forEach(el => {

            });
        }
        // 文件名/类型 → 图标名（单一真相源，桌面/文件夹窗口/标题栏共用）
        function fileIconName(name, isDir){
            if(isDir) return 'fileFolder';
            const el = ((name||'').match(/\.([a-z0-9]+)$/i)||[])[1] || '';
            const e = el.toLowerCase();
            if(['jpg','png','gif','webp','jpeg','bmp','svg','avif','ico'].includes(e)) return 'fileImg';
            if(e==='txt') return 'fileText';
            if(e==='md'||e==='markdown') return 'fileMd';
            if(e==='json') return 'fileJson';
            if(e==='js'||e==='mjs'||e==='cjs') return 'fileJs';
            if(e==='css') return 'fileCss';
            if(e==='csv') return 'fileCsv';
            if(['zip','7z','rar','tar','gz','bz2','xz','cab','tgz'].includes(e)) return 'fileZip';
            if(e==='html'||e==='htm') return 'fileHtml';
            if(e==='pdf') return 'filePdf';
            if(['mp4','avi','mov','mkv','webm','flv','wmv'].includes(e)) return 'fileVideo';
            if(['mp3','wav','flac','m4a','ogg','aac'].includes(e)) return 'fileAudio';
            // 镜像类型图标区分：iso → 光盘(CD/DVD)；img → 软盘/磁盘镜像
            if(e==='iso') return 'fileIso';
            if(e==='img') return 'fileDisk';
            return 'fileGeneric';
        }

        // 获取文件图标 SVG path（统一委托给集中图标库，避免分叉）
        function getFileIconPath(filename, isDir) {
            return iconBody(fileIconName(filename, isDir));
        }

        // 渲染文件夹内容
        // ======== 排序偏好持久化：记住用户点击的排序列和升降序 ========
        const FOLDER_SORT_PREF_KEY = 'JISHENG_OS_FOLDER_SORT';
        function loadFolderSortPref() {
            try {
                const raw = localStorage.getItem(FOLDER_SORT_PREF_KEY);
                if (raw) {
                    const p = JSON.parse(raw);
                    if (p && ['name', 'size', 'date', 'type'].indexOf(p.sortBy) !== -1) {
                        return { sortBy: p.sortBy, sortAsc: !!p.sortAsc };
                    }
                }
            } catch (e) {}
            return { sortBy: 'name', sortAsc: true };
        }
        function saveFolderSortPref(sortBy, sortAsc) {
            try { localStorage.setItem(FOLDER_SORT_PREF_KEY, JSON.stringify({ sortBy: sortBy, sortAsc: sortAsc })); } catch (e) {}
        }

        // ======== 文件夹大小：异步递归计算 + 短时缓存，不阻塞 UI ========
        const DIR_SIZE_CACHE = {};          // path -> { size, time }
        const DIR_SIZE_PENDING = {};        // path -> [callbacks]（合并并发请求，同一文件夹只算一次）
        const DIR_SIZE_TTL = 10000;         // 缓存 10 秒，重复渲染/排序时直接命中，不重复遍历
        const DIR_SIZE_MAX_ENTRIES = 20000; // 安全上限：超大目录停止深入，返回已累计大小，避免卡顿

        function getCachedDirSize(path) {
            const c = DIR_SIZE_CACHE[path];
            if (c && (Date.now() - c.time) < DIR_SIZE_TTL) return c.size;
            return null;
        }

        // 每次失效都递增；计算开始后如果发生过失效，结果只返回给调用者、不写入缓存（避免缓存到旧值）。
        let DIR_SIZE_EPOCH = 0;
        function invalidateAllDirSizes() {
            DIR_SIZE_EPOCH++;
            for (const k in DIR_SIZE_CACHE) delete DIR_SIZE_CACHE[k];
        }
        // JISHENG FS 提交后调用：只清掉变化路径的祖先目录和被删除/移走的子树。
        function invalidateDirSizesFor(event) {
            DIR_SIZE_EPOCH++;
            const paths = [];
            (event && event.changes || []).forEach(c => {
                [c.path, c.oldPath].forEach(p => { if (p) paths.push(String(p).replace(/\/\*$/, '') || '/'); });
            });
            if (!paths.length) return;
            const norm = p => (SYSTEM.fs && SYSTEM.fs._normalize) ? SYSTEM.fs._normalize(p) : p;
            Object.keys(DIR_SIZE_CACHE).forEach(key => {
                const k = norm(key);
                const kPrefix = k === '/' ? '/' : k + '/';
                if (paths.some(p => p === k || p.startsWith(kPrefix) || k.startsWith(p + '/'))) delete DIR_SIZE_CACHE[key];
            });
        }

        function computeDirSize(path, cb) {
            const cached = getCachedDirSize(path);
            if (cached !== null) { cb(cached); return; }
            if (DIR_SIZE_PENDING[path]) { DIR_SIZE_PENDING[path].push(cb); return; }
            DIR_SIZE_PENDING[path] = [cb];

            let total = 0;
            let pendingDirs = 1;   // 正在遍历中的目录数（含根）
            let entryCount = 0;
            let capped = false;
            const epoch = DIR_SIZE_EPOCH;

            const finish = () => {
                if (epoch === DIR_SIZE_EPOCH) DIR_SIZE_CACHE[path] = { size: total, time: Date.now() };
                const cbs = DIR_SIZE_PENDING[path] || [];
                delete DIR_SIZE_PENDING[path];
                cbs.forEach(fn => { try { fn(total); } catch (e) {} });
            };

            const walk = (dir) => {
                SYSTEM.fs.readdir(dir, (err, files) => {
                    if (err || !files || files.length === 0 || capped) {
                        if (--pendingDirs === 0) finish();
                        return;
                    }
                    entryCount += files.length;
                    if (entryCount > DIR_SIZE_MAX_ENTRIES) capped = true;
                    let filePending = files.length;
                    files.forEach(f => {
                        SYSTEM.fs.stat(dir + '/' + f, (e2, st) => {
                            if (!e2 && st) {
                                const isDir = st.isDirectory ? (typeof st.isDirectory === 'function' ? st.isDirectory() : st.isDirectory) : false;
                                if (isDir) {
                                    if (!capped) { pendingDirs++; walk(dir + '/' + f); }
                                } else {
                                    total += st.size || 0;
                                }
                            }
                            if (--filePending === 0) {
                                if (--pendingDirs === 0) finish();
                            }
                        });
                    });
                });
            };
            // JISHENG FS：根卷内（子树没有挂载点）一个只读事务遍历 inode 求和，不需要逐个 readdir + stat。
            if (SYSTEM.fs && typeof SYSTEM.fs._du === 'function' && SYSTEM.fs._isNativeTree(path)) {
                SYSTEM.fs._du(path).then(size => { total = size; finish(); }, () => finish());
                return;
            }
            walk(path);
        }

        // 复用同一个排序器：localeCompare(…, 'zh-CN') 每次比较都要重新查语言规则，数千个文件排序时明显变慢。
        // numeric：文件2 排在 文件10 前面（和 Windows 资源管理器一致）
        const FOLDER_NAME_COLLATOR = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
        function renderFolderContent(windowId) {
            const state = SYSTEM.folderWindowStates[windowId];
            if (!state) return;
            state._renderedAt = Date.now();
            // 渲染令牌：防止旧的异步回调覆盖新渲染的内容
            state._renderToken = (state._renderToken || 0) + 1;
            const renderToken = state._renderToken;

            const filelistEl = document.getElementById('folder-filelist-' + windowId);
            const colHeaderEl = document.getElementById('folder-col-header-' + windowId);
            const statusCountEl = document.getElementById('folder-status-count-' + windowId);
            const statusSizeEl = document.getElementById('folder-status-size-' + windowId);
            if (!filelistEl) return;

            // 获取文件列表
            SYSTEM.fs.readdir(state.currentPath, (err, files) => {
                if (state._renderToken !== renderToken) return; // 已有更新的渲染，放弃本次
                if (err) {
                    filelistEl.innerHTML = '<div style="padding:40px;text-align:center;color:#e81123;font-size:13px">无法读取文件夹</div>';
                    return;
                }

                // 常规视图隐藏点文件与系统入口；开启“显示系统与隐藏文件”后完整保留。
                files = (files || []).filter(file => !shouldHideExplorerItem(state.currentPath, file));

                // 获取统计信息
                let pendingStats = files.length;
                const allStats = {};
                
                const afterStats = () => {
                    if (state._renderToken !== renderToken) return; // 已有更新的渲染，放弃本次
                    // 过滤搜索
                    let filtered = files;
                    if (state.searchQuery) {
                        const q = state.searchQuery.toLowerCase();
                        filtered = files.filter(f => f.toLowerCase().includes(q));
                    }

                    // 排序：文件夹优先，然后按指定字段排序
                    filtered.sort((a, b) => {
                        const aDir = allStats[a]?.isDirectory ? (typeof allStats[a].isDirectory === 'function' ? allStats[a].isDirectory() : allStats[a].isDirectory) : false;
                        const bDir = allStats[b]?.isDirectory ? (typeof allStats[b].isDirectory === 'function' ? allStats[b].isDirectory() : allStats[b].isDirectory) : false;
                        if (aDir && !bDir) return -1;
                        if (!aDir && bDir) return 1;

                        let cmp = 0;
                        if (state.sortBy === 'name') {
                            cmp = FOLDER_NAME_COLLATOR.compare(a, b);
                        } else if (state.sortBy === 'size') {
                            // 文件夹使用缓存的实际大小参与排序（尚未算出时按 0 处理，算出后会自动重排）
                            const aSize = aDir ? (getCachedDirSize(state.currentPath + '/' + a) || 0) : (allStats[a]?.size || 0);
                            const bSize = bDir ? (getCachedDirSize(state.currentPath + '/' + b) || 0) : (allStats[b]?.size || 0);
                            cmp = aSize - bSize;
                        } else if (state.sortBy === 'date') {
                            const aTime = allStats[a]?.mtime || 0;
                            const bTime = allStats[b]?.mtime || 0;
                            cmp = aTime - bTime;
                        } else if (state.sortBy === 'type') {
                            const aType = getFileExtension(a).toLowerCase();
                            const bType = getFileExtension(b).toLowerCase();
                            cmp = aType.localeCompare(bType);
                        }
                        return state.sortAsc ? cmp : -cmp;
                    });

                    // 更新列标题排序指示器
                    if (colHeaderEl) {
                        colHeaderEl.querySelectorAll('.col-sort').forEach(el => {
                            const sort = el.dataset.sort;
                            const arrow = el.querySelector('.sort-arrow');
                            if (sort === state.sortBy) {
                                el.classList.add('active');
                                arrow.textContent = state.sortAsc ? '▲' : '▼';
                            } else {
                                el.classList.remove('active');
                                arrow.textContent = '';
                            }
                        });
                    }

                    // 显示/隐藏列标题
                    if (colHeaderEl) {
                        colHeaderEl.style.display = state.viewMode === 'list' ? 'flex' : 'none';
                    }

                    // 生成内容
                    const selectionBox = filelistEl.querySelector('.folder-selection-box');
                    filelistEl.innerHTML = '';
                    if (selectionBox) filelistEl.appendChild(selectionBox);

                    if (filtered.length === 0) {
                        const emptyMsg = state.searchQuery ? '没有匹配的文件' : '文件夹为空';
                        filelistEl.insertAdjacentHTML('beforeend', `<div style="padding:40px;text-align:center;color:#888;font-size:13px">${emptyMsg}</div>`);
                    } else if (state.viewMode === 'list') {
                        const rows = [];   // 性能：拼好整段 HTML 一次插入，而不是每行一次 insertAdjacentHTML
                        filtered.forEach(file => {
                            const stats = allStats[file] || {};
                            const isDir = typeof stats.isDirectory === 'function' ? stats.isDirectory() : !!stats.isDirectory;
                            const iconPath = getFileIconPath(file, isDir);
                            const itemPath = state.currentPath + '/' + file;
                            const localMountItem = isDir && isLocalMountedPath(itemPath);
                            const cachedDirSize = isDir && !localMountItem ? getCachedDirSize(itemPath) : null;
                            const sizeStr = localMountItem ? '--' : (isDir ? (cachedDirSize !== null ? formatFileSize(cachedDirSize) : '…') : formatFileSize(stats.size));
                            const dateStr = formatDate(stats.mtime);
                            const typeStr = isDir ? '文件夹' : getFileExtension(file);
                            const fullPath = state.currentPath + '/' + file;
                            const safeFile = escapeAttr(file);
                            const safePath = escapeAttr(fullPath);

                            const itemHtml = `
                                <div class="folder-item" data-filename="${safeFile}" data-path="${safePath}" data-isdir="${isDir}"
                                     draggable="true"
                                     ondragstart="return handleFolderItemDragStart(event, this)"
                                     ondragend="SYSTEM._folderNativeDrag=false; SYSTEM._internalNativeDrag=false; this.style.outline='none';"
                                     onmouseenter="preloadFolderItemForDrag(this)" onmouseleave="cancelHoverPreload()"
                                     onclick="handleFolderItemSingleClick(event, '${windowId}', this)"
                                     ondblclick="handleFolderItemDblClick('${windowId}', '${safeFile}', '${safePath}', ${isDir}, this)"
                                     onmousedown="handleFolderItemMouseDown(event, '${windowId}')"
                                     ontouchstart="handleFolderItemTouchStart(event, '${windowId}')"
                                     oncontextmenu="handleFolderItemContextMenu(event, '${windowId}', '${safeFile}', '${safePath}')">
                                    <svg class="icon-svg" viewBox="0 0 24 24">${iconPath}</svg>
                                    <span class="file-name">${highlightText(file, state.searchQuery)}</span>
                                    <span class="file-date">${dateStr}</span>
                                    <span class="file-type">${typeStr}</span>
                                    <span class="file-size">${sizeStr}</span>
                                </div>
                            `;
                            rows.push(itemHtml);
                        });
                        filelistEl.insertAdjacentHTML('beforeend', rows.join(''));
                    } else {
                        // 网格视图
                        const gridContainer = document.createElement('div');
                        gridContainer.className = 'folder-grid-view';
                        const cells = [];
                        filtered.forEach(file => {
                            const stats = allStats[file] || {};
                            const isDir = typeof stats.isDirectory === 'function' ? stats.isDirectory() : !!stats.isDirectory;
                            const iconPath = getFileIconPath(file, isDir);
                            const fullPath = state.currentPath + '/' + file;
                            const safeFile = escapeAttr(file);
                            const safePath = escapeAttr(fullPath);

                            const itemHtml = `
                                <div class="folder-grid-item" data-filename="${safeFile}" data-path="${safePath}" data-isdir="${isDir}"
                                     draggable="true"
                                     ondragstart="return handleFolderItemDragStart(event, this)"
                                     ondragend="SYSTEM._folderNativeDrag=false; SYSTEM._internalNativeDrag=false; this.style.outline='none';"
                                     onmouseenter="preloadFolderItemForDrag(this)" onmouseleave="cancelHoverPreload()"
                                     onclick="handleFolderItemSingleClick(event, '${windowId}', this)"
                                     ondblclick="handleFolderItemDblClick('${windowId}', '${safeFile}', '${safePath}', ${isDir}, this)"
                                     onmousedown="handleFolderItemMouseDown(event, '${windowId}')"
                                     ontouchstart="handleFolderItemTouchStart(event, '${windowId}')"
                                     oncontextmenu="handleFolderItemContextMenu(event, '${windowId}', '${safeFile}', '${safePath}')">
                                    <svg class="icon-svg" viewBox="0 0 24 24">${iconPath}</svg>
                                    <span class="file-name">${highlightText(file, state.searchQuery)}</span>
                                </div>
                            `;
                            cells.push(itemHtml);
                        });
                        gridContainer.innerHTML = cells.join('');
                        filelistEl.appendChild(gridContainer);
                    }

                    // 更新状态栏
                    const dirCount = filtered.filter(f => {
                        const d = allStats[f]?.isDirectory;
                        return d ? (typeof d === 'function' ? d() : d) : false;
                    }).length;
                    const fileCount = filtered.length - dirCount;
                    let statusText = '';
                    if (dirCount > 0 && fileCount > 0) {
                        statusText = `${fileCount} 个文件, ${dirCount} 个文件夹`;
                    } else if (dirCount > 0) {
                        statusText = `${dirCount} 个文件夹`;
                    } else {
                        statusText = `${fileCount} 个文件`;
                    }
                    if (state.searchQuery) {
                        statusText += ` (搜索: "${state.searchQuery}")`;
                    }
                    if (statusCountEl) statusCountEl.textContent = statusText;

                    // 计算总大小（文件夹使用已缓存的实际大小，未算出的稍后异步补上）
                    const computeTotalSize = () => {
                        let t = 0;
                        filtered.forEach(f => {
                            const isDir = allStats[f]?.isDirectory;
                            if (typeof isDir === 'function' ? isDir() : !!isDir) {
                                t += (getCachedDirSize(state.currentPath + '/' + f) || 0);
                            } else {
                                t += (allStats[f]?.size || 0);
                            }
                        });
                        return t;
                    };
                    const totalSize = isLocalMountedPath(state.currentPath) ? 0 : computeTotalSize();
                    if (statusSizeEl) statusSizeEl.textContent = (!isLocalMountedPath(state.currentPath) && totalSize > 0) ? '总计: ' + formatFileSize(totalSize) : '';

                    // 普通虚拟目录仍可异步统计；本地挂载内不递归遍历文件夹，避免卡顿。
                    if (state.viewMode === 'list' && !isLocalMountedPath(state.currentPath)) {
                        const itemEls = filelistEl.querySelectorAll('.folder-item');
                        const dirJobs = [];
                        filtered.forEach((file, i) => {
                            const itemPath = state.currentPath + '/' + file;
                            const itemIsDir = allStats[file]?.isDirectory;
                            if ((typeof itemIsDir === 'function' ? itemIsDir() : !!itemIsDir) && !isLocalMountedPath(itemPath)) {
                                dirJobs.push({ file: file, index: i });
                            }
                        });
                        let dirPending = dirJobs.length;
                        let sizeChanged = false;
                        dirJobs.forEach(job => {
                            const fullPath = state.currentPath + '/' + job.file;
                            const usedSize = getCachedDirSize(fullPath); // 渲染时用的值（可能为 null）
                            computeDirSize(fullPath, (size) => {
                                if (state._renderToken !== renderToken) return; // 窗口已重新渲染/导航，放弃回填
                                const cell = itemEls[job.index] && itemEls[job.index].querySelector('.file-size');
                                if (cell) cell.textContent = formatFileSize(size);
                                if (usedSize !== size) sizeChanged = true;
                                if (--dirPending === 0) {
                                    // 全部算完：更新状态栏总计
                                    const t = computeTotalSize();
                                    if (statusSizeEl) statusSizeEl.textContent = t > 0 ? '总计: ' + formatFileSize(t) : '';
                                    // 若按大小排序且数值有变化，重排一次（此时全部命中缓存，不会重复计算）
                                    if (sizeChanged && state.sortBy === 'size') renderFolderContent(windowId);
                                }
                            });
                        });
                    }

                    // 侧栏的存储后端/系统文件入口会随当前路径与设置变化，渲染时同步状态。
                    const sidebarEl = document.getElementById('folder-sidebar-' + windowId);
                    if (sidebarEl) sidebarEl.innerHTML = buildFolderSidebar(windowId);
                    // 更新默认工作区中的文件夹列表
                    updateSidebarFolderList(windowId);

                    // 更新粘贴按钮状态（剪贴板为空时禁用）
                    updatePasteButtonState(windowId);
                };

                if (files.length === 0) {
                    afterStats();
                } else {
                    files.forEach(file => {
                        const filePath = state.currentPath + '/' + file;
                        SYSTEM.fs.stat(filePath, (err, stats) => {
                            if (!err) {
                                const isDir = stats.isDirectory ? (typeof stats.isDirectory === 'function' ? stats.isDirectory() : stats.isDirectory) : false;
                                allStats[file] = {
                                    size: stats.size || 0,
                                    mtime: stats.mtime || 0,
                                    isDirectory: isDir
                                };
                            }
                            pendingStats--;
                            if (pendingStats === 0) afterStats();
                        });
                    });
                }
            });
        }

        // 文件夹列表/网格中的单项激活：目录在当前窗口导航，文件按路径打开。
        function activateFolderItem(windowId, filename, fullPath, isDir) {
            if (isDir) {
                const state = SYSTEM.folderWindowStates[windowId];
                if (!state) {
                    openFileFromPath(fullPath, filename);
                    return;
                }
                state.folderName = filename;
                state.parentPath = state.currentPath;
                state.currentPath = fullPath;
                state.searchQuery = '';
                state.fileStats = {};
                if (!state.parentPath) {
                    state.parentPath = fullPath.substring(0, fullPath.lastIndexOf('/')) || SYSTEM.desktopPath;
                }
                const win = document.getElementById('folder-content-' + windowId)?.closest('.window');
                if (win) {
                    const titleEl = win.querySelector('.window-title-text');
                    if (titleEl) titleEl.textContent = filename;
                }
                const searchInput = document.getElementById('folder-search-' + windowId);
                if (searchInput) searchInput.value = '';
                updateFolderBreadcrumb(windowId);
                renderFolderContent(windowId);
            } else {
                openFileFromPath(fullPath, filename);
            }
        }

        function handleFolderItemSingleClick(event, windowId, item) {
            if (!shouldOpenFromSingleClick(event, item)) return;
            activateFolderItem(windowId, item.dataset.filename, item.dataset.path, item.dataset.isdir === 'true');
        }

        function handleFolderItemDblClick(windowId, filename, fullPath, isDir, item) {
            if (SYSTEM.clickBehavior !== 'double') return;
            if (item && item._suppressNextDoubleOpen) {
                item._suppressNextDoubleOpen = false;
                return;
            }
            activateFolderItem(windowId, filename, fullPath, isDir);
        }

        function handleLegacyFolderItemSingleClick(event, item) {
            if (shouldOpenFromSingleClick(event, item)) openFileFromPath(item.dataset.path, item.dataset.filename);
        }

        function handleLegacyFolderItemDoubleClick(event, item) {

        // 排序
        function folderSortBy(windowId, sortBy) {

            if (!state) return;
            if (state.sortBy === sortBy) {
                state.sortAsc = !state.sortAsc;

        // 初始化文件夹列宽调整：表头与行共用同一组 CSS 变量，拖动分隔线即可调整宽度
        function initFolderColumnResize(windowId) {
            const state = SYSTEM.folderWindowStates && SYSTEM.folderWindowStates[windowId];
            if (!state) return;
            const contentEl = document.getElementById('folder-content-' + windowId);
            if (!contentEl) return;

            // 默认列宽（优先从 localStorage 恢复保存的宽度）
            const DEFAULT_WIDTHS = { name: 240, date: 138, type: 98, size: 70 };
            const saved = localStorage.getItem('JISHENG_OS_COL_WIDTHS');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.colWidths = { ...DEFAULT_WIDTHS, ...parsed };
                } catch(e) {
                    state.colWidths = { ...DEFAULT_WIDTHS };
                }
            } else {
                state.colWidths = { ...DEFAULT_WIDTHS };
            }

            // 保存列宽到 localStorage
            const persistColWidths = () => {
                try { localStorage.setItem('JISHENG_OS_COL_WIDTHS', JSON.stringify(state.colWidths)); } catch(e) {}
            };

            // 将列宽回写到容器 CSS 变量（表头与行均继承，保证上下对齐）
            const applyWidths = () => {
                contentEl.style.setProperty('--col-name-width', state.colWidths.name + 'px');
                contentEl.style.setProperty('--col-date-width', state.colWidths.date + 'px');
                contentEl.style.setProperty('--col-type-width', state.colWidths.type + 'px');
                contentEl.style.setProperty('--col-size-width', state.colWidths.size + 'px');
            };
            applyWidths();

            // 移动端同样启用列宽拖拽（使用 pointer 事件，兼容鼠标与触屏）
            const headerEl = document.getElementById('folder-col-header-' + windowId);
            if (!headerEl) return;

            const MIN_W = 50;       // 最小列宽
            const MAX_W = 600;      // 最大列宽

            headerEl.querySelectorAll('.col-sort').forEach(colEl => {
                const colName = colEl.dataset.sort; // name / date / type / size
                if (!colName) return;
                if (colEl.querySelector('.col-resizer')) return; // 防止重复添加

                const resizer = document.createElement('div');
                resizer.className = 'col-resizer';
                resizer.dataset.col = colName;
                colEl.appendChild(resizer);

                // 拖拽分隔线调整该列宽度（pointer 事件：同时适配鼠标与触屏）
                const onDragStart = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    resizer.classList.add('dragging');
                    resizer.setPointerCapture(e.pointerId);

                    const startX = e.clientX;
                    const startW = state.colWidths[colName];

                    const onMove = (ev) => {
                        const delta = ev.clientX - startX;
                        let newW = Math.round(startW + delta);
                        if (newW < MIN_W) newW = MIN_W;
                        if (newW > MAX_W) newW = MAX_W;
                        state.colWidths[colName] = newW;
                        applyWidths();
                    };
                    const onUp = (ev) => {
                        resizer.classList.remove('dragging');
                        resizer.releasePointerCapture(ev.pointerId);
                        resizer.removeEventListener('pointermove', onMove);
                        resizer.removeEventListener('pointerup', onUp);
                        resizer.removeEventListener('pointercancel', onUp);
                        persistColWidths();
                    };
                    resizer.addEventListener('pointermove', onMove);
                    resizer.addEventListener('pointerup', onUp);
                    resizer.addEventListener('pointercancel', onUp);
                };

                resizer.addEventListener('pointerdown', onDragStart);

                // 阻止手柄点击冒泡触发列排序
                resizer.addEventListener('click', (e) => { e.stopPropagation(); });
            });
        }
