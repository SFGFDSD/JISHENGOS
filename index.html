    <style>
        :root {
            --bg-deep: #0a0a0f;
            --glass-surface: rgba(24, 24, 32, 0.88);
            --glass-surface-light: rgba(36, 36, 48, 0.92);
            --glass-highlight: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #0078d4;
            --accent-cyan: #00d4ff;
            --text-main: #ffffff;
            --text-muted: #8a8a9a;
            --taskbar-height: 48px;
            --win-close-red: #e81123;
            /* === 文件夹窗口列宽（表头与行共用同一组变量，保证上下对齐）=== */
            --col-name-width: 240px;
            --col-date-width: 138px;
            --col-type-width: 98px;
            --col-size-width: 70px;
        }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 只在必要的元素上设置touch-action */
        .desktop, .title-bar, .pnt-stage, .pnt-canvas {
            touch-action: none;
        }

        /* 确保可滚动元素不受影响 */
        .content-area, .csv-container, .notepad-area, .edx-body, #manga-viewer-* {
            touch-action: auto;
        }



        /* === SVG 图标基础样式 === */
        .icon-svg {
            width: 24px; height: 24px;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .icon-svg.sm { width: 16px; height: 16px; }
        .icon-svg.lg { width: 32px; height: 32px; }
        .icon-svg.xl { width: 40px; height: 40px; }
        .icon-svg.github { width: 18px; height: 18px; fill: currentColor; stroke: none; color: var(--text-muted); }

        /* === JISHENG-OS-APP 应用的自定义 SVG 图标 ===
           用户在应用标记注释里粘贴的 SVG 是"原样使用"的（可能来自 iconfont / Bootstrap /
           FontAwesome / 手写实心图），绝不能套 .icon-svg —— 那个类是描边风格图标的样式，
           里面写死了 fill:none，会把实心图标直接洗没。
           所以这里只做尺寸与配色：尺寸交给容器，配色交给 currentColor（图标自己写了颜色则优先）。 */
        .app-custom-icon { display: block; width: 24px; height: 24px; }
        .desktop-icon .app-custom-icon { width: 36px; height: 36px; color: rgba(255,255,255,0.9); filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4)); }
        .window-icon .app-custom-icon { display: block; width: 16px; height: 16px; color: var(--text-muted); }
        .taskbar-running-item .running-icon .app-custom-icon { width: 18px; height: 18px; color: rgba(255,255,255,0.85); }

        /* 恢复原始内联 SVG 的 stroke-width="2" 视觉效果 */
        .tb-notify-icon .icon-svg,
        .icon-svg.tb-notify-icon { stroke-width: 2; }
        .folder-toolbar .icon-svg { stroke-width: 2; }
        .window-controls .win-btn:first-child .icon-svg { stroke-width: 2; }
        .icon-svg.stroke-2 { stroke-width: 2; }

        /* === 背景系统 === */
        #dynamic-bg {
            position: absolute; inset: 0;
            background-size: cover;
            background-position: center;
            transition: background-image 0.6s ease;
            z-index: 0;
        }
        
        .ambient-overlay {
            position: absolute; inset: 0;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(0, 120, 212, 0.08) 0%, transparent 50%),
                linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.7) 100%);
            z-index: 1; pointer-events: none;
        }

        /* === 噪点 === */
        .noise-layer {
            position: fixed; inset: 0; z-index: 9990;
            opacity: 0.025; pointer-events: none; mix-blend-mode: overlay;
        }

        /* === 玻璃容器 === */
        .ultra-glass {
            background: rgba(16, 16, 22, 0.75);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.6);
        }

        /* === 系统对话框（v7：替代浏览器原生 prompt / confirm / alert，与系统玻璃风格一致）=== */
        .sys-dialog-overlay {
            position: fixed; inset: 0; z-index: 60000;
            display: flex; align-items: center; justify-content: center; padding: 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            opacity: 0; transition: opacity 0.16s ease;
        }
        .sys-dialog-overlay.open { opacity: 1; }
        .sys-dialog {
            width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto;
            background: rgba(16, 16, 22, 0.75);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--dlg-radius);
            padding: 20px 20px 16px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.6);
            transform: translateY(10px) scale(0.97);
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: text; -webkit-user-select: text;
        }
        .sys-dialog-overlay.open .sys-dialog { transform: none; }
        .sys-dialog.shake { animation: sysDialogShake 0.3s; }
        @keyframes sysDialogShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .sys-dialog-head { display: flex; gap: 14px; align-items: flex-start; }
        .sys-dialog-icon {
            flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 120, 212, 0.18); color: #6cc3ff;
        }
        .sys-dialog-icon .icon-svg { width: 22px; height: 22px; stroke-width: 1.8; }
        .sys-dialog-icon.danger { background: rgba(232, 17, 35, 0.16); color: #ff6b7a; }
        .sys-dialog-titles { min-width: 0; flex: 1; padding-top: 2px; }
        .sys-dialog-title { font-size: 15px; font-weight: 600; color: var(--text-main); line-height: 1.4; }
        .sys-dialog-msg { margin-top: 4px; font-size: 13px; color: var(--text-muted); line-height: 1.55; word-break: break-word; white-space: pre-line; }
        .sys-dialog-body { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
        .sys-dialog-field[hidden] { display: none; }
        .sys-dialog-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .sys-dialog-input {
            width: 100%; height: 40px; padding: 0 12px; font-size: 14px; font-family: inherit;
            color: var(--text-main); background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px;
            transition: border-color 0.15s, box-shadow 0.15s; color-scheme: dark;
        }
        .sys-dialog-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.25); }
        select.sys-dialog-input option { background: #1e1e28; color: var(--text-main); }
        .sys-dialog-radios { display: flex; flex-direction: column; gap: 8px; }
        .sys-dialog-radio {
            position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.03);
            cursor: pointer; transition: background 0.12s, border-color 0.12s;
        }
        .sys-dialog-radio input { position: absolute; opacity: 0; pointer-events: none; }
        .sys-dialog-radio:hover { background: rgba(255, 255, 255, 0.06); }
        .sys-dialog-radio.checked { border-color: rgba(0, 120, 212, 0.7); background: rgba(0, 120, 212, 0.12); }
        .sys-dialog-radio-dot { flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); position: relative; }
        .sys-dialog-radio.checked .sys-dialog-radio-dot { border-color: var(--accent-cyan); }
        .sys-dialog-radio.checked .sys-dialog-radio-dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent-cyan); }
        .sys-dialog-radio-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .sys-dialog-radio-title { font-size: 13px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .sys-dialog-radio-title .icon-svg { width: 15px; height: 15px; color: var(--text-muted); stroke-width: 2; flex-shrink: 0; }
        .sys-dialog-radio.checked .sys-dialog-radio-title .icon-svg { color: var(--accent-cyan); }
        .sys-dialog-radio-desc { font-size: 12px; color: var(--text-muted); word-break: break-all; }
        .sys-dialog-empty { font-size: 12px; color: var(--text-muted); padding: 8px 2px; }
        .sys-dialog-error { margin-top: 10px; font-size: 12px; color: #ff8a94; }
        .sys-dialog-error[hidden] { display: none; }
        .sys-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        .sys-dialog-btn {
            min-width: 84px; height: 36px; padding: 0 16px; font-size: 13px; font-family: inherit;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06); color: var(--text-main); cursor: pointer;
            transition: background 0.12s, transform 0.08s;
        }
        .sys-dialog-btn:hover { background: rgba(255, 255, 255, 0.11); }
        .sys-dialog-btn:active { transform: scale(0.97); }
        .sys-dialog-btn:focus-visible { box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.35); }
        .sys-dialog-btn.primary { background: linear-gradient(135deg, #1a86e0, #0f6cc0); border-color: rgba(0, 120, 212, 0.6); }
        .sys-dialog-btn.primary:hover { background: linear-gradient(135deg, #2a93ea, #1478cc); }
        .sys-dialog-btn.primary.danger { background: linear-gradient(135deg, #e0344a, #c01a2e); border-color: rgba(232, 17, 35, 0.6); }
        .sys-dialog-btn.primary.danger:hover { background: linear-gradient(135deg, #ea4358, #cc2438); }
        @media (max-width: 768px) {
            /* 手机上靠上显示，避免被软键盘挡住输入框和按钮 */
            .sys-dialog-overlay { align-items: flex-start; padding: 10vh 12px 12px; }
            .sys-dialog { padding: 18px 16px 14px; }
            .sys-dialog-actions .sys-dialog-btn { flex: 1; height: 42px; }
        }

        /* === 桌面 === */
        .desktop { position: absolute; inset: 0; bottom: var(--taskbar-height); z-index: 5; }
        
        .desktop-icons { 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            display: block; 
            pointer-events: auto; 
        } 

        .desktop-icon { 
            position: absolute; 
            width: 82px; 
            height: 90px; 
            padding: 10px 4px; 
            display: flex; flex-direction: column; align-items: center; gap: 6px; 
            border-radius: 6px; cursor: pointer; 
            border: 1px solid transparent; 
            transition: background 0.15s, border 0.15s; 
            z-index: 1; 
        } 
        
        .desktop-icon:hover { 
            background: rgba(255,255,255,0.08); 
        } 
        
        .desktop-icon.selected { 
            background: rgba(0, 120, 212, 0.25); 
            border-color: rgba(0, 120, 212, 0.5); 
            backdrop-filter: blur(4px); 
        } 

        .desktop-icon:active { transform: scale(0.98); } 
        
        .desktop-icon.dragging { 
            opacity: 0.6; 
            z-index: 1000; 
            pointer-events: none; 
        } 
        
        .desktop-icon .icon-svg { 
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4)); 
            color: rgba(255,255,255,0.9); 
            width: 36px; height: 36px; 
        } 
        
        .desktop-icon .label { 
            font-size: 11px; 
            font-weight: 500; 
            text-align: center; 
            text-shadow: 0 1px 4px rgba(0,0,0,0.9); 
            line-height: 1.3; 
            color: #fff; 
            word-break: break-all; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
            padding: 0 2px; 
            border-radius: 2px; 
        } 
        .desktop-icon.selected .label { color: #fff; } 

        .selection-box { 
            position: fixed; 
            background: rgba(0, 120, 212, 0.2); 
            border: 1px solid rgba(0, 120, 212, 0.6); 
            z-index: 999; 
            pointer-events: none; 
            display: none; 
        } 

        .desktop-grid-overlay { 
            position: absolute; inset: 0; pointer-events: none; z-index: 0; 
        } 

        /* === 拖拽幽灵（跟随指针的图标，替代原来的"已选中 N 个文件"面板） === */
        .drag-ghost {
            position: fixed; left: 0; top: 0;
            z-index: 99990; pointer-events: none;
            opacity: 0.88;
            transform: translate(-50%, -60%) scale(1.06);
            filter: drop-shadow(0 12px 18px rgba(0,0,0,0.5));
            will-change: left, top;
        }
        .drag-ghost .icon-svg {
            display: block; width: 56px; height: 56px;
            color: rgba(255,255,255,0.95);
        }
        .drag-ghost .drag-ghost-badge {
            position: absolute; right: -8px; top: -6px;
            min-width: 18px; height: 18px; padding: 0 5px;
            border-radius: 9px; box-sizing: border-box;
            background: var(--accent-blue, #0078d4); color: #fff;
            font-size: 11px; font-weight: 600; line-height: 18px; text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.45);
        }

        /* 拖拽经过的投放目标高亮（桌面图标 / 侧边栏等通用） */
        .drop-hover {
            outline: 2px dashed var(--accent-blue, #0078d4) !important;
            outline-offset: 2px;
            background: rgba(0, 120, 212, 0.28) !important;
        }

        /* === 窗口系统 === */
        /* 窗口圆角（设置 → 个性化 → 窗口圆角） */
        /* --ui-radius：任务栏按钮、菜单项、开始菜单图标等“内部条目”；--dlg-radius：系统对话框；--cal-day-radius：日历日期 */
        :root { --win-radius: 10px; --ui-radius: 6px; --dlg-radius: 12px; --cal-day-radius: 50%; }
        html[data-win-corners="small"] { --win-radius: 6px; --ui-radius: 4px; --dlg-radius: 8px; --cal-day-radius: 4px; }
        html[data-win-corners="square"] { --win-radius: 0px; --ui-radius: 0px; --dlg-radius: 0px; --cal-day-radius: 0px; }
        /* 修复：窗口下方两个角被内部内容（白色内容区、状态栏、侧栏等）盖成直角。
           以前 .window 是 overflow: visible，圆角只画在窗口自己的背景上，子元素照样铺满到直角。
           缩放手柄都在窗口内部，裁剪不会影响拖拽改大小；box-shadow 画在元素外，也不会被自身裁掉。 */
        .window.ultra-glass { border-radius: var(--win-radius); overflow: hidden; }
        .window {
            position: absolute; min-width: 400px; min-height: 300px;
            display: flex; flex-direction: column; z-index: 10;
            overflow: visible;
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05),
                0 25px 60px rgba(0,0,0,0.5);
        }
        .window.focused { 
            z-index: 100; 
            box-shadow: 
                0 0 0 1px rgba(0, 120, 212, 0.3),
                0 30px 70px rgba(0,0,0,0.6);
        }
        .window.minimized { transform: scale(0.9) translateY(30px); opacity: 0; pointer-events: none; }
        /* 小屏/横屏手机上 400x300 的最小尺寸几乎等于整屏，缩放手柄形同虚设 —— 放宽 */
        @media (max-width: 900px), (max-height: 560px) {
            .window { min-width: 260px; min-height: 180px; }
        }
        .window.maximized { 
            top: 0 !important; left: 0 !important; 
            width: 100% !important; height: calc(100% - var(--taskbar-height)) !important; 
            border-radius: 0 !important; 
        }

        /* === 窗口容器：固定铺满视口并裁剪 ===
           以前 #windows-container 没有任何样式（static 块级，高度 0），
           窗口是绝对定位挂在初始包含块上的，往右拖会把页面内容撑出去，
           移动端浏览器就表现为"页面一直往右延伸"。固定 + overflow:hidden 后，
           窗口无论拖到哪都只会被视口裁掉，不会撑大文档。 */
        /* 必须用 absolute 而不是 fixed：position:fixed 会无条件创建层叠上下文，
           窗口里的 z-index(10/100/9999) 就全被关进 z-index:0 的盒子里，
           结果整层窗口被 .desktop(z-index:5) 盖住 —— 看不见也点不到。
           absolute + z-index:auto 不产生层叠上下文，窗口的层级行为和改之前完全一致，
           同时因为容器是定位元素，overflow:hidden 才能真正裁剪绝对定位的窗口。 */
        #windows-container {
            position: absolute; inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        #windows-container > .window { pointer-events: auto; }
        /* 最小化的窗口只是 opacity:0，元素还铺在原位。
           .window.minimized 的 pointer-events:none 特指度(0,2,0) 压不过上面那条
           带 id 的规则(1,1,0)，会让"看不见的窗口"继续吃掉点击 ——
           表现为最小化之后点桌面上任何地方，窗口都会被重新唤出来。 */
        #windows-container > .window.minimized { pointer-events: none; }

        /* === Aero Snap 贴边 === */
        .window.snap-left, .window.snap-right {
            top: 0 !important;
            width: 50% !important;
            height: calc(100% - var(--taskbar-height)) !important;
            border-radius: 0 !important;
        }
        .window.snap-left  { left: 0 !important; }
        .window.snap-right { left: 50% !important; }

        /* 最大化时不允许拉伸；贴边（半屏）状态保留手柄，可以直接拉 */
        .window.maximized .resize-handle { display: none !important; }

        /* 贴边/还原时的位移动画（仅在吸附瞬间开启，拖拽过程中不带动画以免拖影） */
        .window.snapping {
            transition: left 0.2s cubic-bezier(.2,.9,.2,1), top 0.2s cubic-bezier(.2,.9,.2,1),
                        width 0.2s cubic-bezier(.2,.9,.2,1), height 0.2s cubic-bezier(.2,.9,.2,1),
                        opacity 0.2s, box-shadow 0.2s;
        }

        /* Aero Snap 落点预览 */
        /* 吸附预览的可见态（#snap-preview 基础样式见下方既有定义，
           该元素原本就在 DOM 里但一直没被用起来，这里把它接上 Aero Snap） */
        #snap-preview.show { opacity: 1; }

        /* 标题栏 */
        .title-bar {
            height: 36px; min-height: 36px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.15);
            border-bottom: 1px solid var(--glass-border);
            /* === 新增这行，修复移动端拖拽卡顿 === */
            touch-action: none; 
        }
        .title-bar-left {
            display: flex; align-items: center; gap: 10px; 
            padding-left: 14px; flex: 1; height: 100%;
        }
        /* 修复标题栏图标未对齐：原 .window-icon 为 block 容器，
           内部 SVG 为 inline+vertical-align:baseline，导致图标被顶到行框顶部，
           比标题文字高出约 2px。改为 flex 居中后图标与文字垂直中线对齐。 */
        .window-icon {
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .window-icon .icon-svg { display: block; width: 16px; height: 16px; color: var(--text-muted); }
        .window-title-text { font-size: 12px; font-weight: 500; color: var(--text-muted); }

        /* 窗口控制按钮 */
        .window-controls { display: flex; height: 100%; }
        .win-btn {
            width: 46px; height: 100%;
            display: flex; align-items: center; justify-content: center;
            cursor: default; color: var(--text-muted);
            transition: all 0.1s;
        }
        .win-btn .icon-svg { width: 10px; height: 10px; stroke-width: 2; }
        .win-btn:hover {
            background: linear-gradient(180deg, rgba(100,170,255,0.25) 0%, rgba(60,130,230,0.18) 100%);
            color: var(--text-main);
            box-shadow:
                inset 0 0 8px rgba(80,160,255,0.35),
                0 0 6px rgba(80,160,255,0.25);
        }
        .win-btn.close:hover {
            background: linear-gradient(180deg, rgba(232,17,35,0.9) 0%, rgba(200,10,25,0.95) 100%);
            color: white;
            box-shadow:
                inset 0 0 10px rgba(255,80,100,0.5),
                0 0 8px rgba(232,17,35,0.45);
        }

        /* === 窗口吸附预览 === */
        #snap-preview {
            position: fixed;
            background: rgba(0, 120, 212, 0.25);
            border: 2px solid var(--accent-blue);
            border-radius: 12px;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            pointer-events: none;
            /* 在桌面(z-index:5)之上、窗口(z-index:10+)之下，
               让被拖的窗口浮在预览上方，和 Windows 的 Aero Snap 一致 */
            z-index: 6;
        }
        #snap-preview.show { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

        /* === 浏览器 === */
        .browser-nav {
            display: flex; align-items: center; gap: 6px; padding: 8px 12px;
            background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border);
        }
        .nav-btn {
            width: 32px; height: 32px; border-radius: 6px; border: none;
            background: transparent; color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .nav-btn .icon-svg { width: 16px; height: 16px; }
        .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); color: var(--text-main); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .address-bar {
            flex: 1; display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.25); border-radius: 6px; padding: 0 12px; height: 32px;
            border: 1px solid transparent; transition: all 0.2s;
        }
        .address-bar:focus-within { 
            border-color: var(--accent-blue); 
            background: rgba(0,0,0,0.4);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.15);
        }
        .address-bar .icon-svg { width: 14px; height: 14px; color: #4ade80; }
        .address-bar input { 
            flex: 1; background: transparent; border: none; 
            color: white; font-size: 13px; font-family: inherit;
        }
        .address-bar input::placeholder { color: var(--text-muted); }

        .content-area { flex: 1; background: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        /* 不再叠加 backdrop-filter：窗口（.ultra-glass）已经是毛玻璃，子元素的模糊只作用在窗口自己的底色上，看不出差别却要多算一遍 */
        .content-area.dark { background: rgba(20, 20, 28, 0.85); }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* HTML/网页载入时使用系统暗色遮罩，避免 iframe 初始化的白屏闪烁 */
        .loading-overlay {
            position: absolute; inset: 0;
            background: #0a0a0f;
            display: flex; align-items: center; justify-content: center;
            z-index: 5; opacity: 1; pointer-events: auto;
            transition: opacity 0.24s ease;
        }
        .loading-overlay:not(.active) { opacity: 0; pointer-events: none; }
        .spinner {
            width: 28px; height: 28px;
            border: 2px solid rgba(255, 255, 255, 0.10);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* === 记事本特定样式 === */
        /* .notepad-btn 仍被 V86 虚拟机工具栏使用，保留 */
        .notepad-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: var(--text-main); padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;
            transition: 0.2s; line-height: 1.4;
        }
        .notepad-btn:hover { background: rgba(255,255,255,0.15); }
        .notepad-btn:disabled { opacity: 0.35; cursor: default; }
        .notepad-btn:disabled:hover { background: rgba(255,255,255,0.05); }
        .notepad-btn svg { width: 14px; height: 14px; vertical-align: -2px; }
        .notepad-area {
            flex: 1; background: #1e1e1e; border: none; color: #e0e0e0;
            padding: 16px; font-family: 'Consolas', monospace; font-size: 14px; resize: none;
            line-height: 1.6;
        }
        /* === 记事本（v10.5.8 重做外观）===
           单行工具栏（不再换行变高）；按记事本自身宽度（容器查询）收起按钮文字；
           与 HTML 编辑器、系统设置共用一套按钮 / 分隔 / 状态点样式，图标线宽 1.5 */
        .npx {
            --line: rgba(255,255,255,.075); --ink: #e9eaf0; --muted: #9a9bab; --ok: #19c37d; --warn: #f5a524;
            container-type: inline-size; container-name: npx;
            flex: 1; min-height: 0; display: flex; flex-direction: column; background: #1e1e24; color: var(--ink);
        }
        .npx .icon-svg { width: 16px; height: 16px; flex: none; }
        .npx-bar { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 6px; flex: none; min-width: 0;
            background: rgba(0,0,0,.22); border-bottom: 1px solid var(--line); }
        .npx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; min-width: 28px; padding: 0 8px;
            border: 0; border-radius: 7px; background: transparent; color: #c9cad4; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; flex: none;
            transition: background .12s, color .12s; }
        .npx-btn:hover:not(:disabled) { background: rgba(255,255,255,.07); color: #fff; }
        .npx-btn:active:not(:disabled) { background: rgba(255,255,255,.1); }
        .npx-btn:disabled { opacity: .35; cursor: default; }
        .npx-btn.icon { padding: 0 6px; }
        .npx-btn.save.pending { color: #fff; background: rgba(0,120,212,.22); }               /* 有未保存修改时“保存”轻微高亮 */
        .npx-btn.save.pending:hover { background: rgba(0,120,212,.34); }
        .npx :where(button):focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 1px; }
        .npx-sep { width: 1px; height: 18px; background: var(--line); margin: 0 5px; flex: none; }
        .npx-font { display: inline-flex; align-items: center; height: 28px; padding: 0 2px; border-radius: 8px; background: rgba(0,0,0,.25);
            border: 1px solid var(--line); flex: none; }
        .npx-font .npx-btn { height: 24px; min-width: 26px; padding: 0 4px; border-radius: 6px; }
        .npx-font .npx-btn .icon-svg { width: 15px; height: 15px; }
        .npx-fsize { min-width: 26px; text-align: center; font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; cursor: default; user-select: none; }
        .npx-sp { flex: 1; min-width: 6px; }
        .npx-status { display: inline-flex; align-items: center; gap: 6px; min-width: 0; padding: 0 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
        .npx-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
        .npx-status.saved i { background: var(--ok); }
        .npx-status.dirty i { background: var(--warn); }
        .npx-status.dirty .main { color: #f3c77a; }
        .npx-status .sub { overflow: hidden; text-overflow: ellipsis; }
        .npx .notepad-area { background: transparent; color: #e3e4ea; padding: 14px 18px; border: 0; outline: none; resize: none; line-height: 1.7;
            font-family: Consolas, 'Cascadia Mono', 'JetBrains Mono', 'SF Mono', Menlo, 'Microsoft YaHei UI', 'PingFang SC', monospace;
            caret-color: var(--accent-cyan); tab-size: 4; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
        .npx .notepad-area::placeholder { color: #6b6c7a; }
        .npx .notepad-area::selection { background: rgba(0,120,212,.45); }
        @container npx (max-width: 480px) {
            .npx-btn .lbl { display: none; }
            .npx-btn { padding: 0 6px; }
            .npx-status .sub { display: none; }
        }
        @container npx (max-width: 330px) {
            .npx-sep { margin: 0 2px; }
            .npx-status .main { display: none; }
        }
        @media (pointer: coarse) {
            .npx-bar { height: 44px; }
            .npx-btn { height: 32px; min-width: 32px; }
            .npx-font { height: 32px; }
            .npx-font .npx-btn { height: 28px; min-width: 30px; }
        }

        /* === CSV 表格（v10.6 重做：真表头、排序、筛选、正确解析、写回原目录） === */
        .csvx-search { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 8px; background: rgba(0,0,0,.25); border: 1px solid var(--line); color: var(--muted); min-width: 0; flex: 0 1 220px; }
        .csvx-search:focus-within { border-color: rgba(0,120,212,.6); }
        .csvx-search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--ink); font: inherit; font-size: 12.5px; }
        .csvx-search .icon-svg { width: 14px; height: 14px; }
        .npx-btn.on { background: rgba(0,120,212,.24); color: #fff; }
        .csvx-view { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
        .csvx-table { border-collapse: separate; border-spacing: 0; font-size: 12.5px; min-width: 100%; font-variant-numeric: tabular-nums; }
        .csvx-table th, .csvx-table td { padding: 6px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid rgba(255,255,255,.04); white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; text-align: left; }
        .csvx-table thead th { position: sticky; top: 0; z-index: 2; background: #262630; color: var(--ink); font-weight: 600; cursor: pointer; user-select: none; }
        .csvx-table thead th:hover { background: #2e2e3a; }
        .csvx-table thead th .icon-svg { width: 12px; height: 12px; vertical-align: -1px; margin-left: 4px; color: var(--accent-cyan); }
        .csvx-table .rn { width: 1%; position: sticky; left: 0; z-index: 1; background: #22222a; color: #6f7080; text-align: right; min-width: 36px; font-size: 11.5px; cursor: default; }
        .csvx-table thead .rn { z-index: 3; background: #262630; }
        .csvx-table td { color: #dcdde5; }
        .csvx-table td.num, .csvx-table th.num { text-align: right; }
        .csvx-table tbody tr:hover td { background: rgba(255,255,255,.035); }
        .csvx-table tbody tr:hover .rn { background: #2a2a33; }
        .csvx-table mark { background: rgba(245,165,36,.35); color: #fff; border-radius: 2px; }
        .csvx-more { display: block; margin: 12px auto; }
        .csvx-empty { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 13px; }
        .csvx .notepad-area { flex: 1; min-height: 0; }
        @container npx (max-width: 560px) { .csvx-search { flex-basis: 130px; } }

        /* =====================================================================
           任务栏 · 开始菜单 · 日历 · 右键菜单 · 胶囊通知（v10.6 统一重做）
           - 所有弹出层的圆角都跟随 设置 → 个性化 → 窗口圆角（--win-radius / --ui-radius / --cal-day-radius）
           - 胶囊通知保持胶囊形状（这是它的身份），只统一配色、阴影、对齐与交互
           - 键盘：Tab 可达、可见焦点环、Esc 关闭、方向键在菜单/开始菜单/日历中移动
           ===================================================================== */
        :root {
            --pop-bg: rgba(20, 20, 27, 0.84);
            --pop-border: rgba(255, 255, 255, 0.09);
            --pop-shadow: 0 18px 48px -12px rgba(0, 0, 0, 0.7), 0 0 0 0.5px rgba(0, 0, 0, 0.5);
            --pop-line: rgba(255, 255, 255, 0.07);
            --pop-ink: #eef0f5;
            --pop-muted: #9a9bab;
            --tb-hover: rgba(255, 255, 255, 0.07);
            --tb-press: rgba(255, 255, 255, 0.11);
            --focus-ring: 0 0 0 2px rgba(76, 194, 255, 0.9);
            --tb-accent: #3aa6ff;
        }

        /* --- 任务栏 --- */
        .taskbar {
            position: fixed; bottom: 0; left: 0; right: 0; height: var(--taskbar-height);
            background: rgba(14, 14, 20, 0.8);
            backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            display: flex; align-items: center; gap: 2px; padding-left: 4px;
            z-index: 1000; user-select: none; -webkit-user-select: none;
        }
        .start-btn, .taskbar-icon, .taskbar-running-item, .clock {
            height: 40px; border-radius: var(--ui-radius); cursor: pointer;
            transition: background 0.12s, color 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .start-btn:hover, .taskbar-icon:hover, .taskbar-running-item:hover, .clock:hover { background: var(--tb-hover); }
        .start-btn:active, .taskbar-icon:active, .taskbar-running-item:active, .clock:active { background: var(--tb-press); }
        .start-btn:focus-visible, .taskbar-icon:focus-visible, .taskbar-running-item:focus-visible,
        .clock:focus-visible, .aero-peek-btn:focus-visible, .running-close-btn:focus-visible { box-shadow: inset var(--focus-ring); }
        .start-btn:active .icon-svg, .taskbar-icon:active .icon-svg, .taskbar-running-item:active .running-icon { transform: scale(0.9); }

        .start-btn {
            width: 44px; flex: none;
            display: flex; align-items: center; justify-content: center;
        }
        .start-btn .icon-svg { width: 20px; height: 20px; color: #fff; transition: transform 0.12s, color 0.12s; }
        .start-btn.open { background: var(--tb-press); }
        .start-btn.open .icon-svg { color: #6cc3ff; }

        .taskbar-apps {
            flex: 1; min-width: 0; height: 100%;
            display: flex; align-items: center; gap: 2px; padding-left: 2px;
        }
        .taskbar-icon {
            width: 42px; flex: none; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .taskbar-icon .icon-svg { width: 20px; height: 20px; color: rgba(255, 255, 255, 0.86); transition: transform 0.12s, color 0.12s; }
        .taskbar-icon:hover .icon-svg { color: #fff; }
        /* 固定快捷方式 与 运行中窗口 之间的分隔线（没有运行窗口时隐藏） */
        .taskbar-sep { flex: none; width: 1px; height: 22px; margin: 0 6px; background: rgba(255, 255, 255, 0.12); }
        .taskbar-sep:has(+ .taskbar-running-area:empty) { display: none; }

        .taskbar-running-area {
            display: flex; align-items: center; gap: 2px;
            flex: 1; min-width: 0; height: 100%; overflow: hidden;
        }
        .taskbar-running-item {
            position: relative; flex: 0 1 180px; min-width: 40px; max-width: 180px;
            display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px;
            color: rgba(255, 255, 255, 0.78); overflow: hidden;
            container-type: inline-size;
        }
        /* 状态指示条：打开 = 短灰条；当前窗口 = 长亮条；最小化 = 短灰条 + 图标/标题变暗 */
        .taskbar-running-item::after {
            content: ''; position: absolute; left: 50%; bottom: 2px;
            width: 6px; height: 3px; border-radius: min(2px, var(--ui-radius));
            background: rgba(255, 255, 255, 0.42); transform: translateX(-50%);
            transition: width 0.2s cubic-bezier(0.2, 0.9, 0.25, 1), background 0.2s;
        }
        .taskbar-running-item.focused { background: rgba(255, 255, 255, 0.09); color: #fff; }
        .taskbar-running-item.focused:hover { background: rgba(255, 255, 255, 0.12); }
        .taskbar-running-item.focused::after { width: 18px; background: var(--tb-accent); }
        .taskbar-running-item.minimized-item .running-icon,
        .taskbar-running-item.minimized-item .running-title { opacity: 0.55; }
        .taskbar-running-item .running-icon {
            width: 20px; height: 20px; flex: none;
            display: flex; align-items: center; justify-content: center; transition: transform 0.12s;
        }
        .taskbar-running-item .running-icon .icon-svg { width: 18px; height: 18px; color: rgba(255, 255, 255, 0.88); }
        .taskbar-running-item .running-title {
            flex: 1; min-width: 0; font-size: 12px; line-height: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .taskbar-running-item .running-close-btn {
            flex: none; width: 22px; height: 22px; padding: 0; margin-left: 2px;
            border: none; border-radius: max(0px, calc(var(--ui-radius) - 2px));
            background: transparent; color: var(--pop-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.12s, background 0.12s, color 0.12s;
        }
        .taskbar-running-item:hover .running-close-btn,
        .taskbar-running-item:focus-within .running-close-btn { opacity: 1; }
        .taskbar-running-item .running-close-btn:hover { background: var(--win-close-red); color: #fff; }
        .taskbar-running-item .running-close-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; }
        /* 运行项被挤窄时只显示图标（按运行项自身宽度判断，而不是视口宽度） */
        @container (max-width: 84px) {
            .running-title, .running-close-btn { display: none !important; }
            .running-icon { margin: 0 auto; }
        }
        /* 触屏没有悬停：不显示关闭小按钮，改用长按菜单 */
        @media (hover: none) {
            .taskbar-running-item .running-close-btn { display: none; }
        }

        /* --- 系统托盘 --- */
        .system-tray { position: relative; flex: none; display: flex; align-items: center; gap: 2px; height: 100%; padding-left: 4px; }
        .tray-icon {
            width: 32px; height: 40px; border-radius: var(--ui-radius);
            display: flex; align-items: center; justify-content: center; cursor: default;
        }
        .tray-icon .icon-svg { width: 16px; height: 16px; color: var(--pop-muted); }
        .tray-icon.offline .icon-svg { color: #f5a524; }
        .clock {
            padding: 0 10px; display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
            font-size: 12px; line-height: 1.35; white-space: nowrap; font-variant-numeric: tabular-nums;
        }
        .clock.open { background: var(--tb-press); }
        .clock .time { font-weight: 500; color: #fff; }
        .clock .date { font-size: 11px; color: rgba(255, 255, 255, 0.68); }
        .aero-peek-btn { border-left: 1px solid rgba(255, 255, 255, 0.08) !important; }

        /* --- 通用弹出层外壳（开始菜单 / 日历 / 右键菜单） --- */
        .start-menu, .calendar-panel, .context-menu {
            background: var(--pop-bg);
            backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--pop-border); border-radius: var(--win-radius);
            box-shadow: var(--pop-shadow); color: var(--pop-ink);
        }

        /* --- 开始菜单 --- */
        .start-menu {
            position: fixed; left: 8px; bottom: calc(var(--taskbar-height) + 8px);
            width: 360px; max-width: calc(100vw - 16px); max-height: calc(100vh - var(--taskbar-height) - 16px);
            display: flex; flex-direction: column; overflow: hidden; z-index: 2000;
            opacity: 0; transform: translateY(12px); visibility: hidden; pointer-events: none;
            transition: opacity 0.14s ease, transform 0.22s cubic-bezier(0.2, 0.9, 0.25, 1), visibility 0s linear 0.22s;
        }
        .start-menu.open {
            opacity: 1; transform: none; visibility: visible; pointer-events: auto;
            transition: opacity 0.14s ease, transform 0.22s cubic-bezier(0.2, 0.9, 0.25, 1), visibility 0s;
        }
        .sm-search { position: relative; flex: none; margin: 16px 16px 4px; }
        .sm-search > .icon-svg { position: absolute; left: 11px; top: 10px; width: 16px; height: 16px; color: var(--pop-muted); pointer-events: none; }
        .sm-search input {
            width: 100%; height: 36px; padding: 0 12px 0 34px;
            border-radius: var(--ui-radius); border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.28); color: var(--pop-ink); font: inherit; font-size: 13px;
            transition: border-color 0.12s, box-shadow 0.12s; color-scheme: dark;
        }
        .sm-search input::placeholder { color: var(--pop-muted); }
        .sm-search input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.25); }
        .sm-search input::-webkit-search-cancel-button { filter: grayscale(1) brightness(1.6); cursor: pointer; }
        .start-menu-header { flex: none; padding: 12px 20px 6px; }
        .start-menu-header h2 { font-size: 12.5px; font-weight: 600; color: #c9cad6; letter-spacing: 0; text-transform: none; }
        .menu-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
            padding: 0 12px 12px; overflow-y: auto; min-height: 0; scrollbar-width: thin;
        }
        .menu-item {
            appearance: none; border: 1px solid transparent; background: transparent; color: inherit; font: inherit;
            height: 84px; min-width: 0; padding: 0 4px; border-radius: var(--ui-radius);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer; transition: background 0.12s, border-color 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-item .icon-svg, .menu-item .app-custom-icon { width: 28px; height: 28px; color: rgba(255, 255, 255, 0.9); transition: transform 0.12s; }
        .menu-item span { max-width: 100%; font-size: 12px; color: #d6d7e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .menu-item:hover { background: var(--tb-hover); }
        .menu-item:active { background: var(--tb-press); }
        .menu-item:active .icon-svg { transform: scale(0.92); }
        .menu-item:focus-visible { box-shadow: inset var(--focus-ring); }
        .menu-item.sm-filtered { display: none; }
        /* 搜索时：回车会打开的那一项 */
        .menu-item.sm-first { background: rgba(0, 120, 212, 0.16); border-color: rgba(0, 120, 212, 0.45); }
        .sm-empty { padding: 20px 20px 28px; text-align: center; font-size: 12.5px; color: var(--pop-muted); }
        .sm-empty[hidden] { display: none; }
        .sm-footer {
            flex: none; display: flex; align-items: center; gap: 2px; padding: 8px 10px;
            border-top: 1px solid var(--pop-line); background: rgba(0, 0, 0, 0.2);
        }
        .sm-about, .sm-iconbtn {
            appearance: none; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer;
            border-radius: var(--ui-radius); transition: background 0.12s, color 0.12s;
        }
        .sm-about { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 8px; text-align: left; }
        .sm-logo {
            flex: none; width: 30px; height: 30px; display: grid; place-items: center;
            border-radius: min(8px, calc(var(--ui-radius) + 2px)); border: 1px solid var(--pop-line);
            background: linear-gradient(135deg, #0a0a0f, #181c24); font: 900 11px "Arial Black", Inter, sans-serif;
        }
        .sm-logo span { background: linear-gradient(90deg, #0078d4, #00d4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sm-about-text { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
        .sm-about-text b { font-size: 12.5px; font-weight: 600; }
        .sm-about-text small { font-size: 11px; color: var(--pop-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sm-iconbtn { flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #c9cad6; }
        .sm-iconbtn .icon-svg { width: 18px; height: 18px; }
        .sm-about:hover, .sm-iconbtn:hover { background: var(--tb-hover); color: #fff; }
        .sm-iconbtn.danger:hover { background: rgba(232, 17, 35, 0.16); color: #ff8a94; }
        .sm-about:focus-visible, .sm-iconbtn:focus-visible { box-shadow: inset var(--focus-ring); }

        /* --- 日历 --- */
        .calendar-panel {
            position: fixed; right: 8px; bottom: calc(var(--taskbar-height) + 8px);
            width: 336px; max-width: calc(100vw - 16px); max-height: calc(100vh - var(--taskbar-height) - 16px);
            overflow-y: auto; overflow-x: hidden; z-index: 2000; scrollbar-width: thin;
            opacity: 0; transform: translateY(12px); visibility: hidden; pointer-events: none;
            transition: opacity 0.14s ease, transform 0.22s cubic-bezier(0.2, 0.9, 0.25, 1), visibility 0s linear 0.22s;
        }
        .calendar-panel.open {
            opacity: 1; transform: none; visibility: visible; pointer-events: auto;
            transition: opacity 0.14s ease, transform 0.22s cubic-bezier(0.2, 0.9, 0.25, 1), visibility 0s;
        }
        .cal-now { padding: 16px 18px 14px; border-bottom: 1px solid var(--pop-line); }
        .cal-now-time { font-size: 30px; font-weight: 300; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
        .cal-now-time small { font-size: 13px; font-weight: 400; color: var(--pop-muted); margin-right: 6px; letter-spacing: 0; }
        .cal-now-date { margin-top: 6px; font-size: 12.5px; color: #c9cad6; }
        .cal-now-lunar { margin-left: 8px; color: var(--pop-muted); }
        .cal-body { padding: 12px 14px 14px; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; padding-left: 6px; }
        .calendar-header h3 { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .calendar-nav { display: flex; align-items: center; gap: 2px; }
        .calendar-nav button {
            min-width: 30px; height: 30px; padding: 0; border: none; border-radius: var(--ui-radius);
            background: transparent; color: var(--pop-ink); font: inherit; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: background 0.12s, opacity 0.12s;
        }
        .calendar-nav button.cal-today { padding: 0 10px; color: #8fd0ff; }
        .calendar-nav button:hover { background: rgba(255, 255, 255, 0.08); }
        .calendar-nav button:active { background: rgba(255, 255, 255, 0.12); }
        .calendar-nav button:disabled { opacity: 0.35; cursor: default; background: transparent; }
        .calendar-nav button:focus-visible { box-shadow: inset var(--focus-ring); }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
        .calendar-weekdays span { padding: 8px 0 6px; font-size: 11.5px; font-weight: 500; color: var(--pop-muted); }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
        .calendar-day {
            appearance: none; border: 0; background: transparent; color: inherit; font: inherit;
            height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .calendar-day span {
            width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
            border-radius: var(--cal-day-radius); font-size: 13px; font-variant-numeric: tabular-nums;
            transition: background 0.12s, box-shadow 0.12s;
        }
        .calendar-day:hover span { background: rgba(255, 255, 255, 0.08); }
        .calendar-day.other-month { color: var(--pop-muted); }
        .calendar-day.other-month span { opacity: 0.5; }
        .calendar-day.selected span { box-shadow: inset 0 0 0 1.5px rgba(76, 194, 255, 0.85); }
        .calendar-day.today span { background: var(--accent-blue); color: #fff; font-weight: 600; }
        .calendar-day.today:hover span { background: #1a86e0; }
        .calendar-day.today.selected span { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.85); }
        .calendar-day:focus-visible span { box-shadow: var(--focus-ring); }
        .cal-info {
            margin-top: 10px; padding: 8px 10px; border-radius: var(--ui-radius); background: rgba(255, 255, 255, 0.04);
            display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 12px; color: #c9cad6;
        }
        .cal-info span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cal-info b { flex: none; font-weight: 500; color: #8fd0ff; }

        /* --- 右键菜单 --- */
        .context-menu {
            position: fixed; min-width: 216px; max-width: min(340px, calc(100vw - 16px)); padding: 4px; z-index: 3000;
            max-height: calc(100vh - 16px); overflow-y: auto; overflow-x: hidden; scrollbar-width: thin;
            opacity: 0; transform: scale(0.97); transform-origin: var(--cm-origin, top left);
            visibility: hidden; pointer-events: none;
            transition: opacity 0.1s ease, transform 0.12s ease, visibility 0s linear 0.12s;
        }
        .context-menu.open {
            opacity: 1; transform: none; visibility: visible; pointer-events: auto;
            transition: opacity 0.1s ease, transform 0.14s cubic-bezier(0.2, 0.9, 0.25, 1), visibility 0s;
        }
        .context-item {
            display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 12px 0 10px;
            border-radius: var(--ui-radius); font-size: 13px; color: var(--pop-ink);
            cursor: pointer; white-space: nowrap; user-select: none; -webkit-user-select: none;
            transition: background 0.08s, color 0.08s;
        }
        .context-item > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .context-item .icon-svg { flex: none; width: 16px; height: 16px; color: #a3a5b5; transition: color 0.08s; }
        .context-item:hover, .context-item.kb-active { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .context-item:hover .icon-svg, .context-item.kb-active .icon-svg { color: #fff; }
        .context-item:active { background: rgba(255, 255, 255, 0.12); }
        .context-item.accent, .context-item.accent .icon-svg { color: var(--accent-cyan); }
        .context-item.danger, .context-item.danger .icon-svg { color: #ff8a94; }
        .context-item.danger:hover, .context-item.danger.kb-active { background: rgba(232, 17, 35, 0.16); color: #ffb3ba; }
        .context-item.danger:hover .icon-svg, .context-item.danger.kb-active .icon-svg { color: #ffb3ba; }
        .context-item.disabled, .context-item[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
        .context-divider { height: 1px; margin: 4px 8px; background: rgba(255, 255, 255, 0.08); }
        @media (pointer: coarse) {
            .context-menu { min-width: 200px; }
            .context-item { min-height: 44px; font-size: 14px; padding: 0 14px 0 12px; gap: 12px; }
        }

        /* --- 胶囊通知：锚定在托盘左侧（随时钟宽度自动对齐），始终是胶囊 --- */
        #taskbar-notify-area {
            position: absolute; right: 100%; top: 0; bottom: 0; margin-right: 6px;
            display: flex; align-items: flex-end; justify-content: flex-end; padding-bottom: 7px;
            width: max-content; max-width: 560px; pointer-events: none; z-index: 1005;
        }
        .tb-notification {
            --tbn-c: #4cc2ff; --tbn-bg: rgba(76, 194, 255, 0.16);
            position: relative; flex: none; max-width: 100%; min-height: 34px; height: 34px;
            display: flex; align-items: center; gap: 9px; padding: 0 14px 0 5px;
            border-radius: 999px; overflow: hidden; white-space: nowrap;
            background: rgba(28, 28, 37, 0.94);
            backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            color: var(--pop-ink); font-size: 12.5px; line-height: 1.35;
            pointer-events: auto; cursor: pointer;
            animation: tbnIn 0.34s cubic-bezier(0.2, 0.9, 0.25, 1) both;
        }
        .tb-notification.success { --tbn-c: #3ddc84; --tbn-bg: rgba(61, 220, 132, 0.15); }
        .tb-notification.error   { --tbn-c: #ff6b78; --tbn-bg: rgba(255, 107, 120, 0.16); }
        .tb-notification.warning { --tbn-c: #f5a524; --tbn-bg: rgba(245, 165, 36, 0.16); }
        .tb-notify-badge {
            flex: none; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--tbn-bg); color: var(--tbn-c);
        }
        .tb-notify-badge .icon-svg { width: 14px; height: 14px; }
        .tb-notify-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .tb-notify-title { font-weight: 600; }
        .tb-notify-msg { margin-left: 8px; color: rgba(238, 240, 245, 0.72); }
        .tb-notify-count {
            flex: none; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600;
            background: rgba(255, 255, 255, 0.1); color: #fff; font-variant-numeric: tabular-nums;
        }
        .tb-notify-count[hidden] { display: none; }
        /* 剩余时间：底部细线，悬停时暂停（自动消失由这条动画驱动） */
        .tb-notify-progress {
            position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px; border-radius: 2px;
            background: var(--tbn-c); opacity: 0.55; transform-origin: left center;
            animation: tbnProgress var(--tbn-dur, 3200ms) linear forwards;
        }
        .tb-notification:hover .tb-notify-progress,
        .tb-notification.expanded .tb-notify-progress { animation-play-state: paused; }
        .tb-notification.bump { animation: tbnBump 0.28s ease; }
        /* 文字放不下：悬停 / 轻点时向上展开显示全文（底边不动，不会遮住时钟） */
        .tb-notification.expanded {
            height: auto; white-space: normal; align-items: flex-start;
            padding-top: 5px; padding-bottom: 7px; border-radius: 17px;
        }
        .tb-notification.expanded .tb-notify-text { overflow: visible; padding-top: 3px; word-break: break-word; }
        .tb-notification.expanded .tb-notify-title { display: block; }
        .tb-notification.expanded .tb-notify-msg { display: block; margin-left: 0; margin-top: 2px; }
        .tb-notification.hiding {
            position: absolute; right: 0; bottom: 7px; pointer-events: none;
            animation: tbnOut 0.24s ease forwards;
        }
        @keyframes tbnIn { from { opacity: 0; transform: translateX(18px) scale(0.96); } to { opacity: 1; transform: none; } }
        @keyframes tbnOut { to { opacity: 0; transform: translateX(18px) scale(0.96); } }
        @keyframes tbnBump { 40% { transform: scale(1.04); } }
        @keyframes tbnProgress { from { transform: scaleX(1); } to { transform: scaleX(0); } }

        /* --- 手机 / 窄屏 --- */
        @media (max-width: 600px) {
            .taskbar { padding-left: 2px; gap: 0; }
            /* 固定快捷方式放不下：可横向滑动；一旦有运行中的窗口，任务栏改为显示运行窗口（开始菜单里仍可启动应用） */
            .taskbar-apps { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; }
            .taskbar-apps::-webkit-scrollbar { display: none; }
            .taskbar-icon { width: 40px; }
            .taskbar-apps:has(.taskbar-running-item) > .taskbar-icon.pinned,
            .taskbar-apps:has(.taskbar-running-item) > .taskbar-sep { display: none; }
            .taskbar-running-area { overflow-x: auto; scrollbar-width: none; }
            .taskbar-running-item { flex: 0 0 44px; max-width: 44px; padding: 0; justify-content: center; }
            .taskbar-running-item .running-title, .taskbar-running-item .running-close-btn { display: none; }
            .tray-icon:not(.offline) { display: none; }
            .clock .date { display: none; }
            .start-menu, .calendar-panel { left: 8px; right: 8px; width: auto; max-width: none; }
            #taskbar-notify-area { max-width: calc(100vw - 120px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .start-menu, .calendar-panel, .context-menu, .start-menu.open, .calendar-panel.open, .context-menu.open { transition-duration: 0s !important; transform: none; }
            .tb-notification, .tb-notification.hiding, .tb-notification.bump { animation-duration: 0.01s; }
            .tb-notify-progress { opacity: 0; }
        }

        /* === 系统设置（侧栏导航版，v10.6）===
           所有规则以 .stx 作用域隔离，避免与文件管理器等窗口的通用类名冲突。
           .stx-scroll 是 inline-size 容器：按“内容区宽度”而不是视口宽度自适应，
           因此窗口拖窄 / 最大化 / 手机全屏都能得到合适的布局。 */
        .system-app-hidden { display: none !important; }
        .stx {
            --line: rgba(255,255,255,.075); --card: rgba(255,255,255,.035); --ink: #f2f3f7; --muted: #9a9bab;
            --acc: var(--accent-blue); --cyan: var(--accent-cyan); --ok: #19c37d; --warn: #f5a524; --danger: #ff6b78;
            container-type: inline-size; color: var(--ink); font-size: 13px; line-height: 1.45; min-height: 0;
        }
        .stx .icon-svg { width: 18px; height: 18px; flex: none; }
        .stx-shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px minmax(0,1fr); }
        .stx-nav { min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 3px; background: rgba(0,0,0,.16); scrollbar-width: thin; }
        .stx-me { display: flex; gap: 10px; align-items: center; padding: 6px 8px 14px; min-width: 0; }
        .stx-me b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; }
        .stx-me small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stx-logo { width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center; font: 900 14px "Arial Black", Inter, sans-serif; background: linear-gradient(135deg,#0a0a0f,#181c24); border: 1px solid var(--line); }
        .stx-logo span { background: linear-gradient(90deg,#0078d4,#00d4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stx-logo.lg { width: 60px; height: 60px; border-radius: 15px; font-size: 22px; }
        .stx-search { position: relative; margin: 0 2px 10px; flex: none; }
        .stx-search input { width: 100%; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.3); color: var(--ink); padding: 0 28px 0 32px; font: inherit; font-size: 12.5px; }
        .stx-search input::placeholder { color: var(--muted); }
        .stx-search input:focus { border-color: var(--acc); }
        .stx-search input::-webkit-search-cancel-button { display: none; }
        .stx-search > .icon-svg { position: absolute; left: 10px; top: 9.5px; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
        .stx-search-x { position: absolute; right: 5px; top: 6px; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; display: none; place-items: center; }
        .stx-search-x .icon-svg { width: 13px; height: 13px; }
        .stx-search-x:hover { background: rgba(255,255,255,.08); color: var(--ink); }
        .stx-search.has-q .stx-search-x { display: grid; }
        .stx-navi { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: #cfd0da; font: inherit; font-size: 13px; text-align: left; cursor: pointer; position: relative; user-select: none; flex: none; }
        .stx-navi:hover { background: rgba(255,255,255,.05); }
        .stx-navi.on { background: rgba(255,255,255,.085); color: #fff; }
        .stx-navi.on::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--acc); }
        .stx-navi em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .stx-navi em.warn { color: var(--warn); }
        .stx-main { min-height: 0; display: flex; flex-direction: column; }
        .stx-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; container-type: inline-size; scrollbar-gutter: stable; }
        .stx-scroll::-webkit-scrollbar, .stx-nav::-webkit-scrollbar { width: 8px; height: 6px; }
        .stx-scroll::-webkit-scrollbar-thumb, .stx-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }

        /* 内容区宽度 ≤ 600px（整个窗口变窄 / 手机）：侧栏折叠为顶部横向标签 */
        @container (max-width: 600px) {
            .stx-shell { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); }
            .stx-nav { flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; overflow-x: auto; overflow-y: hidden; gap: 4px; scrollbar-width: none; }
            .stx-nav::-webkit-scrollbar { display: none; }
            .stx-me { display: none; }
            .stx-search { margin: 0 4px 0 0; flex: 0 0 150px; }
            .stx-navi { width: auto; padding: 7px 11px; white-space: nowrap; }
            .stx-navi em { display: none; }
            .stx-navi.on::before { left: 10px; right: 10px; top: auto; bottom: 0; width: auto; height: 2px; }
        }

        /* 通用控件 */
        .stx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 13px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
        .stx-btn:hover { background: rgba(255,255,255,.11); }
        .stx-btn:active { transform: translateY(1px); }
        .stx-btn:disabled { opacity: .42; cursor: not-allowed; transform: none; }
        .stx-btn:disabled:hover { background: rgba(255,255,255,.06); }
        .stx-btn .icon-svg { width: 15px; height: 15px; }
        .stx-btn.primary { background: var(--acc); border-color: transparent; color: #fff; }
        .stx-btn.primary:hover:not(:disabled) { filter: brightness(1.12); background: var(--acc); }
        .stx-btn.danger { color: var(--danger); border-color: rgba(255,107,120,.35); background: rgba(255,107,120,.06); }
        .stx-btn.danger:hover:not(:disabled) { background: rgba(255,107,120,.14); }
        .stx-btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
        .stx-btn.ghost:hover:not(:disabled) { color: var(--ink); background: rgba(255,255,255,.06); }
        .stx-btn.sm { min-height: 28px; padding: 0 10px; font-size: 12px; }
        .stx-btn.busy .icon-svg { animation: spin .8s linear infinite; }
        .stx-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
        .stx :where(.stx-btn, .stx-sw, .stx-seg button, .stx-navi, .stx-rcard, .stx-cb, .stx-tile, .stx-file, .stx-wpx-tile, .stx-wpx-del):focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
        .stx-sw { position: relative; width: 40px; height: 22px; flex: none; border-radius: 99px; border: 0; background: rgba(255,255,255,.18); cursor: pointer; transition: background .18s; padding: 0; }
        .stx-sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
        .stx-sw[aria-checked="true"] { background: var(--acc); }
        .stx-sw[aria-checked="true"]::after { transform: translateX(18px); }
        .stx-sw:disabled { opacity: .45; cursor: not-allowed; }
        .stx-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: rgba(0,0,0,.28); border: 1px solid var(--line); }
        .stx-seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 6px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
        .stx-seg button .icon-svg { width: 14px; height: 14px; }
        .stx-seg button.on { background: rgba(255,255,255,.12); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
        .stx-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 9px; border-radius: 99px; background: rgba(255,255,255,.07); color: var(--muted); white-space: nowrap; }
        .stx-pill .icon-svg { width: 12px; height: 12px; }
        .stx-pill.ok { background: rgba(25,195,125,.13); color: #5ee0a6; }
        .stx-pill.warn { background: rgba(245,165,36,.13); color: #f5c26b; }
        .stx-pill.bad { background: rgba(255,107,120,.12); color: #ff9aa6; }
        .stx-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
        .stx-muted { color: var(--muted); }
        .stx-cb { appearance: none; -webkit-appearance: none; width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,.3); display: grid; place-items: center; cursor: pointer; margin: 0; background: transparent; flex: none; }
        .stx-cb:checked, .stx-cb:indeterminate { background: var(--acc); border-color: var(--acc); }
        .stx-cb:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
        .stx-cb:indeterminate::after { content: ""; width: 8px; height: 2px; background: #fff; border-radius: 1px; }
        .stx-cb:disabled { opacity: .35; cursor: not-allowed; }

        /* 页面与分组（inset grouped list）——内容限制在舒适阅读宽度，拉宽窗口不会被拉散 */
        .stx-page { width: 100%; max-width: 800px; margin: 0 auto; padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 22px; }
        .stx-page.wide { max-width: 1080px; }
        .stx-ph { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
        .stx-ph h2 { font-size: 21px; font-weight: 650; letter-spacing: -.015em; }
        .stx-ph p { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
        .stx-ph > div:first-child { min-width: 0; flex: 1 1 260px; }
        .stx-grp { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .stx-grp-h { display: flex; align-items: center; gap: 8px; padding: 0 4px; min-height: 28px; flex-wrap: wrap; }
        .stx-grp-h h3 { font-size: 12px; font-weight: 600; color: #c9c9d6; letter-spacing: .02em; }
        .stx-grp-h > span { font-size: 11.5px; color: var(--muted); }
        .stx-grp-h .sp, .stx-ph .sp { flex: 1; }
        .stx-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
        .stx-card.pad { padding: 16px; }
        .stx-row { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; align-items: center; column-gap: 14px; row-gap: 10px; padding: 13px 16px; min-height: 58px; position: relative; }
        .stx-row + .stx-row { border-top: 1px solid var(--line); }
        .stx-row.noicon { grid-template-columns: minmax(0,1fr) auto; }
        .stx-row.click { cursor: pointer; }
        .stx-row.click:hover { background: rgba(255,255,255,.03); }
        .stx-row-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.06); color: #cfd3dc; }
        .stx-row-tx { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .stx-row-tx b { font-weight: 500; font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
        .stx-row-tx small { font-size: 12px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
        .stx-row-ct { justify-self: end; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
        .stx-row-ct > .icon-svg { color: var(--muted); width: 16px; height: 16px; }
        .stx-row.dis .stx-row-tx, .stx-row.dis .stx-row-ic { opacity: .55; }
        .stx-row.flash { animation: stxFlash 1.8s ease; }
        @keyframes stxFlash { 0%, 35% { background: rgba(0,212,255,.16); } 100% { background: transparent; } }
        .stx-note { font-size: 11.5px; color: var(--muted); padding: 0 4px; line-height: 1.6; }
        .stx-note .icon-svg { width: 13px; height: 13px; margin-right: 3px; vertical-align: -2px; }
        .stx-empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
        .stx-empty .icon-svg { width: 26px; height: 26px; display: block; margin: 0 auto 8px; opacity: .6; }
        .stx-danger { border-color: rgba(255,107,120,.28); background: rgba(255,107,120,.035); }
        .stx-danger .stx-row-ic { background: rgba(255,107,120,.12); color: var(--danger); }
        /* 窄内容区：控件换到第二行（避免“按钮挤压文字 / 文字凸出”） */
        @container (max-width: 420px) {
            .stx-row { grid-template-columns: 34px minmax(0,1fr); }
            .stx-row.noicon { grid-template-columns: minmax(0,1fr); }
            .stx-row-ct { grid-column: 2; justify-self: start; justify-content: flex-start; }
            .stx-row.noicon .stx-row-ct { grid-column: 1; }
            .stx-row.keep { grid-template-columns: 34px minmax(0,1fr) auto; }
            .stx-row.keep .stx-row-ct { grid-column: auto; justify-self: end; }
            .stx-page { padding: 18px 14px 36px; }
        }

        /* 存储 */
        .stx-hero { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 18px; align-items: end; }
        .stx-big { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
        .stx-big span { font-size: 15px; color: var(--muted); font-weight: 400; }
        .stx-sub { font-size: 12px; color: var(--muted); }
        .stx-pct { text-align: right; font-size: 22px; font-weight: 650; color: var(--cyan); font-variant-numeric: tabular-nums; }
        .stx-pct small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
        .stx-meter { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 12px; }
        .stx-meter i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#087ed7,#00d4ff); }
        .stx-meter.warn i { background: linear-gradient(90deg,#f59e0b,#ef4444); }
        .stx-stack-label { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 16px; }
        .stx-stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: rgba(255,255,255,.07); margin-top: 6px; gap: 2px; }
        .stx-stack i { display: block; height: 100%; min-width: 3px; transition: opacity .15s, filter .15s; }
        .stx-stack:hover i { opacity: .55; } .stx-stack i:hover { opacity: 1; filter: brightness(1.2); }
        .stx-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 4px 18px; margin-top: 12px; }
        .stx-lg { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 2px 8px; align-items: center; font-size: 12.5px; padding: 3px 0; }
        .stx-lg i { width: 10px; height: 10px; border-radius: 3px; }
        .stx-lg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .stx-lg em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
        .stx-lg small { grid-column: 2 / 4; color: var(--muted); font-size: 11px; margin-top: -2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .stx-vgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; align-items: start; }
        @container (max-width: 720px) { .stx-vgrid { grid-template-columns: 1fr; } }
        .stx-bars { display: flex; flex-direction: column; gap: 11px; }
        .stx-bar { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 4px 10px; align-items: center; }
        .stx-bar .ic, .stx-file .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
        .stx-bar .ic .icon-svg, .stx-file .ic .icon-svg { width: 15px; height: 15px; }
        .stx-bar .nm { font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
        .stx-bar .nm span:last-child { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
        .stx-bar .sz { font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; min-width: 62px; }
        .stx-bar .tr { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: -2px; }
        .stx-bar .tr i { display: block; height: 100%; border-radius: 3px; min-width: 2px; }
        .stx-files { display: flex; flex-direction: column; }
        .stx-file { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; width: 100%; }
        .stx-file:hover { background: rgba(255,255,255,.045); }
        .stx-file + .stx-file { box-shadow: 0 -1px 0 var(--line); }
        .stx-file .nm { min-width: 0; }
        .stx-file .nm b { display: block; font-weight: 500; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stx-file .nm small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stx-file .sz { font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
        .stx-tm { position: relative; width: 100%; aspect-ratio: 16 / 7; min-height: 160px; max-height: 380px; border-radius: 10px; overflow: hidden; background: rgba(0,0,0,.25); }
        .stx-tile { position: absolute; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; padding: 6px 8px; border: 2px solid rgba(20,20,28,.95); border-radius: 8px; overflow: hidden; font-size: 11.5px; line-height: 1.35; color: rgba(255,255,255,.96); transition: filter .15s; cursor: default; text-align: left; font-family: inherit; }
        button.stx-tile { cursor: pointer; }
        .stx-tile:hover { filter: brightness(1.18); }
        .stx-tile b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stx-tile span { display: block; opacity: .82; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stx-tile.xs b, .stx-tile.xs span { display: none; }
        .stx-tm-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
        .stx-tm-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .stx-tm-legend i { width: 9px; height: 9px; border-radius: 3px; }
        .stx-skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.11), rgba(255,255,255,.05)); background-size: 200% 100%; animation: stxSkel 1.2s ease-in-out infinite; }
        @keyframes stxSkel { from { background-position: 200% 0; } to { background-position: -200% 0; } }
        .stx-rcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 10px; }
        .stx-rcard { text-align: left; display: flex; gap: 11px; padding: 13px; border-radius: 11px; border: 1px solid var(--line); background: rgba(255,255,255,.03); cursor: pointer; color: var(--ink); font: inherit; }
        .stx-rcard:hover:not(:disabled) { background: rgba(255,255,255,.055); }
        .stx-rcard.on { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 12%, transparent); }
        .stx-rcard:disabled { opacity: .45; cursor: not-allowed; }
        .stx-rcard .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.35); flex: none; margin-top: 2px; display: grid; place-items: center; }
        .stx-rcard.on .dot { border-color: var(--acc); }
        .stx-rcard.on .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
        .stx-rcard b { display: block; font-weight: 550; font-size: 13px; }
        .stx-rcard small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.5; margin-top: 2px; }
        .stx-mig { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 12px; align-items: center; }
        .stx-mig .end { padding: 12px; border-radius: 10px; background: rgba(255,255,255,.035); border: 1px solid var(--line); min-width: 0; }
        .stx-mig .end small { color: var(--muted); font-size: 11px; display: block; }
        .stx-mig .end b { font-weight: 600; font-size: 13.5px; }
        .stx-mig .end .stx-mono { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .stx-mig > .icon-svg { color: var(--muted); }
        .stx-mig-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
        .stx-mig-foot small { flex: 1 1 220px; color: var(--muted); font-size: 11.5px; line-height: 1.55; }
        @container (max-width: 470px) { .stx-hero { grid-template-columns: 1fr; } .stx-pct { text-align: left; } .stx-mig { grid-template-columns: 1fr; } .stx-mig > .icon-svg { transform: rotate(90deg); justify-self: center; } }

        /* 清理流程 */
        .stx-steps { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
        .stx-steps span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
        .stx-steps span i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 10.5px; background: rgba(255,255,255,.08); }
        .stx-steps span.on { color: var(--ink); } .stx-steps span.on i { background: var(--acc); color: #fff; }
        .stx-steps span.done i { background: var(--ok); color: #fff; }
        .stx-steps .ln { width: 18px; height: 1px; background: var(--line); }
        .stx-clean-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; flex-wrap: wrap; }
        .stx-clean-head .sp { flex: 1; }
        .stx-scan { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-top: 1px solid var(--line); }
        .stx-scan .stx-mono { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stx-indet { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; }
        .stx-indet i { position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 3px; background: linear-gradient(90deg, var(--acc), var(--cyan)); animation: stxIndet 1.1s ease-in-out infinite; }
        @keyframes stxIndet { from { left: -35%; } to { left: 100%; } }
        .stx-cg { border-top: 1px solid var(--line); }
        .stx-cg-h { display: grid; grid-template-columns: 20px minmax(0,1fr) auto 16px; gap: 10px; align-items: center; padding: 11px 16px; cursor: pointer; user-select: none; }

        .stx-cg-items { display: none; padding: 0 12px 10px 42px; }

        .stx-ci { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; }
