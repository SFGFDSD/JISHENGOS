            }
            async function genericBatch(list, options) {
                const results = [];
                const skipped = new Set();
                let stopped = false;
                for (let i = 0; i < list.length; i++) {
                    const op = list[i];
                    if (stopped || (op.group != null && skipped.has(op.group))) { results.push({ skipped: true }); continue; }
                    try {
                        switch (op.op) {
                            case 'mkdir': await call('mkdir', op.path); break;
                            case 'mkdirp': await mkdirp(op.path); break;
                            case 'writeFile':
                                await (op.encoding ? call('writeFile', op.path, op.data, op.encoding) : call('writeFile', op.path, op.data));
                                if (op.mtime != null) { try { await call('utimes', op.path, op.atime != null ? op.atime : op.mtime, op.mtime); } catch (_) {} }
                                break;
                            case 'utimes': await call('utimes', op.path, op.atime != null ? op.atime : op.mtime, op.mtime); break;
                            case 'unlink': await call('unlink', op.path); break;
                            case 'rmdir': await call('rmdir', op.path); break;
                            case 'remove': await remove(op.path, { recursive: true }); break;
                            default: throw engine._error('ENOTSUP', op.op);
                        }
                        results.push({ ok: true });
                    } catch (error) {
                        if (options.atomic) throw error;
                        results.push({ ok: false, error });
                        if (op.group != null) skipped.add(op.group);
                        if (op.stop) stopped = true;
                    }
                    if (options.onProgress && (i % 20 === 19 || i === list.length - 1)) { try { options.onProgress(i + 1, list.length); } catch (_) {} }
                }
                return results;
            }

            // 监听某个文件夹的变化（本页和其他标签页的写入都会通知）。返回取消监听的函数。
            function watch(path, listener, options = {}) {
                const target = engine._normalize(path);
                const prefix = target === '/' ? '/' : target + '/';
                return engine.watch(event => {
                    let hit = event.dirs.has(target);
                    if (!hit && options.recursive) {
                        hit = event.changes.some(c => [c.path, c.oldPath].some(p => p && (p === target || p.startsWith(prefix))))
                            || Array.from(event.dirs).some(d => d === target || d.startsWith(prefix));
                    }
                    if (hit) listener(event);
                });
            }

            async function usage() {
                const out = { used: null, quota: null, persisted: null };
                try {
                    if (navigator.storage && navigator.storage.estimate) {
                        const est = await navigator.storage.estimate();
                        out.used = est.usage; out.quota = est.quota;
                    }
                    if (navigator.storage && navigator.storage.persisted) out.persisted = await navigator.storage.persisted();
                } catch (_) {}
                return out;
            }

            return {
                name: 'JISHENG FS', version: 1, engine,
                stat: path => call('stat', path),
                readdir: path => call('readdir', path),
                readFile: (path, encoding) => encoding ? call('readFile', path, encoding) : call('readFile', path),
                writeFile: async (path, data, options = {}) => {
                    await (options.encoding ? call('writeFile', path, data, options.encoding) : call('writeFile', path, data));
                    if (options.mtime) await call('utimes', path, options.atime || options.mtime, options.mtime);
                },
                mkdir: path => call('mkdir', path),
                mkdirp,
                unlink: path => call('unlink', path),
                rmdir: path => call('rmdir', path),
                rename: (from, to) => call('rename', from, to),
                utimes: (path, atime, mtime) => call('utimes', path, atime, mtime),
                exists: path => new Promise(resolve => SYSTEM.fs.exists(path, value => resolve(!!value))),
                remove, copy, move, du, batch, watch, usage,
                onCommit: hook => engine.onCommit(hook),
                isNative: native,
                _copyTreeNative: copyTreeNative,
                _toMs: toMs
            };
        }

        // 文件变化后自动刷新桌面和已打开的文件夹窗口（包括其他标签页里的修改）。
        // 已经被代码手动刷新过的（刷新时间晚于变化时间）不会重复刷新；拖拽/按住鼠标时推迟。
        function initFsAutoRefresh() {
            if (!SYSTEM.fs || typeof SYSTEM.fs.watch !== 'function') return;
            let pointerDown = false;
            document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
            const release = () => { pointerDown = false; };
            document.addEventListener('pointerup', release, true);
            document.addEventListener('pointercancel', release, true);
            window.addEventListener('blur', release);
            let desktopDue = 0, timer = 0;
            const windowsDue = new Map();
            const norm = p => SYSTEM.fs._normalize(p);
            const busy = () => pointerDown || !!document.querySelector('.sysdlg-overlay, .sys-dialog-overlay');
            const run = () => {
                timer = 0;
                if (busy()) { timer = setTimeout(run, 400); return; }
                if (desktopDue && desktopDue > (SYSTEM._desktopRenderedAt || 0)) { try { refreshDesktop(); } catch (_) {} }
                desktopDue = 0;
                windowsDue.forEach((time, windowId) => {
                    const state = SYSTEM.folderWindowStates && SYSTEM.folderWindowStates[windowId];
                    if (!state || !document.getElementById('folder-filelist-' + windowId)) return;
                    if (time > (state._renderedAt || 0)) { state.fileStats = {}; try { renderFolderContent(windowId); } catch (_) {} }
                });
                windowsDue.clear();
            };
            SYSTEM.fs.watch(event => {
                if (SYSTEM.desktopPath && event.dirs.has(norm(SYSTEM.desktopPath))) desktopDue = Math.max(desktopDue, event.time);
                const states = SYSTEM.folderWindowStates || {};
                Object.keys(states).forEach(windowId => {
                    const state = states[windowId];
                    if (state && state.currentPath && event.dirs.has(norm(state.currentPath))) {
                        windowsDue.set(windowId, Math.max(windowsDue.get(windowId) || 0, event.time));
                    }
                });
                if ((desktopDue || windowsDue.size) && !timer) timer = setTimeout(run, 250);
            });
        }

        // === FileSystemAccessFS: 将 File System Access API 包装为系统文件接口 ===
        class FSAStats {
            constructor(isFile, size, mtime) {
                const isDir = !isFile;
                // 同时提供可调用的类型检查方法，兼容文件浏览器的检查方式。
                this.isFile = isFile;
                this.isDirectory = isDir;
                this.size = Number.isFinite(Number(size)) ? Number(size) : 0;
                // Directory modification time is unavailable from File System Access API.
                // Keep it empty instead of presenting a fabricated current timestamp.
                this.mtime = (mtime && Number(mtime) > 0) ? new Date(Number(mtime)) : null;
                this.mtimeMs = this.mtime ? this.mtime.getTime() : 0;
                this.atime = this.mtime;
                this.ctime = this.mtime;
                this.blocks = 1;
                this.mode = isFile ? 0o666 : (0o777 | 0o40000);
                // 目录状态通过标准 isDirectory() 方法提供。
                if (!this.isFile) {
                    this.isDirectory = function() { return true; };
                    this.isFile = function() { return false; };
                } else {
                    this.isDirectory = function() { return false; };
                    this.isFile = function() { return true; };
                }
            }
        }

        class FSAFile {
            constructor(handle, fs, path) {
                this._handle = handle;
                this._fs = fs;
                this._position = 0;
                this._writable = null;
                this._closed = false;
                this._path = path || '';
            }
            getStats(cb) {
                this._handle.getFile().then(f => {
                    cb(null, new FSAStats(true, f.size, f.lastModified));
                }).catch(cb);
            }
            close(cb) {
                if (this._writable) {
                    this._writable.close().then(() => {
                        this._closed = true;
                        if (this._fs && this._fs._invalidate) this._fs._invalidate(this._path);
                        cb();
                    }).catch(cb);
                } else {
                    this._closed = true;
                    if (this._fs && this._fs._invalidate) this._fs._invalidate(this._path);
                    cb();
                }
            }
            read(buffer, offset, length, position, cb) {
                const pos = typeof position === 'number' ? position : this._position;
                this._handle.getFile().then(f => {
                    const end = Math.min(pos + length, f.size);
                    if (end <= pos) return null;
                    return f.slice(pos, end).arrayBuffer();
                }).then(ab => {
                    if (!ab || !ab.byteLength) { cb(null, 0); return; }
                    buffer.set(new Uint8Array(ab), offset);
                    this._position = pos + ab.byteLength;
                    cb(null, ab.byteLength);
                }).catch(cb);
            }
            write(buffer, offset, length, position, cb) {
                (async () => {
                    try {
                        if (!this._writable) {
                            this._writable = await this._handle.createWritable();
                        }
                        const pos = typeof position === 'number' ? position : this._position;
                        const data = buffer.subarray(offset, offset + length);
                        await this._writable.seek(pos);
                        await this._writable.write(data);
                        this._position = pos + data.length;
                        if (this._fs && this._fs._invalidate) this._fs._invalidate(this._path);
                        cb(null, data.length);
                    } catch(e) { cb(e); }
                })();
            }
            sync(cb) {
                if (this._writable) {
                    // 不在这里 close，close 由 close() 负责
                    cb();
                } else {
                    cb();
                }
            }
            stat(cb) { this.getStats(cb); }
        }

        class FileSystemAccessFS {
            constructor(dirHandle) {
                this._handle = dirHandle;
                this._name = 'FileSystemAccess';
                // readdir already yields each entry's handle/kind. Keep a short-lived metadata
                // snapshot so the explorer's follow-up stat calls don't traverse the same path again.
                this._statCache = new Map();
                this._statCacheTtl = 2500;
            }

            _cachePath(path) {
                const parts = this._resolve(path);
                return parts.length ? '/' + parts.join('/') : '/';
            }

            _cacheStat(path, isFile, size, mtime) {
                if (this._statCache.size > 10000) this._statCache.clear();
                this._statCache.set(this._cachePath(path), {
                    isFile: !!isFile, size: Number(size) || 0, mtime: Number(mtime) || 0,
                    expires: Date.now() + this._statCacheTtl
                });
            }

            _invalidate(path) {
                const key = this._cachePath(path);
                const parent = key === '/' ? '/' : (key.slice(0, key.lastIndexOf('/')) || '/');
                const prefix = key === '/' ? '/' : key + '/';
                for (const cachedPath of this._statCache.keys()) {
                    if (cachedPath === key || cachedPath === parent || cachedPath.startsWith(prefix)) this._statCache.delete(cachedPath);
                }
            }
            getName() { return 'FileSystemAccess'; }
            static _err(code, path) {
                const messages = { ENOENT: 'No such file or directory', EEXIST: 'File already exists', ENOTDIR: 'Not a directory', EISDIR: 'Is a directory', ENOTEMPTY: 'Directory not empty', EINVAL: 'Invalid argument', ENOTSUP: 'Operation not supported' };
                const error = new Error((messages[code] || 'Filesystem error') + ': ' + path);
                error.code = code;
                error.path = path;
                return error;
            }
            // 取子项句柄（文件或文件夹），不存在时返回 null。
            static async _child(parent, name) {
                try { return await parent.getFileHandle(name); }
                catch (error) {
                    if (error && error.name === 'NotFoundError') return null;
                    if (!error || error.name !== 'TypeMismatchError') throw error;
                }
                return parent.getDirectoryHandle(name);
            }
            // 复制一个文件或整个文件夹到 dstParent/name（文件直接以 Blob 写入，不整个读进内存）。
            static async _copyEntry(src, dstParent, name) {
                if (src.kind === 'file') {
                    const file = await src.getFile();
                    const fh = await dstParent.getFileHandle(name, { create: true });
                    const writable = await fh.createWritable();
                    await writable.write(file);
                    await writable.close();
                    return;
                }
                const dir = await dstParent.getDirectoryHandle(name, { create: true });
                for await (const [childName, child] of src.entries()) await FileSystemAccessFS._copyEntry(child, dir, childName);
            }
            static Create(opts, cb) {
                if (opts.handle instanceof FileSystemDirectoryHandle) {
                    cb(null, new FileSystemAccessFS(opts.handle));
                } else {
                    cb(new Error('Invalid FileSystemDirectoryHandle'));
                }
            }
            isReadOnly() { return false; }
            supportsLinks() { return false; }
            supportsProps() { return false; }

            _resolve(path) {
                const parts = path.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
                return parts;
            }

            _getHandle(path) {
                const parts = this._resolve(path);
                let chain = Promise.resolve(this._handle);
                for (const p of parts) {
                    chain = chain.then(h => h.getDirectoryHandle(p));
                }
                return chain;
            }

            // 与文件后端保持一致的 stat 回调签名。
            stat(path, isLstat, cb) {
                if (typeof isLstat === 'function') { cb = isLstat; isLstat = false; }
                const parts = this._resolve(path);
                const cacheKey = this._cachePath(path);
                const cached = this._statCache.get(cacheKey);
                if (cached && cached.expires > Date.now()) {
                    cb(null, new FSAStats(cached.isFile, cached.size, cached.mtime));
                    return;
                }
                if (cached) this._statCache.delete(cacheKey);
                if (parts.length === 0) {
                    cb(null, new FSAStats(false, 0, 0));
                    return;
                }
                const parentParts = parts.slice(0, -1);
                const name = parts[parts.length - 1];
                let chain = Promise.resolve(this._handle);
                for (const p of parentParts) {
                    chain = chain.then(h => h.getDirectoryHandle(p));
                }
                chain.then(parentHandle => {
                    return parentHandle.getDirectoryHandle(name).then(() => {
                        this._cacheStat(path, false, 0, 0);
                        cb(null, new FSAStats(false, 0, 0));
                    }).catch(() => {
                        return parentHandle.getFileHandle(name).then(fh => {
                            return fh.getFile().then(f => {
                                this._cacheStat(path, true, f.size, f.lastModified);
                                cb(null, new FSAStats(true, f.size, f.lastModified));
                            });
                        });
                    });
                }).catch(cb);
            }

            readdir(path, cb) {
                this._getHandle(path).then(async handle => {
                    const items = [];
                    const fileJobs = [];
                    for await (const [name, entryHandle] of handle.entries()) {
                        items.push(name);
                        const childPath = this._cachePath(path === '/' ? '/' + name : path + '/' + name);
                        if (entryHandle.kind === 'directory') {
                            this._cacheStat(childPath, false, 0, 0);
                        } else {
                            fileJobs.push(async () => {
                                try {
                                    const file = await entryHandle.getFile();
                                    this._cacheStat(childPath, true, file.size, file.lastModified);
                                } catch (_) { /* A later stat can retry if metadata is temporarily unavailable. */ }
                            });
                        }
                    }
                    // Bound concurrency for large directories instead of firing thousands of
                    // getFile requests at once. Metadata calls run in parallel within each batch.
                    for (let i = 0; i < fileJobs.length; i += 32) {
                        await Promise.all(fileJobs.slice(i, i + 32).map(job => job()));
                    }
                    return items;
                }).then(items => cb(null, items)).catch(cb);
            }

            mkdir(path, mode, cb) {
                if (typeof mode === 'function') { cb = mode; mode = undefined; }
                const parts = this._resolve(path);
                if (parts.length === 0) { cb(null); return; }
                const parentParts = parts.slice(0, -1);
                const name = parts[parts.length - 1];
                let chain = Promise.resolve(this._handle);
                for (const p of parentParts) {
                    chain = chain.then(h => h.getDirectoryHandle(p));
                }
                chain.then(async parentHandle => {
                    let exists = false;
                    try { await parentHandle.getDirectoryHandle(name); exists = true; }
                    catch (error) {
                        if (error && error.name === 'TypeMismatchError') exists = true;
                        else if (!error || error.name !== 'NotFoundError') throw error;
                    }
                    if (exists) throw FileSystemAccessFS._err('EEXIST', path);
                    return parentHandle.getDirectoryHandle(name, { create: true });
                }).then(() => { this._invalidate(path); cb(null); }).catch(cb);
            }

            rmdir(path, cb) {
                const parts = this._resolve(path);
                if (parts.length === 0) { cb(new Error('Cannot remove root')); return; }
                const parentParts = parts.slice(0, -1);
                const name = parts[parts.length - 1];
                let chain = Promise.resolve(this._handle);
                for (const p of parentParts) {
                    chain = chain.then(h => h.getDirectoryHandle(p));
                }
                chain.then(async parentHandle => {
                    // 与根卷一致：只删除空文件夹。以前用 recursive:true，会把非空文件夹连内容一起删掉。
                    let dirHandle;
                    try { dirHandle = await parentHandle.getDirectoryHandle(name); }
                    catch (error) {
                        if (error && error.name === 'TypeMismatchError') throw FileSystemAccessFS._err('ENOTDIR', path);
                        throw error;
                    }
                    for await (const _ of dirHandle.keys()) throw FileSystemAccessFS._err('ENOTEMPTY', path);
                    return parentHandle.removeEntry(name);
                }).then(() => { this._invalidate(path); cb(null); }).catch(cb);
            }

            unlink(path, cb) {
                const parts = this._resolve(path);
                if (parts.length === 0) { cb(new Error('Cannot unlink root')); return; }
                const parentParts = parts.slice(0, -1);
                const name = parts[parts.length - 1];
                let chain = Promise.resolve(this._handle);
                for (const p of parentParts) {
                    chain = chain.then(h => h.getDirectoryHandle(p));
                }
                chain.then(async parentHandle => {
                    try { await parentHandle.getFileHandle(name); }
                    catch (error) {
                        if (error && error.name === 'TypeMismatchError') throw FileSystemAccessFS._err('EISDIR', path);
                        throw error;
                    }
                    return parentHandle.removeEntry(name);
                }).then(() => { this._invalidate(path); cb(null); }).catch(cb);
            }

            // 浏览器的文件句柄不能修改日期；日期由系统的日期记录（mtimeCache）保存，这里只确认路径存在。
            utimes(path, atime, mtime, cb) {
                this.stat(path, false, err => cb(err || null));
            }

            // 与文件后端保持一致的 readFile 回调签名。
            readFile(path, encoding, flag, cb) {
                if (typeof flag === 'function') { cb = flag; flag = undefined; }
                if (typeof encoding === 'function') { cb = encoding; encoding = null; flag = undefined; }
                const parts = this._resolve(path);
                if (parts.length === 0) { cb(new Error('EISDIR')); return; }
                const parentParts = parts.slice(0, -1);
                const name = parts[parts.length - 1];
                let chain = Promise.resolve(this._handle);
                for (const p of parentParts) {
                    chain = chain.then(h => h.getDirectoryHandle(p));
                }
                chain.then(parentHandle => {
                    return parentHandle.getFileHandle(name);
                }).then(fh => {
                    return fh.getFile();
                }).then(file => {
                    if (encoding === 'utf8' || encoding === 'utf-8') {
                        return file.text().then(text => cb(null, text));
                    } else {
                        return file.arrayBuffer().then(ab => {
                            cb(null, new NativeBuffer(ab));
                        });
                    }
                }).catch(cb);
            }

            // 与文件后端保持一致的 writeFile 回调签名。
            writeFile(path, data, encoding, flag, mode, cb) {
                if (typeof mode === 'function') { cb = mode; mode = undefined; }
                if (typeof flag === 'function') { cb = flag; flag = undefined; mode = undefined; }
                if (typeof encoding === 'function') { cb = encoding; encoding = null; flag = undefined; mode = undefined; }
                const parts = this._resolve(path);
                if (parts.length === 0) { cb(new Error('EISDIR')); return; }
                const parentParts = parts.slice(0, -1);
                const name = parts[parts.length - 1];
                let chain = Promise.resolve(this._handle);
                for (const p of parentParts) {
                    chain = chain.then(h => h.getDirectoryHandle(p));
                }
                chain.then(parentHandle => {
                    return parentHandle.getFileHandle(name, { create: true });
                }).then(fh => {
                    return fh.createWritable();
                }).then(writable => {
                    let content;
                    if (typeof data === 'string') {
                        content = new TextEncoder().encode(data);
                    } else if (Buffer.isBuffer(data)) {
                        content = new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
                    } else {
                        content = new Uint8Array(data);
                    }
                    return writable.write(content).then(() => writable.close());
                }).then(() => { this._invalidate(path); cb(null); }).catch(cb);
            }

            rename(oldPath, newPath, cb) {
                // 语义与根卷一致：可重命名文件和文件夹；目标是文件则覆盖，是空文件夹则替换，非空报 ENOTEMPTY。
                // 以前用 读→写→删 实现，文件夹根本无法重命名。
                const from = this._resolve(oldPath), to = this._resolve(newPath);
                (async () => {
                    if (!from.length || !to.length) throw FileSystemAccessFS._err('EINVAL', oldPath);
                    const fromKey = '/' + from.join('/'), toKey = '/' + to.join('/');
                    if (fromKey === toKey) return;
                    if (toKey.startsWith(fromKey + '/')) throw FileSystemAccessFS._err('EINVAL', newPath);
                    const srcParent = await this._getHandle('/' + from.slice(0, -1).join('/'));
                    const dstParent = await this._getHandle('/' + to.slice(0, -1).join('/'));
                    const srcName = from[from.length - 1], dstName = to[to.length - 1];
                    const src = await FileSystemAccessFS._child(srcParent, srcName);
                    if (!src) throw FileSystemAccessFS._err('ENOENT', oldPath);
                    const existing = await FileSystemAccessFS._child(dstParent, dstName);
                    let sameEntry = false;
                    if (existing) {
                        sameEntry = typeof existing.isSameEntry === 'function' && await existing.isSameEntry(src);
                        if (!sameEntry) {
                            if (existing.kind !== src.kind) throw FileSystemAccessFS._err(src.kind === 'directory' ? 'ENOTDIR' : 'EISDIR', newPath);
                            if (existing.kind === 'directory') { for await (const _ of existing.keys()) throw FileSystemAccessFS._err('ENOTEMPTY', newPath); }
                            await dstParent.removeEntry(dstName);
                        }
                    }
                    if (typeof src.move === 'function') {
                        try { await src.move(dstParent, dstName); return; }
                        catch (error) { if (sameEntry) throw error; /* 部分浏览器或本地文件夹不支持移动，改用复制 */ }
                    } else if (sameEntry) throw FileSystemAccessFS._err('ENOTSUP', newPath);
                    await FileSystemAccessFS._copyEntry(src, dstParent, dstName);
                    await srcParent.removeEntry(srcName, { recursive: src.kind === 'directory' });
                })().then(() => { this._invalidate(oldPath); this._invalidate(newPath); cb(null); }, cb);
            }

            open(path, flags, mode, cb) {
                if (typeof mode === 'function') { cb = mode; mode = undefined; }
                const parts = this._resolve(path);
                if (parts.length === 0) { cb(new Error('EISDIR')); return; }
                const parentParts = parts.slice(0, -1);
                const name = parts[parts.length - 1];
                let chain = Promise.resolve(this._handle);
                for (const p of parentParts) {
                    chain = chain.then(h => h.getDirectoryHandle(p));
                }
                const create = flags && (flags.indexOf('w') !== -1 || flags.indexOf('a') !== -1 || flags.indexOf('+') !== -1);
                chain.then(parentHandle => {
                    return parentHandle.getFileHandle(name, { create: !!create });
                }).then(fh => {
                    cb(null, new FSAFile(fh, this, path));
                }).catch(cb);
            }

            exists(path, cb) {
                this.stat(path, false, (err) => {
                    cb(!err);
                });
            }
        }

        // === OPFS 后端 ===
        // Origin Private File System 由浏览器提供，容量会计入 navigator.storage.estimate()。
        // 它被挂载到 /opfs，而不是替换根文件系统：用户可随时在文件管理器中同时查看
        // IndexedDB 与 OPFS，并把文件直接创建、上传、复制或移动到任一位置。
        function initOPFSBackend(done) {
            const finish = typeof done === 'function' ? done : function() {};
            SYSTEM.opfs = { supported: false, available: false, rootPath: '/opfs' };
            const supportsOPFS = !!(navigator.storage && typeof navigator.storage.getDirectory === 'function');
            SYSTEM.opfs.supported = supportsOPFS;
            if (!supportsOPFS || !SYSTEM.rootFs) { finish(); return; }

            navigator.storage.getDirectory().then(async rootHandle => {
                try {
                    SYSTEM.rootFs.mount(SYSTEM.opfs.rootPath, new FileSystemAccessFS(rootHandle));
                    SYSTEM.opfs.available = true;
                    // OPFS 根目录已经由挂载提供，只需创建用户可直接使用的工作区。
                    await ensureDir('/opfs/desktop');
                    await ensureDir('/opfs/documents');
                    console.info('OPFS 后端已挂载到 /opfs');
                } catch (err) {
                    SYSTEM.opfs.available = false;
                    console.warn('OPFS 后端不可用，将继续使用 IndexedDB:', err);
                }
            }).catch(err => {
                console.warn('无法获取 OPFS 根目录，将继续使用 IndexedDB:', err);
            }).finally(finish);
        }

        function checkSystemFiles() {
            const fs = SYSTEM.fs;
            const dirs = ['/system', '/system/config', '/desktop', '/documents'];
            let i = 0;
            function next() {
                if (i >= dirs.length) { loadUserConfig(); return; }
                const dir = dirs[i++];
                fs.exists(dir, (exists) => {
                    if (!exists) fs.mkdir(dir, next);
                    else next();
                });
            }
            next();
        }

        function loadUserConfig() {
            SYSTEM.fs.readFile(SYSTEM.configPath, 'utf8', (err, data) => {
                const mine = (!err && data && String(data).trim()) ? String(data).trim() : 'https://images.unsplash.com/photo-1614121181207-4b6c334d353d?w=1920';
                SYSTEM.customWallpaper = mine;
                let first = mine;
                try {
                    const st = JSON.parse(localStorage.getItem(SYSTEM_SETTINGS_STORAGE_KEY) || 'null');
                    const bing = JSON.parse(localStorage.getItem('JISHENG_OS_BING_WALLPAPER') || 'null');
                    if (st && st.wallpaperSource === 'bing' && bing && bing.today && wpSafeUrl(bing.today.url)) first = bing.today.url;
                } catch (_) {}
                setBg(first, false);
                wpHistoryLoad().then(() => {
                    // 第一次使用本版本：把现有的自定义壁纸记进“最近使用”，以后换掉也能找回
                    if (!SYSTEM.wallpaperHistory.length && !wpIsPreset(mine) && wpValidStored(mine)) wpHistoryAdd(mine, wpNameOf(mine));
                });

                loadSystemSettings(() => {
                    applySystemAppVisibility();
                    refreshDesktop();
                    renderCalendar();
                    Notify.init();
                    initGlobalUploadInputs();
                    Notify.success('欢迎回来', 'JISHENG OS 已准备就绪');
                    wpBingInit();
