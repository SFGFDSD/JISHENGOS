        // 返回上级。两个用户工作区各自是常规浏览的顶层；开启系统文件后，根目录 / 也可安全浏览。
        function folderGoUp(windowId) {
            const state = SYSTEM.folderWindowStates[windowId];
            if (!state) return;

            const topPaths = getExplorerStorageRoots().concat(['/mnt/local', '/mnt', '/']);
            if (topPaths.includes(state.currentPath)) {
                Notify.warning('提示', '已经是此位置的最顶层目录');
                return;
            }
            const parentPath = state.currentPath.substring(0, state.currentPath.lastIndexOf('/')) || '/';
            const parentName = parentPath === '/desktop' ? 'IndexedDB 文件'
                              : parentPath === '/opfs/desktop' ? 'OPFS 文件'
                              : parentPath === '/mnt/local' ? '本地文件'
                              : parentPath === '/mnt' ? '挂载点'
                              : parentPath === '/' ? '完整文件系统'
                              : parentPath.split('/').pop();
            state.currentPath = parentPath;
            state.folderName = parentName;
            state.parentPath = parentPath === '/' ? '/' : (parentPath.substring(0, parentPath.lastIndexOf('/')) || '/');
            state.searchQuery = '';
            state.fileStats = {};
            // 更新窗口标题
            const win = document.getElementById('folder-content-' + windowId)?.closest('.window');
            if (win) {
                const titleEl = win.querySelector('.window-title-text');
                if (titleEl) titleEl.textContent = parentName;
            }
            const searchInput = document.getElementById('folder-search-' + windowId);
            if (searchInput) searchInput.value = '';
            updateFolderBreadcrumb(windowId);
            renderFolderContent(windowId);
        }

        // 刷新
        function folderRefresh(windowId) {
            const state = SYSTEM.folderWindowStates[windowId];
            if (!state) return;
            state.fileStats = {};
            renderFolderContent(windowId);
            refreshDesktop();
            Notify.success('已刷新', '文件夹内容已更新');
        }

        // 新建文件/文件夹
        async function folderCreateNew(windowId, type) {
            const state = SYSTEM.folderWindowStates[windowId];
            if (!state) return;

            // 统一使用系统文件接口（本地挂载目录由 File System Access 后端支持）
            if (type === 'folder') {
                const name = await SysDialog.prompt({ title: '新建文件夹', icon: 'uiNewFolder', label: '文件夹名称', value: '新建文件夹', okText: '创建', validate: SysDialog.nameValidator('文件夹名称') });
                if (!name) return;
                SYSTEM.fs.mkdir(state.currentPath + '/' + name, (err) => {
                    if (err) Notify.error('创建失败', err.message);
                    else { renderFolderContent(windowId); refreshDesktop(); Notify.success('成功', '文件夹已创建'); }
                });
            } else {
                const name = await SysDialog.prompt({ title: '新建文件', icon: 'uiNewFile', label: '文件名称', value: '新建文本文档.txt', okText: '创建', validate: SysDialog.nameValidator('文件名称') });
                if (!name) return;
                const filePath = state.currentPath + '/' + name;
                // 同名文件已存在时不覆盖（以前会把已有文件清空）
                SYSTEM.fs.stat(filePath, (statErr) => {
                    if (!statErr) { Notify.error('创建失败', `"${name}" 已存在`); return; }
                    SYSTEM.fs.writeFile(filePath, '', (err) => {
                        if (err) Notify.error('创建失败', err.message);
                        else { renderFolderContent(windowId); refreshDesktop(); Notify.success('成功', '文件已创建'); }
                    });
                });
            }
        }

        // 更新面包屑导航，显式标明当前路径属于 IndexedDB、OPFS 还是系统根目录。
        function updateFolderBreadcrumb(windowId) {
            const state = SYSTEM.folderWindowStates[windowId];
            const bcEl = document.getElementById('folder-breadcrumb-' + windowId);
            if (!state || !bcEl) return;

            const rootLabels = {
                '/desktop': 'IndexedDB 文件',
                '/opfs/desktop': 'OPFS 文件',
                '/mnt/local': '本地文件',
                '/mnt': '挂载点',
                '/': '完整文件系统'
            };
            const parts = [];
            let p = state.currentPath || '/';
            while (p) {
                if (Object.prototype.hasOwnProperty.call(rootLabels, p)) {
                    // OPFS 不可用时不会主动产生该路径，但保留标签以兼容旧窗口状态。
                    parts.unshift({ name: rootLabels[p], path: p });
                    break;
                }
                parts.unshift({ name: p.split('/').pop(), path: p });
                const parent = p.substring(0, p.lastIndexOf('/')) || '/';
                if (parent === p) break;
                p = parent;
            }

            let html = '';
            parts.forEach((part, i) => {
                if (i > 0) html += '<span class="bc-sep">›</span>';
                const isCurrent = i === parts.length - 1;
                html += `<span class="bc-item ${isCurrent ? 'current' : ''}" onclick="folderNavigateTo('${windowId}', '${part.path}', '${part.name}')">${escapeHtml(part.name)}</span>`;
            });
            bcEl.innerHTML = html;
        }

        // 面包屑导航跳转
        function folderNavigateTo(windowId, targetPath, targetName) {
            const state = SYSTEM.folderWindowStates[windowId];
            if (!state || state.currentPath === targetPath) return;
            state.currentPath = targetPath;
            state.folderName = targetName;
            state.parentPath = targetPath === '/' ? '/' : (targetPath.substring(0, targetPath.lastIndexOf('/')) || '/');
            state.searchQuery = '';
            state.fileStats = {};
            const win = document.getElementById('folder-content-' + windowId)?.closest('.window');
            if (win) {
                const titleEl = win.querySelector('.window-title-text');
                if (titleEl) titleEl.textContent = targetName;
            }
            const searchInput = document.getElementById('folder-search-' + windowId);
            if (searchInput) searchInput.value = '';
            updateFolderBreadcrumb(windowId);
            renderFolderContent(windowId);
        }

        // 初始化文件夹拖放高亮（支持外部文件拖拽导入）
        function initFolderDropHighlight(windowId) {
            const contentArea = document.getElementById('folder-content-' + windowId);
            if (!contentArea) return;

            let dragCounter = 0;
            contentArea.addEventListener('dragenter', (e) => {
                e.preventDefault();
                // 自己拖出去的东西拖回来：不给任何"可以放这里"的暗示
                if (isInternalNativeDrag(e)) return;
                dragCounter++;
                contentArea.classList.add('folder-content-drop-active');
            });
            contentArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dragCounter--;
                if (dragCounter <= 0) {
                    dragCounter = 0;
                    contentArea.classList.remove('folder-content-drop-active');
                }
            });
            contentArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (isInternalNativeDrag(e)) { try { e.dataTransfer.dropEffect = 'none'; } catch(_) {} }
            });
            contentArea.addEventListener('drop', async (e) => {
                e.preventDefault();
                dragCounter = 0;
                contentArea.classList.remove('folder-content-drop-active');

                // 拖出到真实桌面的过程中又放回系统内部 —— 什么都不做
                if (isInternalNativeDrag(e)) return;
                
                const state = SYSTEM.folderWindowStates?.[windowId];
                if(!state) return;
                
                const targetPath = state.currentPath;
                
                // === 定义防抖刷新函数 ===
                let refreshTimer = null;
                const debouncedRefresh = () => {
                    if (refreshTimer) clearTimeout(refreshTimer);
                    refreshTimer = setTimeout(() => {
                        state.fileStats = {};
                        renderFolderContent(windowId);
                        refreshDesktop();
                        Notify.success('导入完成', '文件已导入到当前文件夹');
                    }, 200);
                };
                
                // 1. 处理系统内部文件拖拽（从桌面或其他文件夹拖入）
                const dragData = e.dataTransfer.getData('text/plain');
                if (dragData) {
                    try {
                        const { srcPath, filename } = JSON.parse(dragData);
                        if (srcPath && filename) {
                            SYSTEM.fs.readFile(srcPath, (err, data) => {
                                if (!err) {
                                    const destPath = targetPath + '/' + filename;
                                    SYSTEM.fs.writeFile(destPath, data, () => {
                                        debouncedRefresh();
                                    });
                                }
                            });
                        }
                    } catch (e) { }
                    return;
                }
                
                // 2. 处理外部拖拽（从真实桌面/文件管理器拖入）
                const items = e.dataTransfer.items;
                if (items && items.length > 0) {
                    let processCount = 0;
                    let totalItems = 0;
                    
                    // 先计算总项目数
                    for (let i = 0; i < items.length; i++) {
                        const item = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
                        if (item) totalItems++;
                    }
                    
                    if (totalItems === 0) return;
                    
                    Notify.info('正在处理', `开始导入 ${totalItems} 个项目...`);
                    
                    // 递归扫描函数
                    const traverseFileTree = (item, relativePath) => {
                        relativePath = relativePath || "";
                        
                        if (item.isFile) {
                            item.file((file) => {
                                const reader = new FileReader();
                                reader.onload = (ev) => {
                                    const buffer = SYSTEM.Buffer.from(ev.target.result);
                                    const fullPath = targetPath + (relativePath ? '/' + relativePath : '') + '/' + file.name;
                                    const parentDir = fullPath.substring(0, fullPath.lastIndexOf('/'));
                                    
                                    ensureDir(parentDir).then(() => {
                                        SYSTEM.fs.writeFile(fullPath, buffer, () => {
                                            // 保留拖入文件原始修改时间
                                            if(file.lastModified && SYSTEM.fs.utimes) {
                                                try { SYSTEM.fs.utimes(fullPath, file.lastModified, file.lastModified, () => {}); } catch(e) {}
                                            }
                                            processCount++;
                                            if (processCount === totalItems) {
                                                debouncedRefresh();
                                            }
                                        });
                                    });
                                };
                                reader.readAsArrayBuffer(file);
                            });
                        } else if (item.isDirectory) {
                            const dirPath = (relativePath ? relativePath + '/' : '') + item.name;
                            const fullDirPath = targetPath + '/' + dirPath;
                            
                            ensureDir(fullDirPath).then(() => {
                                processCount++;
                                if (processCount === totalItems) {
                                    debouncedRefresh();
                                }
                                
                                const dirReader = item.createReader();
                                const readEntries = () => {
                                    dirReader.readEntries((entries) => {
                                        if (entries.length > 0) {
                                            totalItems += entries.length;
                                            entries.forEach((entry) => traverseFileTree(entry, dirPath));
                                            readEntries();
                                        }
                                    });
                                };
                                readEntries();
                            });
                        }
                    };

                    for (let i = 0; i < items.length; i++) {
                        const item = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
                        if (item) traverseFileTree(item);
                    }
                }
            });
        }

        // 刷新已存在的同名文件夹窗口内容（增强版）
        function refreshFolderWindow(folderName) {
            SYSTEM.fs.readdir(SYSTEM.desktopPath + '/' + folderName, (err, files) => {
                if (err) return;

                document.querySelectorAll('.window').forEach(win => {
                    const titleText = win.querySelector('.window-title-text')?.innerText;
                    if (titleText !== folderName) return;

                    // 查找对应的 windowId
                    const contentArea = win.querySelector('.content-area');
                    if (!contentArea) return;
                    const contentId = contentArea.id; // folder-content-XXXX
                    const windowId = contentId.replace('folder-content-', '');
                    const state = SYSTEM.folderWindowStates?.[windowId];

                    if (state) {
                        state.fileStats = {};
                        renderFolderContent(windowId);
                    } else {
                        // 旧版窗口，用简单刷新
                        const path = SYSTEM.desktopPath + '/' + folderName;
                        let content = files.length === 0
                            ? '<div style="padding:40px;text-align:center;color:#888">文件夹为空</div>'
                            : files.map(file => {
                                let icon = getFileIconPath(file, false);

                                return `
                                    <div class="folder-item" data-filename="${escapeAttr(file)}" data-path="${escapeAttr(path + '/' + file)}" data-isdir="false"
                                         onclick="handleLegacyFolderItemSingleClick(event, this)"
                                         ondblclick="handleLegacyFolderItemDoubleClick(event, this)"
                                         onmousedown="handleFolderItemMouseDown(event, '${contentId.replace('folder-content-', '')}')"
                                         ontouchstart="handleFolderItemTouchStart(event, '${contentId.replace('folder-content-', '')}')"
                                         oncontextmenu="handleFolderItemContextMenu(event, '${contentId.replace('folder-content-', '')}', '${file}', '${path}/${file}')">
                                        <svg class="icon-svg" viewBox="0 0 24 24">${icon}</svg>
                                        <span class="file-name">${file}</span>
                                    </div>
                                `;
                            }).join('');

                        const selectionBox = contentArea.querySelector('.folder-selection-box');
                        contentArea.innerHTML = '';
                        if (selectionBox) contentArea.appendChild(selectionBox);
                        contentArea.insertAdjacentHTML('beforeend', content);
                    }
                });
            });
        }

        // 文件夹窗口框选逻辑
        function initFolderSelection(windowId) {
            const contentArea = document.getElementById('folder-content-' + windowId);
            const filelistArea = document.getElementById('folder-filelist-' + windowId);
            const selectionBox = document.getElementById('folder-selection-' + windowId);
            // 兼容新旧结构：优先使用 filelistArea，回退到 contentArea
            const scrollArea = filelistArea || contentArea;
            if (!scrollArea || !selectionBox) return () => {};
            let isSelecting = false, startX, startY;
            let lastClientX = 0, lastClientY = 0;
            let scrollInterval = null;

            const getPos = (e) => {
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            };

            const updateSelectionBox = () => {
                const rect = scrollArea.getBoundingClientRect();
                const curX = lastClientX - rect.left + scrollArea.scrollLeft;
                const curY = lastClientY - rect.top + scrollArea.scrollTop;

                const left = Math.min(startX, curX);
                const top = Math.min(startY, curY);
                const width = Math.abs(startX - curX);
                const height = Math.abs(startY - curY);

                selectionBox.style.left = left + 'px';
                selectionBox.style.top = top + 'px';
                selectionBox.style.width = width + 'px';
                selectionBox.style.height = height + 'px';

                const items = scrollArea.querySelectorAll('.folder-item, .folder-grid-item');
                items.forEach(item => {
                    const itemLeft = item.offsetLeft;
                    const itemTop = item.offsetTop;
                    const itemRight = itemLeft + item.offsetWidth;
                    const itemBottom = itemTop + item.offsetHeight;

                    const intersect = !(itemRight < left || itemLeft > left + width ||
                                       itemBottom < top || itemTop > top + height);

                    if(intersect) {
                        item.classList.add('selected');
                    } else {
                        item.classList.remove('selected');
                    }
                });
            };

            const startAutoScroll = (speed) => {
                stopAutoScroll();
                scrollInterval = setInterval(() => {
                    scrollArea.scrollTop += speed;
                    updateSelectionBox();
                }, 16);
            };

            const stopAutoScroll = () => {
                if (scrollInterval) {
                    clearInterval(scrollInterval);
                    scrollInterval = null;
                }
            };

            const handleStart = (e) => {
                if(e.button === 2) return;
                if(isSelecting) return;
                if(e.target.closest('.folder-item, .folder-grid-item')) return;

                e.preventDefault();
                e.stopPropagation();
                clearFolderSelection(windowId);
                isSelecting = true;
                scrollArea.dataset.isSelecting = 'true';

                const pos = getPos(e);
                const rect = scrollArea.getBoundingClientRect();
                lastClientX = pos.x;
                lastClientY = pos.y;
                startX = pos.x - rect.left + scrollArea.scrollLeft;
                startY = pos.y - rect.top + scrollArea.scrollTop;

                selectionBox.style.display = 'block';
                selectionBox.style.width = '0';
                selectionBox.style.height = '0';
                selectionBox.style.left = startX + 'px';
                selectionBox.style.top = startY + 'px';
            };

            const handleMove = (e) => {
                if(!isSelecting) return;
                if(e.type === 'touchmove') e.preventDefault();

                const pos = getPos(e);
                lastClientX = pos.x;
                lastClientY = pos.y;

                const rect = scrollArea.getBoundingClientRect();
                const scrollZone = 40;
                const scrollSpeed = 12;

                stopAutoScroll();

                if (pos.y < rect.top + scrollZone && pos.y > rect.top - 60) {
                    const ratio = Math.min(1, (rect.top + scrollZone - pos.y) / scrollZone);
                    startAutoScroll(-ratio * scrollSpeed);
                } else if (pos.y > rect.bottom - scrollZone && pos.y < rect.bottom + 60) {
                    const ratio = Math.min(1, (pos.y - (rect.bottom - scrollZone)) / scrollZone);
                    startAutoScroll(ratio * scrollSpeed);
                }

                updateSelectionBox();
            };

            const handleEnd = () => {
                isSelecting = false;
                scrollArea.dataset.isSelecting = 'false';
                selectionBox.style.display = 'none';
                stopAutoScroll();
            };

            scrollArea.onmousedown = handleStart;
            scrollArea.ontouchstart = handleStart;

            // 移动端空白区域长按菜单
            let blankLongPressTimer = null;
            let blankLongPressTriggered = false;
            let blankTouchStartX = 0, blankTouchStartY = 0;

            scrollArea.addEventListener('touchstart', (e) => {
                if (e.target.closest('.folder-item, .folder-grid-item')) return;
                blankLongPressTriggered = false;
                const touch = e.touches[0];
                blankTouchStartX = touch.clientX;
                blankTouchStartY = touch.clientY;
                blankLongPressTimer = setTimeout(() => {
                    blankLongPressTriggered = true;
                    clearFolderSelection(windowId);
                    const hasClipboardItems = Clipboard.hasItems();
                    const menuItems = `
                        <div class="context-item" onclick="folderRefresh('${windowId}'); closeCtx()">
                            ${icon('uiRefresh','sm')}
                            <span>刷新</span>
                        </div>
                        ${hasClipboardItems ? `
                        <div class="context-divider"></div>
                        <div class="context-item" onclick="pasteToFolderWindow('${windowId}'); closeCtx()">
                            ${icon('uiPaste','sm')}
                            <span>粘贴</span>
                        </div>
                        ` : ''}
                        <div class="context-divider"></div>
                        <div class="context-item" onclick="SYSTEM.uploadTargetPath=SYSTEM.folderWindowStates['${windowId}'].currentPath;SYSTEM.uploadTargetWindowId='${windowId}';document.getElementById('global-upload-file').click();closeCtx()">
                            ${icon('uiUpload','sm')}
                            <span>上传文件</span>
                        </div>
                        <div class="context-item" onclick="SYSTEM.uploadTargetPath=SYSTEM.folderWindowStates['${windowId}'].currentPath;SYSTEM.uploadTargetWindowId='${windowId}';document.getElementById('global-upload-folder').click();closeCtx()">
                            ${icon('uiUploadFolder','sm')}
                            <span>上传文件夹</span>
                        </div>
                        <div class="context-divider"></div>
                        <div class="context-item" onclick="folderCreateNew('${windowId}','folder'); closeCtx()">
                            ${icon('uiNewFolder','sm')}
                            <span>新建文件夹</span>
                        </div>
                        <div class="context-item" onclick="folderCreateNew('${windowId}','file'); closeCtx()">
                            ${icon('uiNewFile','sm')}
                            <span>新建文本文档</span>
                        </div>
                        <div class="context-item" onclick="createNewHtmlFile(SYSTEM.folderWindowStates['${windowId}'].currentPath, '${windowId}'); closeCtx()">
                            ${icon('uiNewHtml','sm')}
                            <span>新建 HTML 文档</span>
                        </div>
                    `;
                    document.getElementById('context-menu').innerHTML = menuItems;
                    showCtx(blankTouchStartX, blankTouchStartY);
                }, 500);
            }, { passive: true });

            scrollArea.addEventListener('touchmove', (e) => {
                if (blankLongPressTimer) {
                    const touch = e.touches[0];
                    const dx = touch.clientX - blankTouchStartX;
                    const dy = touch.clientY - blankTouchStartY;
                    if (dx * dx + dy * dy > 25) {
                        clearTimeout(blankLongPressTimer);
                        blankLongPressTimer = null;
                    }
                }
            }, { passive: true });

            scrollArea.addEventListener('touchend', () => {
                if (blankLongPressTimer) {
                    clearTimeout(blankLongPressTimer);
                    blankLongPressTimer = null;
                }
            }, { passive: true });

            // 空白区域右键菜单（桌面端）
            scrollArea.oncontextmenu = (e) => {
                if (e.target.closest('.folder-item, .folder-grid-item')) return;
                e.preventDefault();
                e.stopPropagation();
                clearFolderSelection(windowId);
                const state = SYSTEM.folderWindowStates[windowId];
                const hasClipboardItems = Clipboard.hasItems();
                const menuItems = `
                    <div class="context-item" onclick="folderRefresh('${windowId}'); closeCtx()">
                        ${icon('uiRefresh','sm')}
                        <span>刷新</span>
                    </div>
                    ${hasClipboardItems ? `
                    <div class="context-divider"></div>
                    <div class="context-item" onclick="pasteToFolderWindow('${windowId}'); closeCtx()">
                        ${icon('uiPaste','sm')}
                        <span>粘贴</span>
                    </div>
                    ` : ''}
                    <div class="context-divider"></div>
                    <div class="context-item" onclick="SYSTEM.uploadTargetPath=SYSTEM.folderWindowStates['${windowId}'].currentPath;SYSTEM.uploadTargetWindowId='${windowId}';document.getElementById('global-upload-file').click();closeCtx()">
                        ${icon('uiUpload','sm')}
                        <span>上传文件</span>
                    </div>
                    <div class="context-item" onclick="SYSTEM.uploadTargetPath=SYSTEM.folderWindowStates['${windowId}'].currentPath;SYSTEM.uploadTargetWindowId='${windowId}';document.getElementById('global-upload-folder').click();closeCtx()">
                        ${icon('uiUploadFolder','sm')}
                        <span>上传文件夹</span>
                    </div>
                    <div class="context-divider"></div>
                    <div class="context-item" onclick="folderCreateNew('${windowId}','folder'); closeCtx()">
                        ${icon('uiNewFolder','sm')}
                        <span>新建文件夹</span>
                    </div>
                    <div class="context-item" onclick="folderCreateNew('${windowId}','file'); closeCtx()">
                        ${icon('uiNewFile','sm')}
                        <span>新建文本文档</span>
                    </div>
                    <div class="context-item" onclick="createNewHtmlFile(SYSTEM.folderWindowStates['${windowId}'].currentPath, '${windowId}'); closeCtx()">
                        ${icon('uiNewHtml','sm')}
                        <span>新建 HTML 文档</span>
                    </div>
                `;
                document.getElementById('context-menu').innerHTML = menuItems;
                showCtx(e.clientX, e.clientY);
            };

            document.addEventListener('mousemove', handleMove);
            document.addEventListener('touchmove', handleMove, { passive: false });

            document.addEventListener('mouseup', handleEnd);
            document.addEventListener('touchend', handleEnd);

            // 返回清理函数，用于移除事件监听器
            return function cleanup() {
                document.removeEventListener('mousemove', handleMove);
                document.removeEventListener('touchmove', handleMove);
                document.removeEventListener('mouseup', handleEnd);
                document.removeEventListener('touchend', handleEnd);
                stopAutoScroll();
            };
        }

        // === 文件夹项原生拖出（拖到真实桌面）===
        // 长按 400ms 后启用原生 dragstart，把文件以 DownloadURL 形式交给浏览器，
        // 从而可拖到浏览器外的真实桌面。未长按时 preventDefault，交由自定义 mousemove 拖拽。
        SYSTEM._folderNativeDrag = false;
        function preloadFolderItemForDrag(el) {
            const p = el.dataset.path;
            const n = el.dataset.filename;
            if (p && n) hoverPreloadForDrag(p, n);
        }
        function handleFolderItemDragStart(e, el) {
            if (!SYSTEM._folderNativeDrag) {
                // 未长按：阻止原生拖拽，保留给自定义 mousemove 拖拽（窗口内/窗口间移动）
                e.preventDefault();
                return false;
            }
            // 长按已启用：执行原生拖出
            if (!currentDragFile || !dragFileReady) {
                // 兜底：预加载未完成则阻止（避免拖出空数据）
                e.preventDefault();
                return false;
            }
            // 原生拖拽已接管：立刻拆掉自定义拖拽的 mousemove/mouseup 监听。
            // 否则拖到真实桌面再回到页面时不会收到 mouseup，残留监听会让
            // 拖拽幽灵一直跟着指针跑（即此前"回来后还挂着已选中文件"的问题）。
            if (SYSTEM._folderDragTeardown) SYSTEM._folderDragTeardown();
            el.style.outline = '2px solid rgba(0, 120, 212, 0.5)';
            handleNativeDragStart(e, el.dataset.filename);
            return true;
        }

        function handleFolderItemMouseDown(e, windowId) {
            if(e.button !== 0) return;

            const scrollArea = document.getElementById('folder-filelist-' + windowId) || document.getElementById('folder-content-' + windowId);
            if(!scrollArea) return;

            if(scrollArea.dataset.isSelecting === 'true') return;

            const item = e.currentTarget;

            if(e.ctrlKey) {
                item.classList.toggle('selected');
            } else if(!item.classList.contains('selected')) {
                clearFolderSelection(windowId);
                item.classList.add('selected');
            }

            setupFolderItemDrag(e, windowId);
        }

        // 移动端双击检测（防止Edge等浏览器将双击识别为缩放）
        let _lastTapTime = 0;
        let _lastTapTarget = null;

        function handleFolderItemTouchStart(e, windowId) {
            const scrollArea = document.getElementById('folder-filelist-' + windowId) || document.getElementById('folder-content-' + windowId);
            if(!scrollArea) return;

            if(scrollArea.dataset.isSelecting === 'true') return;

            const item = e.currentTarget;
            const now = Date.now();
            item._lastTouchStartAt = now;

            // 双击模式下，同一元素 300ms 内连续两次触摸视为双击。
            if (SYSTEM.clickBehavior === 'double' && _lastTapTarget === item && now - _lastTapTime < 300) {
                const filename = item.dataset.filename;
                const fullPath = item.dataset.path;
                const isDir = item.dataset.isdir === 'true';
                item._suppressNextDoubleOpen = true;
                setTimeout(() => { item._suppressNextDoubleOpen = false; }, 450);
                activateFolderItem(windowId, filename, fullPath, isDir);
                _lastTapTime = 0;
                _lastTapTarget = null;
                e.preventDefault();
                e.stopPropagation();
                return;
            }

            if (SYSTEM.clickBehavior === 'double') {
                _lastTapTime = now;
                _lastTapTarget = item;
            } else {
                _lastTapTime = 0;
                _lastTapTarget = null;
            }

            if(!item.classList.contains('selected')) {
                clearFolderSelection(windowId);
                item.classList.add('selected');
            }

            e.stopPropagation();
            // 不调用 preventDefault()，允许浏览器处理触摸滚动
            setupFolderItemDrag(e, windowId, item);
        }

                    ${(!isDirItem && canOpenWith(filename)) ? `<div class="context-divider"></div>${buildOpenWithMenu(safeFullPath, safeFilename, filename)}` : ''}
                    ${(!isDirItem && isImageFile(filename)) ? `<div class="context-divider"></div><div class="context-item" onclick="setWallpaperFromPath(${escapeAttr(JSON.stringify(fullPath))}, ${escapeAttr(JSON.stringify(filename))}); closeCtx()">${icon('uiWallpaperCtx','sm')}<span>设为桌面壁纸</span></div>` : ''}
                    ${isArchiveFile(filename) ? `<div class="context-item" onclick="extractZipFromPath('${safeFullPath}'); closeCtx()">${icon('uiExtractSimple','sm')}<span>解压</span></div>` : ''}
                    <div class="context-divider"></div>
                    <div class="context-item" onclick="copySelectedFolderItems('${windowId}'); closeCtx()">
                        ${icon('uiCopy','sm')}

        // 修复(#14)：依次打开文件夹窗口中所有选中项（支持列表/网格视图）
        function openSelectedFolderItems(windowId) {
            const contentArea = document.getElementById('folder-content-' + windowId);
            if(!contentArea) return;
            const selectedItems = Array.from(contentArea.querySelectorAll('.folder-item.selected, .folder-grid-item.selected'));
            selectedItems.forEach(item => {
                const filename = item.dataset.filename;
                const fullPath = item.dataset.path;
                if(filename && fullPath) openFileFromPath(fullPath, filename);
            });
        }

        async function deleteFolderItems(windowId) {
            if (!(await SysDialog.confirm({ title: '删除', icon: 'uiDelete', danger: true, okText: '删除', message: '确定删除选中项吗？' }))) return;
            
            const contentArea = document.getElementById('folder-content-' + windowId);
            if(!contentArea) return;
            
            // 使用窗口状态中的路径（支持子文件夹导航）
            const state = SYSTEM.folderWindowStates?.[windowId];
            const folderName = state ? state.folderName : contentArea.closest('.window').querySelector('.window-title-text').innerText;
            const path = state ? state.currentPath : SYSTEM.desktopPath + '/' + folderName;
            
            const selectedItems = Array.from(contentArea.querySelectorAll('.folder-item.selected, .folder-grid-item.selected'));
            const total = selectedItems.length;
            if(total === 0) return;

            // 修复(Bug A / #13)：
            // - 原实现对文件夹使用 fs.unlink 会失败（unlink 不能删目录），
            //   导致批量删除多个文件夹时失败；
            // - 原实现仅在成功时计数，失败时计数器永不达到 total，
            //   导致"删除成功"通知永不触发、窗口卡住不刷新；
            // - 失败被静默忽略，用户得不到提示。
            // 这里按"完成数"（成功+失败）计数，文件夹走递归删除，最后如实汇报结果。
            let doneCount = 0;
            let successCount = 0;
            let errorCount = 0;

            const checkDone = () => {
                if(doneCount === total) {
                    if (state) { state.fileStats = {}; renderFolderContent(windowId); }
                    else refreshFolderWindow(folderName);
                    refreshDesktop();
                    if(errorCount > 0) {
                        Notify.error('部分失败', `成功删除 ${successCount} 个，失败 ${errorCount} 个`);
                    } else {
                        Notify.success('删除成功', `已删除 ${successCount} 个项目`);
                    }
                }
            };

            selectedItems.forEach(item => {
                const filename = item.dataset.filename;
                const fullPath = path + '/' + filename;

                SYSTEM.fs.stat(fullPath, (statErr, stats) => {
                    if(statErr || !stats) {
                        // 可能已被其它操作删除（竞态）或无法访问，记为失败但不卡住流程
                        console.error('删除失败(无法访问):', filename, statErr);
                        errorCount++; doneCount++; checkDone();
                        return;
                    }

                    const isDir = stats.isDirectory ? (typeof stats.isDirectory === 'function' ? stats.isDirectory() : stats.isDirectory) : false;

                    if(isDir) {
                        deleteFolderRecursive(fullPath, (delErr) => {
                            if(delErr) { console.error('删除文件夹失败:', filename, delErr); errorCount++; }
                            else { successCount++; }
                            doneCount++; checkDone();
                        });
                    } else {
                        SYSTEM.fs.unlink(fullPath, (delErr) => {
                            if(delErr) { console.error('删除文件失败:', filename, delErr); errorCount++; }
                            else { successCount++; }
                            doneCount++; checkDone();
                        });
                    }
                });
            });
        }

        async function deleteFolderItem(windowId, filename) {
            if (!(await SysDialog.confirm({ title: '删除', icon: 'uiDelete', danger: true, okText: '删除', message: `确定删除 "${filename}" 吗？` }))) return;
            
            const contentArea = document.getElementById('folder-content-' + windowId);
            if(!contentArea) return;
            
            const state = SYSTEM.folderWindowStates?.[windowId];
            const folderName = state ? state.folderName : contentArea.closest('.window').querySelector('.window-title-text').innerText;
            const path = state ? state.currentPath : SYSTEM.desktopPath + '/' + folderName;
            const fullPath = path + '/' + filename;
            
            // 先检查是否是文件夹
            SYSTEM.fs.stat(fullPath, (err, stats) => {
                if(err) {
                    Notify.error('删除失败', err.message);
                    return;
                }
                
                if(stats.isDirectory()) {
                    // 使用递归删除文件夹
                    deleteFolderRecursive(fullPath, (err) => {
                        if(err) {
                            Notify.error('删除失败', err.message);
                        } else {
                            if (state) { state.fileStats = {}; renderFolderContent(windowId); }
                            else refreshFolderWindow(folderName);
                            refreshDesktop();
                            Notify.success('删除成功', `文件夹 "${filename}" 已删除`);
                        }
                    });
                } else {
                    // 删除文件
                    SYSTEM.fs.unlink(fullPath, (err) => {
                        if(err) {
                            Notify.error('删除失败', err.message);
                        } else {
                            if (state) { state.fileStats = {}; renderFolderContent(windowId); }
                            else refreshFolderWindow(folderName);
                            refreshDesktop();
                            Notify.success('删除成功', `文件 "${filename}" 已删除`);
                        }
                    });
                }
            });
        }

        async function renameFolderItem(windowId, oldName) {
            const newName = await SysDialog.prompt({ title: '重命名', icon: 'uiRename', label: '新名称', value: oldName, okText: '重命名', validate: SysDialog.nameValidator('名称') });
            if(!newName || newName === oldName) return;
            
            const contentArea = document.getElementById('folder-content-' + windowId);
            if(!contentArea) return;
            
            const state = SYSTEM.folderWindowStates?.[windowId];
            const folderName = state ? state.folderName : contentArea.closest('.window').querySelector('.window-title-text').innerText;
            const path = state ? state.currentPath : SYSTEM.desktopPath + '/' + folderName;
            const oldPath = path + '/' + oldName;
            const newPath = path + '/' + newName;
            
            SYSTEM.fs.rename(oldPath, newPath, (err) => {
                if(err) {
                    Notify.error('重命名失败', err.message);
                } else {
                    if (state) { state.fileStats = {}; renderFolderContent(windowId); }
                    else refreshFolderWindow(folderName);
                    refreshDesktop();
                    Notify.success('重命名成功', `已重命名为 "${newName}"`);
                }
            });
        }

        // 工具栏：重命名当前选中的第一个项目
        function renameSelectedFolderItem(windowId) {
            const contentArea = document.getElementById('folder-content-' + windowId);
            if(!contentArea) return;
            const selectedItems = Array.from(contentArea.querySelectorAll('.folder-item.selected, .folder-grid-item.selected'));
            if(selectedItems.length === 0) {
                Notify.info('未选择文件');
                return;
            }
            if(selectedItems.length > 1) {
                Notify.info('请只选择一个文件进行重命名');
                return;
            }
            const filename = selectedItems[0].dataset.filename;
            if(filename) renameFolderItem(windowId, filename);
        }

        // === 文件夹窗口的复制/剪切/粘贴功能 ===

        // 更新所有已打开文件夹窗口的粘贴按钮状态（剪贴板为空时禁用变灰）
        function updatePasteButtonState(windowId) {
            const updateOne = (wid) => {
                const btn = document.getElementById('folder-paste-' + wid);
                if(!btn) return;
                if(Clipboard.hasItems()) {
                    btn.classList.remove('disabled');
                } else {
                    btn.classList.add('disabled');
                }
            };
            if(windowId) {
                updateOne(windowId);
            } else {
                // 更新所有打开的文件夹窗口
                Object.keys(SYSTEM.folderWindowStates || {}).forEach(updateOne);
            }
        }

        // 复制选中的文件夹项目
        function copySelectedFolderItems(windowId) {
            const contentArea = document.getElementById('folder-content-' + windowId);
            if(!contentArea) return;
            
            const selectedItems = Array.from(contentArea.querySelectorAll('.folder-item.selected, .folder-grid-item.selected'));
            if(selectedItems.length === 0) {
                Notify.info('未选择文件');
                return;
            }
            
            Clipboard.clear();
            Clipboard.setCutMode(false);
            
            selectedItems.forEach(item => {
                const filename = item.dataset.filename;
                const path = item.dataset.path;
                if(filename && path) {
                    Clipboard.add({
                        path: path,
                        filename: filename,
                        type: 'copy'
                    });
                }
            });
            
            Notify.success('已复制', `已复制 ${Clipboard.getItems().length} 个项目到剪贴板`);
            updatePasteButtonState();
        }

        // 剪切选中的文件夹项目
        function cutSelectedFolderItems(windowId) {
            const contentArea = document.getElementById('folder-content-' + windowId);
            if(!contentArea) return;
            
            const selectedItems = Array.from(contentArea.querySelectorAll('.folder-item.selected, .folder-grid-item.selected'));
            if(selectedItems.length === 0) {
                Notify.info('未选择文件');
                return;
            }
            
            Clipboard.clear();
            Clipboard.setCutMode(true);
            
            selectedItems.forEach(item => {
                const filename = item.dataset.filename;
                const path = item.dataset.path;
                if(filename && path) {
                    Clipboard.add({
                        path: path,
                        filename: filename,
                        type: 'cut'
                    });
                    // 视觉反馈
                    item.style.opacity = '0.5';
                }
            });
            
            Notify.success('已剪切', `已剪切 ${Clipboard.getItems().length} 个项目`);
            updatePasteButtonState();
        }

        // 粘贴到文件夹窗口（顺序处理，避免竞态条件）
        function pasteToFolderWindow(windowId) {
            if(!Clipboard.hasItems()) {
                Notify.info('剪贴板为空');
                return;
            }
            
            const state = SYSTEM.folderWindowStates?.[windowId];
            if(!state) {
                Notify.error('错误', '无法获取窗口状态');
                return;
            }
            
            const destPath = state.currentPath;
            const items = Clipboard.getItems();
            const isCut = Clipboard.isCut;
            const srcPaths = items.map(i => i.path);
            let processedCount = 0;
            let errorCount = 0;
            
            // 顺序处理每个项目，避免同名文件竞态
            function processNext(index) {
                if (index >= items.length) {
                    // 所有项目处理完毕
                    if(isCut) {
                        Clipboard.clear();
                        document.querySelectorAll('.folder-item, .folder-grid-item').forEach(el => el.style.opacity = '');
                        document.querySelectorAll('.desktop-icon').forEach(el => el.style.opacity = '');
                    }
                    refreshAllAffectedWindows(destPath, srcPaths, isCut);
                    updatePasteButtonState();
                    if(errorCount > 0) {
                        Notify.error('部分失败', `成功 ${processedCount} 个，失败 ${errorCount} 个`);
                    } else {
                        Notify.success('粘贴成功', `已${isCut ? '移动' : '复制'} ${processedCount} 个项目`);
                    }
                    return;
                }
                
                const item = items[index];
                const targetPath = destPath + '/' + item.filename;
                
                // 检查目标是否已存在（复制时只要目标存在就生成新名称，剪切时源!=目标才生成）
                SYSTEM.fs.stat(targetPath, (err) => {
                    if(!err && (isCut ? targetPath !== item.path : true)) {
                        // 目标已存在，生成新名称（参考青丝OS数字叠加方式）
                        const dotIdx = item.filename.lastIndexOf('.');
                        let newName;
                        let counter = 1;
                        if (dotIdx > 0) {
                            const baseName = item.filename.substring(0, dotIdx);
                            const ext = item.filename.substring(dotIdx);
                            newName = baseName + ' (' + counter + ')' + ext;
                        } else {
                            newName = item.filename + ' (' + counter + ')';
                        }
                        
                        const checkAndRename = () => {
                            const newPath = destPath + '/' + newName;
                            SYSTEM.fs.stat(newPath, (err) => {
                                if(!err) {
                                    counter++;
                                    const dotIdx2 = item.filename.lastIndexOf('.');
                                    if (dotIdx2 > 0) {
                                        const baseName = item.filename.substring(0, dotIdx2);
                                        const ext = item.filename.substring(dotIdx2);
                                        newName = baseName + ' (' + counter + ')' + ext;
                                    } else {
                                        newName = item.filename + ' (' + counter + ')';
                                    }
                                    checkAndRename();
                                } else {
                                    performFolderPaste(item.path, newPath, isCut, () => {
                                        processNext(index + 1);
                                    });
                                }
                            });
                        };
                        checkAndRename();
                    } else {
                        performFolderPaste(item.path, targetPath, isCut, () => {
                            processNext(index + 1);
                        });
                    }
                });
            }
            
            function performFolderPaste(srcPath, destPath, isCut, done) {
                if(isCut) {
                    // JISHENG FS move：同一存储内 rename，跨存储自动 复制（保留日期）+ 删除源
                    SYSTEM.jfs.move(srcPath, destPath).then(() => {
                        processedCount++;
                        done();
                    }, (err) => {
                        console.error('剪切失败:', err);
                        errorCount++;
                        done();
                    });
                } else {
                    SYSTEM.fs.stat(srcPath, (err, stats) => {
                        if(err) {
                            errorCount++;
                            done();
                            return;
                        }
                        if(stats.isDirectory()) {
                            copyFolderRecursive(srcPath, destPath, (err) => {
                                if(err) {
                                    console.error('复制文件夹失败:', err);
                                    errorCount++;
                                } else {
                                    processedCount++;
                                }
                                done();
                            });
                        } else {
                            SYSTEM.fs.readFile(srcPath, (err, data) => {
                                if(err) {
                                    errorCount++;
                                    done();
                                    return;
                                }
                                SYSTEM.fs.writeFile(destPath, data, (err) => {
                                    if(err) {
                                        console.error('写入文件失败:', err);
                                        errorCount++;
                                    } else {
                                        // 复制时保留原始修改时间
                                        if (stats.mtime && SYSTEM.fs.utimes) {
                                            try { SYSTEM.fs.utimes(destPath, stats.mtime, stats.mtime, () => {}); } catch(e) {}
                                        }
                                        processedCount++;
                                    }
                                    done();
                                });
                            });
                        }
                    });
                }
            }
            
            processNext(0);
        }

        function setupFolderItemDrag(e, windowId, touchItem) {
            const contentArea = document.getElementById('folder-content-' + windowId);
            if(!contentArea) return;

            const selectedItems = Array.from(contentArea.querySelectorAll('.folder-item.selected, .folder-grid-item.selected'));
            if(selectedItems.length === 0) return;

            const getPos = (e) => {
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            };

            const startPos = getPos(e);
            const startX = startPos.x;
            const startY = startPos.y;
            const activationItem = touchItem || e.currentTarget || null;
            let isDragging = false;
            let hasMovedForActivation = false;
            let dragPreview = null;
            let longPressTimer = null;
            let longPressTriggered = false;
            let touchMoveRegistered = false;
            // 鼠标长按计时器：长按 400ms 后启用原生拖出（拖到真实桌面）
            let nativeDragTimer = null;

            // 长按检测（仅触摸设备）
            if (e.type === 'touchstart' && touchItem) {
                longPressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    // 触发上下文菜单
                    const filename = touchItem.dataset.filename;
                    const fullPath = touchItem.dataset.path;
                    if (filename && fullPath) {
                        handleFolderItemContextMenu({
                            preventDefault: () => {},
                            stopPropagation: () => {},
                            clientX: startX,
                            clientY: startY,
                            currentTarget: touchItem
                        }, windowId, filename, fullPath);
                    }
                }, 500);
            }

            // 鼠标长按检测：长按后启用原生拖出（参照桌面图标的长按机制）
            if (e.type === 'mousedown') {
                nativeDragTimer = setTimeout(() => {
                    SYSTEM._folderNativeDrag = true;
                    // 预加载主选中项以备原生拖出
                    const primary = selectedItems[0];
                    if (primary && primary.dataset.path && primary.dataset.filename) {
                        preloadFileForDrag(primary.dataset.path, primary.dataset.filename, () => {});
                    }
                    // 与桌面图标长按一致的视觉提示
                    selectedItems.forEach(it => it.style.outline = '2px solid rgba(0, 120, 212, 0.5)');
                }, 400);
            }

            const onMove = (moveEvent) => {
                // 鼠标在浏览器窗口外松开（收不到 mouseup）后又移回页面：
                // buttons === 0 说明键已经松了，直接结束，别让幽灵继续粘着指针。
                if (moveEvent.type === 'mousemove' && moveEvent.buttons === 0) {
                    cleanup();
                    return;
                }

                const pos = getPos(moveEvent);
                const dx = pos.x - startX;
                const dy = pos.y - startY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMovedForActivation = true;

                // 长按已触发，取消后续拖拽
                if (longPressTriggered) {
                    cleanup();
                    return;
                }

                // 鼠标长按已启用原生拖出：交由浏览器 dragstart 处理，不启动自定义拖拽
                if (SYSTEM._folderNativeDrag) {
                    return;
                }

                // 移动超过阈值，取消长按（触摸 + 鼠标）
                if (longPressTimer && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                if (nativeDragTimer && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                    clearTimeout(nativeDragTimer);
                    nativeDragTimer = null;
                    SYSTEM._folderNativeDrag = false;
                }

                if(!isDragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                    // 触摸时才需要区分"横向拖拽 / 纵向滚动"；鼠标没有滚动冲突，
                    // 任意方向都应立刻起拖（否则往下拖到桌面会拖不动，很顿）。
                    const isTouch = (moveEvent.type === 'touchmove');
                    if (!isTouch || Math.abs(dx) > Math.abs(dy) * 1.2) {
                        isDragging = true;
                        document.body.style.cursor = 'grabbing';

                        const filesData = selectedItems.map(item => ({
                            filename: item.dataset.filename,
                            path: item.dataset.path,
                            isdir: item.dataset.isdir === 'true'
                        }));

                        dragPreview = createDragPreview(filesData, pos.x, pos.y);

                        // 确认是拖拽后，注册非passive的touchmove来阻止滚动
                        if (!touchMoveRegistered && moveEvent.type === 'touchmove') {
                            touchMoveRegistered = true;
                            document.removeEventListener('touchmove', onMove);
                            document.addEventListener('touchmove', onMove, { passive: false });
                        }
                    }
                    // 否则是垂直滚动，不阻止，让浏览器自然滚动
                }

                if(isDragging && dragPreview) {
                    if(moveEvent.type === 'touchmove') moveEvent.preventDefault();
                    moveDragPreview(dragPreview, pos.x, pos.y);
                    updateDropHighlight(pos.x, pos.y, selectedItems);
                }
            };

            const cleanup = () => {
                if(longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                if(nativeDragTimer) { clearTimeout(nativeDragTimer); nativeDragTimer = null; }
                SYSTEM._folderNativeDrag = false;
                selectedItems.forEach(it => it.style.outline = 'none');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onUp);
                document.body.style.cursor = '';
                if(dragPreview) { dragPreview.remove(); dragPreview = null; }
                endDropHighlight();
                SYSTEM._folderDragTeardown = null;
            };
            // 供原生拖出（dragstart）调用：原生拖拽接管后立刻拆掉自定义拖拽，
            // 否则从真实桌面回来时 mouseup 已丢失，残留的 mousemove 会让幽灵一直粘在指针上。
            SYSTEM._folderDragTeardown = () => cleanup();

            const onUp = (upEvent) => {
                if(longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                if(nativeDragTimer) { clearTimeout(nativeDragTimer); nativeDragTimer = null; }
                SYSTEM._folderNativeDrag = false;
                SYSTEM._folderDragTeardown = null;
                selectedItems.forEach(it => it.style.outline = 'none');

                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onUp);
                document.body.style.cursor = '';

                if(dragPreview) {
                    dragPreview.remove();
                    dragPreview = null;
                }
                endDropHighlight();

                // 拖动或触屏滚动结束后可能仍会收到合成 click；单击打开模式下抑制它。
                if (hasMovedForActivation) {
                    const ignoreUntil = Date.now() + (upEvent.type === 'touchend' ? 420 : 120);
                    if (activationItem) activationItem._ignoreActivationUntil = ignoreUntil;
                    selectedItems.forEach(it => { it._ignoreActivationUntil = ignoreUntil; });
                }

                if(!isDragging) return;

                const pos = getPos(upEvent);
                const target = document.elementFromPoint(pos.x, pos.y);
                if(!target) return;
                const desktop = document.getElementById('desktop');
                
                // 修复(#2)：源路径必须取自窗口状态的 currentPath（支持子文件夹导航），
                // 而非窗口标题拼接 desktopPath，否则在子目录中拖放会使用错误的源路径。
                const srcState = SYSTEM.folderWindowStates?.[windowId];
                const folderName = srcState ? srcState.folderName
                    : contentArea.closest('.window').querySelector('.window-title-text').innerText;
                const sourcePath = srcState ? srcState.currentPath : (SYSTEM.desktopPath + '/' + folderName);
                
                let targetPath = null;
                let targetFolderName = null;
                let operationType = 'copy';
                
                const folderWindow = target.closest('.window');
                const desktopIcon = target.closest('.desktop-icon');
                
                // === 修复后的判定逻辑 ===
                // 此处不再检查 desktop.contains(target)，因为 window 元素并不是 desktop 的子元素
                if (folderWindow) {
                    // 1. 如果目标是窗口（文件夹窗口）
                    // 修复(#3)：目标路径取自目标窗口状态的 currentPath，而非窗口标题，
                    // 否则目标窗口已导航到子目录时会移动到错误的位置。
                    const targetContent = folderWindow.querySelector('.content-area[id^="folder-content-"]');
                    const targetWindowId = targetContent ? targetContent.id.replace('folder-content-', '') : null;
                    const targetState = targetWindowId ? SYSTEM.folderWindowStates?.[targetWindowId] : null;
                    if (targetState) {
                        targetFolderName = targetState.folderName;
                        targetPath = targetState.currentPath;
                    } else {
                        // 非文件夹窗口（如记事本等），不是有效拖放目标
                        return;
                    }
                    operationType = 'move';
                } else if (desktopIcon && desktopIcon.dataset.filename && desktopIcon.dataset.isdir === 'true') {
                     // 2. 如果目标是桌面上的文件夹图标
                    // 修复(#4)：只有当桌面图标确实是文件夹时才作为投放目标，
                    // 避免把文件拖到普通文件图标上时产生错误路径。
                    const iconFilename = desktopIcon.dataset.filename;
                    targetPath = SYSTEM.desktopPath + '/' + iconFilename;
                    targetFolderName = iconFilename;
                    operationType = 'move';
                } else if (desktop.contains(target) || target === desktop || target.id === 'desktop-icons' || target.id === 'desktop-grid' || target.id === 'selection-box') {
                    // 3. 如果目标是桌面背景
                    targetPath = SYSTEM.desktopPath;
                    targetFolderName = '桌面';
                    operationType = 'move';
                } else {
                    // 无效目标
                    return;
                }
                
                if(!targetPath) return;
                
                if(targetPath === sourcePath) {
                    Notify.warning('操作无效', '不能将文件移动到同一文件夹');
                    return;
                }
                
                let processedCount = 0;
                let errorCount = 0;
                const total = selectedItems.length;
                const operationText = operationType === 'move' ? '移动' : '复制';
                
                const processFile = (item, callback) => {
                    const filename = item.dataset.filename;
                    const srcPath = item.dataset.path;
                    const destPath = targetPath + '/' + filename;
                    // 修复(#5)：先判断源是文件还是目录，目录走递归复制/删除，
                    // 避免直接 fs.readFile 文件夹时静默失败。
                    const isDir = item.dataset.isdir === 'true';

                    console.log(`开始${operationText}: ${filename} 从 ${srcPath} 到 ${destPath} (${isDir ? '目录' : '文件'})`);

                    // 移动目录时：先尝试 rename，失败（如跨文件系统）则回退到 复制+删除。
                    const moveDirectory = () => {
                        SYSTEM.fs.rename(srcPath, destPath, (renameErr) => {
                            if(!renameErr) {
                                processedCount++;
                                callback();
                                return;
                            }
                            // 修复(#6)：rename 跨挂载点失败，回退到递归复制后删除源
                            copyFolderRecursive(srcPath, destPath, (copyErr) => {
                                if(copyErr) {
                                    errorCount++;
                                    console.error('移动文件夹失败(复制阶段):', filename, copyErr);
                                    callback();
                                    return;
                                }
                                deleteFolderRecursive(srcPath, (delErr) => {
                                    if(delErr) { console.error('移动文件夹失败(删除源阶段):', filename, delErr); }
                                    processedCount++;
                                    callback();
                                });
                            });
                        });
                    };

                    const moveFile = () => {
                        SYSTEM.fs.rename(srcPath, destPath, (renameErr) => {
                            if(!renameErr) {
                                verifyFileIntegrity(destPath, filename, (isValid) => {
                                    if(isValid) { processedCount++; }
                                    else { errorCount++; console.error('移动成功但验证失败:', filename); }
                                    callback();
                                });
                                return;
                            }
                            // 修复(#6)：rename 跨文件系统失败，回退到 复制+删除
                            SYSTEM.fs.stat(srcPath, (sErr, sStats) => {
                                const mtime = (!sErr && sStats.mtime) ? sStats.mtime : null;
                                SYSTEM.fs.readFile(srcPath, (readErr, data) => {
                                    if(readErr) { errorCount++; console.error('移动文件失败(读取):', filename, readErr); callback(); return; }
                                    SYSTEM.fs.writeFile(destPath, data, (writeErr) => {
                                        if(writeErr) { errorCount++; console.error('移动文件失败(写入):', filename, writeErr); callback(); return; }
                                        if(mtime && SYSTEM.fs.utimes) { try { SYSTEM.fs.utimes(destPath, mtime, mtime, () => {}); } catch(e) {} }
                                        SYSTEM.fs.unlink(srcPath, () => { processedCount++; callback(); });
                                    });
                                });
                            });
                        });
                    };

                    const copyFileOnly = () => {
                        // 先取源文件修改时间，复制后回写以保留原始修改日期
                        SYSTEM.fs.stat(srcPath, (sErr, sStats) => {
                            const mtime = (!sErr && sStats.mtime) ? sStats.mtime : null;
                            SYSTEM.fs.readFile(srcPath, (readErr, data) => {
                                if(readErr) { errorCount++; console.error('读取文件失败:', filename, readErr); callback(); return; }
                                SYSTEM.fs.writeFile(destPath, data, (writeErr) => {
                                    if(writeErr) {
                                        errorCount++;
                                        console.error('写入文件失败:', filename, writeErr);
                                        callback();
                                    } else {
                                        if(mtime && SYSTEM.fs.utimes) { try { SYSTEM.fs.utimes(destPath, mtime, mtime, () => {}); } catch(e) {} }
                                        verifyFileIntegrity(destPath, filename, (isValid) => {
                                            if(isValid) { processedCount++; }
                                            else { errorCount++; console.error('复制成功但验证失败:', filename); }
                                            callback();
                                        });
                                    }
                                });
                            });
                        });
                    };

                    const doOperation = () => {
                        if(operationType === 'move') {
                            if(isDir) moveDirectory(); else moveFile();
                        } else {
                            if(isDir) {
                                copyFolderRecursive(srcPath, destPath, (copyErr) => {
                                    if(copyErr) { errorCount++; console.error('复制文件夹失败:', filename, copyErr); }
                                    else { processedCount++; }
                                    callback();
                                });
                            } else {
                                copyFileOnly();
                            }
                        }
                    };

                    // 检查目标是否已存在，存在则确认覆盖（移动/复制统一处理）
                    SYSTEM.fs.stat(destPath, async (err) => {
                        if(!err) {
                            if (!(await SysDialog.confirm({ title: '文件已存在', icon: 'uiWarning', danger: true, okText: '覆盖', message: `"${filename}" 已存在于目标文件夹，是否覆盖？` }))) {
                                processedCount++;
                                callback();
                                return;
                            }
                        }
                        doOperation();
                    });
                };
                
                const verifyFileIntegrity = (filePath, filename, callback) => {
                    SYSTEM.fs.readFile(filePath, (err, data) => {
                        if(err) {
                            console.error('验证失败 - 无法读取文件:', filename, err);
                            callback(false);
                            return;
                        }
                        
                        const size = data.length;
                        const checksum = simpleChecksum(data);
                        
                        console.log(`文件验证: ${filename}, 大小: ${size} bytes, 校验和: ${checksum}`);
                        
                        callback(true);
                    });
                };
                
                const simpleChecksum = (buffer) => {
                    let hash = 0;
                    for(let i = 0; i < buffer.length; i++) {
                        const char = buffer[i];
                        hash = ((hash << 5) - hash) + char;
                        hash = hash & hash;
                    }
                    return hash.toString(16);
                };
                
                const finishOperation = () => {
                    // 收集源路径用于刷新
                    const srcPaths = selectedItems.map(item => item.dataset.path);
                    
                    // 刷新所有受影响的窗口
                    refreshAllAffectedWindows(targetPath, srcPaths, operationType === 'move');
                    
                    if(errorCount > 0) {
                        Notify.error('部分失败', `成功${operationText} ${processedCount} 个文件，失败 ${errorCount} 个`);
                    } else {
                        Notify.success('操作成功', `已${operationText} ${total} 个文件到 ${targetFolderName}`);
                    }
                };
                
                let index = 0;
                const processNext = () => {
                    if(index >= total) {
                        finishOperation();
                        return;
                    }
                    
                    processFile(selectedItems[index], () => {
                        index++;
                        processNext();
                    });
                };
                
                processNext();
            };
            
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            // 触摸事件初始用 passive: true，允许浏览器处理滚动
            // 确认是水平拖拽后会在 onMove 中切换为 passive: false
            document.addEventListener('touchmove', onMove, { passive: true });
            document.addEventListener('touchend', onUp);
        }

        // === 拖拽幽灵：跟随指针的文件图标（多选时右上角带数量角标）===
        function createDragPreview(filesData, x, y) {
            const count = filesData.length;
            const first = filesData[0] || {};
            const g = document.createElement('div');
            g.className = 'drag-ghost';
            g.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24">${getFileIconPath(first.filename || '', !!first.isdir)}</svg>`
                + (count > 1 ? `<span class="drag-ghost-badge">${count}</span>` : '');
            document.body.appendChild(g);
            moveDragPreview(g, x, y);
            return g;
        }

        function moveDragPreview(ghost, x, y) {
            if (!ghost) return;
            ghost.style.left = x + 'px';
            ghost.style.top = y + 'px';
        }

        // === 投放目标高亮：拖到哪里、会落到哪里，实时可见 ===
        // 返回当前指针下的投放目标元素（文件夹项 / 桌面文件夹图标 / 文件夹窗口内容区）
        function findDropTargetEl(x, y, excludeEls) {
            const el = document.elementFromPoint(x, y);
            if (!el) return null;
            const skip = (t) => excludeEls && excludeEls.some(s => s === t || s.contains(t));

            const item = el.closest('.folder-item[data-isdir="true"], .folder-grid-item[data-isdir="true"]');
            if (item && !skip(item)) return item;

            const icon = el.closest('.desktop-icon[data-isdir="true"]');
            if (icon && !skip(icon)) return icon;

            const win = el.closest('.window');
            if (win) {
                const ca = win.querySelector('.content-area[id^="folder-content-"]');
                // 源窗口自身不算投放目标，避免拖动过程中整窗闪高亮
                if (ca && excludeEls && excludeEls.some(sel => ca.contains(sel))) return null;
                return ca;
            }

            return null;
        }

        function clearDropHighlight() {
            document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
            document.querySelectorAll('.folder-item.drag-over, .folder-grid-item.drag-over')
                .forEach(el => el.classList.remove('drag-over'));
            document.querySelectorAll('.folder-content-drop-active')
                .forEach(el => el.classList.remove('folder-content-drop-active'));
        }

        function updateDropHighlight(x, y, excludeEls) {
            const target = findDropTargetEl(x, y, excludeEls);
            // 目标没变就不重复操作 DOM，保证拖拽过程顺滑
            if (SYSTEM._lastDropTarget === target) return target;
            clearDropHighlight();
            SYSTEM._lastDropTarget = target || null;
            if (!target) return null;
            if (target.classList.contains('folder-item') || target.classList.contains('folder-grid-item')) {
                target.classList.add('drag-over');
            } else if (target.classList.contains('desktop-icon')) {
                target.classList.add('drop-hover');
            } else {
                target.classList.add('folder-content-drop-active');
            }
            return target;
        }

        function endDropHighlight() {
            SYSTEM._lastDropTarget = null;
            clearDropHighlight();
        }

        // 兜底：任何原生拖拽结束/落下后，清掉可能残留的拖拽幽灵与投放高亮
        function purgeDragVisuals() {
            document.querySelectorAll('.drag-ghost').forEach(g => g.remove());
            endDropHighlight();
        }
        document.addEventListener('dragend', purgeDragVisuals, true);
        document.addEventListener('drop', purgeDragVisuals, true);
        // 兜底：原生拖拽一结束就清掉"内部拖出"标记（drop 阶段不能清，drop 处理器还要用）
        document.addEventListener('dragend', () => { SYSTEM._internalNativeDrag = false; }, true);

        function clearFolderSelection(windowId) {
            const contentArea = document.getElementById('folder-content-' + windowId);
            if(contentArea) {
                contentArea.querySelectorAll('.folder-item.selected, .folder-grid-item.selected').forEach(item => {

                });
            }
        }
        // === 修复：桌面背景右键菜单 & 新建文件夹 ===
        
        // 重新绑定桌面背景的右键事件
        document.getElementById('desktop').oncontextmenu = (e) => {

                <div class="context-item" onclick="SYSTEM.uploadTargetPath=SYSTEM.desktopPath;SYSTEM.uploadTargetWindowId=null;document.getElementById('global-upload-file').click();closeCtx()">
