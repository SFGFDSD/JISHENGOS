                onInit: (w, id) => {
                    initCodeEditorWindow(id, initialContent, filename, saveDir);
                }
            });
        }

        // 编辑器偏好（新开窗口沿用上一次的选择）
        const EDX_PREFS_KEY = 'JISHENG_OS_EDITOR_PREFS';
        const EDX_PREF_DEFAULTS = { view: 'split', dir: 'h', ratio: 0.5, wrap: true, auto: true, font: 14, device: 'auto' };
        function readEditorPrefs() {
            let p = {};
            try { p = JSON.parse(localStorage.getItem(EDX_PREFS_KEY) || '{}') || {}; } catch (e) {}
            const r = Object.assign({}, EDX_PREF_DEFAULTS, p);
            if (!['code', 'split', 'preview'].includes(r.view)) r.view = 'split';
            if (!['h', 'v'].includes(r.dir)) r.dir = 'h';
            if (!['auto', '768', '375'].includes(String(r.device))) r.device = 'auto';
            r.device = String(r.device);
            r.ratio = Math.min(0.9, Math.max(0.1, +r.ratio || 0.5));
            r.font = Math.min(24, Math.max(10, Math.round(+r.font || 14)));
            return r;
        }
        function initCodeEditorWindow(winId, initialContent, filename, saveDir) {
            const root = document.getElementById(`editor-app-${winId}`);
            const winEl = document.getElementById(`win-${winId}`);
            if (!root) return;
            const $ = r => root.querySelector(`[data-r="${r}"]`);
            const prefs = readEditorPrefs();
            const savePrefs = () => { try { localStorage.setItem(EDX_PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} };

            let editor = null;
            // 当前文件保存目录：来源目录优先，否则桌面
            let editorSaveDir = saveDir || SYSTEM.desktopPath;
            // 当前对应的虚拟文件路径：从虚拟桌面打开 / 导出 / 保存后有值；空白新建或从现实设备导入时为 null
            let editorFsPath = saveDir ? editorSaveDir + '/' + filename : null;
            let cleanGen = 0, lastSavedAt = 0;
            const sState = { query: '', currentIndex: -1, matches: [], markers: [], caseSensitive: false, wholeWord: false, regex: false };
            let _previewBlobUrl = null, _previewLoadingTimer = null, _previewDebounceTimer = null;
            let previewStale = false, previewGen = 0, previewLineOffset = null;
            let narrowPick = null;           // 窗口太窄放不下分屏时，用户临时选的单栏（不覆盖“分屏”偏好）
            let rafStatus = 0, rafLayout = 0;
            const conEntries = [];

            const textarea = $('ta');
            // 注意：刷新预览时会整个换掉这个 iframe，所以必须是 let
            let previewFrame = $('frame');
            const previewLoading = $('loading');
            const body = $('body'), codePane = $('code'), previewPane = $('preview'), splitter = $('split');
            const stage = $('stage'), deviceBox = $('deviceBox'), devLabel = $('devLabel');
            const findBox = $('find'), searchInput = $('findInput'), replaceInput = $('repInput'), searchCount = $('findCount'), findField = $('findField');
            const langSelect = $('lang');
            const fileInput = $('fileInput');

            const LANG_NAMES = { 'htmlmixed': 'HTML', 'css': 'CSS', 'javascript': 'JavaScript', 'markdown': 'Markdown', 'application/json': 'JSON', 'xml': 'XML / SVG' };
            const langByExt = { 'html': 'htmlmixed', 'htm': 'htmlmixed', 'css': 'css', 'js': 'javascript', 'mjs': 'javascript', 'json': 'application/json', 'md': 'markdown', 'markdown': 'markdown', 'xml': 'xml', 'svg': 'xml', 'txt': 'htmlmixed' };
            const extByLang = { 'htmlmixed': '.html', 'css': '.css', 'javascript': '.js', 'markdown': '.md', 'application/json': '.json', 'xml': '.xml' };
            const curLang = () => langSelect.value;

            // ===== CodeMirror 输入模式（只影响本编辑器，navigator.userAgent 与系统其它部分一律不动）=====
            // CodeMirror 5 只在一处“看 UA”：option("inputStyle", mobile ? "contenteditable" : "textarea")。
            // 这就是“手机模式全选只能选一段 / 切成电脑版网站就正常”的全部原因。这里把选择权交给用户：
            //     auto            = 跟随浏览器 UA（CodeMirror 默认行为）
            //     textarea        = 按“电脑浏览器”工作：系统菜单可全选/复制全文，但触屏不能拖拽选字
            //     contenteditable = 按“手机浏览器”工作：可长按拖拽选字，系统全选只到已渲染部分
            // 选择保存在 localStorage，新开的编辑器窗口沿用；“复制全部”两种模式下都可用。
            const EDITOR_INPUT_MODE_KEY = 'JISHENG_OS_EDITOR_INPUT_MODE';
            const INPUT_MODE_SHORT = { textarea: '电脑', contenteditable: '手机' };
            function readInputModePref() {
                try {
                    const v = localStorage.getItem(EDITOR_INPUT_MODE_KEY);
                    if (v === 'textarea' || v === 'contenteditable') return v;
                } catch (e) {}
                return 'auto';
            }
            function resolveInputStyle(pref) { return pref === 'auto' ? CodeMirror.defaults.inputStyle : pref; }
            let inputModePref = readInputModePref();
            let offMobileSelectAll = () => {};

            function keymap() {
                const km = {};
                const bind = (keys, fn) => keys.forEach(k => { km['Ctrl-' + k] = fn; km['Cmd-' + k] = fn; });
                bind(['F'], () => openFind(false));
                bind(['H'], () => openFind(true));
                bind(['S'], () => saveEditorToFile());
                bind(['Shift-S'], () => exportEditorFile('saveas'));
                bind(['O'], () => importEditorFile());
                bind(['Enter'], () => updateEditorPreview());
                bind(['Shift-F'], () => formatEditorCode());
                bind(['/'], cm => cm.execCommand('toggleComment'));
                bind(['G'], cm => cm.execCommand('jumpToLine'));
                bind(['='], () => setFont(prefs.font + 1));
                bind(['-'], () => setFont(prefs.font - 1));
                km['Alt-Z'] = () => setWrap(!prefs.wrap);
                km['F3'] = () => editorSearchNext();
                km['Shift-F3'] = () => editorSearchPrev();
                km['Tab'] = cm => { if (cm.somethingSelected()) cm.indentSelection('add'); else cm.replaceSelection('  ', 'end'); };
                km['Shift-Tab'] = cm => cm.indentSelection('subtract');
                km['Esc'] = () => { if (findBox.classList.contains('open')) closeFind(); else return CodeMirror.Pass; };
                return CodeMirror.normalizeKeyMap(km);
            }

            function createEditorInstance(inputStyle) {
                const cm = CodeMirror.fromTextArea(textarea, {
                    mode: 'htmlmixed',
                    theme: 'material-darker',
                    inputStyle: inputStyle,
                    lineNumbers: true,
                    lineWrapping: prefs.wrap,
                    indentUnit: 2, tabSize: 2, indentWithTabs: false,
                    gutters: ['CodeMirror-linenumbers'],
                    matchBrackets: true,
                    autoCloseBrackets: true,
                    matchTags: { bothTags: true },
                    autoCloseTags: true,
                    styleActiveLine: true,
                    showTrailingSpace: true,
                    extraKeys: keymap()
                });
                cm.on('cursorActivity', scheduleStatus);
                cm.on('change', () => { scheduleStatus(); onDocChanged(); });
                // 把文件拖进编辑区 = 打开该文件（而不是把内容插到鼠标位置）
                cm.on('drop', (c, e) => {
                    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
                    if (!f) return;
                    e.preventDefault();
                    openDeviceFile(f);
                });
                // 手机模式(contenteditable)下修复系统“全选”只能选到已渲染一段的问题；电脑模式(textarea)下该函数为空操作
                offMobileSelectAll = fixMobileSelectAll(cm, '.editor-app');
                return cm;
            }

            // 切换输入模式。CodeMirror 不允许在运行中修改 inputStyle（会直接 throw），
            // 因此在原位重建实例，并保留内容、光标/选区、滚动位置、撤销历史、语言模式与“是否已保存”。
            function switchEditorInputMode(pref) {
                const target = resolveInputStyle(pref);
                inputModePref = pref;
                try {
                    if (pref === 'auto') localStorage.removeItem(EDITOR_INPUT_MODE_KEY);
                    else localStorage.setItem(EDITOR_INPUT_MODE_KEY, pref);
                } catch (e) {}
                const label = `输入方式：${INPUT_MODE_SHORT[target] || target}模式${pref === 'auto' ? '（自动）' : ''}`;
                if (editor.options.inputStyle === target) { updateStatusBar(); Notify.info(label); return; }

                const wasDirty = isDirty();
                const value = editor.getValue();
                const selections = editor.listSelections();
                const scroll = editor.getScrollInfo();
                const topLine = editor.lineAtHeight(scroll.top, 'local');   // 按“首行”恢复滚动位置，两种模型行高测量略有差异
                const history = editor.getHistory();
                const mode = editor.getOption('mode');
                clearEditorHighlights();
                try { offMobileSelectAll(); } catch (e) {}
                editor.toTextArea();
                editor = createEditorInstance(target);
                if (editor.getValue() !== value) editor.setValue(value);
                editor.setOption('mode', mode);
                try { editor.setHistory(history); } catch (e) {}
                cleanGen = wasDirty ? -1 : editor.changeGeneration(true);
                try { editor.setSelections(selections, null, { scroll: false }); } catch (e) { editor.setCursor({ line: 0, ch: 0 }); }
                editor.refresh();
                editor.scrollTo(scroll.left, editor.heightAtLine(topLine, 'local'));
                updateStatusBar(); updateDirty();
                if (sState.query) performEditorSearch();
                Notify.info(label);
            }

            // ===== 文件状态：是否有未保存修改 =====
            const isDirty = () => !!editor && !editor.isClean(cleanGen);
            function markClean() { cleanGen = editor.changeGeneration(true); updateDirty(); }
            function setEditorTitle() {
                const t = document.querySelector(`#win-${winId} .window-title-text`);
                const named = editorFsPath || filename !== '未命名.html';
                if (t) t.textContent = (isDirty() ? '● ' : '') + (named ? `HTML编辑器 - ${filename}` : 'HTML编辑器');
            }
            function updateDirty() {
                const d = isDirty();
                root.classList.toggle('dirty', d);
                $('fileBtn').title = `文件：${filename}\n` + (editorFsPath ? `位置：${editorFsPath}` : '尚未保存到虚拟磁盘') + (d ? '\n有未保存的修改' : '');
                const s = $('stSave');
                const t = s.querySelector('span');
                if (d) t.textContent = '未保存';
                else if (!editorFsPath) t.textContent = editor && editor.getValue() ? '未存入磁盘' : '新文件';
                else t.textContent = lastSavedAt ? '已保存 ' + new Date(lastSavedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false }) : '已保存';
                s.title = d ? '按 Ctrl+S 保存' : (editorFsPath || '');
                setEditorTitle();
            }

            function onDocChanged() {
                updateDirty();
                if (sState.query && findBox.classList.contains('open')) { clearTimeout(onDocChanged._t); onDocChanged._t = setTimeout(performEditorSearch, 120); }
                if (prefs.auto) scheduleEditorPreview();
                else { previewStale = true; updatePreviewHeader(); }
            }

            // ===== 状态栏 =====
            function scheduleStatus() { if (!rafStatus) rafStatus = requestAnimationFrame(() => { rafStatus = 0; updateStatusBar(); }); }
            function updateStatusBar() {
                if (!editor) return;
                const c = editor.getCursor();
                $('stCursor').textContent = `行 ${c.line + 1}, 列 ${c.ch + 1}`;
                const sels = editor.getSelections().filter(Boolean);
                const sel = sels.join('');
                $('stSel').textContent = sel ? `已选 ${sel.length.toLocaleString()} 字符` + (sel.includes('\n') ? ` · ${sel.split('\n').length} 行` : '') : '';
                $('stCount').textContent = `${editor.lineCount().toLocaleString()} 行 · ${editor.getValue().length.toLocaleString()} 字符`;
                $('stLang').textContent = LANG_NAMES[curLang()] || curLang();
                const style = editor.options.inputStyle;
                $('stInput').textContent = '输入: ' + (INPUT_MODE_SHORT[style] || style) + (inputModePref === 'auto' ? ' · 自动' : '');
                $('stInput').title = 'CodeMirror 输入方式：' + (inputModePref === 'auto' ? '自动（跟随浏览器 UA）' : '手动指定') + '\n电脑：系统菜单可全选/复制全文，触屏不能拖拽选字\n手机：可长按拖拽选字，系统全选只到已渲染部分\n当前 UA：' + navigator.userAgent;
                $('undo').disabled = !editor.historySize().undo;
                $('redo').disabled = !editor.historySize().redo;
                $('format').disabled = curLang() === 'markdown';
            }

            // ===== 视图：代码 / 分屏 / 预览，分屏方向与比例 =====
            const MIN = { h: [200, 160], v: [90, 80] };          // [代码区最小, 预览区最小]（像素）
            function splitFits() {
                return prefs.dir === 'h' ? root.clientWidth >= 640 : body.clientHeight >= 300;
            }
            function effView() {
                if (prefs.view !== 'split') return prefs.view;
                return splitFits() ? 'split' : (narrowPick || 'code');
            }
            function clampRatio(r) {
                const size = prefs.dir === 'h' ? body.clientWidth : body.clientHeight;
                if (!size) return r;
                const [a, b] = MIN[prefs.dir];
                const lo = Math.min(0.45, a / size), hi = Math.max(0.55, 1 - b / size);
                return Math.min(hi, Math.max(lo, r));
            }
            function applyLayout() {
                const v = effView();
                const changed = root.dataset.viewEff !== v || root.dataset.dir !== prefs.dir;
                root.dataset.viewEff = v;
                root.dataset.dir = prefs.dir;
                splitter.setAttribute('aria-orientation', prefs.dir === 'h' ? 'vertical' : 'horizontal');
                root.querySelectorAll('.edx-seg.view button').forEach(b => {
                    const on = b.dataset.view === v;
                    b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
                });
                if (v === 'split') {
                    // 比例存的是百分比：窗口怎么缩放，分割条都停在相对位置，不会出现“只能最大/最小”
                    const r = clampRatio(prefs.ratio);
                    codePane.style.flex = `0 0 ${(r * 100).toFixed(3)}%`;
                    previewPane.style.flex = '1 1 0';
                    splitter.setAttribute('aria-valuenow', Math.round(r * 100));
                } else {
                    codePane.style.flex = ''; previewPane.style.flex = '';
                }
                layoutDevice();
                if (changed && v !== 'code' && previewStale && (prefs.auto || previewGen === 0)) updateEditorPreview();
            }
            function scheduleLayout() {
                if (rafLayout) return;
                rafLayout = requestAnimationFrame(() => { rafLayout = 0; applyLayout(); if (editor) editor.refresh(); });
            }
            function setView(v) {
                if (prefs.view === 'split' && v !== 'split' && !splitFits()) narrowPick = v;
                else { prefs.view = v; narrowPick = null; savePrefs(); }
                applyLayout();
                if (editor) editor.refresh();
                if (effView() !== 'preview' && editor) editor.focus();
            }
            function setDir(d) { prefs.dir = d; savePrefs(); applyLayout(); if (editor) editor.refresh(); }

            // 分割条：Pointer Events（鼠标 / 触屏 / 手写笔通用）+ setPointerCapture；双击恢复均分；键盘方向键微调
            (function initSplitter() {
                let dragging = false;
                const posToRatio = e => {
                    const rc = body.getBoundingClientRect();
                    return prefs.dir === 'h' ? (e.clientX - rc.left) / rc.width : (e.clientY - rc.top) / rc.height;
                };
                splitter.addEventListener('pointerdown', e => {
                    if (e.button !== 0) return;
                    e.preventDefault();
                    dragging = true;
                    try { splitter.setPointerCapture(e.pointerId); } catch (_) {}
                    root.classList.add('dragging');
                });
                splitter.addEventListener('pointermove', e => {
                    if (!dragging) return;
                    prefs.ratio = clampRatio(posToRatio(e));
                    scheduleLayout();
                });
                const end = e => {
                    if (!dragging) return;
                    dragging = false;
                    try { splitter.releasePointerCapture(e.pointerId); } catch (_) {}
                    root.classList.remove('dragging');
                    savePrefs();
                    if (editor) editor.refresh();
                };
                splitter.addEventListener('pointerup', end);
                splitter.addEventListener('pointercancel', end);
                splitter.addEventListener('lostpointercapture', end);
                splitter.addEventListener('dblclick', () => { prefs.ratio = 0.5; savePrefs(); applyLayout(); editor.refresh(); });
                splitter.addEventListener('keydown', e => {
                    const step = e.shiftKey ? 0.1 : 0.02;
                    const back = prefs.dir === 'h' ? 'ArrowLeft' : 'ArrowUp', fwd = prefs.dir === 'h' ? 'ArrowRight' : 'ArrowDown';
                    let r = clampRatio(prefs.ratio);
                    if (e.key === back) r -= step;
                    else if (e.key === fwd) r += step;
                    else if (e.key === 'Home') r = 0;
                    else if (e.key === 'End') r = 1;
                    else if (e.key === 'Enter') r = 0.5;
                    else return;
                    e.preventDefault();
                    prefs.ratio = clampRatio(r); savePrefs(); applyLayout(); editor.refresh();
                });
            })();

            // ===== 预览 =====
            // 预览尺寸：自适应 / 平板 768 / 手机 375。预览区比设备窄时等比缩小显示，页面本身仍按设备宽度排版
            function layoutDevice() {
                const dev = prefs.device;
                root.querySelectorAll('[data-r="device"] button').forEach(b => {
                    const on = b.dataset.dev === dev; b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
                });
                if (dev === 'auto') {
                    stage.classList.remove('framed');
                    deviceBox.style.cssText = '';
                    devLabel.hidden = true;
                    return;
                }
                const W = stage.clientWidth, H = stage.clientHeight;
                if (!W || !H) return;
                const devW = +dev, pad = 12;
                const s = Math.min(1, (W - pad * 2) / devW);
                const h = (H - pad * 2) / s;
                stage.classList.add('framed');
                deviceBox.style.cssText = `width:${devW}px;height:${h}px;left:${Math.max(pad, (W - devW * s) / 2)}px;top:${pad}px;transform:scale(${s})`;
                devLabel.hidden = false;
                devLabel.textContent = `${devW} × ${Math.round(h)}` + (s < 0.999 ? ` · ${Math.round(s * 100)}%` : '');
            }
            function setDevice(d) { prefs.device = d; savePrefs(); layoutDevice(); }

            function previewKind() {
                return { markdown: 'Markdown 渲染', javascript: 'JavaScript 运行', css: 'CSS 示例页', 'application/json': 'JSON 视图' }[curLang()] || '';
            }
            function updatePreviewHeader() {
                const st = $('pState');
                const k = previewKind();
                $('pTitle').textContent = k ? '预览 · ' + k : '预览';
                st.classList.toggle('paused', !prefs.auto && !previewStale);
                st.classList.toggle('stale', !prefs.auto && previewStale);
                st.querySelector('span').textContent = prefs.auto ? '实时' : (previewStale ? '有修改未预览' : '手动刷新');
                st.title = prefs.auto ? '输入停顿约 0.5 秒后自动刷新（可在“更多”里关闭）' : '自动刷新已关闭：按 Ctrl+Enter 或点击刷新按钮';
                $('refresh').classList.toggle('stale', !prefs.auto && previewStale);
            }

            const escHtml = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const CSS_SAMPLE = `<header class="header"><nav class="nav"><a href="#">首页</a> <a href="#">文档</a> <a href="#">关于</a></nav></header>
<main class="container"><h1>一级标题 Heading 1</h1><h2>二级标题</h2><h3>三级标题</h3>
<p>这是一段示例文字，包含<a href="#">链接</a>、<strong>加粗</strong>、<em>强调</em>和 <code>code</code>。</p>
<blockquote>引用文本 blockquote</blockquote><ul><li>列表项一</li><li>列表项二</li></ul><ol><li>有序一</li><li>有序二</li></ol>
<p><button class="btn">按钮</button> <button class="btn btn-primary primary">主按钮</button> <input type="text" placeholder="输入框"> <select><option>选项</option></select> <label><input type="checkbox"> 复选</label></p>
<div class="card box"><h3>.card / .box</h3><p>卡片内容</p></div>
<table><thead><tr><th>表头</th><th>表头</th></tr></thead><tbody><tr><td>单元格</td><td>单元格</td></tr></tbody></table></main>
<footer class="footer">页脚 footer</footer>`;
            // 按语言组装预览文档；offset = 编辑器第 1 行在预览文档中前面多出的行数（用于把报错行号对回编辑器）
            function buildPreview(code) {
                const lang = curLang();
                if (lang === 'markdown') return { html: buildMarkdownPreviewDoc(code), offset: null };
                // JavaScript：先写入空白页骨架（不关闭文档），再以 <script> 元素插入代码。
                // 这样各浏览器报告的行号都从代码第 1 行算起，且 DOMContentLoaded / load 仍会在之后正常触发。
                if (lang === 'javascript') return {
                    html: '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px/1.6 system-ui,sans-serif;margin:16px;color:#222}</style></head><body>',
                    script: code, offset: 0
                };
                if (lang === 'css') return {
                    html: '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>\n' + code.replace(/<\/style/gi, '<\\/style') + '\n</style></head><body>' + CSS_SAMPLE + '</body></html>',
                    offset: null
                };
                if (lang === 'application/json') {
                    let out;
                    try { out = '<pre class="ok">' + escHtml(JSON.stringify(JSON.parse(code || 'null'), null, 2)) + '</pre>'; }
                    catch (e) { out = '<div class="err">JSON 解析失败：' + escHtml(e.message) + '</div>'; }
                    return { html: '<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#0d1117;color:#c9d1d9;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}pre{margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word}.err{margin:14px;padding:10px 12px;border-radius:8px;background:rgba(255,107,120,.12);color:#ff9aa5}</style></head><body>' + out + '</body></html>', offset: null };
                }
                // HTML 页面不给“定位到行”：Chrome 对 document.write 写入的脚本报告的是“相对 <script> 标签”的行号，Firefox 是绝对行号，无法可靠换算
                return { html: code || '<html><body style="margin:0;background:#0d1117;"></body></html>', offset: null };
            }

            // 独立页面（新标签页 / blob 兜底）：把 JS 模式的脚本拼回 HTML
            function standaloneHtml(built) {
                return built.script === undefined ? built.html
                    : built.html + '<script>\n' + built.script.replace(/<\/script/gi, '<\\/script') + '\n<\/script></body></html>';
            }
            // 更新预览
            // 【关键】每次刷新都换一个全新的 iframe，而不是往同一个 iframe 里反复 document.write。
            // document.open() 只会清空"文档"，不会重置 iframe 的 window（全局对象）：
            // 上一次预览声明过的顶层 const / let / class、注册过的自定义元素、计时器、监听器全都还在。
            // 于是复杂页面（比如 JISHENG OS 自己）第二次刷新时第一行就抛 "Identifier 'SYSTEM' has already been declared"，
            // 整个脚本中断 —— 表现就是刷新一次变黑屏。cloneNode 换掉 iframe 可以拿到一个全新的浏览上下文。
            function updateEditorPreview() {
                if (_previewDebounceTimer) { clearTimeout(_previewDebounceTimer); _previewDebounceTimer = null; }
                if (!editor) return;
                previewStale = false;
                updatePreviewHeader();
                // 只看代码时不必真的渲染（切回预览时会补一次）
                if (effView() === 'code') { previewStale = true; return; }
                const code = editor.getValue();
                previewLoading.classList.add('active');
                const built = buildPreview(code);
                previewLineOffset = built.offset;

                const fresh = previewFrame.cloneNode(false);
                fresh.removeAttribute('src');
                fresh.removeAttribute('srcdoc');
                previewFrame.replaceWith(fresh);
                previewFrame = fresh;
                if (_previewBlobUrl) { URL.revokeObjectURL(_previewBlobUrl); _previewBlobUrl = null; }

                const gen = ++previewGen;
                clearConsole(true);
                let doc = null;
                try { doc = previewFrame.contentDocument || (previewFrame.contentWindow && previewFrame.contentWindow.document); } catch (e) { doc = null; }
                if (doc) {
                    doc.open();
                    // document.open() 之后 window 对象保持不变：在写入页面脚本之前挂上控制台捕获
                    try { hookPreviewConsole(previewFrame.contentWindow, gen); } catch (e) {}
                    // Chrome 会把页面脚本的语法错误从 document.write 里重新抛出来：记到控制台即可，不能当成“写入失败”再渲染一遍
                    try {
                        doc.write(built.html);
                        if (built.script !== undefined) {
                            const sc = doc.createElement('script');
                            sc.textContent = built.script;
                            (doc.body || doc.documentElement).appendChild(sc);
                        }
                    } catch (e) {
                        const m = String(e && e.message || e).replace(/^Failed to execute '\w+' on '\w+': /, '');
                        if (gen === previewGen && !conEntries.some(x => x.level === 'error' && x.text.includes(m))) pushConsole('error', m);
                    }
                    try { doc.close(); } catch (e) {}
                } else {
                    // 兜底：某些环境（跨源策略等）拿不到 contentDocument，改用 blob URL（此时无法捕获控制台）
                    _previewBlobUrl = URL.createObjectURL(new Blob([standaloneHtml(built)], { type: 'text/html' }));
                    previewFrame.src = _previewBlobUrl;
                }
                if (_previewLoadingTimer) clearTimeout(_previewLoadingTimer);
                _previewLoadingTimer = setTimeout(() => { previewLoading.classList.remove('active'); _previewLoadingTimer = null; }, 450);
            }
            // 输入时的自动预览：防抖 450ms（手动刷新 / Ctrl+Enter 立即生效）
            function scheduleEditorPreview() {
                if (_previewDebounceTimer) clearTimeout(_previewDebounceTimer);
                _previewDebounceTimer = setTimeout(() => { _previewDebounceTimer = null; updateEditorPreview(); }, 450);
            }

            // ===== 预览控制台 =====
            function fmtArg(a, w) {
                try {
                    if (typeof a === 'string') return a;
                    if (a === undefined) return 'undefined';
                    if (typeof a === 'function') return String(a).slice(0, 200);
                    if (a && typeof a === 'object') {
                        if (a.nodeType === 1) return '<' + a.tagName.toLowerCase() + (a.id ? '#' + a.id : '') + '>';
                        if (w && a instanceof w.Error || a instanceof Error || (a.stack && a.message)) return a.stack || String(a);
                        const s = JSON.stringify(a, null, 1);
                        return s === undefined ? String(a) : s.replace(/\n\s*/g, ' ');
                    }
                    return String(a);
                } catch (e) { return String(a); }
            }
            function hookPreviewConsole(w, gen) {
                if (!w || !w.console) return;
                ['log', 'info', 'warn', 'error', 'debug'].forEach(level => {
                    const orig = w.console[level];
                    w.console[level] = function (...args) {
                        if (gen === previewGen) pushConsole(level === 'debug' ? 'log' : level, args.map(a => fmtArg(a, w)).join(' '));
                        try { if (orig) orig.apply(w.console, args); } catch (e) {}
                    };
                });
                w.addEventListener('error', e => {
                    if (gen !== previewGen) return;
                    if (e.message) pushConsole('error', String(e.message).replace(/Failed to execute '\w+' on '\w+': /, ''), e.lineno);
                    else if (e.target && e.target !== w && e.target.tagName) pushConsole('warn', '资源加载失败：' + (e.target.src || e.target.href || '<' + e.target.tagName.toLowerCase() + '>'));
                }, true);
                w.addEventListener('unhandledrejection', e => { if (gen === previewGen) pushConsole('error', 'Uncaught (in promise) ' + fmtArg(e.reason, w)); });
            }
            const CON_ICON = { error: 'stxCircleX', warn: 'stxTriangleAlert', info: 'stxInfo', log: 'stxChevronRight' };
            function pushConsole(level, msg, line) {
                if (conEntries.length >= 500) return;
                const text = String(msg).slice(0, 4000);
                const last = conEntries[conEntries.length - 1];
                if (last && last.level === level && last.text === text && last.line === line) { last.n++; renderConsole(); return; }
                conEntries.push({ level, text, line, n: 1 });
                renderConsole();
            }
            function clearConsole(silent) { conEntries.length = 0; renderConsole(); if (!silent) Notify.info('控制台已清空'); }
            function renderConsole() {
                const errs = conEntries.filter(e => e.level === 'error').reduce((s, e) => s + e.n, 0);
                const warns = conEntries.filter(e => e.level === 'warn').reduce((s, e) => s + e.n, 0);
                const total = conEntries.reduce((s, e) => s + e.n, 0);
                const badge = $('conBadge');
                badge.textContent = errs ? String(errs) : (total ? String(Math.min(total, 99)) : '');
                badge.classList.toggle('err', !!errs);
                $('conBtn').title = '控制台' + (total ? `：${errs} 个错误，${warns} 个警告，共 ${total} 条` : '：暂无输出');
                $('conSum').textContent = total ? `${errs} 错误 · ${warns} 警告 · ${total} 条` : '';
                if (!previewPane.classList.contains('con-open')) return;
                const list = $('conList');
                const lines = editor ? editor.lineCount() : 0;
                list.innerHTML = conEntries.length ? conEntries.map((e, i) => {
                    const ln = (previewLineOffset !== null && e.line) ? e.line - previewLineOffset : 0;
                    const link = ln > 0 && ln <= lines ? `<a data-line="${ln}" title="在编辑器中定位">第 ${ln} 行</a>` : '';
                    return `<div class="edx-con-item ${e.level}">${icon(CON_ICON[e.level] || 'stxChevronRight')}<pre>${escHtml(e.text)}${e.n > 1 ? ` <span class="edx-badge">${e.n}</span>` : ''}</pre>${link}</div>`;
                }).join('') : '<div class="edx-con-empty">暂无输出。预览页面里的 console.log / 报错会显示在这里。</div>';
                list.scrollTop = list.scrollHeight;
            }
            function toggleConsole(force) {
                const open = force === undefined ? !previewPane.classList.contains('con-open') : force;
                previewPane.classList.toggle('con-open', open);
                $('conBtn').classList.toggle('on', open);
                renderConsole();
                layoutDevice();
            }
            function gotoLine(ln) {
                if (effView() === 'preview') setView('code');
                editor.focus();
                editor.setCursor({ line: ln - 1, ch: 0 });
                editor.scrollIntoView({ line: ln - 1, ch: 0 }, 80);
                const h = editor.addLineClass(ln - 1, 'background', 'CodeMirror-selected');
                setTimeout(() => { try { editor.removeLineClass(h, 'background', 'CodeMirror-selected'); } catch (e) {} }, 1200);
            }

            // ===== 编辑操作 =====
            // 复制全部（不依赖系统选区；HTTPS 下走 Clipboard API，否则退回 execCommand('copy')）
            async function copyAllEditorText() {
                const text = editor.getValue();
                if (!text) { Notify.info('没有可复制的内容'); return; }
                let ok = false;
                try {
                    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
                } catch (e) { ok = false; }
                if (!ok) {
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.setAttribute('readonly', '');
                        ta.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;';
                        document.body.appendChild(ta);
                        ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
                        ok = document.execCommand('copy');
                        document.body.removeChild(ta);
                        editor.focus();
                    } catch (e) { ok = false; }
                }
                if (ok) Notify.success(`已复制全部 ${text.length.toLocaleString()} 字符`);
                else Notify.error('复制失败，请长按编辑区用系统菜单复制');
            }

            // 格式化：作为一次普通编辑写入（Ctrl+Z 可撤销），并尽量保持光标所在行与滚动位置
            function formatEditorCode() {
                const code = editor.getValue();
                const lang = curLang();
                if (lang === 'markdown') { Notify.info('Markdown 不需要格式化'); return; }
                if (!code.trim()) { Notify.info('没有可格式化的内容'); return; }
                let fmt = code;
                try {
                    if (lang === 'htmlmixed' || lang === 'xml') {
                        fmt = html_beautify(code, { indent_size: 2, wrap_line_length: 120, indent_inner_html: true, preserve_newlines: true, max_preserve_newlines: 2, end_with_newline: true });
                    } else if (lang === 'css') {
                        fmt = css_beautify(code, { indent_size: 2, end_with_newline: true });
                    } else if (lang === 'javascript' || lang === 'application/json') {
                        fmt = js_beautify(code, { indent_size: 2, end_with_newline: true });
                    }
                } catch (e) { Notify.error('格式化失败', e.message); return; }
                if (fmt === code) { Notify.info('代码格式已经规范'); return; }
                const c = editor.getCursor();
                const top = editor.getScrollInfo().top;
                editor.operation(() => {
                    editor.replaceRange(fmt, CodeMirror.Pos(0, 0), CodeMirror.Pos(editor.lastLine()), '+format');
                    editor.setCursor({ line: Math.min(c.line, editor.lastLine()), ch: 0 });
                });
                editor.scrollTo(null, top);
                editor.focus();
                Notify.success('已格式化', 'Ctrl+Z 可撤销');
            }
            function clearEditor() {
                if (!editor.getValue()) return;
                editor.setValue('');
                editor.focus();
                Notify.info('已清空', 'Ctrl+Z 可撤销');
            }
            function setWrap(v) { prefs.wrap = v; savePrefs(); editor.setOption('lineWrapping', v); Notify.info(v ? '自动换行：开' : '自动换行：关'); }
            function setFont(px) {
                px = Math.min(24, Math.max(10, px));
                if (px === prefs.font) return;
                prefs.font = px; savePrefs();
                root.style.setProperty('--edx-font', px + 'px');
                editor.refresh();
                const v = root.querySelector('.edx-menu [data-fontval]');
                if (v) v.textContent = px + 'px';
            }
            function setAuto(v) {
                prefs.auto = v; savePrefs();
                if (v && previewStale) updateEditorPreview();
                updatePreviewHeader();
            }
            function applyLang(notify) {
                const mode = curLang();
                editor.setOption('mode', mode);
                updateStatusBar();
                if (notify) Notify.info(`语言：${LANG_NAMES[mode] || mode}`);
                if (mode === 'javascript' && !previewPane.classList.contains('con-open')) toggleConsole(true);
                updateEditorPreview();
            }

            // ===== 查找 / 替换 =====
            function openFind(withReplace) {
                findBox.classList.add('open');
                if (withReplace) findBox.classList.add('rep-open');
                const sel = editor.getSelection();
                if (sel && !sel.includes('\n')) searchInput.value = sel;
                (withReplace && searchInput.value ? replaceInput : searchInput).focus();
                searchInput.select();
                performEditorSearch();
            }
            function closeFind() {
                findBox.classList.remove('open');
                clearEditorHighlights();
                sState.query = ''; sState.currentIndex = -1; sState.matches = [];
                searchCount.textContent = '';
                editor.focus();
            }
            function performEditorSearch() {
                const raw = searchInput.value;
                sState.query = raw;
                clearEditorHighlights();
                sState.matches = [];
                sState.currentIndex = -1;
                findField.classList.remove('bad');
                searchCount.classList.remove('none');
                if (!raw) { searchCount.textContent = ''; return; }
                let q;
                const cf = !sState.caseSensitive;
                if (sState.regex) {
                    try { q = new RegExp(raw, cf ? 'gi' : 'g'); } catch (e) { searchCount.textContent = '正则无效'; findField.classList.add('bad'); return; }
                } else if (sState.wholeWord) {
                    const esc = raw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    q = new RegExp('\\b' + esc + '\\b', cf ? 'gi' : 'g');
                } else q = raw;
                const cursor = editor.getSearchCursor(q, CodeMirror.Pos(0, 0), { caseFold: cf && !sState.regex });
                let guard = 0;
                while (cursor.findNext() && guard++ < 20000) {
                    if (cursor.from().line === cursor.to().line && cursor.from().ch === cursor.to().ch) continue;   // 跳过空匹配
                    sState.matches.push({ from: cursor.from(), to: cursor.to() });
                }
                if (!sState.matches.length) { searchCount.textContent = '无结果'; searchCount.classList.add('none'); return; }
                editor.operation(() => sState.matches.forEach(m => sState.markers.push(editor.markText(m.from, m.to, { className: 'editor-cm-search-highlight' }))));
                const cur = editor.getCursor('from');
                let nearest = 0;
                for (let i = 0; i < sState.matches.length; i++) {
                    const m = sState.matches[i];
                    if (m.from.line > cur.line || (m.from.line === cur.line && m.from.ch >= cur.ch)) { nearest = i; break; }
                    nearest = i;
                }
                goToEditorMatch(nearest, true);
            }
            let curMarker = null;
            function goToEditorMatch(idx, keepFocus) {
                if (!sState.matches.length) return;
                if (curMarker) { curMarker.clear(); curMarker = null; }
                sState.currentIndex = idx;
                const m = sState.matches[idx];
                curMarker = editor.markText(m.from, m.to, { className: 'editor-cm-search-current' });
                editor.scrollIntoView({ from: m.from, to: m.to }, 80);
                editor.setSelection(m.from, m.to, { scroll: false });
                searchCount.textContent = `${idx + 1} / ${sState.matches.length}`;
            }
            function editorSearchNext() {
                if (!findBox.classList.contains('open')) { openFind(false); return; }
                if (!sState.matches.length) { if (searchInput.value) performEditorSearch(); return; }
                goToEditorMatch((sState.currentIndex + 1) % sState.matches.length);
            }
            function editorSearchPrev() {
                if (!sState.matches.length) { if (searchInput.value) performEditorSearch(); return; }
                goToEditorMatch((sState.currentIndex - 1 + sState.matches.length) % sState.matches.length);
            }
            function clearEditorHighlights() {
                sState.markers.forEach(m => m.clear()); sState.markers = [];
                if (curMarker) { curMarker.clear(); curMarker = null; }
            }
            function replaceEditorCurrent() {
                if (!sState.matches.length || sState.currentIndex < 0) return;
                const m = sState.matches[sState.currentIndex];
                const idx = sState.currentIndex;
                editor.replaceRange(replaceInput.value, m.from, m.to, '+replace');
                performEditorSearch();
                if (sState.matches.length) goToEditorMatch(Math.min(idx, sState.matches.length - 1));
            }
            function replaceEditorAll() {
                if (!sState.matches.length) return;
                const rv = replaceInput.value;
                const cnt = sState.matches.length;
                editor.operation(() => {
                    for (let i = sState.matches.length - 1; i >= 0; i--) editor.replaceRange(rv, sState.matches[i].from, sState.matches[i].to, '+replace');
                });
                Notify.success(`已替换 ${cnt} 处`, 'Ctrl+Z 可一次撤销');
                performEditorSearch();
            }

            // ===== 保存 / 导入 / 导出（导出可选 虚拟桌面 / 原目录 / 现实设备，文件名可自定义，弹窗为系统风格）=====
            const EXPORT_TARGET_KEY = 'JISHENG_OS_EDITOR_EXPORT_TARGET';
            function refreshDirViews(dir) {
                refreshDesktop();
                Object.keys(SYSTEM.folderWindowStates || {}).forEach(wId => {
                    const st = SYSTEM.folderWindowStates[wId];
                    if (st && st.currentPath === dir) { st.fileStats = {}; renderFolderContent(wId); }
                });
            }
            // 把文本作为“新打开的文件”载入：按扩展名切换语言，清空撤销历史，标记为已保存
            function loadTextIntoEditor(text, name) {
                const ext = (name.split('.').pop() || '').toLowerCase();
                langSelect.value = langByExt[ext] || 'htmlmixed';
                editor.setOption('mode', curLang());
                editor.setValue(text);
                editor.clearHistory();
                editor.setCursor({ line: 0, ch: 0 });
                markClean();
                updateStatusBar();
                if (curLang() === 'javascript' && !previewPane.classList.contains('con-open')) toggleConsole(true);
                updateEditorPreview();
            }
            const fsStat = path => new Promise(res => SYSTEM.fs.stat(path, (err, st) => res(err ? null : st)));
            const dirLabel = dir => dir === SYSTEM.desktopPath ? '虚拟桌面' : dir;
            // 保存（Ctrl+S）：已对应虚拟文件 → 直接写回；否则走“另存为”
            function saveEditorToFile() {
                if (!editorFsPath) { exportEditorFile('save'); return; }
                if (!SYSTEM.mounted) { Notify.error('文件系统未就绪'); return; }
                const path = editorFsPath;
                SYSTEM.fs.writeFile(path, editor.getValue(), 'utf8', err => {
                    if (err) { Notify.error('保存失败', err.message); return; }
                    lastSavedAt = Date.now();
                    markClean();
                    refreshDirViews(editorSaveDir);
                    Notify.success('已保存', filename);
                });
            }
            function openDeviceFile(f) {
                const reader = new FileReader();
                reader.onload = e => {
                    filename = f.name;
                    editorFsPath = null;       // 来自现实设备，尚未对应任何虚拟文件
                    lastSavedAt = 0;
                    loadTextIntoEditor(e.target.result, f.name);
                    Notify.success('已导入', f.name);
                };
                reader.onerror = () => Notify.error('读取失败', f.name);
                reader.readAsText(f);
            }
            // 导入：直接打开系统文件选择器，从手机 / 电脑的存储中选文件（虚拟桌面上的文件双击即可用编辑器打开）
            function importEditorFile() {
                fileInput.onchange = function () {
                    const f = this.files[0];
                    this.value = '';
                    if (f) openDeviceFile(f);
                };
                fileInput.click();
            }
            function downloadToDevice(name, code) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain;charset=utf-8' }));
                a.download = name;
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 10000);
            }
            function quickDownload() {
                const name = (filename && filename !== '未命名.html') ? filename : ('未命名' + (extByLang[curLang()] || '.txt'));
                downloadToDevice(name, editor.getValue());
                if (!editorFsPath) markClean();
                Notify.success('已下载到设备', name);
            }
            // 导出 / 另存为 / 新文件首次保存：同一个对话框，文件名可自定义；目标可选 虚拟桌面 / 原目录（从子目录打开时）/ 现实设备
            // kind: 'export'（工具栏“导出”，沿用旧文案）| 'saveas'（另存为）| 'save'（新文件按 Ctrl+S）
            async function exportEditorFile(kind) {
                if (kind !== 'save' && kind !== 'saveas') kind = 'export';
                const W = { export: ['导出文件', '导出', '导出到', '已导出到'], saveas: ['另存为', '保存', '保存到', '已保存到'], save: ['保存文件', '保存', '保存到', '已保存到'] }[kind];
                const code = editor.getValue();
                let defaultName = (filename && filename !== '未命名.html') ? filename : ('未命名' + (extByLang[curLang()] || '.txt'));
                const targets = [
                    { value: 'desktop', icon: 'uiMenuFolder', label: '虚拟桌面', desc: `写入 JISHENG OS 桌面（${SYSTEM.desktopPath}），桌面图标和文件管理器里都能看到` }
                ];
                if (editorSaveDir && editorSaveDir !== SYSTEM.desktopPath) {
                    targets.push({ value: 'source', icon: 'uiMenuFolder', label: '原目录', desc: `写回文件所在目录 ${editorSaveDir}` });
                }
                targets.push({ value: 'device', icon: 'uiDownload', label: '现实设备', desc: '通过浏览器下载到手机 / 电脑' });
                let lastTarget = localStorage.getItem(EXPORT_TARGET_KEY) || 'desktop';
                if (editorFsPath && editorSaveDir !== SYSTEM.desktopPath) lastTarget = 'source';
                if (!targets.some(t => t.value === lastTarget)) lastTarget = 'desktop';

                const r = await SysDialog.form({
                    title: W[0],
                    icon: 'uiUpload',
                    okText: W[1],
                    fields: [
                        { type: 'text', name: 'name', label: '文件名', value: defaultName, placeholder: '例如 index.html' },
                        { type: 'radio', name: 'target', label: W[2], value: lastTarget, options: targets }
                    ],
                    validate: v => SysDialog.nameValidator('文件名')(v.name)
                });
                if (!r) return;
                const name = r.name;
                localStorage.setItem(EXPORT_TARGET_KEY, r.target);

                if (r.target === 'device') {
                    downloadToDevice(name, code);
                    if (!editorFsPath) { filename = name; markClean(); }
                    Notify.success(kind === 'export' ? '已导出到现实设备' : '已下载到设备', name);
                    return;
                }
                if (!SYSTEM.mounted) { Notify.error('文件系统未就绪'); return; }
                const dir = r.target === 'source' ? editorSaveDir : SYSTEM.desktopPath;
                const path = dir + '/' + name;
                const existing = await fsStat(path);
                if (existing && existing.isDirectory()) { Notify.error('保存失败', `"${name}" 是一个文件夹`); return; }
                if (existing && path !== editorFsPath) {
                    const overwrite = await SysDialog.confirm({ title: '文件已存在', icon: 'uiWarning', danger: true, okText: '覆盖', message: `${dirLabel(dir)}上已有 "${name}"，是否覆盖？` });
                    if (!overwrite) return;
                }
                SYSTEM.fs.writeFile(path, code, 'utf8', err => {
                    if (err) { Notify.error('保存失败', err.message); return; }
                    filename = name;
                    editorSaveDir = dir;
                    editorFsPath = path;               // 之后 Ctrl+S 直接写回
                    lastSavedAt = Date.now();
                    markClean();
                    refreshDirViews(dir);
                    Notify.success(W[3] + dirLabel(dir), name);
                });
            }
            function openEditorInNewWindow() {
                const content = standaloneHtml(buildPreview(editor.getValue()));
                const url = URL.createObjectURL(new Blob([content], { type: 'text/html' }));
                window.open(url, '_blank');
                setTimeout(() => URL.revokeObjectURL(url), 10000);
            }

            // ===== 弹出菜单 =====
            let menuEl = null, menuAnchor = null;
            function closeMenu(refocus) {
                if (!menuEl) return;
                menuEl.remove(); menuEl = null;
                document.removeEventListener('pointerdown', onDocDown, true);
                if (menuAnchor) { menuAnchor.setAttribute('aria-expanded', 'false'); if (refocus) menuAnchor.focus(); }
                menuAnchor = null;
            }

        // === 存储观测与清理 ===
        // navigator.storage.estimate() 给出浏览器实际计入配额的总已用/配额；
        // 下面的扫描只用于把 JISHENG OS 自己的文件按后端与系统目录分类，二者不混淆。
        function storageFsReaddir(path) {
            return new Promise((resolve, reject) => SYSTEM.fs.readdir(path, (err, files) => err ? reject(err) : resolve(files || [])));
        }
        function storageFsStat(path) {
            return new Promise((resolve, reject) => SYSTEM.fs.stat(path, (err, stat) => err ? reject(err) : resolve(stat)));
        }
        function isDirectoryStat(stat) {
            return !!(stat && (typeof stat.isDirectory === 'function' ? stat.isDirectory() : stat.isDirectory));
        }
        function formatStorageBytes(bytes) {
            if (!Number.isFinite(Number(bytes))) return '不可用';
            const n = Math.max(0, Number(bytes));
            if (n < 1024) return Math.round(n) + ' B';
            if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
            if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
            return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        async function measureStorageTree(rootPath, maxEntries = 50000) {
            const result = { bytes: 0, files: 0, directories: 0, entries: 0, capped: false, unavailable: false };
            try {
                await storageFsStat(rootPath);
            } catch (_) {
                result.unavailable = true;
                return result;
            }
            const queue = [rootPath];
            while (queue.length && !result.capped) {
                const dir = queue.shift();
                result.directories++;
                let names = [];
                try { names = await storageFsReaddir(dir); } catch (_) { continue; }
                for (let start = 0; start < names.length && !result.capped; start += 32) {
                    const batch = names.slice(start, start + 32);
                    const stats = await Promise.all(batch.map(async name => {
                        const path = (dir === '/' ? '' : dir) + '/' + name;
                        try { return { name, path, stat: await storageFsStat(path) }; }
                        catch (_) { return null; }
                    }));
                    for (const item of stats) {
                        if (!item) continue;
                        result.entries++;
                        if (result.entries > maxEntries) { result.capped = true; break; }
                        if (isDirectoryStat(item.stat)) queue.push(item.path);
                        else {
                            result.files++;
                            result.bytes += Number(item.stat.size) || 0;
                        }
                    }
                }
            }
            return result;
        }

        // === 一次性缓存 / 临时文件：只扫描、由用户逐项勾选后才删除 ===
        // 不自动删除任何文件。扫描结果只是“候选项”，每项都显示路径和判定理由。
        const TEMP_CLEANUP_STATE = Object.create(null);
        const TEMP_CLEANUP_EXT = /\.(tmp|temp|part|crdownload|bak|backup|old|log|dmp|swp|swo|~)$/i;
        const TEMP_CLEANUP_SYSTEM_KEEP = new Set([
            '/system/config/settings.json',
            '/system/config/icon-positions.json',
            '/system/config/wallpaper.cfg'
        ]);

        function getTempCleanupState(windowId) {
            if (!TEMP_CLEANUP_STATE[windowId]) TEMP_CLEANUP_STATE[windowId] = { items: [], selected: {}, scanning: false };
            return TEMP_CLEANUP_STATE[windowId];
        }
        function tempCleanupPath(parent, name) {
            return parent === '/' ? '/' + name : parent.replace(/\/+$/, '') + '/' + name;
        }
        function tempCleanupGroupTitle(group) {
            return {
                temp: '临时 / 备份 / 缓存文件', cache: '浏览器缓存与历史测试数据', hidden: '隐藏文件（. 开头）',
                duplicate: '疑似重复副本', blank: '空白未命名文档', draft: '未保存草稿（可能有内容）',
                protected: '系统配置（建议保留）'
            }[group] || group;
        }
        function tempCleanupGroupOrder() { return ['temp', 'cache', 'hidden', 'duplicate', 'blank', 'draft', 'protected']; }

        async function scanTempFilesystem(rootPath, volumeLabel, maxDepth = 8) {
            const found = [];
            let scanned = 0;
            const walk = async (dir, depth) => {
                if (depth > maxDepth || scanned > 50000) return;
                let names;
                try { names = await storageFsReaddir(dir); } catch (_) { return; }
                for (const name of names) {
                    if (++scanned > 50000) break;
                    const fullPath = tempCleanupPath(dir, name);
                    let stat;
                    try { stat = await storageFsStat(fullPath); } catch (_) { continue; }
                    const isDir = isDirectoryStat(stat);
                    let group = null, reason = null;
                    if (TEMP_CLEANUP_SYSTEM_KEEP.has(fullPath)) {
                        group = 'protected'; reason = '系统配置文件，OS 正在使用，建议保留';
                    } else if (name === '.cache' || name === '.tmp' || TEMP_CLEANUP_EXT.test(name)
                        || (isDir && /^(tmp|temp|cache|trash|recycle|\.trash|回收站)$/i.test(name))) {
                        group = 'temp'; reason = isDir ? '临时缓存 / 回收目录' : '临时、下载残留或备份文件';
                    } else if (/^~\$/.test(name)) {
                        group = 'temp'; reason = 'Office 临时文件残留';
                    } else if (name.startsWith('.')) {
                        group = 'hidden'; reason = '隐藏文件或隐藏目录（. 开头）';
                    } else if (!isDir && /\(\d+\)(\.[a-z0-9]+)?$/i.test(name)) {
                        group = 'duplicate'; reason = '自动重命名产生的疑似重复副本';
                    } else if (!isDir && /^(新建文本文档|新建 ?HTML ?文档|未命名|untitled).*\.(txt|html?)$/i.test(name) && !(Number(stat.size) || 0)) {
                        group = 'blank'; reason = '0 字节的未命名文档';
                    }
                    if (group) found.push({ kind: 'fs', group, path: fullPath, isDir, size: isDir ? null : (Number(stat.size) || 0), reason, volume: volumeLabel });
                    if (isDir) await walk(fullPath, depth + 1);
                }
            };
            await walk(rootPath, 0);
            // 目录候选项显示递归体积，便于用户自己判断是否值得删除。
            for (const item of found) {
                if (item.isDir) {
                    const measured = await measureStorageTree(item.path, 8000);
                    item.size = measured.bytes || 0;
                    if (measured.capped) item.reason += '（体积统计达到安全上限）';
                }
            }
            return found;
        }

        async function scanTempBrowserData() {
            const found = [];
            // 只列出“指向已不存在文件”的日期元数据；有效日期绝不作为清理候选。
            try {
                const cache = SYSTEM.mtimeCache || JSON.parse(localStorage.getItem('JISHENG_OS_MTIME_CACHE') || '{}');
                const stalePaths = [];
                for (const path of Object.keys(cache || {})) {
                    if (String(path).startsWith('/mnt/')) continue;
                    const exists = await new Promise(resolve => SYSTEM.fs.exists(path, value => resolve(!!value)));
                    if (!exists) stalePaths.push(path);
                }
                stalePaths.forEach(path => found.push({
                    kind: 'mtime', group: 'cache', path, keys: [path], size: 32,
                    reason: '这个文件已经删除，只剩下它的日期记录；清理记录不会影响现有文件。'
                }));
            } catch (_) {}
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (!key || !key.startsWith(NP_DRAFT_PREFIX)) continue;
                    const value = localStorage.getItem(key) || '';
                    found.push({ kind: 'draft', group: 'draft', path: key, keys: [key], size: value.length, reason: '记事本未保存草稿，请确认不再需要后再勾选' });
                }
            } catch (_) {}
            try {
                if (indexedDB.databases) {
                    const known = new Set(['JISHENG_OS_V3', 'MountedFoldersDB']);
                    const databases = await indexedDB.databases();
                    const names = databases.map(db => db.name).filter(name => name && !known.has(name));
                    names.forEach(name => found.push({ kind: 'idb', group: 'cache', path: name, keys: [name], size: 0, reason: '非当前系统使用的 IndexedDB 数据库，可能是历史版本或测试残留' }));
                }
            } catch (_) {}
            try {
                if (window.caches && caches.keys) {
                    const keys = await caches.keys();
                    for (const key of keys) {
                        let bytes = 0, responseCount = 0;
                        try {
                            const cache = await caches.open(key);
                            const requests = await cache.keys();
                            responseCount = requests.length;
                            for (const request of requests) {
                                const response = await cache.match(request);
                                if (!response) continue;
                                const length = Number(response.headers.get('content-length'));
                                bytes += Number.isFinite(length) && length > 0 ? length : (await response.clone().blob()).size;
                            }
                        } catch (_) {}
                        found.push({ kind: 'cache', group: 'cache', path: key, keys: [key], size: bytes, reason: `Cache Storage 缓存（${responseCount} 个响应，可能包含离线资源或历史测试数据）` });
                    }
                }
            } catch (_) {}
            return found;
        }

        async function scanOneOffCache(windowId) {
            windowId = Number(windowId);
            const state = getTempCleanupState(windowId);
            if (state.scanning) return;
            state.scanning = true; state.error = null; state.status = '准备扫描…';
            renderOneOffCache(windowId);
            try {
                const items = [];
                for (const path of ['/desktop', '/documents', '/system']) {
                    state.status = `正在扫描 IndexedDB · ${path}`; renderOneOffCache(windowId);
                    items.push(...await scanTempFilesystem(path, 'IndexedDB'));
                }
                if (SYSTEM.opfs && SYSTEM.opfs.available) {
                    state.status = '正在扫描 OPFS · /opfs'; renderOneOffCache(windowId);
                    items.push(...await scanTempFilesystem('/opfs', 'OPFS'));
                }
                state.status = '正在检查浏览器缓存、草稿和日期记录…'; renderOneOffCache(windowId);
                items.push(...await scanTempBrowserData());
                state.items = items;
                state.selected = {}; // 扫描后全部默认不勾选，始终由用户决定。
                state.open = {};
                // 候选项不多时默认展开，方便直接查看；很多时折叠，只看分组摘要。
                if (items.length <= 12) tempCleanupGroupOrder().forEach(g => { state.open[g] = true; });
                state.scanned = true;
            } catch (err) {
                state.items = []; state.selected = {};
                state.error = err && err.message ? err.message : String(err);
            } finally {

            }

        function renderOneOffCache(windowId) {
            const card = document.getElementById('stx-clean-' + windowId);
            if (!card) return;

            stxSyncCleanCheckboxes(Number(windowId));

        function setOneOffCacheSelected(windowId, index, selected) {
            getTempCleanupState(windowId).selected[index] = !!selected;
            renderOneOffCache(windowId);
        }
        function toggleAllOneOffCache(windowId, selected) {
            const state = getTempCleanupState(windowId);
            state.items.forEach((item, index) => { state.selected[index] = selected && item.group !== 'protected'; });
            renderOneOffCache(windowId);
        }
        function toggleOneOffCacheGroup(windowId, group, selected) {
            const state = getTempCleanupState(windowId);
            state.items.forEach((item, index) => {
                if (item.group === group && item.group !== 'protected') state.selected[index] = !!selected;
            });

        async function removeOneOffFilesystemPath(path) {
            const stat = await storageFsStat(path);
            await new Promise((resolve, reject) => {
                const done = err => err ? reject(err) : resolve();
                if (isDirectoryStat(stat)) deleteFolderRecursive(path, done);
                else SYSTEM.fs.unlink(path, done);
            });
        }

        async function cleanSelectedOneOffCache(windowId) {
            const state = getTempCleanupState(windowId);
            const chosen = state.items.filter((_, index) => state.selected[index]);
            if (!chosen.length) { Notify.info('没有选中项目'); return; }
            const estimatedBytes = chosen.reduce((sum, item) => sum + (item.size || 0), 0);
            const protectedCount = chosen.filter(item => item.group === 'protected').length;
            const confirmed = await SysDialog.confirm({
                title: '清理已选项目', icon: 'uiDelete', danger: true, okText: '清理',
                message: `只会删除你选中的 ${chosen.length} 个项目（预计 ${formatStorageBytes(estimatedBytes)}）。\n\n`
                    + `其中含 ${chosen.filter(item => item.kind === 'fs').length} 个文件或目录、${chosen.filter(item => item.kind !== 'fs').length} 项浏览器数据。`
                    + (protectedCount ? `\n\n注意：你选择了 ${protectedCount} 个系统配置项，相关设置可能会恢复默认。` : '')
            });
            if (!confirmed) return;
            let removed = 0, failed = 0;
            for (const item of chosen) {
                try {
                    if (item.kind === 'fs') await removeOneOffFilesystemPath(item.path);
                    else if (item.kind === 'mtime') {
                        const cache = SYSTEM.mtimeCache || JSON.parse(localStorage.getItem('JISHENG_OS_MTIME_CACHE') || '{}');
                        item.keys.forEach(key => delete cache[key]);
                        SYSTEM.mtimeCache = cache;
                        if (SYSTEM.saveMtimeCache) SYSTEM.saveMtimeCache();
                    } else if (item.kind === 'draft') item.keys.forEach(key => localStorage.removeItem(key));
                    else if (item.kind === 'idb') {
                        for (const name of item.keys) {
                            const ok = await new Promise(resolve => {
                                try { const req = indexedDB.deleteDatabase(name); req.onsuccess = () => resolve(true); req.onerror = req.onblocked = () => resolve(false); }
                                catch (_) { resolve(false); }
                            });
                            if (!ok) throw new Error('无法删除数据库：' + name);
                        }
                    } else if (item.kind === 'cache') {
                        for (const key of item.keys) { if (!(await caches.delete(key))) throw new Error('无法删除缓存：' + key); }
                    }
                    removed++;
                } catch (err) { failed++; console.warn('清理项目失败:', item.path, err); }
                await new Promise(resolve => setTimeout(resolve, 0));
            }
            invalidateAllDirSizes();
            refreshDesktop();
            refreshOpenFileManagers();
            refreshAllStorageDashboards();
            Notify[failed ? 'warning' : 'success'](failed ? '清理完成（有失败项）' : '清理完成', `已清理 ${removed} 项，失败 ${failed} 项。`);
            await scanOneOffCache(windowId);
        }

        // ============================================================

        // 文件类型分类（按扩展名）。顺序即匹配优先级；未匹配的归入“其他”。

            { k: 'audio', n: '音频', ic: 'stxMusic', c: '#a78bfa', re: /^(mp3|wav|ogg|oga|flac|m4a|aac|opus|wma|mid|midi)$/ },
            { k: 'archive', n: '压缩包与镜像', ic: 'stxArchive', c: '#f59e0b', re: /^(zip|7z|rar|tar|gz|tgz|bz2|xz|zst|cab|cbz|cbr|iso|img|vhd|vhdx|vmdk|qcow2|dmg)$/ },
            { k: 'doc', n: '文档与数据', ic: 'stxFileText', c: '#19c37d', re: /^(pdf|txt|md|markdown|doc|docx|xls|xlsx|ppt|pptx|csv|tsv|rtf|odt|ods|odp|epub|json|xml|ya?ml|toml|ini|log)$/ },
            { k: 'code', n: '网页与代码', ic: 'stxFileCode', c: '#22d3ee', re: /^(html?|css|scss|less|js|mjs|cjs|ts|jsx|tsx|vue|py|java|kt|c|cc|cpp|h|hpp|cs|go|rs|php|rb|swift|sh|bat|ps1|sql|wasm)$/ },
            { k: 'other', n: '其他', ic: 'stxFile', c: '#64748b', re: null }

        // 文件夹树图的“根”：路径最长前缀匹配，树图按根下一级文件夹聚合。
        const STX_TREE_ROOTS = [
            { p: '/opfs/desktop', n: 'OPFS 桌面', c: '#14b8a6' },
            { p: '/opfs/documents', n: 'OPFS 文档', c: '#22c55e' },

        const stxEsc = s => escapeHtml(String(s == null ? '' : s));
        const stxAttr = s => escapeAttr(String(s == null ? '' : s));
        // 供内联 onclick 使用的 JS 字符串字面量（再经 HTML 属性转义）
        const stxJs = s => stxAttr(JSON.stringify(String(s == null ? '' : s)));
        function stxOpfsOk() { return !!(SYSTEM.opfs && SYSTEM.opfs.available); }
        function stxFsaOk() { return 'showDirectoryPicker' in window; }
        function stxTypeOf(name) {
            const i = String(name).lastIndexOf('.');
            const ext = i > 0 ? String(name).slice(i + 1).toLowerCase() : '';
            return STX_TYPES.find(t => t.re && t.re.test(ext)) || STX_TYPES[STX_TYPES.length - 1];
        }
        function stxParent(path) { const i = path.lastIndexOf('/'); return i <= 0 ? '/' : path.slice(0, i); }
        function stxBucketLabel(path) {
            if (path === '/opfs' || path.startsWith('/opfs/')) return 'OPFS';
            if (path === '/system' || path.startsWith('/system/')) return '系统';
            return 'IndexedDB';
        }
        function stxPct(part, total) { return total > 0 ? Math.max(0, Math.min(100, part / total * 100)) : 0; }
        function stxPctText(p) { return p >= 10 ? p.toFixed(0) + '%' : p >= 0.1 ? p.toFixed(1) + '%' : (p > 0 ? '<0.1%' : '0%'); }
        function stxTime(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

        // ---------- 存储扫描：一次遍历同时得到后端分类、类型统计、最大文件和文件夹聚合 ----------
        async function stxCollectStorageReport() {
            const report = {
                time: Date.now(), usage: NaN, quota: NaN, caches: NaN,
                idb: { bytes: 0, files: 0 }, opfs: { bytes: 0, files: 0 }, system: { bytes: 0, files: 0 },
                types: {}, top: [], folders: {}, capped: false, entries: 0, maxEntries: 60000
            };
            STX_TYPES.forEach(t => { report.types[t.k] = { bytes: 0, files: 0 }; });
            const estimatePromise = navigator.storage && typeof navigator.storage.estimate === 'function'
                ? navigator.storage.estimate().catch(() => ({})) : Promise.resolve({});
            const addFile = (path, name, size, bucket) => {
                report[bucket].bytes += size; report[bucket].files++;
                if (bucket === 'system') return;          // 系统配置只计入后端分类，不参与用户文件统计
                const t = stxTypeOf(name);
                report.types[t.k].bytes += size; report.types[t.k].files++;
                if (report.top.length < 10 || size > report.top[report.top.length - 1].size) {
                    report.top.push({ path, name, size, type: t.k });
                    report.top.sort((a, b) => b.size - a.size);
                    if (report.top.length > 10) report.top.length = 10;
                }
                const root = STX_TREE_ROOTS.find(r => path.startsWith(r.p + '/'));
                if (!root) return;
                const rest = path.slice(root.p.length + 1);
                const slash = rest.indexOf('/');
                const key = slash > 0 ? root.p + '/' + rest.slice(0, slash) : root.p + '/';
                const f = report.folders[key] || (report.folders[key] = {
                    key, root: root.p, rootName: root.n, color: root.c, bytes: 0, files: 0,
                    path: slash > 0 ? root.p + '/' + rest.slice(0, slash) : root.p,
                    name: slash > 0 ? rest.slice(0, slash) : root.n + ' · 散落文件'
                });
                f.bytes += size; f.files++;
            };
            const walk = async (rootPath, bucket) => {
                try { await storageFsStat(rootPath); } catch (_) { return; }
                const queue = [rootPath];
                while (queue.length && !report.capped) {
                    const dir = queue.shift();
                    let names = [];
                    try { names = await storageFsReaddir(dir); } catch (_) { continue; }
                    for (let s = 0; s < names.length && !report.capped; s += 32) {
                        const batch = await Promise.all(names.slice(s, s + 32).map(async name => {
                            const path = (dir === '/' ? '' : dir) + '/' + name;
                            try { return { name, path, stat: await storageFsStat(path) }; } catch (_) { return null; }
                        }));
                        for (const it of batch) {
                            if (!it) continue;
                            if (++report.entries > report.maxEntries) { report.capped = true; break; }
                            if (isDirectoryStat(it.stat)) queue.push(it.path);
                            else addFile(it.path, it.name, Number(it.stat.size) || 0, bucket);
                        }
                    }
                }
            };
            await walk('/desktop', 'idb');
            await walk('/documents', 'idb');
            if (stxOpfsOk()) await walk('/opfs', 'opfs');
            await walk('/system', 'system');
            const est = await estimatePromise;
            report.usage = Number(est && est.usage);
            report.quota = Number(est && est.quota);
            const details = est && est.usageDetails && typeof est.usageDetails === 'object' ? est.usageDetails : {};
            report.caches = Number(details.caches);
            report.time = Date.now();
            return report;
        }

        function stxGetReport(force) {
            if (!force && STX_REPORT && Date.now() - STX_REPORT.time < 60000) return Promise.resolve(STX_REPORT);
            if (STX_REPORT_PROMISE) return STX_REPORT_PROMISE;
            STX_REPORT_PROMISE = stxCollectStorageReport()
                .then(r => { STX_REPORT = r; return r; })
                .finally(() => { STX_REPORT_PROMISE = null; });
            return STX_REPORT_PROMISE;
        }

        async function stxRefreshPersist() {
            if (!STX_PERSIST.supported) return;
            try { STX_PERSIST.persisted = await navigator.storage.persisted(); } catch (_) { STX_PERSIST.persisted = null; }
        }

        // 兼容旧接口：文件/后端发生变化的地方都会调用它，这里让所有设置窗口重新统计并刷新。
        function refreshAllStorageDashboards() {
            STX_REPORT = null;
            stxAllWins().forEach(id => { const st = STX_STATE[id]; if (st && (st.page === 'storage' || st.page === 'about')) stxRender(id, { keepScroll: true }); else stxRenderNav(id); });
        }
        function stxRefreshStorage(winId) {
            STX_REPORT = null;
            const btn = document.querySelector(`#win-${winId} [data-stx-refresh]`);
            if (btn) { btn.classList.add('busy'); btn.disabled = true; }
            stxGetReport(true).catch(err => Notify.error('无法读取存储信息', stxEsc(err && err.message || err)))
                .finally(() => stxAllWins().forEach(id => { const st = STX_STATE[id]; if (st && (st.page === 'storage' || st.page === 'about')) stxRender(id, { keepScroll: true }); else stxRenderNav(id); }));
        }

            const targetPage = STX_PAGES.some(p => p.k === page) ? page : null;

        function stxRenderNav(winId, full) {
            const st = STX_STATE[winId];
            const nav = document.querySelector(`#win-${winId} .stx-nav`);
            if (!st || !nav) return;

            const pct = r && r.quota > 0 ? Math.max(Number.isFinite(r.usage) ? r.usage : 0, r.idb.bytes + r.opfs.bytes + r.system.bytes) / r.quota * 100 : null;
            const items = STX_PAGES.map(p => {
                let badge = '';

                if (p.k === 'files') { const dc = Object.values(SYSTEM.mountedFolders || {}).filter(m => m.disconnected).length; if (dc) badge = `<em class="warn" title="${dc} 个文件夹需要重新授权">${dc}</em>`; }

            }).join('');
            if (full || !nav.querySelector('.stx-search')) {
                nav.innerHTML = `
                    <div class="stx-me"><div class="stx-logo"><span>JS</span></div><div style="min-width:0"><b>JISHENG OS</b><small>版本 ${STX_VERSION}</small><small data-stx-me-sub></small></div></div>
                    <div class="stx-search ${st.q ? 'has-q' : ''}">${icon('stxSearch')}

        function stxGo(winId, page, rowId) {
            const st = STX_STATE[winId];
            if (!st) return;

            if (st.q) stxClearSearch(winId, false);

        function stxRender(winId, opts = {}) {
            const st = STX_STATE[winId];
            const scroller = document.querySelector(`#win-${winId} .stx-scroll`);
            if (!st || !scroller) return;
            const top = scroller.scrollTop;
            let html;
            try {
                html = st.q ? stxSearchResults(winId) : ({
                    personal: stxPagePersonal, storage: stxPageStorage, files: stxPageFiles,
                    clean: stxPageClean, apps: stxPageApps, about: stxPageAbout
                }[st.page] || stxPagePersonal)(winId);

        // ---------- 页面：存储 ----------
        function stxSquarify(items, W, H) {
            const total = items.reduce((s, d) => s + d.bytes, 0);
            if (!total) return [];
            const scale = (W * H) / total;
            const list = items.map(d => ({ d, a: d.bytes * scale })).filter(x => x.a > 0).sort((a, b) => b.a - a.a);
            const out = [];
            let x = 0, y = 0, w = W, h = H, row = [];
            const worst = (r, side) => { const s = r.reduce((t, i) => t + i.a, 0); const mx = Math.max(...r.map(i => i.a)), mn = Math.min(...r.map(i => i.a)); return Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn)); };
            const lay = r => {
                const s = r.reduce((t, i) => t + i.a, 0);
                if (w >= h) { const cw = s / h; let cy = y; r.forEach(i => { const ch = i.a / cw; out.push({ ...i, x, y: cy, w: cw, h: ch }); cy += ch; }); x += cw; w -= cw; }
                else { const ch = s / w; let cx = x; r.forEach(i => { const iw = i.a / ch; out.push({ ...i, x: cx, y, w: iw, h: ch }); cx += iw; }); y += ch; h -= ch; }
            };
            while (list.length) {
                const side = Math.min(w, h), it = list[0];
                if (!row.length || worst([...row, it], side) <= worst(row, side)) { row.push(it); list.shift(); }
                else { lay(row); row = []; }
            }
            if (row.length) lay(row);
            return out;
        }
