            const refreshBtn = stxBtn('刷新', `stxRefreshStorage(${winId})`, { ic: 'stxRefreshCw', cls: 'sm' + (STX_REPORT_PROMISE ? ' busy' : ''), attrs: 'data-stx-refresh', dis: !!STX_REPORT_PROMISE });
            const headRight = `<div class="stx-btns">${r ? `<span class="stx-muted" style="font-size:11.5px">更新于 ${stxTime(r.time)}</span>` : ''}${refreshBtn}</div>`;
            const opfsOk = stxOpfsOk();
            const backendCards = `<div class="stx-rcards" data-stx-row="backend">
                <button type="button" class="stx-rcard ${SYSTEM.storageBackend === 'indexeddb' ? 'on' : ''}" onclick="stxSetBackend(${winId}, 'indexeddb')" aria-pressed="${SYSTEM.storageBackend === 'indexeddb'}"><span class="dot"></span><span><b>IndexedDB</b><small>兼容性最好，所有浏览器可用。路径 /desktop</small></span></button>
                <button type="button" class="stx-rcard ${SYSTEM.storageBackend === 'opfs' ? 'on' : ''}" ${opfsOk ? '' : 'disabled'} onclick="stxSetBackend(${winId}, 'opfs')" aria-pressed="${SYSTEM.storageBackend === 'opfs'}"><span class="dot"></span><span><b>OPFS${opfsOk ? '' : '（不可用）'}</b><small>${opfsOk ? '读写大文件更快，适合视频、压缩包。路径 /opfs/desktop' : '当前浏览器或隐私模式未提供 Origin Private File System'}</small></span></button>
            </div>
            <p class="stx-note" style="margin-top:2px">${icon('stxInfo')}桌面、新建文件和常规上传默认保存到这里。切换不会移动或删除已有文件，当前工作区：<span class="stx-mono" data-storage-current-path>${stxEsc(SYSTEM.desktopPath)}</span></p>`;
            const src = SYSTEM.storageBackend, dst = src === 'opfs' ? 'indexeddb' : 'opfs';
            const copyCard = `<div class="stx-card pad" data-stx-row="copy">
                <div class="stx-mig">
                    <div class="end"><small>从（当前默认）</small><b>${storageBackendLabel(src)}</b><span class="stx-mono">${stxEsc(getStorageDesktopPath(src))}</span></div>
                    ${icon('stxArrowRight')}
                    <div class="end"><small>复制到</small><b>${storageBackendLabel(dst)}${opfsOk ? '' : '（不可用）'}</b><span class="stx-mono">${stxEsc(getStorageDesktopPath(dst))}</span></div>
                </div>
                <div class="stx-mig-foot"><small>源文件保留，目标中的同名文件会被覆盖；所有修改日期一并保留。复制不会改变默认存储位置。</small>
                    ${stxBtn(STX_STATE[winId] && STX_STATE[winId].copying ? '复制中…' : '开始复制', `stxCopyWorkspace(${winId}, '${dst}')`, { ic: STX_STATE[winId] && STX_STATE[winId].copying ? 'stxRefreshCw' : 'stxCopy', cls: (STX_STATE[winId] && STX_STATE[winId].copying ? 'busy ' : ''), dis: !opfsOk || (STX_STATE[winId] && STX_STATE[winId].copying), attrs: 'data-storage-migration-button' })}
                </div>
            </div>`;
            const tail = stxGroup('默认存储位置', '', backendCards) + stxGroup('复制工作区到另一位置', '一次性的手动操作', copyCard);
            if (!r) return `<div class="stx-page wide">${stxHead('storage', headRight)}${stxStorageSkeleton()}<div class="stx-card">${stxPersistRow()}</div>${tail}</div>`;

            const quotaKnown = Number.isFinite(r.quota) && r.quota > 0;
            const cacheBytes = Number.isFinite(r.caches) ? r.caches : 0;
            const classified = r.idb.bytes + r.opfs.bytes + r.system.bytes + cacheBytes;
            // 浏览器的 estimate() 可能滞后（刚写入的数据尚未计入）或因压缩偏小；
            // 此时以文件扫描合计为准，避免出现“已用 < 文件总和”的矛盾数字。
            const reported = Number.isFinite(r.usage) ? r.usage : NaN;
            const lagging = Number.isFinite(reported) && classified > reported;
            const used = Number.isFinite(reported) ? Math.max(reported, classified) : classified;
            const usageKnown = Number.isFinite(reported) || classified > 0;
            const pct = usageKnown && quotaKnown ? used / r.quota * 100 : null;
            const otherBytes = Number.isFinite(reported) ? Math.max(0, reported - classified) : 0;
            const stackTotal = used || 1;
            const segs = [
                { n: 'IndexedDB 文件', c: '#1688e5', b: r.idb.bytes, s: `${r.idb.files} 个文件 · /desktop、/documents` },
                { n: 'OPFS 文件', c: '#19c37d', b: r.opfs.bytes, s: opfsOk ? `${r.opfs.files} 个文件 · /opfs` : '当前浏览器不可用' },
                { n: '系统文件与设置', c: '#a78bfa', b: r.system.bytes, s: `${r.system.files} 个文件 · /system` },
                { n: 'Cache Storage', c: '#f59e0b', b: cacheBytes, s: Number.isFinite(r.caches) ? '浏览器离线缓存' : '浏览器未单独提供' },
                { n: '其他 / 文件系统开销', c: '#64748b', b: otherBytes, s: '元数据、草稿与未单独归类的数据' }
            ];
            const totalFiles = r.idb.files + r.opfs.files;
            const overview = `<div class="stx-card pad" data-storage-dashboard="${winId}" data-stx-row="overview">
                <div class="stx-hero">
                    <div><div class="stx-big">${usageKnown ? formatStorageBytes(used) : '—'} <span>/ ${quotaKnown ? formatStorageBytes(r.quota) : '浏览器未提供配额'}</span></div>
                        <div class="stx-sub">${quotaKnown && usageKnown ? '可用 ' + formatStorageBytes(Math.max(0, r.quota - used)) + ' · ' : ''}共 ${totalFiles} 个用户文件${r.capped ? '（文件过多，已达扫描上限，数值为下限）' : ''}</div>${lagging ? `<div class="stx-sub" title="浏览器的配额统计通常会延迟几秒到几分钟更新">浏览器报告 ${formatStorageBytes(reported)}，尚未计入最新写入，已按文件扫描合计显示</div>` : ''}</div>
                    <div class="stx-pct">${pct === null ? '—' : stxPctText(pct)}<small>配额占用率</small></div>
                </div>
                <div class="stx-meter ${pct !== null && pct >= 80 ? 'warn' : ''}" role="meter" aria-label="配额占用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct === null ? 0 : pct.toFixed(1)}"><i style="width:${pct === null ? 0 : Math.max(pct, 0.6)}%"></i></div>
                <div class="stx-stack-label"><span>已用空间构成</span><span>${usageKnown ? formatStorageBytes(used) : ''}</span></div>
                <div class="stx-stack">${segs.filter(s => s.b > 0).map(s => `<i style="background:${s.c};width:${stxPct(s.b, stackTotal)}%" title="${stxAttr(s.n + '：' + formatStorageBytes(s.b))}"></i>`).join('')}</div>
                <div class="stx-legend">${segs.map(s => `<div class="stx-lg"><i style="background:${s.c}"></i><span>${s.n}</span><em>${formatStorageBytes(s.b)}</em><small>${s.s}</small></div>`).join('')}</div>
            </div>`;

            const typeTotal = STX_TYPES.reduce((t, x) => t + r.types[x.k].bytes, 0);
            const typeMax = Math.max(1, ...STX_TYPES.map(x => r.types[x.k].bytes));
            const typeRows = STX_TYPES.filter(t => r.types[t.k].files > 0).sort((a, b) => r.types[b.k].bytes - r.types[a.k].bytes).map(t => {
                const v = r.types[t.k];
                return `<div class="stx-bar" title="${stxAttr(t.n + '：' + formatStorageBytes(v.bytes) + '，占用户文件 ' + stxPctText(stxPct(v.bytes, typeTotal)))}">
                    <div class="ic" style="background:${t.c}22;color:${t.c}">${icon(t.ic)}</div>
                    <div class="nm"><span>${t.n}</span><span>${v.files} 个 · ${stxPctText(stxPct(v.bytes, typeTotal))}</span></div>
                    <div class="sz">${formatStorageBytes(v.bytes)}</div>
                    <div class="tr"><i style="width:${stxPct(v.bytes, typeMax)}%;background:${t.c}"></i></div>
                </div>`;
            }).join('');
            const types = stxGroup('按文件类型', typeTotal ? formatStorageBytes(typeTotal) : '', `<div class="stx-card pad" data-stx-row="types">${typeRows ? `<div class="stx-bars">${typeRows}</div>` : `<div class="stx-empty">${icon('stxFile')}还没有用户文件</div>`}</div>`);

            const topRows = r.top.map(f => {
                const t = STX_TYPES.find(x => x.k === f.type);
                const parent = stxParent(f.path);
                return `<button type="button" class="stx-file" title="${stxAttr('打开所在位置：' + parent)}" onclick="openFileExplorer(${stxJs(parent)})">
                    <div class="ic" style="background:${t.c}22;color:${t.c}">${icon(t.ic)}</div>
                    <div class="nm"><b>${stxEsc(f.name)}</b><small>${stxBucketLabel(f.path)} · ${stxEsc(parent)}</small></div>
                    <div class="sz">${formatStorageBytes(f.size)}</div>
                </button>`;
            }).join('');
            const top = stxGroup('占用最多的文件', '点击打开所在位置', `<div class="stx-card pad" data-stx-row="top" style="padding:8px 10px">${topRows ? `<div class="stx-files">${topRows}</div>` : `<div class="stx-empty">${icon('stxFile')}还没有用户文件</div>`}</div>`);

            const folders = Object.values(r.folders).filter(f => f.bytes > 0).sort((a, b) => b.bytes - a.bytes);
            const shown = folders.slice(0, 18);
            const rest = folders.slice(18);
            if (rest.length) shown.push({ key: '__rest', name: `其他 ${rest.length} 个文件夹`, rootName: '合计', color: '#475569', bytes: rest.reduce((t, f) => t + f.bytes, 0), files: rest.reduce((t, f) => t + f.files, 0) });
            const folderTotal = folders.reduce((t, f) => t + f.bytes, 0);
            const shadeIdx = {};
            const tiles = stxSquarify(shown, 100, 100).map(t => {
                const f = t.d, xs = t.w < 9 || t.h < 13;
                const label = `${f.name}（${f.rootName}）：${formatStorageBytes(f.bytes)} · ${f.files} 个文件 · ${stxPctText(stxPct(f.bytes, folderTotal))}`;
                const k = (shadeIdx[f.root] = (shadeIdx[f.root] ?? -1) + 1);
                const bg = f.key === '__rest' ? f.color : `color-mix(in srgb, ${f.color} ${[100, 78, 90, 68, 84, 60][k % 6]}%, #0b1020)`;
                const style = `left:${t.x}%;top:${t.y}%;width:${t.w}%;height:${t.h}%;background:${bg}`;
                const inner = `<b>${stxEsc(f.name)}</b><span>${formatStorageBytes(f.bytes)}</span>`;
                return f.key === '__rest'
                    ? `<div class="stx-tile ${xs ? 'xs' : ''}" style="${style}" title="${stxAttr(label)}">${inner}</div>`
                    : `<button type="button" class="stx-tile ${xs ? 'xs' : ''}" style="${style}" title="${stxAttr(label + '\n点击打开')}" aria-label="${stxAttr(label)}" onclick="openFileExplorer(${stxJs(f.path)})">${inner}</button>`;
            }).join('');
            const usedRoots = STX_TREE_ROOTS.filter(rt => folders.some(f => f.root === rt.p));
            const tree = stxGroup('文件夹占用', '面积代表大小 · 点击方块打开文件夹', `<div class="stx-card pad" data-stx-row="tree">${tiles
                ? `<div class="stx-tm">${tiles}</div><div class="stx-tm-legend">${usedRoots.map(rt => `<span><i style="background:${rt.c}"></i>${rt.n}</span>`).join('')}</div>`
                : `<div class="stx-empty">${icon('stxFolder')}还没有可显示的文件夹</div>`}</div>`);

            return `<div class="stx-page wide">${stxHead('storage', headRight)}
                ${overview}
                <div class="stx-card">${stxPersistRow()}</div>
                <div class="stx-vgrid">${types}${top}</div>
                ${tree}
                ${tail}
                <p class="stx-note">${icon('stxInfo')}总量与配额来自浏览器 navigator.storage.estimate()；分类与文件统计来自 JISHENG OS 对 /desktop、/documents、/opfs、/system 的扫描。已挂载的本地文件夹不占用浏览器空间，不计入统计。</p>
            </div>`;
        }
        async function stxSetBackend(winId, v) {
            if (v === SYSTEM.storageBackend) return;
            await setStorageBackend(v);
            stxAllWins().forEach(id => stxRender(id, { keepScroll: true }));
        }
        async function stxCopyWorkspace(winId, target) {
            const st = STX_STATE[winId];
            if (!st || st.copying) return;
            st.copying = true;
            stxRender(winId, { keepScroll: true });
            try { await copyCurrentWorkspaceToBackend(target); }
            finally { if (STX_STATE[winId]) { st.copying = false; stxRender(winId, { keepScroll: true }); } }
        }

        // ---------- 页面：文件管理 ----------
        function stxPageFiles(winId) {
            const hidden = SYSTEM.showHiddenFiles;
            const display = `<div class="stx-card">
                ${stxRow({ id: 'hidden', ic: 'stxEye', title: '显示系统与隐藏文件', desc: '显示点文件、/system、挂载点和完整内部文件系统。仅建议在检查或维护时开启。', cls: 'keep',
                    ctl: stxSwitch(hidden, `stxToggleHidden(${winId})`, '显示系统与隐藏文件', { id: `show-hidden-files-${winId}` }) })}
                ${stxRow({ id: 'full', ic: 'stxFolder', title: '浏览完整文件系统', cls: hidden ? '' : 'dis',
                    desc: hidden ? '从根目录 / 查看系统目录、隐藏文件与挂载点。' : '需要先打开上方“显示系统与隐藏文件”。',
                    ctl: stxBtn('打开根目录', 'openFullFileExplorer()', { cls: 'sm', dis: !hidden }) })}
                ${stxRow({ id: 'explorer', ic: 'stxFolderOpen', title: '文件管理器', desc: '侧栏同时提供 IndexedDB 与 OPFS；在哪个位置新建、上传或粘贴，文件就保存在哪里。',
                    ctl: stxBtn('打开', 'openFileExplorer()', { cls: 'sm', ic: 'stxExternalLink' }) })}
            </div>`;
            const mounts = Object.values(SYSTEM.mountedFolders || {});
            const fsa = stxFsaOk();
            const mountBtn = stxBtn('挂载文件夹…', `stxMount(${winId})`, { ic: 'stxFolderPlus', cls: 'primary sm', dis: !fsa, title: fsa ? '' : '当前浏览器不支持 File System Access API' });
            const list = mounts.length ? `<div class="stx-card">${mounts.map(m => {
                const path = m.mountPath || ('/mnt/local/' + m.name);
                const id = stxJs(m.id);
                return stxRow({
                    ic: m.disconnected ? 'stxUnplug' : 'stxFolderSync',
                    title: `${stxEsc(m.name)} ${m.disconnected ? stxPill('需要重新授权', 'warn') : stxPill('已连接', 'ok')}`,
                    desc: `<span class="stx-mono">${stxEsc(path)}</span>`,
                    ctl: (m.disconnected
                        ? stxBtn('重新授权', `stxRemount(${winId}, ${id})`, { cls: 'primary sm', ic: 'stxPlugZap' })
                        : stxBtn('打开', `openLocalFolder(${id})`, { cls: 'sm', ic: 'stxExternalLink' }))
                        + stxBtn('卸载', `stxUnmount(${winId}, ${id})`, { cls: 'ghost sm', ic: 'stxUnplug', title: '卸载不会删除电脑上的任何文件' })
                });
            }).join('')}</div>`
                : `<div class="stx-card"><div class="stx-empty">${icon('stxFolderSync')}还没有挂载本地文件夹<br>挂载后可以在 JISHENG OS 中直接读写电脑上的文件夹，文件不占用浏览器空间。</div></div>`;
            const mountNote = fsa
                ? `<p class="stx-note">${icon('stxInfo')}浏览器重启后，出于安全考虑通常需要点击“重新授权”才能继续访问。卸载只会移除授权，不会删除电脑上的文件。</p>`
                : `<p class="stx-note">${icon('stxTriangleAlert')}当前浏览器不支持 File System Access API（需要 Chrome / Edge 等 Chromium 内核桌面浏览器）。</p>`;
            return `<div class="stx-page">${stxHead('files')}
                ${stxGroup('显示与浏览', '', display)}
                ${stxGroup('已挂载的本地文件夹', mounts.length ? mounts.length + ' 个' : '', list + mountNote, mountBtn, 'data-stx-row="mounts"')}
            </div>`;
        }
        function stxToggleHidden(winId) {
            setShowHiddenFiles(!SYSTEM.showHiddenFiles);
            stxRender(winId, { keepScroll: true });
        }
        async function stxMount(winId) {
            await mountLocalFolder();
            stxAllWins().forEach(id => { stxRenderNav(id); if (STX_STATE[id].page === 'files') stxRender(id, { keepScroll: true }); });
        }
        async function stxRemount(winId, folderId) {
            await remountFolder(folderId, false);
            stxAllWins().forEach(id => { stxRenderNav(id); if (STX_STATE[id].page === 'files') stxRender(id, { keepScroll: true }); });
        }
        async function stxUnmount(winId, folderId) {
            const info = SYSTEM.mountedFolders[folderId];
            if (!info) return;
            const ok = await SysDialog.confirm({
                title: '卸载文件夹', icon: 'uiEject', okText: '卸载',
                message: `卸载“${info.name}”后，JISHENG OS 将不再能访问它，已打开的相关窗口可能无法继续使用。\n\n电脑上的文件不会被删除，之后可以随时重新挂载。`
            });
            if (!ok) return;
            await unmountLocalFolder(folderId);
            stxAllWins().forEach(id => { stxRenderNav(id); if (STX_STATE[id].page === 'files') stxRender(id, { keepScroll: true }); });
        }

        // ---------- 页面：清理与维护 ----------
        function stxCleanCard(winId) {
            const state = getTempCleanupState(winId);
            const has = state.items.length > 0;
            const selectable = state.items.filter(i => i.group !== 'protected');
            const chosen = state.items.filter((_, i) => state.selected[i]);
            const step = state.scanning ? 1 : !state.scanned ? 1 : chosen.length ? 3 : 2;
            const stepHtml = ['扫描', '勾选', '清理'].map((n, i) => {
                const k = i + 1, cls = state.scanned && k < step ? 'done' : k === step ? 'on' : '';
                return `${i ? '<i class="ln"></i>' : ''}<span class="${cls}"><i>${cls === 'done' ? '✓' : k}</i>${n}</span>`;
            }).join('');
            const head = `<div class="stx-clean-head"><div class="stx-steps">${stepHtml}</div><i class="sp"></i>
                ${stxBtn(state.scanning ? '扫描中…' : state.scanned ? '重新扫描' : '开始扫描', `scanOneOffCache(${winId})`, { ic: state.scanning ? 'stxRefreshCw' : 'stxScanSearch', cls: (state.scanned ? 'sm' : 'primary sm') + (state.scanning ? ' busy' : ''), dis: state.scanning })}</div>`;
            let body;
            if (state.scanning) {
                body = `<div class="stx-scan"><div class="stx-indet"><i></i></div><div class="stx-mono">${stxEsc(state.status || '正在扫描…')}</div><small class="stx-muted">只读取，不会删除任何内容。</small></div>`;
            } else if (state.error) {
                body = `<div class="stx-empty" style="border-top:1px solid var(--line)">${icon('stxTriangleAlert')}扫描失败：${stxEsc(state.error)}</div>`;
            } else if (!state.scanned) {
                body = `<div class="stx-empty" style="border-top:1px solid var(--line);text-align:left;padding:14px 16px">会检查 IndexedDB、OPFS、系统目录和浏览器缓存，列出临时文件、缓存、重复副本、空白文档等候选项。<br>扫描不会删除任何内容；所有项目默认不勾选，由你逐项确认。</div>`;
            } else if (!has) {
                body = `<div class="stx-empty" style="border-top:1px solid var(--line)">${icon('stxCircleCheck')}很干净，没有发现可清理的临时文件或缓存。</div>`;
            } else {
                state.open = state.open || {};
                body = tempCleanupGroupOrder().map(group => {
                    const entries = state.items.map((item, index) => ({ item, index })).filter(e => e.item.group === group);
                    if (!entries.length) return '';
                    const bytes = entries.reduce((t, e) => t + (e.item.size || 0), 0);
                    const isProt = group === 'protected';
                    const open = !!state.open[group];
                    return `<div class="stx-cg ${open ? 'open' : ''}">
                        <div class="stx-cg-h" onclick="stxToggleCleanGroup(${winId}, '${group}')" role="button" tabindex="0" aria-expanded="${open}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}">
                            <input type="checkbox" class="stx-cb" data-cleanup-group-select="${group}" ${isProt ? 'disabled title="受保护，需要单独勾选"' : ''} aria-label="整组选择：${stxAttr(tempCleanupGroupTitle(group))}" onclick="event.stopPropagation()" onchange="toggleOneOffCacheGroup(${winId}, '${group}', this.checked)">
                            <b>${tempCleanupGroupTitle(group)}${isProt ? ' ' + stxPill('建议保留', 'warn', 'stxLock') : ''}</b>
                            <small>${entries.length} 项 · ${formatStorageBytes(bytes)}</small>
                            ${icon('stxChevronRight')}
                        </div>
                        <div class="stx-cg-items">${entries.map(({ item, index }) => `<label class="stx-ci">
                            <input type="checkbox" class="stx-cb" ${state.selected[index] ? 'checked' : ''} onchange="setOneOffCacheSelected(${winId}, ${index}, this.checked)">
                            <span style="min-width:0"><b title="${stxAttr(item.path)}">${stxEsc(item.path)}</b><small>${stxEsc(item.reason)}${item.volume ? ' · ' + stxEsc(item.volume) : ''}</small></span>
                            <em>${formatStorageBytes(item.size || 0)}</em>
                        </label>`).join('')}</div>
                    </div>`;
                }).join('');
                const freed = chosen.reduce((t, i) => t + (i.size || 0), 0);
                body += `<div class="stx-actionbar">
                    <span>已选 <b>${chosen.length}</b> 项 · 预计释放 <b>${formatStorageBytes(freed)}</b></span><i class="sp"></i>
                    ${stxBtn('全选', `toggleAllOneOffCache(${winId}, true)`, { cls: 'ghost sm', dis: !selectable.length, title: '选择全部候选项（不含系统配置）' })}
                    ${stxBtn('清空', `toggleAllOneOffCache(${winId}, false)`, { cls: 'ghost sm', dis: !chosen.length })}
                    ${stxBtn(`清理 ${chosen.length} 项`, `cleanSelectedOneOffCache(${winId})`, { cls: 'danger sm', ic: 'stxTrash2', dis: !chosen.length })}
                </div>`;
            }
            return `<div class="stx-card" id="stx-clean-${winId}" data-stx-row="scan">${head}${body}</div>`;
        }

        async function stxExportBackup() {

                    iconPositions: SYSTEM.iconPositions && typeof SYSTEM.iconPositions === 'object' ? SYSTEM.iconPositions : {}
                };
                const text = JSON.stringify(data, null, 2);
                const d = new Date(), p = n => String(n).padStart(2, '0');
                const name = `JISHENG-OS-设置备份-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;

        function stxImportBackup(winId) {

                let data;

                if (!data || data.type !== 'jisheng-os-settings-backup' || !data.settings || typeof data.settings !== 'object') {
                    Notify.error('无法读取备份', '这不是 JISHENG OS 导出的设置备份文件。'); return;
                }
                const wp = typeof data.wallpaper === 'string' && /^(data:image\/|https?:\/\/)/i.test(data.wallpaper) && !/['"\\\n\r()]/.test(data.wallpaper.replace(/^data:[^,]*,/, '')) && !/['"\\\n\r]/.test(data.wallpaper) ? data.wallpaper : null;
                const pos = data.iconPositions && typeof data.iconPositions === 'object' && !Array.isArray(data.iconPositions) ? data.iconPositions : null;
                const s = data.settings;
                const parts = [
                    `· 图标打开方式：${s.clickBehavior === 'single' ? '单击' : '双击'}`,
                    `· 默认存储位置：${s.storageBackend === 'opfs' ? 'OPFS' + (stxOpfsOk() ? '' : '（当前不可用，将使用 IndexedDB）') : 'IndexedDB'}`,
                    `· 显示隐藏文件：${s.showHiddenFiles ? '开' : '关'}`,

                    `· 桌面图标位置：${pos ? Object.keys(pos).length + ' 个' : '不包含'}`
                ];
                const ok = await SysDialog.confirm({
                    title: '从备份恢复设置', icon: 'uiUpload', okText: '恢复',
                    message: `备份时间：${data.exportedAt ? new Date(data.exportedAt).toLocaleString() : '未知'}（系统版本 ${data.osVersion || '未知'}）\n\n将恢复以下内容，当前对应设置会被覆盖：\n${parts.join('\n')}\n\n不会修改或删除任何文件。`
                });

        // === 壁纸管理 ===
        // 所有入口（开始菜单「壁纸」、桌面右键「更换壁纸」、设置）统一打开 设置 → 个性化。
        // wallpaper.cfg 始终保存“当前实际显示的图片地址”；SYSTEM.wallpaperSource 只记录是否跟随必应每日更换。
        function openWallpaperPanel() {
            try { closeCtx(); } catch (_) {}
            return openSettings('personal');
        }

        // 两个概念分开：
        //   “你的壁纸”= SYSTEM.customWallpaper，保存在 wallpaper.cfg，只由你主动选择（预设 / 上传 / 右键 / 固定一张必应图）时改变；
        //   必应每日壁纸只是“显示层”，用 wpShow 盖在上面，从不写 wallpaper.cfg —— 关掉就恢复你的壁纸。
        // （上一版把必应图片直接写进 wallpaper.cfg，开启后原来的壁纸就被永久顶掉了。）
        function wpShow(u) {
            if (!u) return;
            document.getElementById('dynamic-bg').style.backgroundImage = `url('${u}')`;
            stxSyncWallpaperPreviews();
        }
        function setBg(u, save = true) {
            wpShow(u);
            if (save) wpSaveCustom(u);
        }
        function wpSaveCustom(u, name) {
            SYSTEM.customWallpaper = u;
            if (SYSTEM.mounted) {
                SYSTEM.fs.writeFile(SYSTEM.configPath, u, (err) => { if(err) console.error("Save WP failed", err); });
            }
            wpHistoryAdd(u, name);
        }

        // ---------- 最近使用的壁纸（预设不计入，它们一直都在） ----------
        const WP_HISTORY_MAX = 6;
        const WP_HISTORY_PATH = '/system/config/wallpaper-history.json';
        function wpIsPreset(u) { return typeof WALLPAPER_PRESETS !== 'undefined' && WALLPAPER_PRESETS.some(p => p.url === u); }
        function wpValidStored(u) {
            return typeof u === 'string' && /^(data:image\/|https?:\/\/)/i.test(u) && !/['"\\\n\r]/.test(u);
        }
        function wpHistoryLoad() {
            return new Promise(resolve => {
                if (!SYSTEM.fs) { resolve(); return; }
                SYSTEM.fs.readFile(WP_HISTORY_PATH, 'utf8', (err, data) => {
                    let list = [];
                    if (!err && data) { try { list = JSON.parse(data); } catch (_) { list = []; } }
                    SYSTEM.wallpaperHistory = (Array.isArray(list) ? list : [])
                        .filter(x => x && wpValidStored(x.url) && !wpIsPreset(x.url))
                        .slice(0, WP_HISTORY_MAX)
                        .map(x => ({ url: x.url, name: String(x.name || ''), at: Number(x.at) || 0 }));
                    resolve();
                });
            });
        }
        function wpHistoryWrite() {
            if (!SYSTEM.mounted || !SYSTEM.fs) return;
            SYSTEM.fs.writeFile(WP_HISTORY_PATH, JSON.stringify(SYSTEM.wallpaperHistory || []), err => { if (err) console.warn('保存壁纸历史失败:', err); });
        }
        function wpHistoryAdd(u, name) {
            if (!wpValidStored(u) || wpIsPreset(u)) return;
            const list = (SYSTEM.wallpaperHistory || []).filter(x => x.url !== u);
            const old = (SYSTEM.wallpaperHistory || []).find(x => x.url === u);
            list.unshift({ url: u, name: String(name || (old && old.name) || ''), at: Date.now() });
            SYSTEM.wallpaperHistory = list.slice(0, WP_HISTORY_MAX);
            wpHistoryWrite();
        }
        function wpHistoryRemove(index) {
            const list = SYSTEM.wallpaperHistory || [];
            const item = list[index];
            if (!item) return;
            list.splice(index, 1);
            wpHistoryWrite();
            wpRefreshSettings();
            Notify.info('已从最近使用中移除', item.url === SYSTEM.customWallpaper ? '当前壁纸不受影响。' : '');
        }
        function wpNameOf(u) {
            if (!u) return '';
            const preset = typeof WALLPAPER_PRESETS !== 'undefined' && WALLPAPER_PRESETS.find(p => p.url === u);
            if (preset) return preset.name;
            const h = (SYSTEM.wallpaperHistory || []).find(x => x.url === u);
            if (h && h.name) return h.name;
            const bing = typeof wpBingLookup === 'function' ? wpBingLookup(u) : null;
            if (bing && bing.desc) return bing.desc;
            const meta = typeof wpReadMeta === 'function' ? wpReadMeta() : null;
            if (meta && meta.fp === wpFingerprint(u) && meta.name) return meta.name;
            return /^data:/i.test(u) ? '本地图片' : '网络图片';
        }

        const WP_META_KEY = 'JISHENG_OS_WALLPAPER_META';
        const WP_BING_KEY = 'JISHENG_OS_BING_WALLPAPER';
        const WP_BING_TTL = 3 * 3600 * 1000;           // 同一天内最多每 3 小时向服务器确认一次
        const WP_BING = { busy: null, loading: false, error: '', recentBusy: null, recentError: '' };

        function wpSafeUrl(u) {
            return typeof u === 'string' && /^https:\/\/[^\s'"()\\<>]+$/i.test(u) ? u : '';
        }
        function wpCurrentUrl() {
            const m = /^url\((['"]?)(.*)\1\)$/.exec(stxCurrentWallpaper());
            return m ? m[2] : '';
        }
        function wpPreload(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('图片无法加载'));
                img.src = url;
            });
        }
        function wpFingerprint(u) { return String(u || '').length + ':' + String(u || '').slice(-48); }
        function wpReadMeta() { try { return JSON.parse(localStorage.getItem(WP_META_KEY)) || null; } catch (_) { return null; } }
        function wpWriteMeta(url, name) {
            try { localStorage.setItem(WP_META_KEY, JSON.stringify({ fp: wpFingerprint(url), name: String(name || '') })); } catch (_) {}
        }
        function wpThumb(u) { return u.replace(/([?&])w=\d+/, '$1w=480'); }
        function wpToday() {
            const d = new Date(), p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        }
        function wpNormDate(s) {
            const m = /^(\d{4})-?(\d{2})-?(\d{2})/.exec(String(s || ''));
            return m ? `${m[1]}-${m[2]}-${m[3]}` : '';
        }
        // 必应中国区按北京时间换图；用“已知最新图片日期”和本机日期中较晚的一天作为“今天”，避免时区不同时出现两个“今天”或日期错位
        function wpRefDay() {
            let ref = wpToday();
            try {
                const c = JSON.parse(localStorage.getItem(WP_BING_KEY)) || {};
                [c.today && c.today.date, Array.isArray(c.recent) && c.recent[0] && c.recent[0].date].forEach(d => { if (d && d > ref) ref = d; });
            } catch (_) {}
            return ref;
        }
        function wpIsToday(date) { return !!date && date >= wpRefDay(); }
        function wpDateLabel(date) {
            if (!date) return '';
            const ref = wpRefDay();
            if (date >= ref) return '今天';
            const y = new Date(ref + 'T12:00:00'); y.setDate(y.getDate() - 1);
            const p = n => String(n).padStart(2, '0');
            if (date === `${y.getFullYear()}-${p(y.getMonth() + 1)}-${p(y.getDate())}`) return '昨天';
            const [, mm, dd] = date.split('-');
            return `${Number(mm)}月${Number(dd)}日`;
        }

        // 用户主动选择一张固定壁纸（预设、上传、文件右键、必应往期）：顺带关闭“每日更换”。
        function wpApplyCustom(url, name) {
            const wasDaily = SYSTEM.wallpaperSource === 'bing';
            if (wasDaily) { SYSTEM.wallpaperSource = 'custom'; saveSystemSettings(); }
            if (name) wpWriteMeta(url, name);
            wpShow(url);
            wpSaveCustom(url, name);
            wpRefreshSettings();
            return wasDaily;
        }

        async function wpPickTile(btn) {
            const url = btn && btn.dataset.wpUrl;
            if (!url || btn.classList.contains('busy')) return;
            if (url === wpCurrentUrl() && SYSTEM.wallpaperSource !== 'bing') return;
            btn.classList.add('busy'); btn.setAttribute('aria-busy', 'true');
            try {
                await wpPreload(url);               // 下载完成再切换，避免桌面闪空白
                const wasDaily = wpApplyCustom(url, btn.dataset.wpName || '');
                if (wasDaily) Notify.info('已改为固定壁纸', '必应每日壁纸已关闭，可随时在 设置 → 个性化 重新开启。');
            } catch (_) {
                Notify.error('壁纸加载失败', '图片无法下载，请检查网络后重试。');
            } finally {
                btn.classList.remove('busy'); btn.removeAttribute('aria-busy');
            }
        }

        function wpUploadFile(file) {
            if (!file) return;
            if (!/^image\//i.test(file.type || '') && !/\.(jpe?g|png|gif|webp|bmp|avif|svg)$/i.test(file.name || '')) {
                Notify.warning('无法设为壁纸', `“${stxEsc(file.name || '该文件')}” 不是图片文件。`);
                return;
            }
            const r = new FileReader();
            r.onerror = () => Notify.error('读取失败', '无法读取所选图片。');
            r.onload = ev => {
                const dataUrl = ev.target.result;
                wpPreload(dataUrl).then(() => {
                    wpApplyCustom(dataUrl, file.name || '本地图片');
                    Notify.success('壁纸已更换', `已将 “${stxEsc(file.name || '图片')}” 设为桌面壁纸`);
                }).catch(() => Notify.error('设置失败', `“${stxEsc(file.name || '图片')}” 无法作为图片解码`));
            };
            r.readAsDataURL(file);
        }
        function wpChooseFile() { const fi = document.getElementById('file-input'); if (fi) { fi.value = ''; fi.click(); } }
        function wpDragHasFiles(e) { return !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')); }
        function wpDragOver(e, el) {
            if (!wpDragHasFiles(e)) return;
            e.preventDefault(); e.stopPropagation();
            e.dataTransfer.dropEffect = 'copy';
            el.classList.add('drag');
        }
        function wpDragLeave(e, el) { if (!el.contains(e.relatedTarget)) el.classList.remove('drag'); }
        function wpDrop(e, el) {
            el.classList.remove('drag');
            if (!wpDragHasFiles(e)) return;
            e.preventDefault(); e.stopPropagation();
            wpUploadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
        }

        // ---------- 必应每日壁纸 ----------
        // 必应官方接口不允许跨域，这里用两个开放 CORS 的公共镜像：
        //   今日图片：bing.biturl.top（直接返回 www.bing.com 的 1920×1080 原图地址）
        //   近 7 天 + 备用：peapix.com（中国区 feed）
        function wpBingCache() { try { const c = JSON.parse(localStorage.getItem(WP_BING_KEY)); return c && typeof c === 'object' ? c : {}; } catch (_) { return {}; } }
        function wpBingStore(c) { try { localStorage.setItem(WP_BING_KEY, JSON.stringify(c)); } catch (_) {} }
        function wpSplitCopyright(s) {
            const m = /^(.*?)\s*[（(]\s*(©[^)）]*)[)）]\s*$/.exec(String(s || '').trim());
            return m ? { desc: m[1], credit: m[2] } : { desc: String(s || '').trim(), credit: '' };
        }
        async function wpFetchJson(url, ms = 9000) {
            const ctl = typeof AbortController === 'function' ? new AbortController() : null;
            const timer = ctl ? setTimeout(() => ctl.abort(), ms) : null;
            try {
                const res = await fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } finally { if (timer) clearTimeout(timer); }
        }
        async function wpBingFetchRecent() {
            const d = await wpFetchJson('https://peapix.com/bing/feed?country=cn');
            const list = (Array.isArray(d) ? d : []).map(x => {
                const url = wpSafeUrl(x && x.fullUrl);
                if (!url) return null;
                return { date: wpNormDate(x.date), url, thumb: wpSafeUrl(x.thumbUrl) || url, desc: String(x.title || ''), credit: '', link: wpSafeUrl(x.pageUrl) };
            }).filter(Boolean).slice(0, 8);
            if (!list.length) throw new Error('必应图片列表为空');
            return list;
        }
        async function wpBingFetchToday() {
            try {
                const d = await wpFetchJson('https://bing.biturl.top/?resolution=1920&format=json&index=0&mkt=zh-CN');
                const url = wpSafeUrl(d && d.url);
                if (url && /^https:\/\/www\.bing\.com\//.test(url)) {
                    const { desc, credit } = wpSplitCopyright(d.copyright);
                    return { date: wpNormDate(d.end_date) || wpToday(), url, thumb: url.replace(/_1920x1080\.jpg/, '_640x360.jpg'), desc, credit, link: wpSafeUrl(d.copyright_link) };
                }
            } catch (_) { /* 落到备用源 */ }
            const list = await wpBingFetchRecent();
            const c = wpBingCache(); c.recent = list; c.recentAt = Date.now(); c.recentDay = wpToday(); wpBingStore(c);
            return list[0];
        }
        // 用今日“官方”条目替换 peapix 列表中的同日条目，保证“今天”那张与每日模式用的是同一个地址
        function wpBingRecentList() {
            const c = wpBingCache();
            const list = Array.isArray(c.recent) ? c.recent.slice() : [];
            if (c.today && c.today.url) {
                const i = list.findIndex(x => x.date === c.today.date);
                if (i >= 0) list[i] = c.today; else if (!list.length || c.today.date > list[0].date) list.unshift(c.today);
            }
            return list.slice(0, 8);
        }
        function wpBingLookup(url) {
            if (!url) return null;
            const c = wpBingCache();
            if (c.today && c.today.url === url) return c.today;
            return (Array.isArray(c.recent) ? c.recent : []).find(x => x.url === url) || null;
        }

        // 检查并应用今日必应壁纸。force：忽略缓存；announce：自动换图时提示一次。
        function wpBingUpdate(opts = {}) {
            if (WP_BING.busy) return WP_BING.busy;
            WP_BING.busy = (async () => {
                const c = wpBingCache();
                const fresh = c.today && c.checkedDay === wpToday() && Date.now() - (c.checkedAt || 0) < WP_BING_TTL;
                let item = c.today || null;
                if (opts.force || !fresh) {
                    WP_BING.loading = true;
                    wpRefreshSettings();
                    try {
                        item = await wpBingFetchToday();
                        const c2 = wpBingCache();
                        c2.today = item; c2.checkedAt = Date.now(); c2.checkedDay = wpToday();
                        wpBingStore(c2);
                        WP_BING.error = '';
                    } catch (err) {
                        WP_BING.error = navigator.onLine === false ? '当前处于离线状态' : '暂时无法连接必应';
                        if (!item) throw err;
                    } finally { WP_BING.loading = false; }
                }
                if (SYSTEM.wallpaperSource === 'bing' && item && item.url && item.url !== wpCurrentUrl()) {
                    await wpPreload(item.url);
                    if (SYSTEM.wallpaperSource !== 'bing') return item;   // 加载期间用户已改选其它壁纸
                    wpShow(item.url);
                    if (opts.announce) Notify.info('今日必应壁纸', stxEsc(item.desc || '桌面壁纸已更新'));
                }
                return item;
            })().finally(() => { WP_BING.busy = null; wpRefreshSettings(); });
            return WP_BING.busy;
        }
        function wpBingLoadRecent(force) {
            const c = wpBingCache();
            if (!force && Array.isArray(c.recent) && c.recent.length && c.recentDay === wpToday() && Date.now() - (c.recentAt || 0) < WP_BING_TTL) return Promise.resolve();
            if (WP_BING.recentBusy) return WP_BING.recentBusy;
            WP_BING.recentError = '';
            WP_BING.recentBusy = wpBingFetchRecent().then(list => {
                const c2 = wpBingCache(); c2.recent = list; c2.recentAt = Date.now(); c2.recentDay = wpToday(); wpBingStore(c2);
            }).catch(() => {
                WP_BING.recentError = navigator.onLine === false ? '当前处于离线状态，联网后可查看近期壁纸。' : '暂时无法获取必应近期壁纸。';
            }).finally(() => { WP_BING.recentBusy = null; wpRefreshSettings(); });
            return WP_BING.recentBusy;
        }
        async function wpSetBingDaily(on) {
            if (on === (SYSTEM.wallpaperSource === 'bing')) return;
            SYSTEM.wallpaperSource = on ? 'bing' : 'custom';
            saveSystemSettings();
            wpRefreshSettings();
            if (!on) {
                const mine = SYSTEM.customWallpaper;
                if (mine && mine !== wpCurrentUrl()) {
                    try { await wpPreload(mine); } catch (_) {}
                    if (SYSTEM.wallpaperSource !== 'bing') wpShow(mine);
                }
                wpRefreshSettings();
                Notify.info('已关闭必应每日壁纸', `已恢复为你的壁纸「${stxEsc(wpNameOf(mine))}」。`);
                return;
            }
            try {
                const item = await wpBingUpdate();
                if (item && SYSTEM.wallpaperSource === 'bing') Notify.success('已开启必应每日壁纸', stxEsc(item.desc || '每天会自动更换为必应首页图片。'));
            } catch (_) {
                Notify.warning('暂时无法获取必应壁纸', '已保持开启，联网后会自动更新；当前壁纸不变。');
            }
        }
        function wpBingInit() {
            if (wpBingInit.done) return;
            wpBingInit.done = true;
            const tick = () => {
                if (SYSTEM.wallpaperSource === 'bing' && document.visibilityState !== 'hidden') wpBingUpdate({ announce: true }).catch(() => {});
            };
            tick();
            setInterval(tick, 30 * 60 * 1000);
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });
            window.addEventListener('online', tick);
        }

        // ---------- 设置页同步 ----------
        function wpRefreshSettings() {
            if (typeof stxAllWins !== 'function') return;
            stxAllWins().forEach(id => {
                const st = STX_STATE[id];
                if (st && st.page === 'personal' && !st.q) stxRender(id, { keepScroll: true });
            });
        }

        const fileInput = document.getElementById('file-input');
        fileInput.onchange = e => {
            const f = e.target.files && e.target.files[0];
            if (f) wpUploadFile(f);
            e.target.value = '';
        };



        async function clearOPFSForReset() {
            if (!(navigator.storage && typeof navigator.storage.getDirectory === 'function')) {
                throw new Error('当前浏览器不提供 OPFS，无法执行 OPFS 重置');
            }
            const root = await navigator.storage.getDirectory();
            const names = [];
            for await (const [name] of root.entries()) names.push(name);
            for (const name of names) await root.removeEntry(name, { recursive: true });
        }

        function dropResetMtimeEntries(prefixes) {
            try {
                const cache = SYSTEM.mtimeCache || JSON.parse(localStorage.getItem('JISHENG_OS_MTIME_CACHE') || '{}');
                Object.keys(cache).forEach(path => {
                    if (prefixes.some(prefix => path === prefix || path.startsWith(prefix + '/'))) delete cache[path];
                });
                SYSTEM.mtimeCache = cache;
                if (SYSTEM.saveMtimeCache) SYSTEM.saveMtimeCache();
                else localStorage.setItem('JISHENG_OS_MTIME_CACHE', JSON.stringify(cache));
            } catch (err) { console.warn('清理重置后的日期元数据失败:', err); }
        }

        function deleteStorageDatabase(name) {
            return new Promise((resolve, reject) => {
                try {
                    const request = indexedDB.deleteDatabase(name);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error || new Error('无法删除数据库：' + name));
                    request.onblocked = () => reject(new Error('数据库正被其他页面占用，请关闭其他 JISHENG OS 标签页后重试'));
                } catch (err) { reject(err); }
            });
        }

        async function clearIndexedDBVolumeForReset() {
            // 直接删除当前数据库会被本页自己的连接阻塞，因此只清空用户数据，
            // 保留已打开的文件系统容器和 /mnt、/opfs 挂载点。
            let rootEntries = [];
            try { rootEntries = await storageFsReaddir('/'); } catch (err) { throw new Error('无法读取 IndexedDB 根目录：' + (err.message || err)); }
            for (const name of rootEntries) {
                if (name === 'mnt' || name === 'opfs') continue;
                await removeOneOffFilesystemPath('/' + name);
            }
            // 立即恢复空的基础目录，后续重新加载能稳定启动，不会因空卷出现 ENOENT。
            await ensureDir('/system');
            await ensureDir('/system/config');
            await ensureDir('/desktop');
            await ensureDir('/documents');
        }

        function clearAllJishengLocalData() {
            try {
                const keys = [];
                for (let index = 0; index < localStorage.length; index++) {
                    const key = localStorage.key(index);
                    if (key && (key.startsWith('JISHENG_OS_') || key.startsWith(NP_DRAFT_PREFIX))) keys.push(key);
                }
                keys.forEach(key => localStorage.removeItem(key));
                SYSTEM.mtimeCache = {};
            } catch (err) { console.warn('清理本地系统数据失败:', err); }
        }

        async function resetStorageScope(scope, options = {}) {
            const descriptions = {
                indexeddb: {
                    title: '仅重置 IndexedDB',
                    message: '这会删除 IndexedDB 中 JISHENG OS 的文件、系统目录和已保存的本地文件夹授权记录。OPFS 文件、浏览器缓存和 localStorage 设置不会删除；操作完成后页面会重新加载。'
                },
                opfs: {
                    title: '仅重置 OPFS',
                    message: '这会删除 OPFS 中的所有文件和目录。IndexedDB 中的文件、系统设置和浏览器缓存不会删除；操作完成后页面会重新加载。'
                },
                all: {
                    title: '重置 IndexedDB 与 OPFS',
                    message: '这会删除 IndexedDB 与 OPFS 中 JISHENG OS 的全部文件和系统数据，并移除 JISHENG OS 的本地设置、草稿和修改时间元数据。浏览器将重新加载。'
                }
            };
            const detail = descriptions[scope];
            if (!detail) return;
            // 设置页的重置对话框已让用户选择范围并输入确认词，此时不再重复确认。
            if (!options.confirmed) {
                const confirmed = await SysDialog.confirm({
                    title: detail.title, icon: 'uiWarning', danger: true, okText: '确认重置',
                    message: `警告：${detail.message}\n\n此操作不可恢复，确定继续吗？`
                });
                if (!confirmed) return;
            }
            try {
                if (scope === 'opfs' || scope === 'all') {
                    await clearOPFSForReset();
                    dropResetMtimeEntries(['/opfs']);
                }
                if (scope === 'indexeddb' || scope === 'all') {
                    await clearIndexedDBVolumeForReset();
                    // 挂载记录本身也在独立 IndexedDB；先关闭本页连接，避免删除时自我阻塞。
                    try { if (mountedFoldersDB) mountedFoldersDB.close(); mountedFoldersDB = null; } catch (_) {}
                    await deleteStorageDatabase(MOUNTED_FOLDERS_DB);
                    dropResetMtimeEntries(['/desktop', '/documents', '/system']);
                }
                if (scope === 'all') clearAllJishengLocalData();
                location.reload();
            } catch (err) {
                console.error('重置存储失败:', err);
                Notify.error('重置失败', err && err.message ? err.message : '存储数据无法删除');
            }
        }

        // 保留开始菜单的“重置系统”入口，语义为重置两个后端。
        function resetSystem() { return resetStorageScope('all'); }

        // ============================================

        const AeroPeek = {

        // =
        // ============================================
        // 1. 运行窗口任务栏条状图标管理
        // ============================================

        function updateTaskbarRunningItems() {
            const area = document.getElementById('taskbar-running-area');
            if (!area) return;
            
            const existingIds = new Set();
            
            // 更新/添加
            SYSTEM.windows.forEach(w => {
                existingIds.add(w.id);
                let item = document.getElementById('taskbar-run-' + w.id);
                
                if (!item) {
                    // 创建新的条状图标
                    item = document.createElement('div');
                    item.className = 'taskbar-running-item';
                    item.id = 'taskbar-run-' + w.id;
                    item.dataset.winId = w.id;
                    item.setAttribute('role', 'button');
                    item.tabIndex = 0;
                    
                    const taskbarIcon = w.iconHtml || icon('appDefault');
                    item.innerHTML = `
                        <div class="running-icon">${taskbarIcon}</div>
                        <div class="running-title">${escapeHtml(w.title || '窗口')}</div>
                        <button class="running-close-btn" title="关闭窗口" aria-label="关闭窗口" tabindex="-1">
                            ${icon('uiClose')}
                        </button>
                    `;
                    
                    // 点击：聚焦/最小化
                    item.addEventListener('click', function(e) {
                        // 如果点击的是关闭按钮，不执行聚焦/最小化
                        if (e.target.closest('.running-close-btn')) return;
                        try { clearAeroPeekEffects(); } catch(err) {}
                        const winId = parseInt(this.dataset.winId);
                        const win = SYSTEM.windows.find(ww => ww.id === winId);
                        if (!win) return;
                        
                        if (win.element.classList.contains('focused') && !win.minimized) {
                            minimizeWin(winId);
                        } else {
                            focusWin(winId);
                        }
                        setTimeout(updateTaskbarRunningItems, 30);
                    });
                    
                    // 关闭按钮点击事件
                    const closeBtn = item.querySelector('.running-close-btn');
                    if (closeBtn) {
                        closeBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            // 修复：点掉蓝色框窗口时先清 Peek，否则关闭动画被 !important 卡住
                            try { clearAeroPeekEffects(); } catch(err) {}
                            const winId = parseInt(item.dataset.winId);
                            closeWin(winId);
                            setTimeout(updateTaskbarRunningItems, 30);
                        });
                    }
                    
                    // 悬停：显示Aero Peek效果（虚化其他窗口）
                    item.addEventListener('mouseenter', function(e) {
                        const winId = parseInt(this.dataset.winId);
                        clearTimeout(item._peekTimer);
                        item._peekTimer = setTimeout(() => onRunningItemHover(e, winId), 380);
                    });
                    item.addEventListener('mouseleave', function(e) {
                        const winId = parseInt(this.dataset.winId);
                        clearTimeout(item._peekTimer);
                        onRunningItemLeave(e, winId);
                    });
                    
                    area.appendChild(item);
                }
                
                // 更新状态
                item.classList.toggle('focused', w.element.classList.contains('focused'));
                item.classList.toggle('minimized-item', !!w.minimized);
                
                // 更新标题（可能变化）
                const titleEl = item.querySelector('.running-title');
                if (titleEl && titleEl.textContent !== (w.title || '窗口')) {
                    titleEl.textContent = w.title || '窗口';
                }
                const tip = (w.title || '窗口') + (w.minimized ? '（已最小化）' : '');
                if (item.title !== tip) { item.title = tip; item.setAttribute('aria-label', tip); }
            });
            
            // 删除已关闭的窗口图标
            Array.from(area.children).forEach(child => {
                const winId = parseInt(child.dataset.winId);
                if (!existingIds.has(winId)) {
                    clearTimeout(child._peekTimer);
                    child.style.transition = 'opacity 0.15s, transform 0.15s';
                    child.style.opacity = '0';
                    child.style.transform = 'scale(0.8)';
                    setTimeout(() => child.remove(), 150);
                }
            });
        }

        // ============================================
        // 2. 任务栏悬停预览效果（Aero Peek）
        // ============================================

        function onRunningItemHover(event, winId) {
            const win = SYSTEM.windows.find(w => w.id === winId);
            if (!win) return;
            
            // 虚化其他窗口，高亮当前窗口
            SYSTEM.windows.forEach(w => {
                if (w.id === winId && !w.minimized) {
                    w.element.classList.add('aero-peek-highlight');
                    w.element.classList.remove('aero-peek-dim');
                } else if (!w.minimized) {
                    w.element.classList.add('aero-peek-dim');
                    w.element.classList.remove('aero-peek-highlight');
                }
            });
        }

        function onRunningItemLeave(event, winId) {
            clearAeroPeekEffects();
        }

        function clearAeroPeekEffects() {
            SYSTEM.windows.forEach(w => {
                if (!w.element) return;
                w.element.classList.remove('aero-peek-dim');
                w.element.classList.remove('aero-peek-highlight');
                w.element.classList.remove('aero-peek-transparent');
            });
            // 额外兜底：若桌面预览处于悬停态，一并清理标记与延时器，避免关闭动画被透明态覆盖
            if (AeroPeek.previewTimer) {
                clearTimeout(AeroPeek.previewTimer);
                AeroPeek.previewTimer = null;
            }
            if (AeroPeek.previewHideTimer) {
                clearTimeout(AeroPeek.previewHideTimer);
                AeroPeek.previewHideTimer = null;
            }
            AeroPeek.isDesktopPeeking = false;
            AeroPeek.currentPreviewWinId = null;
        }

        // ============================================
        // 3. 桌面预览模式（右下角按钮）
        // ============================================

        function aeroPeekDesktopEnter() {
            if (AeroPeek.isDesktopLocked) return;
            
            AeroPeek.previewTimer = setTimeout(() => {
                AeroPeek.isDesktopPeeking = true;
                SYSTEM.windows.forEach(w => {
                    if (!w.minimized) {
                        w.element.classList.add('aero-peek-transparent');
                    }
                });
            }, 300);
        }

        function aeroPeekDesktopLeave() {
            if (AeroPeek.previewTimer) {
                clearTimeout(AeroPeek.previewTimer);
                AeroPeek.previewTimer = null;
            }
            
            if (AeroPeek.isDesktopPeeking && !AeroPeek.isDesktopLocked) {
                AeroPeek.isDesktopPeeking = false;
                SYSTEM.windows.forEach(w => {
                    w.element.classList.remove('aero-peek-transparent');
                });
            }
        }

        function aeroPeekDesktopClick() {
            if (AeroPeek.isDesktopLocked) {
                // 恢复所有窗口
                AeroPeek.isDesktopLocked = false;
                AeroPeek.isDesktopPeeking = false;
                
                AeroPeek.savedWindowStates.forEach(state => {
                    const win = SYSTEM.windows.find(w => w.id === state.id);
                    if (win) {
                        win.minimized = false;
                        win.element.classList.remove('minimized');
                        win.element.classList.remove('aero-peek-transparent');
                    }
                });
                AeroPeek.savedWindowStates = [];
            } else {
                // 最小化所有窗口
                AeroPeek.isDesktopLocked = true;
                AeroPeek.isDesktopPeeking = false;
                
                AeroPeek.savedWindowStates = SYSTEM.windows
                    .filter(w => !w.minimized)
                    .map(w => ({ id: w.id }));
                
                SYSTEM.windows.forEach(w => {
                    w.element.classList.remove('aero-peek-transparent');
                    if (!w.minimized) {
                        w.minimized = true;
                        w.element.classList.add('minimized');
                    }
                });
            }
            
            updateTaskbarRunningItems();
        }

        // 启动
        window.onload = initKernel;
    </script>

    <!-- ========== 7z-wasm 解压引擎（放在 </body> 前面）========== -->
    <script type="module">
    import SevenZip from 'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js';

    class SevenZipEngine {
        constructor() {
            this.sevenZip = null;
            this.ready = false;
        }

        async init() {
            try {
                this.sevenZip = await SevenZip({
                    print: (t) => console.log('[7z]', t),
                    printErr: (t) => console.error('[7z]', t)
                });
                this.ready = true;
                console.log('✅ 7z-wasm 引擎加载成功');
                return true;
            } catch (e) {
                console.error('❌ 7z-wasm 加载失败:', e);
                return false;
            }
        }

        async extract(arrayBuffer, filename) {
            if (!this.ready) throw new Error('7z引擎未加载');
            
            const data = new Uint8Array(arrayBuffer);
            
            const stream = this.sevenZip.FS.open(filename, 'w+');
            this.sevenZip.FS.write(stream, data, 0, data.length);
            this.sevenZip.FS.close(stream);
            
            this.sevenZip.callMain(['x', '-y', filename]);
            
            try { this.sevenZip.FS.unlink(filename); } catch(e) {}
            
            return this.collectFiles('/');
        }

        collectFiles(path = '/') {
            const files = [];
            const skip = ['tmp', 'home', 'dev', 'proc'];
            try {
                const entries = this.sevenZip.FS.readdir(path);
                for (const entry of entries) {
                    if (entry === '.' || entry === '..' || skip.includes(entry)) continue;
                    const fullPath = path === '/' ? '/' + entry : path + '/' + entry;
                    try {
                        const stat = this.sevenZip.FS.stat(fullPath);
                        const mtime = stat.mtime && stat.mtime.getTime ? stat.mtime.getTime() : (stat.mtime || null);
                        if (this.sevenZip.FS.isDir(stat.mode)) {
                            // 保留目录条目及其原始修改时间
                            files.push({
                                path: fullPath.substring(1),
                                name: entry,
                                dir: true,
                                mtime: mtime
                            });
                            files.push(...this.collectFiles(fullPath));
                        } else if (this.sevenZip.FS.isFile(stat.mode)) {
                            if (!fullPath.match(/\.(7z|zip|rar|tar|gz|bz2|xz|cab)$/i)) {
                                // 保留 7z 解压后文件的原始修改时间
                                files.push({
                                    path: fullPath.substring(1),
                                    name: entry,
                                    data: this.sevenZip.FS.readFile(fullPath),
                                    size: stat.size,
                                    mtime: mtime
                                });
                            }
                        }
                    } catch (e) {}
                }
            } catch (e) {}
            return files;
        }

        cleanup() {
            if (!this.ready) return;
            const files = this.collectFiles('/');
            // 先删除文件，再按路径深度从深到浅删除目录
            for (const f of files) {
                if (f.dir) continue;
                try { this.sevenZip.FS.unlink('/' + f.path); } catch(e) {}
            }
            const dirs = files.filter(f => f.dir).sort((a, b) => b.path.length - a.path.length);
            for (const d of dirs) {
                try { this.sevenZip.FS.rmdir('/' + d.path); } catch(e) {}
            }
        }
    }

    window.sevenZipEngine = new SevenZipEngine();
    window.sevenZipEngine.init().then(ok => {
        window.sevenZipReady = ok;
        console.log('7z引擎状态:', ok ? '就绪' : '失败');
    });
    </script>
