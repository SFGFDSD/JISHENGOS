    <!-- 窗口容器 -->
    <div id="windows-container"></div>

    <script>
        // === 系统内核与状态 ===
        const SYSTEM = {
            windows: [], 
            idCounter: 0, 
            startOpen: false,
            calendarOpen: false,
            fs: null,
            Buffer: null,
            mounted: false,
            // 用户工作区可在 IndexedDB 与 OPFS 间切换；系统配置始终放在 IndexedDB，
            // 这样即使 OPFS 不可用也不会丢失设置或让系统无法启动。
            desktopPath: '/desktop',
            documentsPath: '/documents',
            storageBackend: 'indexeddb',
            opfs: { supported: false, available: false, rootPath: '/opfs' },
            showHiddenFiles: false,
            configPath: '/system/config/wallpaper.cfg',
            settingsPath: '/system/config/settings.json',
            clickBehavior: 'double',
            hiddenSystemApps: [],
            windowCorners: 'round',      // round / small / square
            wallpaperSource: 'custom',   // custom / bing
            customWallpaper: '',         // 你的壁纸（wallpaper.cfg），必应模式下也保持不变
            wallpaperHistory: [],
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear(),
            selectedIcons: [],           
            iconPositions: {},           
            gridSize: 90, 
            iconPositionsPath: '/system/config/icon-positions.json',
            localFolders: {},  // 保留兼容性，实际使用 mountedFolders
            folderWindowStates: {}
        };

        // 内置应用快捷方式的统一清单；系统设置永远不能隐藏，确保用户始终可以恢复配置。
        const SYSTEM_APP_DEFS = [
            { key: 'browser', desktopId: 'app-browser', name: '浏览器', action: 'openBrowser()', icon: 'appBrowser', hideable: true },
            { key: 'explorer', desktopId: 'app-explorer', name: '文件资源管理器', action: 'openFileExplorer()', icon: 'appExplorer', hideable: true },
            { key: 'notepad', desktopId: 'app-notepad', name: '记事本', action: 'openNotepad()', icon: 'appNotepad', hideable: true },
            { key: 'calculator', desktopId: 'app-calc', name: '计算器', action: 'openCalculator()', icon: 'appCalc', hideable: true },
            { key: 'paint', desktopId: 'app-paint', name: '画板', action: 'openPaint()', icon: 'appPaint', hideable: true },
            { key: 'settings', desktopId: 'app-settings', name: '系统设置', action: 'openSettings()', icon: 'appSettings', hideable: false },
            { key: 'v86', desktopId: 'app-v86', name: 'V86 虚拟机', action: 'openV86()', icon: 'appVM', hideable: true },
            { key: 'code', desktopId: 'app-editor', name: 'HTML 编辑器', action: 'openCodeEditor()', icon: 'appCode', hideable: true }
        ];
        const SYSTEM_SETTINGS_STORAGE_KEY = 'JISHENG_OS_SETTINGS';

        // 两个可写用户工作区的固定入口。系统文件仍放在 IndexedDB 根目录的 /system，
        // 因此切换工作区不会影响壁纸、图标设置或系统启动。
        function getStorageDesktopPath(backend) {
            return backend === 'opfs' ? '/opfs/desktop' : '/desktop';
        }
        function getStorageDocumentsPath(backend) {
            return backend === 'opfs' ? '/opfs/documents' : '/documents';
        }
        function storageBackendLabel(backend) {
            return backend === 'opfs' ? 'OPFS' : 'IndexedDB';
        }
        function getExplorerStorageRoots() {
            const roots = ['/desktop'];
            if (SYSTEM.opfs && SYSTEM.opfs.available) roots.push('/opfs/desktop');
            return roots;
        }
        function isPathInStorage(path, backend) {
            const root = getStorageDesktopPath(backend);
            return path === root || String(path || '').startsWith(root + '/');
        }
        function syncStorageMigrationControls() {
            const canUseOPFS = !!(SYSTEM.opfs && SYSTEM.opfs.available);
            document.querySelectorAll('[data-storage-migration-target]').forEach(select => {
                const idb = select.querySelector('option[value="indexeddb"]');
                const opfs = select.querySelector('option[value="opfs"]');
                if (idb) idb.disabled = SYSTEM.storageBackend === 'indexeddb';
                if (opfs) opfs.disabled = SYSTEM.storageBackend === 'opfs' || !canUseOPFS;
                select.disabled = !canUseOPFS;
                const preferred = SYSTEM.storageBackend === 'indexeddb' ? 'opfs' : 'indexeddb';
                select.value = (preferred === 'opfs' && canUseOPFS) ? 'opfs' : 'indexeddb';
            });
            document.querySelectorAll('[data-storage-migration-button]').forEach(button => { button.disabled = !canUseOPFS; });
        }

        function applyWindowCorners() {
            document.documentElement.dataset.winCorners = ['small', 'square'].includes(SYSTEM.windowCorners) ? SYSTEM.windowCorners : 'round';
        }
        function applySystemSettings(rawSettings) {
            const settings = rawSettings && typeof rawSettings === 'object' ? rawSettings : {};
            SYSTEM.clickBehavior = settings.clickBehavior === 'single' ? 'single' : 'double';
            const requestedBackend = settings.storageBackend === 'opfs' ? 'opfs' : 'indexeddb';
            // OPFS 是渐进增强：旧浏览器 / 隐私模式不可用时安全回退到 IndexedDB。
            SYSTEM.storageBackend = requestedBackend === 'opfs' && SYSTEM.opfs && SYSTEM.opfs.available ? 'opfs' : 'indexeddb';
            SYSTEM.desktopPath = getStorageDesktopPath(SYSTEM.storageBackend);
            SYSTEM.documentsPath = getStorageDocumentsPath(SYSTEM.storageBackend);
            SYSTEM.showHiddenFiles = settings.showHiddenFiles === true;
            SYSTEM.wallpaperSource = settings.wallpaperSource === 'bing' ? 'bing' : 'custom';
            SYSTEM.windowCorners = ['round', 'small', 'square'].includes(settings.windowCorners) ? settings.windowCorners : 'round';
            applyWindowCorners();
            const hideableKeys = new Set(SYSTEM_APP_DEFS.filter(app => app.hideable).map(app => app.key));
            SYSTEM.hiddenSystemApps = Array.isArray(settings.hiddenSystemApps)
                ? [...new Set(settings.hiddenSystemApps.filter(key => hideableKeys.has(key)))]
                : [];
        }

        function loadSystemSettings(callback) {
            let localSettings = null;
            try {
                const stored = localStorage.getItem(SYSTEM_SETTINGS_STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) localSettings = parsed;
                }
            } catch (e) { localSettings = null; }

            SYSTEM.fs.readFile(SYSTEM.settingsPath, 'utf8', (err, data) => {
                let fileSettings = null;
                if (!err && data) {
                    try {
                        const parsed = JSON.parse(data);
                        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) fileSettings = parsed;
                    } catch (e) { fileSettings = null; }
                }
                // localStorage 作为快速镜像，文件系统作为持久化备份；重置系统时同步清除两者。
                applySystemSettings(localSettings || fileSettings || {});
                if (!localSettings && fileSettings) {
                    try { localStorage.setItem(SYSTEM_SETTINGS_STORAGE_KEY, JSON.stringify(fileSettings)); } catch (e) {}
                }
                if (typeof callback === 'function') callback();
            });
        }

        function saveSystemSettings() {
            const settings = buildSystemSettingsSnapshot();
            const serialized = JSON.stringify(settings);
            try { localStorage.setItem(SYSTEM_SETTINGS_STORAGE_KEY, serialized); } catch (e) {}
            if (SYSTEM.mounted && SYSTEM.fs) {
                SYSTEM.fs.writeFile(SYSTEM.settingsPath, serialized, err => {
                    if (err) console.warn('保存系统设置失败:', err);
                });
            }
        }

        function isSystemAppHidden(appKey) {
            const app = SYSTEM_APP_DEFS.find(item => item.key === appKey);
            return !!app && app.hideable && SYSTEM.hiddenSystemApps.includes(appKey);
        }

        function applySystemAppVisibility() {
            document.querySelectorAll('[data-system-app]').forEach(el => {
                const hidden = isSystemAppHidden(el.dataset.systemApp);
                el.classList.toggle('system-app-hidden', hidden);
                el.hidden = hidden;
                if (hidden) el.setAttribute('aria-hidden', 'true');
                else el.removeAttribute('aria-hidden');
            });
        }

        function setSystemAppHidden(appKey, hidden) {
            const app = SYSTEM_APP_DEFS.find(item => item.key === appKey);
            if (!app || !app.hideable) return false;
            const hiddenApps = new Set(SYSTEM.hiddenSystemApps);
            if (hidden) hiddenApps.add(appKey);
            else hiddenApps.delete(appKey);
            SYSTEM.hiddenSystemApps = [...hiddenApps];
            saveSystemSettings();
            applySystemAppVisibility();
            if (SYSTEM.mounted) refreshDesktop();
            return true;
        }

        function setClickBehavior(behavior) {
            if (behavior !== 'single' && behavior !== 'double') return;
            SYSTEM.clickBehavior = behavior;
            saveSystemSettings();
        }

        // 切换“桌面”默认写入位置；已有文件绝不会被静默迁移或删除，两个后端仍可在
        // 文件管理器侧栏中同时访问。用户可直接在任一后端目录里新建、上传或粘贴文件。
        async function setStorageBackend(backend) {
            if (backend !== 'indexeddb' && backend !== 'opfs') return;
            if (backend === 'opfs' && !(SYSTEM.opfs && SYSTEM.opfs.available)) {
                Notify.warning('OPFS 不可用', '当前浏览器或运行环境不支持 Origin Private File System，已继续使用 IndexedDB');
                document.querySelectorAll('[data-storage-backend-select]').forEach(select => { select.value = SYSTEM.storageBackend; });
                return;
            }
            try {
                await ensureDir(getStorageDesktopPath(backend));
                await ensureDir(getStorageDocumentsPath(backend));
            } catch (err) {
                Notify.error('切换失败', err && err.message ? err.message : '无法准备存储工作区');
                document.querySelectorAll('[data-storage-backend-select]').forEach(select => { select.value = SYSTEM.storageBackend; });
                return;
            }
            SYSTEM.storageBackend = backend;
            SYSTEM.desktopPath = getStorageDesktopPath(backend);
            SYSTEM.documentsPath = getStorageDocumentsPath(backend);
            saveSystemSettings();
            document.querySelectorAll('[data-storage-backend-select]').forEach(select => { select.value = backend; });
            document.querySelectorAll('[data-storage-current-path]').forEach(el => { el.textContent = SYSTEM.desktopPath; });
            syncStorageMigrationControls();
            refreshDesktop();
            refreshOpenFileManagers();
            Notify.success('默认存储已切换', `桌面新文件将保存到 ${storageBackendLabel(backend)}。未进行文件复制，现有文件仍留在原后端。`);
            refreshAllStorageDashboards();
        }

        // 默认后端切换与数据复制严格分离：只有用户点击此操作并二次确认时才会复制。
        // 使用 copyFolderRecursive，它会对每个文件及目录持久化源修改日期（包括 OPFS）。
        async function copyCurrentWorkspaceToBackend(targetBackend) {
            const sourceBackend = SYSTEM.storageBackend;
            if (targetBackend !== 'indexeddb' && targetBackend !== 'opfs') return;
            if (targetBackend === sourceBackend) {
                Notify.info('无需复制', '源后端与目标后端相同。');
                return;
            }
            if (targetBackend === 'opfs' && !(SYSTEM.opfs && SYSTEM.opfs.available)) {
                Notify.warning('OPFS 不可用', '当前浏览器或运行环境不支持 Origin Private File System。');
                return;
            }
            const sourcePath = getStorageDesktopPath(sourceBackend);
            const targetPath = getStorageDesktopPath(targetBackend);
            const confirmed = await SysDialog.confirm({
                title: '复制工作区', icon: 'uiCopy', okText: '开始复制',
                message: `将 ${storageBackendLabel(sourceBackend)} 工作区中的内容复制到 ${storageBackendLabel(targetBackend)}。源文件会保留，目标同名文件会被覆盖；所有文件和文件夹的修改日期将一并保留。此操作不会切换默认后端。`
            });
            if (!confirmed) return;
            try {
                await ensureDir(targetPath);
                await new Promise((resolve, reject) => copyFolderRecursive(sourcePath, targetPath, err => err ? reject(err) : resolve()));
                invalidateAllDirSizes();
                refreshOpenFileManagers();
                refreshDesktop();
                refreshAllStorageDashboards();
                Notify.success('工作区复制完成', `已从 ${storageBackendLabel(sourceBackend)} 复制到 ${storageBackendLabel(targetBackend)}，修改日期已保留；默认后端未改变。`);
            } catch (err) {
                Notify.error('工作区复制失败', err && err.message ? err.message : '复制过程中发生错误；源文件没有被删除。');
            }
        }

        function setShowHiddenFiles(show) {
            SYSTEM.showHiddenFiles = !!show;
            saveSystemSettings();
            refreshOpenFileManagers();
            Notify.info(SYSTEM.showHiddenFiles ? '已显示系统与隐藏文件' : '已隐藏系统与隐藏文件');
        }

        // 所有已打开的资源管理器实时应用侧栏/隐藏文件设置，不要求用户重新打开窗口。
        function refreshOpenFileManagers() {
            Object.keys(SYSTEM.folderWindowStates || {}).forEach(windowId => {
                const sidebar = document.getElementById('folder-sidebar-' + windowId);
                if (sidebar && typeof buildFolderSidebar === 'function') sidebar.innerHTML = buildFolderSidebar(windowId);
                if (typeof updateFolderBreadcrumb === 'function') updateFolderBreadcrumb(windowId);
                if (typeof renderFolderContent === 'function') renderFolderContent(windowId);
            });
        }

        function toggleWinFullscreen(id, type) {
            const win = document.getElementById('win-' + id);
            if (!win) return;

            const isManga = type === 'manga';
            const isEntering = !win.classList.contains('truly-fullscreen');

            if (isEntering) {
                win.classList.add('truly-fullscreen');
                if (isManga) win.classList.add('manga-full');
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            } else {
                win.classList.remove('truly-fullscreen');
                win.classList.remove('manga-full');
                if (document.fullscreenElement) document.exitFullscreen();
            }
        }

        let currentDragFile = null;
        let dragFileReady = false;

        let longPressTimer = null;
        let longPressTriggered = false;

        // === 剪贴板系统 ===
        const Clipboard = {
            items: [], // { path, filename, type: 'copy'|'cut', sourceWindowId? }
            isCut: false,
            
            clear() {
                this.items = [];
                this.isCut = false;
            },
            
            add(item) {
                // 如果已存在相同路径的项目，先移除
                this.items = this.items.filter(i => i.path !== item.path);
                this.items.push(item);
            },
            
            setCutMode(isCut) {
                this.isCut = isCut;
            },
            
            getItems() {
                return this.items;
            },
            
            hasItems() {
                return this.items.length > 0;
            },
            
            removeByPath(path) {
                this.items = this.items.filter(i => i.path !== path);
            }
        };

        const nativeDragHelper = document.createElement('div');
        nativeDragHelper.id = 'native-drag-helper';
        nativeDragHelper.draggable = true;
        nativeDragHelper.style.cssText = 'position:fixed;width:80px;height:90px;opacity:0;z-index:20000;pointer-events:auto;display:none;cursor:move;';
        document.body.appendChild(nativeDragHelper);

        function getClientXY(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            if (e.changedTouches && e.changedTouches.length > 0) {
                return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        // 预设壁纸（均为 Unsplash，w=1920）
        const WALLPAPER_PRESETS = [
            { name: '金色群山', url: 'https://images.unsplash.com/photo-1791534837966-2a7b42afc33e?w=1920' },
            { name: '山脊小屋', url: 'https://images.unsplash.com/photo-1791534907557-dca09f734860?w=1920' },
            { name: '湖面晚霞', url: 'https://images.unsplash.com/photo-1518418248320-a4de2fbc87c2?w=1920' },
            { name: '大气层边缘', url: 'https://images.unsplash.com/photo-1614121181207-4b6c334d353d?w=1920' },
            { name: '海岸暮色', url: 'https://images.unsplash.com/photo-1506102383123-c8ef1e872756?w=1920' },
            { name: '沙丘', url: 'https://images.unsplash.com/photo-1510075644440-2c2b60679e1a?w=1920' },
            { name: '地球夜景', url: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920' },
            { name: '云层之上', url: 'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=1920' }
        ];
        const wallpapers = WALLPAPER_PRESETS.map(p => p.url);

        // === 通知系统（任务栏内嵌胶囊）===
        // - 胶囊锚定在托盘左侧（CSS：#taskbar-notify-area 位于 .system-tray 内，right:100%），时钟变宽也不会错位
        // - 同一时刻只显示一条；新通知交叉淡入淡出（旧胶囊脱离文档流，不会把新胶囊挤歪）
        // - 相同内容连续出现时合并为 ×N，而不是反复闪烁
        // - 按类型给停留时间（错误更久）；悬停暂停；文字放不下时悬停/轻点向上展开全文
        // - 文本一律按纯文本渲染：调用方可能传入已转义的文本（&amp; 等），先解码实体再用 textContent，
        //   既不会显示成 "&amp;"，也不会把文件名里的 <img onerror> 之类当 HTML 执行
        const Notify = {
            container: null,
            current: null,
            DURATION: { info: 3200, success: 3200, warning: 5000, error: 6500 },

            init() {
                this.container = document.getElementById('taskbar-notify-area');
                if (this.container) {
                    this.container.setAttribute('role', 'status');
                    this.container.setAttribute('aria-live', 'polite');
                }
            },

            _text(v) {
                if (v == null || v === '') return '';
                const t = document.createElement('textarea');   // RCDATA：只解码实体，不解析标签
                t.innerHTML = String(v);
                return t.value;
            },

            // 胶囊最宽只能到开始按钮右侧，避免盖住开始按钮
            _fit() {
                const tray = this.container && this.container.parentElement;
                if (!tray) return;
                const room = tray.getBoundingClientRect().left - 60;
                this.container.style.maxWidth = Math.max(140, Math.min(560, room)) + 'px';
            },

            dismiss(el) {
                if (!el || el.classList.contains('hiding')) return;
                el.classList.remove('expanded');
                el.classList.add('hiding');
                if (this.current === el) this.current = null;
                setTimeout(() => el.remove(), 260);
            },

            show({ title, message, type = 'info', duration } = {}) {
                if (!this.container) this.init();
                if (!this.container) return null;
                if (!this.DURATION[type]) type = 'info';
                const t = this._text(title), m = this._text(message);
                const dur = Math.max(1200, Number(duration) || this.DURATION[type]);
                const key = type + '\u0000' + t + '\u0000' + m;

                const cur = this.current;
                if (cur && cur._key === key && cur.isConnected && !cur.classList.contains('hiding')) {
                    cur._count += 1;
                    const badge = cur.querySelector('.tb-notify-count');
                    badge.textContent = '×' + cur._count;
                    badge.hidden = false;
                    const bar = cur.querySelector('.tb-notify-progress');
                    bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
                    cur.classList.remove('bump'); void cur.offsetWidth; cur.classList.add('bump');
                    return cur;
                }
                if (cur) this.dismiss(cur);
                this._fit();

                const el = document.createElement('div');
                el.className = 'tb-notification ' + type;
                el._key = key; el._count = 1;
                el.style.setProperty('--tbn-dur', dur + 'ms');
                const iconName = 'ui' + type.charAt(0).toUpperCase() + type.slice(1);
                el.innerHTML = `<span class="tb-notify-badge">${icon(iconName, 'tb-notify-icon')}</span>`
                    + `<span class="tb-notify-text"><span class="tb-notify-title"></span><span class="tb-notify-msg"></span></span>`
                    + `<span class="tb-notify-count" hidden></span><span class="tb-notify-progress"></span>`;
                el.querySelector('.tb-notify-title').textContent = t;
                const msgEl = el.querySelector('.tb-notify-msg');
                if (m) msgEl.textContent = m; else msgEl.remove();

                const text = el.querySelector('.tb-notify-text');
                const truncated = () => text.scrollWidth > text.clientWidth + 1;
                el.addEventListener('mouseenter', () => { if (!el.classList.contains('hiding') && truncated()) el.classList.add('expanded'); });
                el.addEventListener('mouseleave', () => el.classList.remove('expanded'));
                el.addEventListener('click', e => {
                    e.stopPropagation();
                    // 触屏没有悬停：第一次轻点展开全文，第二次关闭
                    if (!el.classList.contains('expanded') && truncated()) { el.classList.add('expanded'); return; }
                    this.dismiss(el);
                });
                el.querySelector('.tb-notify-progress').addEventListener('animationend', () => this.dismiss(el));

                this.container.appendChild(el);
                this.current = el;
                return el;
            },

            success(title, message) { return this.show({ title, message, type: 'success' }); },
            error(title, message) { return this.show({ title, message, type: 'error' }); },
            warning(title, message) { return this.show({ title, message, type: 'warning' }); },
            info(title, message) { return this.show({ title, message, type: 'info' }); }
        };

        // === 系统对话框（v7）：替代浏览器原生 prompt / confirm / alert（原生弹窗与系统风格不符）===
        // 全部返回 Promise，调用处需要 await：
        //   SysDialog.prompt({ title, message, label, value, placeholder, okText, icon, validate })  -> 字符串 / null(取消)
        //   SysDialog.confirm({ title, message, okText, cancelText, danger, icon })                 -> true / false
        //   SysDialog.alert({ title, message, okText, icon })                                        -> undefined
        //   SysDialog.form({ title, message, icon, okText, fields, validate })                        -> { 字段名: 值 } / null(取消)
        //     fields: [{ type: 'text'|'radio'|'select', name, label, value, placeholder, options:[{value,label,desc,icon}], showIf(values), emptyText }]
        // 图标一律取自集中式图标库 icon(name)。
        const SysDialog = (() => {
            let queue = Promise.resolve();   // 同一时刻只显示一个对话框，其余排队
            const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

            function fieldHtml(f, i) {
                const id = `sys-dialog-field-${i}`;
                const label = f.label ? `<label class="sys-dialog-label" for="${id}">${esc(f.label)}</label>` : '';
                if (f.type === 'radio') {
                    return `<div class="sys-dialog-field" data-name="${esc(f.name)}">${label}<div class="sys-dialog-radios">${(f.options || []).map(o => `
                        <label class="sys-dialog-radio${o.value === f.value ? ' checked' : ''}">
                            <input type="radio" name="${esc(f.name)}" value="${esc(o.value)}"${o.value === f.value ? ' checked' : ''}>
                            <span class="sys-dialog-radio-dot"></span>
                            <span class="sys-dialog-radio-text">
                                <span class="sys-dialog-radio-title">${o.icon ? icon(o.icon) : ''}<span>${esc(o.label)}</span></span>
                                ${o.desc ? `<span class="sys-dialog-radio-desc">${esc(o.desc)}</span>` : ''}
                            </span>
                        </label>`).join('')}</div></div>`;
                }
                if (f.type === 'select') {
                    const opts = f.options || [];
                    return `<div class="sys-dialog-field" data-name="${esc(f.name)}">${label}${opts.length
                        ? `<select class="sys-dialog-input" id="${id}" name="${esc(f.name)}">${opts.map(o => `<option value="${esc(o.value)}"${o.value === f.value ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`
                        : `<div class="sys-dialog-empty">${esc(f.emptyText || '没有可选项')}</div>`}</div>`;
                }
                return `<div class="sys-dialog-field" data-name="${esc(f.name)}">${label}<input class="sys-dialog-input" id="${id}" name="${esc(f.name)}" type="text" value="${esc(f.value)}" placeholder="${esc(f.placeholder || '')}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
            }

            function open(opts) {
                return new Promise(resolve => {
                    const fields = opts.fields || [];
                    const overlay = document.createElement('div');
                    overlay.className = 'sys-dialog-overlay';
                    overlay.innerHTML = `
                        <div class="sys-dialog" role="dialog" aria-modal="true">
                            <div class="sys-dialog-head">
                                ${opts.icon ? `<div class="sys-dialog-icon${opts.danger ? ' danger' : ''}">${icon(opts.icon)}</div>` : ''}
                                <div class="sys-dialog-titles">
                                    <div class="sys-dialog-title">${esc(opts.title || '提示')}</div>
                                    ${opts.message ? `<div class="sys-dialog-msg">${esc(opts.message)}</div>` : ''}
                                </div>
                            </div>
                            ${fields.length ? `<div class="sys-dialog-body">${fields.map(fieldHtml).join('')}</div>` : ''}
                            <div class="sys-dialog-error" hidden></div>
                            <div class="sys-dialog-actions">
                                ${opts.cancelText === null ? '' : `<button type="button" class="sys-dialog-btn" data-act="cancel">${esc(opts.cancelText || '取消')}</button>`}
                                <button type="button" class="sys-dialog-btn primary${opts.danger ? ' danger' : ''}" data-act="ok">${esc(opts.okText || '确定')}</button>
                            </div>
                        </div>`;
                    document.body.appendChild(overlay);
                    const box = overlay.querySelector('.sys-dialog');
                    const errEl = overlay.querySelector('.sys-dialog-error');
                    const prevFocus = document.activeElement;
                    let closed = false;

                    const values = () => {
                        const v = {};
                        fields.forEach(f => {
                            if (f.type === 'radio') { const c = overlay.querySelector(`input[name="${f.name}"]:checked`); v[f.name] = c ? c.value : null; }
                            else { const el = overlay.querySelector(`[name="${f.name}"]`); v[f.name] = el ? (f.type === 'text' ? el.value.trim() : el.value) : null; }
                        });
                        return v;
                    };
                    const applyVisibility = () => {
                        const v = values();
                        fields.forEach(f => {
                            if (typeof f.showIf !== 'function') return;
                            const el = overlay.querySelector(`.sys-dialog-field[data-name="${f.name}"]`);
                            if (el) el.hidden = !f.showIf(v);
                        });
                    };
                    const close = result => {
                        if (closed) return;
                        closed = true;
                        document.removeEventListener('keydown', onKey, true);
                        overlay.classList.remove('open');
                        setTimeout(() => overlay.remove(), 170);
                        if (prevFocus && typeof prevFocus.focus === 'function') { try { prevFocus.focus({ preventScroll: true }); } catch (e) {} }
                        resolve(result);
                    };
                    const ok = () => {
                        const v = values();
                        if (typeof opts.validate === 'function') {
                            const msg = opts.validate(v);
                            if (msg) {
                                errEl.textContent = msg;
                                errEl.hidden = false;
                                box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
                                const bad = overlay.querySelector('.sys-dialog-field:not([hidden]) input[type="text"]');
                                if (bad) bad.focus();
                                return;
                            }
                        }
                        close(v);
                    };
                    const onKey = e => {
                        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(null); }
                        else if (e.key === 'Enter' && !(e.target && e.target.tagName === 'TEXTAREA')) { e.preventDefault(); e.stopPropagation(); ok(); }
                    };
                    overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(null); });
                    overlay.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => b.dataset.act === 'ok' ? ok() : close(null)));
                    overlay.querySelectorAll('input[type="radio"]').forEach(r => r.addEventListener('change', () => {
                        overlay.querySelectorAll('.sys-dialog-radio').forEach(l => l.classList.toggle('checked', l.querySelector('input').checked));
                        errEl.hidden = true;
                        applyVisibility();
                    }));
                    overlay.querySelectorAll('.sys-dialog-input').forEach(i => i.addEventListener('input', () => { errEl.hidden = true; }));
                    document.addEventListener('keydown', onKey, true);
                    applyVisibility();

                    requestAnimationFrame(() => {
                        overlay.classList.add('open');
                        const first = overlay.querySelector('.sys-dialog-field:not([hidden]) input[type="text"], .sys-dialog-field:not([hidden]) select');
                        if (first) {
                            first.focus();
                            if (first.tagName === 'INPUT') {
                                // 文件名默认只选中主名、不选扩展名（与桌面系统的重命名习惯一致）
                                const f = fields.find(x => x.name === first.name);
                                const dot = first.value.lastIndexOf('.');
                                if (f && f.selectStem !== false && dot > 0) first.setSelectionRange(0, dot); else first.select();
                            }
                        } else {
                            const okBtn = overlay.querySelector('[data-act="ok"]');
                            if (okBtn) okBtn.focus();
                        }
                    });
                });
            }

            const enqueue = opts => { const p = queue.then(() => open(opts)); queue = p.catch(() => {}); return p; };
            return {
                form: opts => enqueue(opts),
                prompt: opts => enqueue({
                    ...opts,
                    fields: [{ type: 'text', name: 'value', label: opts.label || '', value: opts.value || '', placeholder: opts.placeholder || '', selectStem: opts.selectStem }],
                    validate: v => typeof opts.validate === 'function' ? opts.validate(v.value) : null
                }).then(r => r ? r.value : null),
                confirm: opts => enqueue({ ...opts, fields: [] }).then(r => r !== null),
                alert: opts => enqueue({ ...opts, fields: [], cancelText: null }).then(() => undefined),
                // 文件 / 文件夹名称校验：返回错误文案，合法时返回 null
                nameValidator: (label = '名称') => v => {
                    const t = (v || '').trim();
                    if (!t) return `${label}不能为空`;
                    if (t === '.' || t === '..') return `${label}无效`;
                    if (/[\\/]/.test(t)) return `${label}不能包含 / 或 \\`;
                    if (/[\u0000-\u001f]/.test(t)) return `${label}含有非法控制字符`;
                    return null;
                }
            };
        })();
        window.SysDialog = SysDialog;

        function addFolderToZipSync(zip, folderPath, callback) {
            SYSTEM.fs.readdir(folderPath, (err, files) => {
                if (err || files.length === 0) {
                    callback();
                    return;
                }
                let pending = files.length;
                files.forEach(file => {
                    const filePath = folderPath + '/' + file;
                    SYSTEM.fs.stat(filePath, (err, stats) => {
                        if (err) {
                            pending--;
                            if (pending === 0) callback();
                            return;
                        }
                        if (stats.isDirectory()) {
                            // 修复：保留文件夹原始修改时间，避免解压后全部变为最新
                            const folderDate = prepareZipWriteDate(new Date(stats.mtime || Date.now()));
                            try { zip.file(file + "/", "", { dir: true, date: folderDate }); } catch(e) {}
                            const subFolder = zip.folder(file);
                            try { const fe = zip.files[file + "/"]; if (fe) fe.date = folderDate; } catch(e) {}
                            addFolderToZipSync(subFolder, filePath, () => {
                                pending--;
                                if (pending === 0) callback();
                            });
                        } else {
                            SYSTEM.fs.readFile(filePath, (err, data) => {
                                // 保留原始修改时间写入 zip 条目，否则 JSZip 默认用当前时间
                                if (!err) zip.file(file, data, { date: prepareZipWriteDate(new Date(stats.mtime || Date.now())) });
                                pending--;
                                if (pending === 0) callback();
                            });
                        }
                    });
                });
            });
        }

        // 悬停预读：停留 250ms 才开始，只预读 ≤16MB 的文件；文件夹不在悬停时打包（以前划过文件夹就会把整个文件夹 DEFLATE 压缩一遍）。
        // 长按（400ms）进入原生拖出时仍会对按住的项目完整预加载，包括文件夹。
        let hoverPreloadTimer = null;
        const HOVER_PRELOAD_MAX = 16 * 1024 * 1024;
        function hoverPreloadForDrag(filepath, filename) {
            cancelHoverPreload();
            hoverPreloadTimer = setTimeout(() => {
                hoverPreloadTimer = null;
                SYSTEM.fs.stat(filepath, (err, stats) => {
                    if (err || stats.isDirectory() || (stats.size || 0) > HOVER_PRELOAD_MAX) return;
                    preloadFileForDrag(filepath, filename, () => {});
                });
            }, 250);
        }
        function cancelHoverPreload() { if (hoverPreloadTimer) { clearTimeout(hoverPreloadTimer); hoverPreloadTimer = null; } }
        let preloadSeq = 0;
        function preloadFileForDrag(filepath, filename, callback) {
            const seq = ++preloadSeq;   // 只有最新一次预加载的结果有效，避免慢的旧请求覆盖当前拖拽的文件
            SYSTEM.fs.stat(filepath, (err, stats) => {
                if (err || seq !== preloadSeq) {
                    callback(false);
                    return;
                }
                const mtime = stats.mtime ? +new Date(stats.mtime) : 0;
                if (dragFileReady && currentDragFile && currentDragFile.srcPath === filepath && currentDragFile._mtime === mtime && currentDragFile.originalName === filename) {
                    callback(true);
                    return;
                }
                if (stats.isDirectory()) {
                    const zip = new JSZip();
                    const folderDate = prepareZipWriteDate(new Date(stats.mtime || Date.now()));
                    try { zip.file(filename + "/", "", { dir: true, date: folderDate }); } catch(e) {}
                    const rootFolder = zip.folder(filename);
                    try { const fe = zip.files[filename + "/"]; if (fe) fe.date = folderDate; } catch(e) {}
                    addFolderToZipSync(rootFolder, filepath, () => {
                        zip.generateAsync({ type: 'blob', compression: 'DEFLATE' })
                        .then(blob => {
                            if (seq !== preloadSeq) { callback(false); return; }
                            currentDragFile = {
                                blob: blob,
                                filename: filename + '.zip',
                                originalName: filename,
                                mtime: stats.mtime || Date.now(),
                                _mtime: mtime,
                                srcPath: filepath
                            };
                            dragFileReady = true;
                            callback(true);
                        }, () => callback(false));
                    });
                } else {
                    SYSTEM.fs.readFile(filepath, (err, data) => {
                        if (err || seq !== preloadSeq) {
                            callback(false);
                            return;
                        }
                        currentDragFile = {
                            blob: new Blob([data]),
                            filename: filename,
                            originalName: filename,
                            mtime: stats.mtime || Date.now(),
                            _mtime: mtime,
                            srcPath: filepath
                        };
                        dragFileReady = true;
                        callback(true);
                    });
                }
            });
        }

        function handleNativeDragStart(e, filename) {
            // 预加载的必须正是正在拖的这个项目，否则宁可不带文件数据，也不能把别的文件拖出去
            if (!dragFileReady || !currentDragFile || (filename && currentDragFile.originalName !== filename)) {
                SYSTEM._internalNativeDrag = true;
                try { e.dataTransfer.setData('application/x-jisheng', '1'); } catch(_) {}
                e.dataTransfer.setData('text/plain', filename);
                return;
            }
            const blob = currentDragFile.blob;
            const finalFilename = currentDragFile.filename;
            const file = new File([blob], finalFilename, {
                type: 'application/octet-stream',
                lastModified: currentDragFile.mtime || Date.now()
            });
            e.dataTransfer.effectAllowed = 'copyMove';
            // 标记：这是本系统发起的"拖出到真实桌面"，如果又被放回系统内部应当什么都不做
            SYSTEM._internalNativeDrag = true;
            try { e.dataTransfer.setData('application/x-jisheng', '1'); } catch(_) {}
            if (e.dataTransfer.items && e.dataTransfer.items.add) {
                e.dataTransfer.items.add(file);
            }
            // 修复内存泄漏：每次拖出都会为整个文件建一个 Blob URL，原来从不释放（拖 10 次 200 MB 文件 = 2 GB）。
            // 现在新的拖动开始时释放上一个；拖动结束 60 秒后（浏览器早已取走数据）也会释放。
            if (SYSTEM._dragOutUrl) { URL.revokeObjectURL(SYSTEM._dragOutUrl); SYSTEM._dragOutUrl = null; }
            const url = URL.createObjectURL(blob);
            SYSTEM._dragOutUrl = url;
            e.dataTransfer.setData('DownloadURL', 'application/octet-stream:' + finalFilename + ':' + url);
            e.dataTransfer.setData('text/plain', JSON.stringify({
                filename: currentDragFile.originalName,
                srcPath: currentDragFile.srcPath || (SYSTEM.desktopPath + '/' + currentDragFile.originalName)
            }));
            e.target.style.opacity = '0.4';
            console.log('→ 拖拽到真实桌面');
        }

        function handleNativeDragEnd(e) {
            e.target.style.opacity = '1';
            if (SYSTEM._dragOutUrl) { const u = SYSTEM._dragOutUrl; setTimeout(() => { URL.revokeObjectURL(u); if (SYSTEM._dragOutUrl === u) SYSTEM._dragOutUrl = null; }, 60000); }
            SYSTEM._internalNativeDrag = false;
            dragFileReady = false;
            currentDragFile = null;
        }

        // 是否是"本系统自己发起的原生拖出"。
        // 这种拖拽的唯一目的地是浏览器外的真实桌面；放回系统内部时应当什么都不发生，
        // 而不是把文件当成外部文件重新导入一遍（会误报"导入完成"）。
        function isInternalNativeDrag(e) {
            try {
                const types = e && e.dataTransfer && e.dataTransfer.types;
                if (types && Array.prototype.indexOf.call(types, 'application/x-jisheng') !== -1) return true;
            } catch(_) {}
            return !!SYSTEM._internalNativeDrag;
        }

        // Native IndexedDB filesystem: it directly reads and writes the existing v3 key/value
        // volume format, with no third-party filesystem runtime and no data-copy migration.
        class NativeBuffer extends Uint8Array {
            static from(value, encoding) {
                if (typeof value === 'string') {
                    if (encoding === 'base64') {
                        const binary = atob(value);
                        const out = new NativeBuffer(binary.length);
                        for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
                        return out;
                    }
                    if (encoding === 'hex') {
                        const out = new NativeBuffer(Math.floor(value.length / 2));
                        for (let i = 0; i < out.length; i++) out[i] = parseInt(value.slice(i * 2, i * 2 + 2), 16) || 0;
                        return out;
                    }
                    return new NativeBuffer(new TextEncoder().encode(value));
                }
                if (value instanceof ArrayBuffer) return new NativeBuffer(new Uint8Array(value));
                if (ArrayBuffer.isView(value)) return new NativeBuffer(new Uint8Array(value.buffer, value.byteOffset, value.byteLength));
                if (value && value.data && Array.isArray(value.data)) return new NativeBuffer(value.data);
                return new NativeBuffer(value || 0);
            }
            static isBuffer(value) { return value instanceof NativeBuffer; }
            toString(encoding = 'utf8') {
                if (encoding === 'base64') {
                    let binary = '';
                    for (let i = 0; i < this.length; i += 0x8000) {
                        binary += String.fromCharCode.apply(null, this.subarray(i, Math.min(i + 0x8000, this.length)));
                    }
                    return btoa(binary);
                }
                if (encoding === 'hex') return Array.from(this, b => b.toString(16).padStart(2, '0')).join('');
                if (encoding === 'ascii' || encoding === 'latin1') return Array.from(this, b => String.fromCharCode(b)).join('');
                return new TextDecoder(encoding === 'utf-8' ? 'utf-8' : encoding).decode(this);
            }
        }
        window.Buffer = NativeBuffer;

        class NativeStats {
            constructor(record) {
                this.size = record.kind === 'file' ? (record.size || 0) : 4096;
                this.mtimeMs = Number(record.mtime) || 0;
                this.mtime = new Date(this.mtimeMs || 0);
                this.atime = new Date(Number(record.atime) || this.mtimeMs || 0);
                this.ctime = new Date(Number(record.ctime) || this.mtimeMs || 0);
                this.mode = record.kind === 'dir' ? 0o40777 : 0o100666;
                this.blocks = Math.ceil(this.size / 512);
                this.isFile = () => record.kind === 'file';
                this.isDirectory = () => record.kind === 'dir';
            }
        }

        // ======================== JISHENG FS 引擎 ========================
        // 直接读写现有的 JISHENG_OS_V3 卷（与 BrowserFS 相同的 v3 格式：inode = 30 字节头 + ASCII id，
        // 目录 = JSON {名字: inode 键}，文件 = ArrayBuffer）。不升级数据库版本、不改数据格式，

        //  · 一个事务里可以执行多步操作（_batch / _rmTree / _copyTree / _mkdirp / _du），

        class JfsRetry extends Error {}

        class JfsTx {

                this.loading = new Map();   // 正在加载的目录（并发查找同一目录时只读一次）
                this.purged = [];           // 提交后要从缓存里清掉整棵子树的路径

                        this.dirs.set(path, rec);

                const existing = this.dirs.get(path);
                if (existing) return existing;
                // 从磁盘解析出来的目录是本事务独有的对象，可以直接修改；来自缓存的目录修改前要先复制（见 own）。
                const rec = { key, inode, listing, raw, own: this.mode === 'readwrite', dirty: false, inodeDirty: false };
                this.dirs.set(path, rec);

            }

            async dirAt(path) {

            }
            async nodeAt(path) {
                if (path === '/') { const root = await this.dirAt('/'); return { key: '/', inode: root.inode }; }
                const known = this.dirs.get(path);

                const parent = await this.dirAt(this.fs._parent(path)).catch(error => {
                    if (error && error.code === 'ENOENT') throw this.fs._error('ENOENT', path);

            own(rec) {
                if (!rec.own) {
                    rec.listing = NativeFileSystem._cloneListing(rec.listing);
                    rec.inode = Object.assign({}, rec.inode);
                    rec.own = true;
                }

            }
            // 与旧版 _writeParent 相同：目录内容变化时把目录的 atime/mtime 设为当前时间。

                rec.inode.mtime = now;

                } catch (_) {}

            }
            dropDirs(path) {
                const prefix = path === '/' ? '/' : path + '/';
                for (const p of Array.from(this.dirs.keys())) if (p === path || p.startsWith(prefix)) this.dirs.delete(p);
                this.purged.push(path);
            }
            rekeyDirs(from, to) {
                const prefix = from + '/';
                const moved = [];

                }

                        this.put(rec.raw, rec.inode.id);

        }

        class NativeFileSystem {
            constructor(db) {
                this._db = db;
                this._storeName = 'JISHENG_OS_V3';
                this._mounts = new Map();
                this._dirCache = new Map();      // path -> { key, inode, listing, n }
                this._dirCacheEntries = 0;
                this._dirCacheMaxDirs = 3000;
                this._dirCacheMaxEntries = 200000;

            static _bytes(value) {

                    mode: view.getUint16(4, true),

                    mtime: view.getFloat64(14, true),
                    ctime: view.getFloat64(22, true)

                    if (name === '__proto__') Object.defineProperty(out, name, { value: listing[name], enumerable: true, configurable: true, writable: true });

                    t.put(JFS_TEXT_ENCODER.encode('{}').buffer, inode.id);

                    return true;

            static _done(promise, callback, map) {

            }

            // ---------- 变更事件 ----------

            onCommit(hook) { this._hooks.add(hook); return () => this._hooks.delete(hook); }

            // ---------- 挂载 ----------
            static _fsaErrorCode(error, method) {

                    case 'NotFoundError': return 'ENOENT';
                    case 'TypeMismatchError': return method === 'readFile' || method === 'writeFile' || method === 'unlink' ? 'EISDIR' : 'ENOTDIR';
                    case 'InvalidModificationError': return 'ENOTEMPTY';

                        if (code) { try { Object.defineProperty(err, 'code', { value: code, configurable: true }); } catch (_) {} }
                    } else if (change) this._emit([change]);
                    if (callback) callback(err, ...rest);

            }

            // ---------- 基本操作（事务内） ----------
            async _opMkdir(t, path) {

                const name = this._base(path);

                    const newInodeKey = NativeFileSystem._newId();

            async _opUnlink(t, path) {

                const inodeKey = this._entryKey(parent.listing, name);
                if (!inodeKey) throw this._error('ENOENT', path);

            async _opRmdir(t, path) {

                const inodeKey = this._entryKey(parent.listing, name);
                if (!inodeKey) throw this._error('ENOENT', path);
                const inode = await t.inode(inodeKey);
                if (!inode) throw this._error('ENOENT', path);

                const listing = self ? self.listing : await t.listingOf(inode, path);

            async _opRename(t, from, to) {

                if (from === '/' || to === '/') throw this._error('EINVAL', from);
                if (to.startsWith(from + '/')) throw this._error('EINVAL', to);
                const fromParentPath = this._parent(from), toParentPath = this._parent(to);
                const sourceParent = await t.dirAt(fromParentPath);
                const targetParent = fromParentPath === toParentPath ? sourceParent : await t.dirAt(toParentPath);
                const fromName = this._base(from), toName = this._base(to);

                if (targetKey) {

                    if (!targetInode) throw this._error('ENOENT', to);

                    if (targetIsDir) {

            async _opUtimes(t, path, atime, mtime) {

            // 收集整棵子树的 inode（只读 inode，不读文件内容）。
            async _collectTree(t, path, inode, out, rel) {

                    const item = { rel: rel ? rel + '/' + name : name, path: path === '/' ? '/' + name : path + '/' + name, key: listing[name], inode: child, isDir: NativeFileSystem._isDir(child) };
                    out.push(item);

                        if (op.mtime != null) await this._opUtimes(t, path, op.atime != null ? op.atime : op.mtime, op.mtime);

            //  · 默认：某一步失败只记录错误，继续执行后面的步骤；

            _batch(ops, options = {}) {

            }

            // 文件夹总大小：一个只读事务遍历 inode，不读文件内容。
            _du(path) {

            // 单个文件复制：一个事务读源、写目标，并把目标时间设为 mtimeMs（与 读→写→utimes 结果相同）。
            _copyFile(src, dst, mtimeMs) {

            // 递归复制（合并到已存在的目标目录）。语义与旧的 copyFolderRecursive 相同：

            // 文件内容分段提交（每段最多约 48 MB / 1500 项），避免一次占用过多内存。
            async _copyTree(src, dst, mtimeOf, onProgress) {

                });

                await this._tx('readwrite', async t => {

                    let bytes = 0;
                    while (index < plan.items.length && chunk.length < MAX_ITEMS) {
                        const item = plan.items[index];
                        const size = item.isDir ? 0 : (item.inode.size || 0);

                    }
                    await this._tx('readwrite', async t => {

                            const target = to === '/' ? '/' + item.rel : to + '/' + item.rel;
                            if (item.isDir) {

                                catch (error) {
                                    let ok = false;

                                    }
                                    if (!ok) { note(error); skippedDirs.push(item.rel); continue; }

                dirTimes.sort((a, b) => b[0].length - a[0].length);
                if (rootMs) dirTimes.push([to, rootMs]);
                await this._tx('readwrite', async t => {
                    for (const [path, ms] of dirTimes) {
                        if (!ms) continue;
                        try { await this._opUtimes(t, path, ms, ms); pins.push([path, ms]); } catch (error) { note(error); }
                    }
                });
                return { firstError, pins, count: plan.items.length };
            }

            // ---------- 兼容 Node 风格的回调 API ----------
            // 性能：同一轮事件循环里的多个 stat 合并到一个只读事务；同一目录的索引只读一次（命中缓存时不读）。
            stat(path, callback) {

                };
                this._tx('readonly', async t => {
                    await Promise.all(reqs.map(async req => {
                        try { req.result = { stats: NativeFileSystem._statsOf((await t.nodeAt(req.path)).inode) }; }
                        catch (error) { req.result = { err: error }; }
                    }));
                }).then(() => {
                    reqs.forEach(req => deliver(req, req.result.err, req.result.stats));
                }, error => {
                    reqs.forEach(req => deliver(req, error));
                });
            }
            readdir(path, callback) {
                const route = this._route(path);
                if (route.backend) return this._mountedCall('readdir', route, [callback]);
                NativeFileSystem._done(this._tx('readonly', async t => {
                    const dir = await t.dirAt(route.path);
                    const names = new Set(Object.keys(dir.listing));
                    for (const mountPath of this._mounts.keys()) {

                    }
                    return Array.from(names);
                }), callback);
            }
            mkdir(path, mode, callback) {
                if (typeof mode === 'function') { callback = mode; mode = undefined; }
                const route = this._route(path);
                if (route.backend) return this._mountedCall('mkdir', route, [callback], { type: 'mkdir', path: this._normalize(path) });
                NativeFileSystem._done(this._tx('readwrite', t => this._opMkdir(t, route.path)), callback, () => undefined);
            }
            readFile(path, encoding, flag, callback) {
                if (typeof encoding === 'function') { callback = encoding; encoding = null; }
                else if (typeof flag === 'function') callback = flag;
                const route = this._route(path);
                if (route.backend) return this._mountedCall('readFile', route, [encoding, callback]);
                const read = this._tx('readonly', async t => {
                    const found = await t.nodeAt(route.path);
                    if (NativeFileSystem._isDir(found.inode)) throw this._error('EISDIR', route.path);
                    const raw = await t.get(found.inode.id);
                    if (raw === undefined) throw this._error('ENOENT', route.path);
                    return raw;
                }).then(async raw => {
                    // 前向兼容：以后的版本可能把大文件存成 Blob，这里也能读出来。
                    const data = (typeof Blob !== 'undefined' && raw instanceof Blob) ? new NativeBuffer(await raw.arrayBuffer()) : NativeFileSystem._fromStored(raw);
                    if (!data) throw new Error('文件数据格式无效: ' + route.path);

            }
            writeFile(path, data, encoding, flag, mode, callback) {
                if (typeof encoding === 'function') callback = encoding;
                else if (typeof flag === 'function') callback = flag;
                else if (typeof mode === 'function') callback = mode;
                const route = this._route(path);
                if (route.backend) {
                    // 把参数整理成固定位置，确保后端调用的是包装后的回调（用于错误码和变更事件）。
                    const enc = typeof encoding === 'string' ? encoding : null;

                    const md = typeof mode === 'function' ? undefined : mode;
                    return this._mountedCall('writeFile', route, [data, enc, fl, md, callback], { type: 'change', path: this._normalize(path) });

                if (route.path === '/') { if (typeof callback === 'function') callback(this._error('EISDIR', route.path)); return; }

                if (content.size > 0xFFFFFFFF) { if (typeof callback === 'function') callback(this._error('EFBIG', route.path)); return; }

            }
            rmdir(path, callback) {
                const route = this._route(path);

                if (route.path === '/') { if (typeof callback === 'function') callback(this._error('EBUSY', route.path)); return; }

            }
        }

        function initKernel() {
            NativeFileSystem.open().then(fs => {
                SYSTEM.fs = fs;
                SYSTEM.Buffer = NativeBuffer;
                SYSTEM.mounted = true;
                SYSTEM.rootFs = SYSTEM.fs;
                SYSTEM.mountedFolders = {}; // { mountPath: { handle, name, id } }
                
                // === 修改时间缓存系统（修复 IndexedDB 等后端不支持 utimes 导致解压后日期丢失）===
                // 显示规则保持不变：路径在日期记录里有值时，stat 总是返回记录里的日期
                // （所以改完文件保存后，资源管理器里的修改日期不变——这是现有的预期行为）。
                // 数据仍存放在 localStorage 的 JISHENG_OS_MTIME_CACHE，格式不变，旧版本可直接读取。
                SYSTEM.mtimeCache = {};
                try {
                    const savedMtime = localStorage.getItem('JISHENG_OS_MTIME_CACHE');
                    if (savedMtime) SYSTEM.mtimeCache = JSON.parse(savedMtime);
                } catch(e) { SYSTEM.mtimeCache = {}; }
                
                // 路径规范化（去掉重复斜杠/结尾斜杠），缓存键统一用它
                const _normMtimePath = function(p) {
                    p = String(p == null ? '' : p).replace(/\/+/g, '/');
                    if (p.length > 1 && p.endsWith('/')) p = p.slice(0, -1);
                    return p;
                };
                // 绝大多数键本来就是规范的：先做便宜的检查，只有需要时才跑正则。
                const _normKey = function(k) {
                    return (k.indexOf('//') !== -1 || (k.length > 1 && k.charCodeAt(k.length - 1) === 47)) ? _normMtimePath(k) : k;
                };
                
                // 性能：以前每改一条日期就把整个记录 JSON.stringify 一遍写进 localStorage
                // （解压/上传 1000 个文件 = 1000 次全量写入，约 2.5 秒）。现在改为最多每 0.4 秒写一次，
                // 页面隐藏/关闭时立即写入。SYSTEM.saveMtimeCache() 本身仍然是立即写入。
                let _mtimeSaveTimer = 0;
                SYSTEM.saveMtimeCache = function() {
                    if (_mtimeSaveTimer) { clearTimeout(_mtimeSaveTimer); _mtimeSaveTimer = 0; }
                    try { localStorage.setItem('JISHENG_OS_MTIME_CACHE', JSON.stringify(SYSTEM.mtimeCache)); } catch(e) {}
                };
                const _scheduleMtimeSave = function() {
                    if (!_mtimeSaveTimer) _mtimeSaveTimer = setTimeout(() => { _mtimeSaveTimer = 0; SYSTEM.saveMtimeCache(); }, 400);
                };
                SYSTEM.flushMtimeCache = function() { if (_mtimeSaveTimer) SYSTEM.saveMtimeCache(); };
                window.addEventListener('pagehide', SYSTEM.flushMtimeCache);
                window.addEventListener('beforeunload', SYSTEM.flushMtimeCache);
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') SYSTEM.flushMtimeCache(); });
                
                SYSTEM.setMtimeCache = function(path, mtime) {
                    if (!mtime || isLocalMountedPath(path)) return;
                    const ms = mtime instanceof Date ? mtime.getTime() : Number(mtime);
                    if (!isNaN(ms) && ms > 0) {
                        // 统一用规范化路径作键（去掉重复/结尾斜杠），保证 rename 迁移时能匹配
                        SYSTEM.mtimeCache[_normMtimePath(path)] = ms;
                        _scheduleMtimeSave();
                    }
                };
                // 显示用的修改时间：与下面包装后的 stat 完全相同的规则（供 JISHENG FS 的递归复制使用）
                SYSTEM.displayMtime = function(path, backendMs) {
                    let cachedMs = SYSTEM.mtimeCache[path];
                    if (!cachedMs) cachedMs = SYSTEM.mtimeCache[_normMtimePath(path)];
                    return (cachedMs && !isLocalMountedPath(path)) ? cachedMs : backendMs;
                };
                
                // 包装 fs.utimes：即使后端（如 IndexedDB）返回 ENOTSUP，也把目标时间写入缓存
                const originalUtimes = SYSTEM.fs.utimes.bind(SYSTEM.fs);
                SYSTEM.fs.utimes = function(path, atime, mtime, callback) {
                    SYSTEM.setMtimeCache(path, mtime);
                    return originalUtimes(path, atime, mtime, callback);
                };

                // 文件夹大小缓存：以前每次写入前清空全部缓存；现在由 JISHENG FS 在提交后
                // 只清掉受影响路径的祖先目录（以及被删除/移走的子树），其他窗口的文件夹大小不必重算。
                fs.onCommit(event => {
                    try { if (typeof invalidateDirSizesFor === 'function') invalidateDirSizesFor(event); } catch (e) {}
                });
                
                // 包装 fs.stat：如果路径在缓存中有修改时间，则优先返回缓存值
                const originalStat = SYSTEM.fs.stat.bind(SYSTEM.fs);

                    return originalStat(path, function(err, stats) {
                        let cachedMs = SYSTEM.mtimeCache[path];

                        if (!err && stats && cachedMs && !isLocalMountedPath(path)) {
                            try {
                                stats.mtime = new Date(cachedMs);
                                stats.mtimeMs = cachedMs;
                            } catch(e) {}
                        }
                        callback(err, stats);
                    });
                };

                // === 修复：移动/重命名后修改日期丢失 ===
                // 原因：IndexedDB 后端不支持 utimes，所有"保留下来的原始修改时间"都只存在于
                // 以【路径】为键的 mtimeCache 里。从文件夹窗口拖到桌面走的是 fs.rename，
                // 路径变了缓存却还挂在旧路径上 —— 文件夹本身、里面的所有子文件/子文件夹
                // 全部"丢失"修改日期，显示成真实写入时间。
                // 解决：包装 rename，成功后把旧路径及其整棵子树的缓存条目迁移到新路径；
                // 同时把源的修改时间写到新路径上（覆盖跨挂载点 rename = 读+写+删 时被刷新的情况）。
                // 删除某路径及其子树的缓存条目（不立即持久化，返回是否有变化）
                const _dropMtimeSubtree = function(p) {
                    const base = _normMtimePath(p);
                    const prefix = base === '/' ? '/' : base + '/';
                    let changed = false;
                    Object.keys(SYSTEM.mtimeCache).forEach(k => {
                        const nk = _normKey(k);
                        if (nk === base || nk.indexOf(prefix) === 0) {
                            delete SYSTEM.mtimeCache[k];
                            changed = true;
                        }
                    });
                    return changed;
                };
                SYSTEM.dropMtimeCache = function(p) {
                    if (_dropMtimeSubtree(p)) _scheduleMtimeSave();
                };
                SYSTEM.moveMtimeCache = function(oldPath, newPath, srcMtimeMs) {
                    if (isLocalMountedPath(oldPath) || isLocalMountedPath(newPath)) return;
                    const o = _normMtimePath(oldPath);
                    const n = _normMtimePath(newPath);
                    if (o === n) return;
                    const oPrefix = o + '/';
                    // 1) 先收集旧子树条目
                    const moved = [];
                    Object.keys(SYSTEM.mtimeCache).forEach(k => {
                        const nk = _normKey(k);
                        if (nk === o || nk.indexOf(oPrefix) === 0) {
                            moved.push([n + nk.substring(o.length), SYSTEM.mtimeCache[k]]);
                            delete SYSTEM.mtimeCache[k];
                        }
                    });
                    // 2) 目标若被覆盖，清掉它原有的残留条目
                    _dropMtimeSubtree(n);
                    // 3) 写入迁移后的条目
                    moved.forEach(([k, v]) => { SYSTEM.mtimeCache[k] = v; });
                    // 4) 源本身的修改时间（含后端真实 mtime）也落到新路径上
                    if (srcMtimeMs && !isNaN(srcMtimeMs) && srcMtimeMs > 0) {
                        SYSTEM.mtimeCache[n] = srcMtimeMs;
                    }
                    _scheduleMtimeSave();
                };

                const _prevRename = SYSTEM.fs.rename.bind(SYSTEM.fs);
                SYSTEM.fs.rename = function(oldPath, newPath, callback) {
                    const cb = (typeof callback === 'function') ? callback : function() {};
                    // 先取源的修改时间（经由上面包装过的 stat，已包含缓存值）
                    SYSTEM.fs.stat(oldPath, function(sErr, sStats) {
                        let srcMs = null;
                        if (!sErr && sStats && sStats.mtime) {
                            const ms = sStats.mtime instanceof Date ? sStats.mtime.getTime() : Number(sStats.mtime);
                            if (!isNaN(ms) && ms > 0) srcMs = ms;
                        }
                        _prevRename(oldPath, newPath, function(err) {
                            if (!err) {
                                try { SYSTEM.moveMtimeCache(oldPath, newPath, srcMs); } catch (e) { console.warn('迁移修改时间缓存失败:', e); }
                            }
                            cb.apply(null, arguments);
                        });
                    });
                };

                // 删除文件/空目录成功后清理缓存，避免以后同名新建的项目"继承"旧日期
                ['unlink', 'rmdir'].forEach(fnName => {
                    const prev = SYSTEM.fs[fnName].bind(SYSTEM.fs);
                    SYSTEM.fs[fnName] = function(p, callback) {
                        const cb = (typeof callback === 'function') ? callback : function() {};
                        return prev(p, function(err) {
                            if (!err) { try { SYSTEM.dropMtimeCache(p); } catch (e) {} }
                            cb.apply(null, arguments);
                        });
                    };
                });
                // ================================================================

                SYSTEM.jfs = createJishengFS(fs);
                initFsAutoRefresh();
                
                // 创建挂载点目录
                SYSTEM.fs.mkdir('/mnt', () => {});
                SYSTEM.fs.mkdir('/mnt/local', () => {});

                // OPFS 通过系统统一的挂载表暴露到 /opfs，失败时不阻塞系统启动。
                // 这样 IndexedDB 和 OPFS 可以同时在文件管理器中访问，而不只是二选一。
                initOPFSBackend(checkSystemFiles);
            }).catch(error => {
                console.error('本地文件系统启动失败:', error);
                if (typeof Notify !== 'undefined') Notify.error('系统启动失败', error.message || '无法初始化持久化文件系统');
            });
        }

        // ======================== SYSTEM.jfs：JISHENG FS 高层接口 ========================
        // Promise 接口 + 递归操作 + 批量写入 + 变更监听。

        function createJishengFS(engine) {
            const call = (name, ...args) => new Promise((resolve, reject) => {
                SYSTEM.fs[name](...args, (err, value) => err ? reject(err) : resolve(value));
            });
            const isDirStats = st => !!st && (typeof st.isDirectory === 'function' ? st.isDirectory() : !!st.isDirectory);
            const native = path => engine._isNativeTree(path);
            const onRoot = path => !engine._route(path).backend;
            const toMs = value => {
                const ms = value instanceof Date ? value.getTime() : Number(value);

            const displayMtime = (path, inodeMs) => SYSTEM.displayMtime ? SYSTEM.displayMtime(path, inodeMs) : inodeMs;

            async function mkdirpGeneric(path) {
                const parts = String(path).split('/').filter(p => p);
                let current = '';
                for (const part of parts) {
                    current += '/' + part;
                    const dir = current;
                    await new Promise((resolve, reject) => {
                        SYSTEM.fs.mkdir(dir, (err) => {
                            if (!err) { resolve(); return; }
                            SYSTEM.fs.stat(dir, (statErr, stats) => {

                                else reject(err);
                            });
                        });
                    });
                }

            function mkdirp(path) {

            async function remove(path, options = {}) {
                if (options.recursive && native(path)) {

                }
                const st = await call('stat', path);
                if (!isDirStats(st)) return call('unlink', path);
                if (!options.recursive) return call('rmdir', path);
                await new Promise((resolve, reject) => deleteFolderRecursive(path, err => err ? reject(err) : resolve()));
            }

            async function copyTreeNative(src, dst, onProgress) {
                const result = await engine._copyTree(src, dst, displayMtime, onProgress);
                result.pins.forEach(([path, ms]) => SYSTEM.setMtimeCache(path, ms));
                return result;

            async function copy(src, dst) {
                const from = engine._normalize(src), to = engine._normalize(dst);

                if (to === from || to.startsWith(from === '/' ? '/' : from + '/')) throw engine._error('EINVAL', dst);
                const st = await call('stat', src);
                if (isDirStats(st)) {
                    await new Promise((resolve, reject) => copyFolderRecursive(src, dst, err => err ? reject(err) : resolve()));
                } else {
                    await new Promise((resolve, reject) => copyFilePreservingMtime(src, dst, st.mtime || null, err => err ? reject(err) : resolve()));
                }

            // 移动：同一存储内直接 rename；跨存储（如根目录 ↔ /opfs）自动改为 复制（保留日期）+ 删除源。
            async function move(src, dst) {
                try { await call('rename', src, dst); return; }
                catch (err) { if (!err || err.code !== 'EXDEV') throw err; }

                const data = await call('readFile', src);

                await call('unlink', src);
            }

            async function du(path) {
                if (native(path)) return engine._du(path);
                return new Promise(resolve => computeDirSize(path, resolve));
            }

            // 批量写入。ops: [{ op: 'mkdir'|'mkdirp'|'writeFile'|'utimes'|'unlink'|'rmdir'|'remove', path, data?, encoding?, atime?, mtime?, group?, stop? }]
            // writeFile 带 mtime 时写入后立即设置并记录修改日期（与 writeFile + utimes 两步相同）。
            // 规则见 NativeFileSystem._batch。返回与 ops 一一对应的 [{ ok, error } | { skipped: true }]。
            // 全部位于根卷时在少量事务里完成；涉及挂载点时按顺序逐项调用 SYSTEM.fs。
            async function batch(ops, options = {}) {
                const list = Array.from(ops || []);
                if (!list.length) return [];
                list.forEach(op => { if (op.op === 'rename') throw engine._error('ENOTSUP', 'batch rename'); });
                const allNative = list.every(op => op.op === 'remove' ? native(op.path) : onRoot(op.path));
                return allNative ? nativeBatch(list, options) : genericBatch(list, options);
            }
            function afterOps(ops, results) {
                ops.forEach((op, i) => {
                    const r = results[i];
                    if (!r || r.skipped) return;
                    // 与包装层相同：utimes 无论成败都记录日期；删除成功后清掉日期记录。
                    if (op.op === 'utimes') SYSTEM.setMtimeCache(op.path, op.mtime);
                    else if (op.op === 'writeFile' && op.mtime != null && r.ok) SYSTEM.setMtimeCache(op.path, op.mtime);
                    else if (r.ok && (op.op === 'unlink' || op.op === 'rmdir' || op.op === 'remove')) { try { SYSTEM.dropMtimeCache(op.path); } catch (_) {} }
                });
            }
            async function nativeBatch(list, options) {
                const MAX_BYTES = 48 * 1024 * 1024, MAX_OPS = 2000;
                const chunks = [];
                if (options.atomic) chunks.push(list);
                else {
                    let chunk = [], bytes = 0;
                    list.forEach((op, i) => {
                        const size = op.op === 'writeFile' && op.data ? (op.data.byteLength != null ? op.data.byteLength : (op.data.length || 0)) : 0;
                        const sameGroup = op.group != null && i > 0 && list[i - 1].group === op.group;
                        if (chunk.length && !sameGroup && (chunk.length >= MAX_OPS || bytes + size > MAX_BYTES)) { chunks.push(chunk); chunk = []; bytes = 0; }
                        chunk.push(op); bytes += size;
                    });
                    if (chunk.length) chunks.push(chunk);
                }
                const results = [];
                let stopped = null;
                for (const chunk of chunks) {
                    if (stopped) { chunk.forEach(() => results.push(stopped.error ? { ok: false, error: stopped.error } : { skipped: true })); continue; }
                    let chunkResults;
                    try { chunkResults = await engine._batch(chunk, options); }
                    catch (error) {
                        if (options.atomic) throw error;
                        // 事务级失败（例如存储空间不足）：这一段全部失败，后面的不再尝试。
                        chunkResults = chunk.map(() => ({ ok: false, error }));
                        stopped = { error };
                    }
                    afterOps(chunk, chunkResults);
                    chunkResults.forEach(r => results.push(r));
                    if (!stopped && chunk.some((op, i) => op.stop && chunkResults[i] && chunkResults[i].ok === false)) stopped = { error: null };
                    if (options.onProgress) { try { options.onProgress(results.length, list.length); } catch (_) {} }
                }
