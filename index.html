                            <button class="npx-btn save" data-act="save" title="保存 (Ctrl+S)">${icon('uiSave')}<span class="lbl">保存</span></button>
                        </div>
                        <div class="csvx-view"></div>
                        <textarea class="notepad-area" spellcheck="false" style="display:none"></textarea>
                    </div>`,
                onInit: (w, winId) => {
                    const root = w.querySelector('.csvx');
                    const view = w.querySelector('.csvx-view');
                    const editor = w.querySelector('.notepad-area');
                    const search = w.querySelector('.csvx-search input');
                    const status = w.querySelector('.npx-status');
                    const statusMain = status.querySelector('.main');
                    const btn = a => w.querySelector(`[data-act="${a}"]`);
                    const titleEl = w.querySelector('.window-title-text');
                    editor.value = content;   // 用 .value 赋值：文件里有 </textarea> 也不会破坏界面
                    const st = { mode: 'table', header: true, sort: null, filter: '', shown: PAGE, saved: editor.value, parsed: null, numCols: [] };
                    const crlf = /\r\n/.test(content);   // textarea 会把 CRLF 变成 LF：比较用规范化后的文本，保存时按原文件的换行符写回
                    const collator = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
                    const isNum = v => /^\s*[-+]?(\d{1,3}(,\d{3})+|\d+)?(\.\d+)?%?\s*$/.test(v) && /\d/.test(v);
                    const toNum = v => parseFloat(String(v).replace(/[,%\s]/g, ''));
                    const hl = (text, q) => {
                        const e = escapeHtml(text);
                        if (!q) return e;
                        const qe = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        return e.replace(new RegExp(qe, 'gi'), m => `<mark>${m}</mark>`);
                    };
                    const reparse = () => {
                        st.parsed = csvParse(editor.value);
                        const rows = st.parsed.rows;
                        st.cols = rows.reduce((m, r) => Math.max(m, r.length), 0);
                        const body = st.header ? rows.slice(1) : rows;
                        st.numCols = Array.from({ length: st.cols }, (_, c) => {
                            const vals = body.slice(0, 500).map(r => r[c]).filter(v => v != null && v.trim() !== '');
                            return vals.length > 0 && vals.filter(isNum).length / vals.length >= 0.8;
                        });
                    };
                    const render = () => {
                        const rows = st.parsed.rows, cols = st.cols;
                        const head = st.header && rows.length ? rows[0] : null;
                        let body = (head ? rows.slice(1) : rows).map((r, i) => ({ r, i }));
                        const q = st.filter.trim().toLowerCase();
                        if (q) body = body.filter(o => o.r.some(v => v && v.toLowerCase().includes(q)));
                        if (st.sort) {
                            const { col, dir } = st.sort, num = st.numCols[col];
                            body.sort((a, b) => {
                                const x = a.r[col] || '', y = b.r[col] || '';
                                if (!x !== !y) return x ? -1 : 1;   // 空值总在最后
                                const d = num ? toNum(x) - toNum(y) : collator.compare(x, y);
                                return (d || a.i - b.i) * dir;
                            });
                        }
                        const total = body.length;
                        const dataRows = head ? rows.length - 1 : rows.length;
                        statusMain.textContent = (q ? `${total} / ${dataRows} 行` : `${dataRows} 行`) + ` × ${cols} 列 · ${DELIM_NAME[st.parsed.delim] || '逗号'}分隔`;
                        if (!rows.length) { view.innerHTML = `<div class="csvx-empty">没有数据。切换到「源码」开始输入，每行一条记录，用逗号分隔。</div>`; return; }
                        const arrow = c => st.sort && st.sort.col === c ? icon(st.sort.dir > 0 ? 'uiArrowUpSm' : 'uiArrowDownSm') : '';
                        let html = '<table class="csvx-table"><thead><tr><th class="rn">#</th>';
                        for (let c = 0; c < cols; c++) {
                            const label = head ? (head[c] || '') : `列 ${c + 1}`;
                            html += `<th data-col="${c}" class="${st.numCols[c] ? 'num' : ''}" title="${escapeHtml(label)}（点击排序）">${escapeHtml(label) || '<span style="opacity:.4">（空）</span>'}${arrow(c)}</th>`;
                        }
                        html += '</tr></thead><tbody>';
                        const lim = Math.min(total, st.shown);
                        for (let k = 0; k < lim; k++) {
                            const { r, i } = body[k];
                            html += `<tr><td class="rn">${i + 1}</td>`;
                            for (let c = 0; c < cols; c++) {
                                const v = r[c] == null ? '' : r[c];
                                html += `<td${st.numCols[c] ? ' class="num"' : ''}${v.length > 40 ? ` title="${escapeHtml(v).replace(/"/g, '&quot;')}"` : ''}>${hl(v, q)}</td>`;
                            }
                            html += '</tr>';
                        }
                        html += '</tbody></table>';
                        if (total > lim) html += `<button class="npx-btn csvx-more">显示更多（还有 ${total - lim} 行）</button>`;
                        if (q && !total) html += `<div class="csvx-empty">没有包含「${escapeHtml(st.filter)}」的行</div>`;
                        view.innerHTML = html;
                    };
                    const setDirty = () => {
                        const dirty = editor.value !== st.saved;
                        status.classList.toggle('dirty', dirty); status.classList.toggle('saved', !dirty);
                        btn('save').classList.toggle('pending', dirty);
                        if (titleEl) titleEl.textContent = (dirty ? '● ' : '') + 'CSV 表格 - ' + filename;
                    };
                    const setMode = m => {
                        st.mode = m;
                        btn('table').classList.toggle('on', m === 'table'); btn('source').classList.toggle('on', m === 'source');
                        view.style.display = m === 'table' ? '' : 'none';
                        editor.style.display = m === 'source' ? '' : 'none';
                        w.querySelector('.csvx-search').style.display = btn('header').style.display = m === 'table' ? '' : 'none';
                        if (m === 'table') { reparse(); render(); } else editor.focus();
                    };
                    const save = () => {
                        const path = dir + '/' + filename;
                        const text = editor.value;
                        SYSTEM.fs.writeFile(path, crlf ? text.replace(/\r?\n/g, '\r\n') : text, 'utf8', err => {
                            if (err) { Notify.error('保存失败', err.message); return; }
                            st.saved = text; setDirty();
                            refreshDesktop();
                            Object.keys(SYSTEM.folderWindowStates || {}).forEach(wId => {
                                const fst = SYSTEM.folderWindowStates[wId];
                                if (fst && fst.currentPath === dir) { fst.fileStats = {}; renderFolderContent(wId); }
                            });
                            Notify.success('已保存', path.replace(SYSTEM.desktopPath, '桌面'));
                        });
                    };
                    btn('table').onclick = () => setMode('table');
                    btn('source').onclick = () => setMode('source');
                    const applyHeader = on => {
                        if (on === st.header) return;
                        st.header = on; st.sort = null;
                        btn('header').classList.toggle('on', st.header);
                        reparse(); render();
                    };
                    btn('header').onclick = () => csvHeaderSet(!st.header);   // 全局：记住选择，并通知所有 CSV 窗口
                    const onHeaderPref = e => applyHeader(e.detail);
                    window.addEventListener('jsos-csv-header', onHeaderPref);
                    btn('save').onclick = save;
                    let ft = 0;
                    search.addEventListener('input', () => { clearTimeout(ft); ft = setTimeout(() => { st.filter = search.value; st.shown = PAGE; render(); }, 120); });
                    view.addEventListener('click', e => {
                        const th = e.target.closest('th[data-col]');
                        if (th) {
                            const col = +th.dataset.col;
                            st.sort = !st.sort || st.sort.col !== col ? { col, dir: 1 } : st.sort.dir > 0 ? { col, dir: -1 } : null;   // 升序 → 降序 → 原顺序
                            render(); return;
                        }
                        if (e.target.closest('.csvx-more')) { st.shown += PAGE; const top = view.scrollTop; render(); view.scrollTop = top; }
                    });
                    editor.addEventListener('input', setDirty);
                    const onKey = e => {
                        if (!w.classList.contains('focused') || !(e.ctrlKey || e.metaKey)) return;
                        const k = e.key.toLowerCase();
                        if (k === 's') { e.preventDefault(); save(); }
                        else if (k === 'f' && st.mode === 'table') { e.preventDefault(); search.focus(); search.select(); }
                    };
                    document.addEventListener('keydown', onKey);
                    w.cleanup = () => { document.removeEventListener('keydown', onKey); window.removeEventListener('jsos-csv-header', onHeaderPref); };
                    reparse();
                    // 优先用全局设置；从没设置过时自动判断：首行像数据（整行都是数字）就不当表头
                    const savedHeader = csvHeaderGet();
                    const autoHeader = !(st.parsed.rows.length && st.parsed.rows[0].every(v => v.trim() !== '' && isNum(v)));
                    const wantHeader = savedHeader !== undefined ? savedHeader : autoHeader;
                    if (wantHeader !== st.header) { st.header = wantHeader; btn('header').classList.toggle('on', st.header); reparse(); }
                    render(); setDirty();
                }
            });
        }

        // 修复(Bug B / #1 / #16)：新增 saveDir 参数。
        // 从子文件夹打开文件时传入该文件所在目录，保存/另存为都默认写回当前工作目录，
        // 而不是硬编码到桌面。未提供时回退到桌面（保持任务栏新建记事本的旧行为）。
        //
        // 记事本增强：
        //  - 移除无用的「新建」按钮（要新建直接从任务栏/开始菜单再开一个记事本即可）
        //  - 自动暂存草稿（参考「炸字移动端文字编辑」）：输入后 ~400ms 自动写入 localStorage，
        //    关窗、刷新、断电都不会丢；下次打开同一文件时自动恢复未保存的内容
        //  - 字号调节（工具栏字号按钮，Ctrl + 滚轮，Ctrl + - / = / 0），全局记忆
        //  - 撤销 / 重做按钮（自维护历史栈，最多 200 步；Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z）
        //  - Ctrl+S 保存；标题栏用 ● 标记未保存
        const NP_DRAFT_PREFIX = 'JSOS_NP_DRAFT::';
        const NP_FONT_KEY = 'JSOS_NP_FONTSIZE';
        const NP_FONT_MIN = 10, NP_FONT_MAX = 40, NP_FONT_DEFAULT = 14;
        function npGetFontSize() {
            const v = parseInt(localStorage.getItem(NP_FONT_KEY) || '', 10);
            return (v >= NP_FONT_MIN && v <= NP_FONT_MAX) ? v : NP_FONT_DEFAULT;
        }
        function npReadDraft(key) {
            try {
                const raw = localStorage.getItem(NP_DRAFT_PREFIX + key);
                if (!raw) return null;
                const d = JSON.parse(raw);
                return (d && typeof d.content === 'string') ? d : null;
            } catch (e) { return null; }
        }
        function npWriteDraft(key, content) {
            try {
                localStorage.setItem(NP_DRAFT_PREFIX + key, JSON.stringify({ content, time: Date.now() }));
                return true;
            } catch (e) {
                // 存储已满等情况：静默失败，但通知一次
                if (!npWriteDraft._warned) { npWriteDraft._warned = true; Notify.warning('草稿无法暂存', '浏览器存储空间已满，请按 Ctrl+S 保存到文件'); }
                return false;
            }
        }
        function npClearDraft(key) { try { localStorage.removeItem(NP_DRAFT_PREFIX + key); } catch (e) {} }
        function npFmtTime(ts) {
            const d = new Date(ts); const p = n => String(n).padStart(2, '0');
            return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }
        function npFmtHM(ts) {
            const d = new Date(ts); const p = n => String(n).padStart(2, '0');
            return `${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        function openNotepad(content = '', filename = '未命名.txt', saveDir = null) {
            // 修复：textarea 内容需转义，避免文件内容含 </textarea> 等破坏 DOM。
            const safeContent = escapeHtml(content);
            const nid = SYSTEM.idCounter + 1;
            const id = createWindow({
                title: '记事本 - ' + filename,
                iconHtml: icon('appNotepad','sm'),
                width: 650, height: 480,
                content: `
                    <div class="npx">
                        <div class="npx-bar" role="toolbar" aria-label="记事本工具栏">
                            <button type="button" class="npx-btn save" id="np-save-${nid}" title="保存 (Ctrl+S)">${icon('edxSave')}<span class="lbl">保存</span></button>
                            <button type="button" class="npx-btn" id="np-saveas-${nid}" title="另存为">${icon('npxSaveAs')}<span class="lbl">另存为</span></button>
                            <span class="npx-sep"></span>
                            <button type="button" class="npx-btn icon" id="np-undo-${nid}" title="撤销 (Ctrl+Z)" aria-label="撤销" disabled>${icon('edxUndo')}</button>
                            <button type="button" class="npx-btn icon" id="np-redo-${nid}" title="重做 (Ctrl+Y)" aria-label="重做" disabled>${icon('edxRedo')}</button>
                            <span class="npx-sep"></span>
                            <div class="npx-font" role="group" aria-label="字号">
                                <button type="button" class="npx-btn" id="np-fdec-${nid}" title="缩小字号 (Ctrl+-)" aria-label="缩小字号">${icon('npxFontDown')}</button>
                                <span class="npx-fsize" id="np-fsize-${nid}" title="字号 · 双击恢复默认 (Ctrl+0)">14</span>
                                <button type="button" class="npx-btn" id="np-finc-${nid}" title="放大字号 (Ctrl+=)" aria-label="放大字号">${icon('npxFontUp')}</button>
                            </div>
                            <span class="npx-sp"></span>
                            <span class="npx-status" id="np-status-${nid}" role="status"><i></i><span class="main"></span><span class="sub"></span></span>
                        </div>
                        <textarea class="notepad-area" id="np-area-${nid}" placeholder="在此输入内容" spellcheck="false">${safeContent}</textarea>
                    </div>
                `,
                onInit: (w, winId) => {
                    let currentFile = filename;
                    // 当前工作目录：优先使用传入的 saveDir（来源文件所在目录），否则桌面。
                    let currentDir = saveDir || SYSTEM.desktopPath;
                    const area = document.getElementById('np-area-' + winId);
                    const titleEl = w.querySelector('.window-title-text');
                    const btnSave = document.getElementById('np-save-' + winId);
                    const btnSaveAs = document.getElementById('np-saveas-' + winId);
                    const btnUndo = document.getElementById('np-undo-' + winId);
                    const btnRedo = document.getElementById('np-redo-' + winId);
                    const btnFDec = document.getElementById('np-fdec-' + winId);
                    const btnFInc = document.getElementById('np-finc-' + winId);
                    const fsizeEl = document.getElementById('np-fsize-' + winId);
                    const statusEl = document.getElementById('np-status-' + winId);

                    // ---------- 状态 ----------
                    let savedContent = content;          // 磁盘（虚拟FS）上的内容
                    let draftKey = currentDir + '/' + currentFile;
                    let draftTimer = 0;
                    let histTimer = 0;
                    let composing = false;
                    let hist = [content];                // 撤销历史栈
                    let histI = 0;
                    const HIST_MAX = 200;

                    const isDirty = () => area.value !== savedContent;
                    const setTitle = () => {
                        titleEl.innerText = (isDirty() ? '● ' : '') + '记事本 - ' + currentFile;
                        btnSave.classList.toggle('pending', isDirty());
                    };
                    // 状态：主文字（已保存 / 未保存 / 新文件）+ 次要说明（窄窗口时隐藏）+ 悬停提示
                    const filePathTip = () => '文件：' + currentDir + '/' + currentFile;
                    const setStatus = (main, sub, cls, tip) => {
                        statusEl.className = 'npx-status' + (cls ? ' ' + cls : '');
                        statusEl.querySelector('.main').textContent = main;
                        statusEl.querySelector('.sub').textContent = sub ? ' · ' + sub : '';
                        statusEl.title = tip || filePathTip();
                    };
                    const DRAFT_TIP = '修改已暂存在本机浏览器，刷新页面或关闭窗口不会丢失。\n按 Ctrl+S 保存到文件。';

                    const refreshAfterSave = () => {
                        // 刷新桌面 + 该目录已打开的文件夹窗口，使保存立即可见。
                        refreshDesktop();
                        Object.keys(SYSTEM.folderWindowStates || {}).forEach(wId => {
                            const st = SYSTEM.folderWindowStates[wId];
                            if (st && st.currentPath === currentDir) { st.fileStats = {}; renderFolderContent(wId); }
                        });
                    };

                    // ---------- 自动暂存草稿 ----------
                    const flushDraft = () => {
                        clearTimeout(draftTimer); draftTimer = 0;
                        if (isDirty()) {
                            if (npWriteDraft(draftKey, area.value)) setStatus('未保存', '草稿已暂存 ' + npFmtHM(Date.now()), 'dirty', DRAFT_TIP);
                            else setStatus('未保存', '', 'dirty', '草稿无法暂存，请按 Ctrl+S 保存到文件');
                        } else {
                            npClearDraft(draftKey);
                            setStatus('已保存', '', 'saved');
                        }
                        setTitle();
                    };
                    const scheduleDraft = () => {
                        if (isDirty()) setStatus('未保存', '正在暂存…', 'dirty', DRAFT_TIP);
                        setTitle();
                        clearTimeout(draftTimer);
                        draftTimer = setTimeout(flushDraft, 400);
                    };

                    // ---------- 撤销 / 重做 ----------
                    const updateHistBtns = () => { btnUndo.disabled = histI <= 0; btnRedo.disabled = histI >= hist.length - 1; };
                    const pushHist = () => {
                        clearTimeout(histTimer); histTimer = 0;
                        const v = area.value;
                        if (hist[histI] === v) return;
                        hist = hist.slice(0, histI + 1);
                        hist.push(v);
                        if (hist.length > HIST_MAX) hist.shift();
                        histI = hist.length - 1;
                        updateHistBtns();
                    };
                    const scheduleHist = () => { clearTimeout(histTimer); histTimer = setTimeout(pushHist, 300); };
                    const applyHist = (i) => {
                        const keepScroll = area.scrollTop;
                        area.value = hist[i];
                        histI = i;
                        area.scrollTop = keepScroll;
                        try { area.setSelectionRange(area.value.length, area.value.length); } catch (e) {}
                        area.focus({ preventScroll: true });
                        updateHistBtns();
                        scheduleDraft();
                    };
                    const undo = () => { pushHist(); if (histI > 0) applyHist(histI - 1); };
                    const redo = () => { if (histI < hist.length - 1) applyHist(histI + 1); };
                    btnUndo.onclick = undo;
                    btnRedo.onclick = redo;

                    // ---------- 字号 ----------
                    let fontSize = npGetFontSize();
                    const applyFont = () => {
                        area.style.fontSize = fontSize + 'px';
                        fsizeEl.textContent = fontSize;
                        btnFDec.disabled = fontSize <= NP_FONT_MIN;
                        btnFInc.disabled = fontSize >= NP_FONT_MAX;
                        try { localStorage.setItem(NP_FONT_KEY, String(fontSize)); } catch (e) {}
                    };
                    const changeFont = (delta) => { fontSize = Math.max(NP_FONT_MIN, Math.min(NP_FONT_MAX, fontSize + delta)); applyFont(); };
                    btnFDec.onclick = () => changeFont(-1);
                    btnFInc.onclick = () => changeFont(1);
                    fsizeEl.ondblclick = () => { fontSize = NP_FONT_DEFAULT; applyFont(); };
                    area.addEventListener('wheel', (e) => {
                        if (!e.ctrlKey) return;
                        e.preventDefault();
                        changeFont(e.deltaY < 0 ? 1 : -1);
                    }, { passive: false });
                    applyFont();

                    // ---------- 保存 / 另存为 ----------
                    const writeFile = (cb) => {
                        const path = currentDir + '/' + currentFile;
                        const val = area.value;
                        SYSTEM.fs.writeFile(path, val, 'utf8', err => {
                            if (err) { Notify.error('保存失败', err.message); return; }
                            savedContent = val;
                            npClearDraft(draftKey);
                            setStatus('已保存', npFmtHM(Date.now()), 'saved');
                            setTitle();
                            refreshAfterSave();
                            Notify.success('已保存', currentFile);
                            if (cb) cb();
                        });
                    };
                    btnSave.onclick = () => writeFile();
                    btnSaveAs.onclick = async () => {
                        const name = await SysDialog.prompt({ title: '另存为', icon: 'uiSave', label: '文件名', value: currentFile, okText: '保存', validate: SysDialog.nameValidator('文件名') });
                        if (!name) return;
                        const oldKey = draftKey;
                        currentFile = name.match(/\.(txt|md|csv|log|json|js|html|css)$/i) ? name : name + '.txt';
                        draftKey = currentDir + '/' + currentFile;
                        writeFile(() => { if (oldKey !== draftKey) npClearDraft(oldKey); });
                    };

                    // ---------- 输入事件 ----------
                    area.addEventListener('compositionstart', () => { composing = true; });
                    area.addEventListener('compositionend', () => { composing = false; scheduleHist(); scheduleDraft(); });
                    area.addEventListener('input', () => {
                        if (composing) return;
                        scheduleHist(); scheduleDraft();
                    });
                    area.addEventListener('blur', () => { pushHist(); if (draftTimer) flushDraft(); });
                    area.addEventListener('keydown', (e) => {
                        const mod = e.ctrlKey || e.metaKey;
                        if (!mod) return;
                        const k = e.key.toLowerCase();
                        if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
                        else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
                        else if (k === 's') { e.preventDefault(); writeFile(); }
                        else if (k === '=' || k === '+') { e.preventDefault(); changeFont(1); }
                        else if (k === '-') { e.preventDefault(); changeFont(-1); }
                        else if (k === '0') { e.preventDefault(); fontSize = NP_FONT_DEFAULT; applyFont(); }
                    });

                    // 窗口关闭 / 页面刷新时立刻落盘草稿，确保不丢
                    const onUnload = () => { if (draftTimer) flushDraft(); };
                    window.addEventListener('beforeunload', onUnload);
                    document.addEventListener('visibilitychange', onUnload);
                    w.cleanup = () => {
                        onUnload();
                        window.removeEventListener('beforeunload', onUnload);
                        document.removeEventListener('visibilitychange', onUnload);
                    };

                    // ---------- 打开时恢复草稿 ----------
                    const draft = npReadDraft(draftKey);
                    if (draft && draft.content !== content) {
                        area.value = draft.content;
                        hist = [content, draft.content]; histI = 1;   // 按一次「撤销」即可回到文件原内容
                        updateHistBtns();
                        setStatus('未保存', '已恢复 ' + npFmtHM(draft.time) + ' 的草稿', 'dirty', '已恢复 ' + npFmtTime(draft.time) + ' 暂存的修改。\n按 Ctrl+S 保存到文件，或点撤销回到文件原内容。');
                        setTitle();
                        Notify.info('已恢复未保存的草稿', `“${currentFile}”有 ${npFmtHM(draft.time)} 暂存的修改尚未保存。按 Ctrl+S 保存，或点撤销回到文件原内容。`);
                    } else {
                        if (draft) npClearDraft(draftKey);
                        if (content) setStatus('已保存', '', 'saved');
                        else setStatus('新文件', '', '', '输入的内容会自动暂存在本机，刷新页面不会丢失');
                    }
                    updateHistBtns();
                    setTimeout(() => { try { area.focus({ preventScroll: true }); } catch (e) {} }, 50);
                }
            });
            return id;
        }

        // === 计算器 ===
        // 安全求值（不再用 eval）：先乘除后加减，结果保留 15 位有效数字，0.1 + 0.2 = 0.3。
        function calcEvaluate(tokens) {
            const nums = [], ops = [];
            for (let i = 0; i < tokens.length; i++) (i % 2 ? ops : nums).push(tokens[i]);
            const vals = [Number(nums[0])], addOps = [];
            for (let i = 0; i < ops.length; i++) {
                const n = Number(nums[i + 1]), op = ops[i];
                if (op === '×') vals[vals.length - 1] *= n;
                else if (op === '÷') { if (n === 0) throw new Error('不能除以零'); vals[vals.length - 1] /= n; }
                else { addOps.push(op); vals.push(n); }
            }
            let r = vals[0];
            addOps.forEach((op, i) => { r = op === '+' ? r + vals[i + 1] : r - vals[i + 1]; });
            if (!isFinite(r)) throw new Error('结果超出范围');
            return parseFloat(r.toPrecision(15));
        }
        function calcFormat(str) {
            if (/e/i.test(str)) return str;
            const neg = str.startsWith('-');
            const [int, dec] = (neg ? str.slice(1) : str).split('.');
            const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return (neg ? '-' : '') + grouped + (dec !== undefined ? '.' + dec : '');
        }
        function calcNumToStr(n) {
            const a = Math.abs(n);
            if (n !== 0 && (a >= 1e16 || a < 1e-10)) return n.toExponential(10).replace(/\.?0+e/, 'e');
            return String(n);
        }
        function openCalculator() {
            const KEYS = [
                ['C', 'fn', '清除 (Esc)'], ['⌫', 'fn', '退格 (Backspace)'], ['%', 'fn', '百分比 (%)'], ['÷', 'op', '除 (/)'],
                ['7'], ['8'], ['9'], ['×', 'op', '乘 (*)'],
                ['4'], ['5'], ['6'], ['−', 'op', '减 (-)'],
                ['1'], ['2'], ['3'], ['+', 'op', '加 (+)'],
                ['±', 'fn', '正负号 (F9)'], ['0'], ['.', '', '小数点 (.)'], ['=', 'eq', '等于 (Enter)']
            ];
            return createWindow({
                title: '计算器',
                iconHtml: icon('appCalc','sm'),
                width: 340, height: 500,
                content: `<div class="calx" tabindex="-1" aria-label="计算器">
                        <div class="calx-display" title="点击复制结果">
                            <span class="calx-hint">点击复制</span>
                            <div class="calx-expr" aria-live="polite"></div>
                            <div class="calx-result" role="status">0</div>
                        </div>
                        <div class="calx-keys">${KEYS.map(([k, cls, tip]) => `<button type="button" class="calx-key ${cls || ''}" data-k="${k}"${tip ? ` title="${tip}"` : ''} tabindex="-1">${k === '⌫' ? icon('uiBackspace') : k}</button>`).join('')}</div>
                    </div>`,
                onInit: (w, winId) => {
                    const root = w.querySelector('.calx');
                    const exprEl = w.querySelector('.calx-expr');
                    const resEl = w.querySelector('.calx-result');
                    const st = { tokens: [], cur: '0', entering: true, done: false, error: '' };
                    const reset = () => { st.tokens = []; st.cur = '0'; st.entering = true; st.done = false; st.error = ''; };
                    const fit = () => {
                        resEl.style.fontSize = '';
                        let size = parseFloat(getComputedStyle(resEl).fontSize);
                        while (resEl.scrollWidth > resEl.clientWidth && size > 16) { size -= 2; resEl.style.fontSize = size + 'px'; }
                    };
                    const render = (exprText) => {
                        resEl.classList.toggle('err', !!st.error);
                        resEl.textContent = st.error || calcFormat(st.cur);
                        exprEl.textContent = exprText !== undefined ? exprText : st.tokens.map((t, i) => i % 2 ? t : calcFormat(t)).join(' ');
                        w.querySelectorAll('.calx-key.op').forEach(b => b.classList.toggle('armed', !st.entering && !st.done && st.tokens.length > 0 && st.tokens[st.tokens.length - 1] === b.dataset.k));
                        if (!st.error) fit();
                    };
                    const press = k => {
                        if (/^[0-9]$/.test(k)) {
                            if (st.error || st.done) reset();
                            if (!st.entering) { st.cur = '0'; st.entering = true; }
                            if (st.cur.replace(/[-.]/g, '').length >= 16) return;
                            st.cur = st.cur === '0' ? k : (st.cur === '-0' ? '-' + k : st.cur + k);
                        } else if (k === '.') {
                            if (st.error || st.done) reset();
                            if (!st.entering) { st.cur = '0'; st.entering = true; }
                            if (!st.cur.includes('.')) st.cur += '.';
                        } else if (k === 'C') {
                            reset();
                        } else if (k === '⌫') {
                            if (st.error) reset();
                            else if (st.done) { st.done = false; st.tokens = []; render(''); return; }
                            else if (st.entering) st.cur = st.cur.length > 1 && st.cur !== '-0' ? st.cur.slice(0, -1).replace(/^-$/, '0') : '0';
                        } else if (k === '±') {
                            if (st.error) return;
                            if (st.cur !== '0' && st.cur !== '0.') st.cur = st.cur.startsWith('-') ? st.cur.slice(1) : '-' + st.cur;
                            if (st.done) { st.tokens = []; st.done = false; }
                            st.entering = true;
                        } else if (k === '%') {
                            if (st.error) return;
                            st.cur = calcNumToStr(parseFloat((Number(st.cur) / 100).toPrecision(15)));
                            st.entering = true; if (st.done) { st.tokens = []; st.done = false; }
                        } else if (['+', '−', '×', '÷'].includes(k)) {
                            if (st.error) return;
                            if (st.done) { st.tokens = [st.cur]; st.done = false; }
                            else if (!st.entering && st.tokens.length) st.tokens[st.tokens.length - 1] = k;   // 连按运算符 = 更换运算符
                            else st.tokens.push(st.cur.replace(/\.$/, ''));
                            if (st.tokens.length % 2 === 1) st.tokens.push(k);
                            st.entering = false;
                        } else if (k === '=') {
                            if (st.error || st.done || !st.tokens.length) return;
                            const tokens = st.entering ? st.tokens.concat(st.cur.replace(/\.$/, '')) : st.tokens.slice(0, -1);
                            const line = tokens.map((t, i) => i % 2 ? t : calcFormat(t)).join(' ') + ' =';
                            try {
                                st.cur = calcNumToStr(calcEvaluate(tokens.map(t => t === '−' ? '-' : t)));
                            } catch (err) { st.error = err.message; }
                            st.tokens = []; st.done = true; st.entering = true;
                            render(line); return;
                        }
                        render();
                    };
                    const flash = k => { const b = w.querySelector(`.calx-key[data-k="${CSS.escape(k)}"]`); if (b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 110); } };
                    w.querySelector('.calx-keys').addEventListener('click', e => { const b = e.target.closest('.calx-key'); if (b) { press(b.dataset.k); root.focus({ preventScroll: true }); } });
                    w.querySelector('.calx-display').addEventListener('click', () => {
                        const text = st.error ? '' : st.cur;
                        if (!text) return;
                        const ok = () => Notify.success('已复制', text);
                        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, () => {});
                    });
                    const KEYMAP = { '+': '+', '-': '−', '*': '×', 'x': '×', 'X': '×', '/': '÷', 'Enter': '=', '=': '=', 'Backspace': '⌫', 'Delete': 'C', 'Escape': 'C', '%': '%', '.': '.', ',': '.', 'F9': '±' };
                    const onKey = e => {
                        if (!w.classList.contains('focused') || w.classList.contains('minimized') || e.ctrlKey || e.metaKey || e.altKey) return;
                        const t = e.target;
                        if (t && t !== root && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
                        if (document.querySelector('.sys-dialog-overlay')) return;
                        const k = /^[0-9]$/.test(e.key) ? e.key : KEYMAP[e.key];
                        if (!k) return;
                        e.preventDefault();
                        press(k); flash(k);
                    };
                    const onCopy = e => {
                        if (!w.classList.contains('focused') || st.error) return;
                        const sel = window.getSelection && String(window.getSelection());
                        if (sel) return;
                        e.preventDefault(); e.clipboardData.setData('text/plain', st.cur);
                        Notify.success('已复制', st.cur);
                    };
                    document.addEventListener('keydown', onKey);
                    document.addEventListener('copy', onCopy);
                    w.cleanup = () => { document.removeEventListener('keydown', onKey); document.removeEventListener('copy', onCopy); };
                    new ResizeObserver(() => { if (!st.error) fit(); }).observe(resEl);
                    root.focus({ preventScroll: true });
                    render();
                }
            });
        }

        // 修复(#17)：新增 saveDir 参数，保存目录可配置（默认桌面）。
        function openPaint(saveDir = null) {
            const paintSaveDir = saveDir || SYSTEM.desktopPath;
            const SWATCHES = ['#1f2328', '#8b8d98', '#e5484d', '#f76b15', '#f5d90a', '#30a46c', '#0091ff', '#8e4ec6'];
            return createWindow({
                title: '画板',
                iconHtml: icon('appPaint','sm'),
                width: 820, height: 560,
                content: `
                    <div class="pnt">
                        <div class="pnt-bar">
                            <button class="pnt-btn on" data-tool="brush" title="画笔 (B)">${icon('uiBrush')}</button>
                            <button class="pnt-btn" data-tool="eraser" title="橡皮擦 (E)">${icon('uiEraser')}</button>
                            <span class="pnt-sep"></span>
                            ${SWATCHES.map((c, i) => `<button class="pnt-sw${i === 0 ? ' on' : ''}" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}
                            <label class="pnt-custom" title="自定义颜色"><input type="color" value="#1f2328"></label>
                            <span class="pnt-sep"></span>
                            <label class="pnt-size" title="笔刷大小（[ 与 ] 调整）"><span class="t">大小</span><input type="range" min="1" max="60" value="6"><output>6 px</output></label>
                            <span class="pnt-sp"></span>
                            <button class="pnt-btn" data-act="undo" title="撤销 (Ctrl+Z)" disabled>${icon('uiUndo')}</button>
                            <button class="pnt-btn" data-act="redo" title="重做 (Ctrl+Y)" disabled>${icon('uiRedo')}</button>
                            <button class="pnt-btn" data-act="clear" title="清空画布（可撤销）">${icon('uiDelete')}</button>
                            <button class="pnt-btn primary" data-act="save" title="保存为 PNG (Ctrl+S)">${icon('uiSave')}<span class="lbl">保存</span></button>
                        </div>
                        <div class="pnt-stage"><canvas class="pnt-canvas"></canvas><div class="pnt-cursor"></div></div>
                    </div>
                `,
                onInit: (w, winId) => {
                    const root = w.querySelector('.pnt');
                    root.style.containerType = 'inline-size';
                    const stage = w.querySelector('.pnt-stage');
                    const canvas = w.querySelector('.pnt-canvas');
                    const cursorEl = w.querySelector('.pnt-cursor');
                    const sizeIn = w.querySelector('.pnt-size input');
                    const sizeOut = w.querySelector('.pnt-size output');
                    const colorIn = w.querySelector('.pnt-custom input');
                    const btn = a => w.querySelector(`[data-act="${a}"]`);
                    const ctx = canvas.getContext('2d', { alpha: false });
                    // 文档画布：按屏幕大小 × 设备像素比分配，窗口缩小再放大时内容不会丢；高清屏笔迹不再发虚。
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const docW = Math.max(window.screen.width, 1920), docH = Math.max(window.screen.height, 1080);
                    const doc = document.createElement('canvas');
                    doc.width = Math.round(docW * dpr); doc.height = Math.round(docH * dpr);
                    const dctx = doc.getContext('2d', { alpha: false });
                    const st = { tool: 'brush', color: '#1f2328', size: 6, ops: [], redo: [], cur: null, pid: null, dirty: false };

                    const blit = () => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(doc, 0, 0); };
                    const sync = () => {
                        const cw = stage.clientWidth, ch = stage.clientHeight;
                        if (!cw || !ch) return;
                        canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
                        canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
                        blit();
                    };
                    const clearDoc = () => { dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.fillStyle = '#ffffff'; dctx.fillRect(0, 0, doc.width, doc.height); };
                    // 一笔 = 点列；用中点二次曲线连接，快速划线也圆滑。实时绘制与撤销重放走同一套代码，结果完全一致。
                    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
                    const segment = (c, op, i) => {
                        const p = op.pts;
                        c.beginPath();
                        if (i === 1) { const m = mid(p[0], p[1]); c.moveTo(p[0][0], p[0][1]); c.lineTo(m[0], m[1]); }
                        else { const a = mid(p[i - 2], p[i - 1]), b = mid(p[i - 1], p[i]); c.moveTo(a[0], a[1]); c.quadraticCurveTo(p[i - 1][0], p[i - 1][1], b[0], b[1]); }
                        c.stroke();
                    };
                    const style = (c, op) => {
                        c.setTransform(dpr, 0, 0, dpr, 0, 0);
                        c.strokeStyle = c.fillStyle = op.eraser ? '#ffffff' : op.color;
                        c.lineWidth = op.size; c.lineCap = 'round'; c.lineJoin = 'round';
                    };
                    const dot = (c, op) => { c.beginPath(); c.arc(op.pts[0][0], op.pts[0][1], op.size / 2, 0, Math.PI * 2); c.fill(); };
                    const tail = (c, op) => { const p = op.pts, n = p.length; if (n < 2) return; const m = mid(p[n - 2], p[n - 1]); c.beginPath(); c.moveTo(m[0], m[1]); c.lineTo(p[n - 1][0], p[n - 1][1]); c.stroke(); };
                    const replay = () => {
                        clearDoc();
                        st.ops.forEach(op => {
                            if (op.clear) { clearDoc(); return; }
                            style(dctx, op); dot(dctx, op);
                            for (let i = 1; i < op.pts.length; i++) segment(dctx, op, i);
                            tail(dctx, op);
                        });
                        blit();
                    };
                    const updateButtons = () => {
                        btn('undo').disabled = !st.ops.length;
                        btn('redo').disabled = !st.redo.length;
                    };
                    const commit = op => { st.ops.push(op); st.redo = []; st.dirty = true; updateButtons(); };

                    const pos = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
                    const moveCursor = e => { const [x, y] = pos(e); cursorEl.style.left = x + 'px'; cursorEl.style.top = y + 'px'; };
                    const sizeCursor = () => { const d = Math.max(st.size, 4); cursorEl.style.width = cursorEl.style.height = d + 'px'; };

                    canvas.addEventListener('pointerdown', e => {
                        if (st.pid !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
                        e.preventDefault();
                        if (!w.classList.contains('focused')) focusWin(winId);
                        st.pid = e.pointerId;
                        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}   // 画出画布边缘也不断笔
                        st.cur = { color: st.color, size: st.size, eraser: st.tool === 'eraser', pts: [pos(e)] };
                        style(ctx, st.cur); style(dctx, st.cur); dot(ctx, st.cur); dot(dctx, st.cur);
                    });
                    canvas.addEventListener('pointermove', e => {
                        moveCursor(e);
                        if (e.pointerId !== st.pid || !st.cur) return;
                        const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
                        (evs.length ? evs : [e]).forEach(ev => {
                            const p = pos(ev), last = st.cur.pts[st.cur.pts.length - 1];
                            if (Math.abs(p[0] - last[0]) + Math.abs(p[1] - last[1]) < 0.75) return;
                            st.cur.pts.push(p);
                            const i = st.cur.pts.length - 1;
                            segment(ctx, st.cur, i); segment(dctx, st.cur, i);
                        });
                    });
                    const end = e => {
                        if (e.pointerId !== st.pid) return;
                        if (st.cur) { tail(ctx, st.cur); tail(dctx, st.cur); commit(st.cur); }
                        st.cur = null; st.pid = null;
                    };
                    canvas.addEventListener('pointerup', end);
                    canvas.addEventListener('pointercancel', end);
                    stage.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') { stage.classList.add('hover'); moveCursor(e); } });
                    stage.addEventListener('pointerleave', () => stage.classList.remove('hover'));

                    const setTool = t => {
                        st.tool = t;
                        w.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
                        stage.classList.toggle('eraser', t === 'eraser');
                    };
                    const setColor = (c, fromCustom) => {
                        st.color = c; colorIn.value = c;
                        let hit = false;
                        w.querySelectorAll('.pnt-sw').forEach(b => { const on = !fromCustom && b.dataset.c === c; b.classList.toggle('on', on); hit = hit || on; });
                        w.querySelector('.pnt-custom').classList.toggle('on', !hit);
                        setTool('brush');
                    };
                    const setSize = v => { st.size = Math.max(1, Math.min(60, Math.round(v))); sizeIn.value = st.size; sizeOut.textContent = st.size + ' px'; sizeCursor(); };
                    const undo = () => { if (!st.ops.length) return; st.redo.push(st.ops.pop()); st.dirty = true; replay(); updateButtons(); };
                    const redo = () => { if (!st.redo.length) return; st.ops.push(st.redo.pop()); st.dirty = true; replay(); updateButtons(); };
                    const clear = () => {
                        if (!st.ops.length || st.ops[st.ops.length - 1].clear) return;
                        commit({ clear: true }); clearDoc(); blit();
                        Notify.info('已清空画布', '按 Ctrl+Z 可以撤销');
                    };
                    const listDir = () => new Promise(r => SYSTEM.fs.readdir(paintSaveDir, (err, list) => r(err ? [] : list || [])));
                    const save = async () => {
                        const names = new Set(await listDir());
                        let def = '画作.png', n = 2;
                        while (names.has(def)) def = `画作 (${n++}).png`;
                        let name = await SysDialog.prompt({ title: '保存图片', icon: 'uiImage', label: `文件名（保存到 ${paintSaveDir === SYSTEM.desktopPath ? '桌面' : paintSaveDir}）`, value: def, okText: '保存', validate: SysDialog.nameValidator('文件名') });
                        if (!name) return;
                        if (!/\.png$/i.test(name)) name += '.png';
                        if (names.has(name) && !(await SysDialog.confirm({ title: '文件已存在', icon: 'uiImage', danger: true, okText: '替换', message: `「${name}」已经存在，要替换它吗？` }))) return;
                        const cw = stage.clientWidth, ch = stage.clientHeight;
                        const out = document.createElement('canvas');
                        out.width = canvas.width; out.height = canvas.height;
                        out.getContext('2d').drawImage(doc, 0, 0, out.width, out.height, 0, 0, out.width, out.height);
                        out.toBlob(async blob => {
                            if (!blob) { Notify.error('保存失败', '无法生成图片'); return; }
                            const buffer = SYSTEM.Buffer.from(new Uint8Array(await blob.arrayBuffer()));
                            const path = paintSaveDir.replace(/\/$/, '') + '/' + name;
                            SYSTEM.fs.writeFile(path, buffer, err => {
                                if (err) { Notify.error('保存失败', err.message); return; }
                                st.dirty = false;
                                refreshDesktop();
                                Object.keys(SYSTEM.folderWindowStates || {}).forEach(wId => {
                                    const fst = SYSTEM.folderWindowStates[wId];
                                    if (fst && fst.currentPath === paintSaveDir) { fst.fileStats = {}; renderFolderContent(wId); }
                                });
                                Notify.success('已保存', `${name}（${cw}×${ch}，当前可见区域）`);
                            });
                        }, 'image/png');
                    };

                    w.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
                    w.querySelectorAll('.pnt-sw').forEach(b => b.onclick = () => setColor(b.dataset.c));
                    colorIn.addEventListener('input', () => setColor(colorIn.value, true));
                    sizeIn.addEventListener('input', () => setSize(+sizeIn.value));
                    btn('undo').onclick = undo; btn('redo').onclick = redo; btn('clear').onclick = clear; btn('save').onclick = save;

                    const onKey = e => {
                        if (!w.classList.contains('focused') || w.classList.contains('minimized')) return;
                        const t = e.target;
                        if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && t.type !== 'range' && t.type !== 'color')) return;
                        if (document.querySelector('.sys-dialog-overlay')) return;
                        const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
                        if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
                        else if (mod && k === 'y') { e.preventDefault(); redo(); }
                        else if (mod && k === 's') { e.preventDefault(); save(); }
                        else if (mod || e.altKey) return;
                        else if (k === 'b') setTool('brush');
                        else if (k === 'e') setTool('eraser');
                        else if (k === '[') setSize(st.size - (st.size > 10 ? 2 : 1));
                        else if (k === ']') setSize(st.size + (st.size >= 10 ? 2 : 1));
                    };
                    document.addEventListener('keydown', onKey);
                    const ro = new ResizeObserver(sync);
                    ro.observe(stage);
                    w.cleanup = () => { document.removeEventListener('keydown', onKey); ro.disconnect(); doc.width = doc.height = 0; };
                    clearDoc(); setSize(6); sync(); updateButtons();
                }
            });
        }

        // 漫画/长图查看器：打开单张图片时触发，加载同目录下所有图片
        // 图片查看器（原「漫画阅读器」升级）：

        //  - 长条模式（原漫画阅读）：滚动到附近才读取文件（原来一打开就把整个文件夹的图片全部读进内存）
        //  - 所有 Blob URL 在换图 / 关窗时释放（原来从不释放）
        const IMG_EXT_RE = /\.(jpe?g|png|gif|webp|bmp|svg|avif|ico)$/i;
        const IMG_MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp', svg: 'image/svg+xml', avif: 'image/avif', ico: 'image/x-icon' };
        const IMV_MODE_KEY = 'JSOS_IMV_MODE';
        function openMangaViewer(targetFullPath, targetFilename) {

            SYSTEM.fs.readdir(folderPath, (err, files) => {

                const collator = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
                const list = files.filter(f => IMG_EXT_RE.test(f)).sort(collator.compare);
                if (!list.includes(targetFilename)) list.unshift(targetFilename);
                let mode = localStorage.getItem(IMV_MODE_KEY) === 'strip' ? 'strip' : 'single';
                createWindow({
                    title: '图片查看器 - ' + targetFilename,
                    winType: 'manga',
                    iconHtml: icon('fileImg','sm'),
                    width: 860, height: 620,
                    content: `
                        <div class="npx imv">
                            <div class="npx-bar" role="toolbar" aria-label="图片工具栏">
                                <button class="npx-btn icon" data-act="prev" title="上一张 (←)">${icon('uiChevronLeft')}</button>

                                <span class="imv-seg">
