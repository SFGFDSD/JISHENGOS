        }

        // === 0. 初始化全局上传控件 (文件 & 文件夹) ===
        function initGlobalUploadInputs() {
            SYSTEM.uploadTargetPath = SYSTEM.desktopPath;
            SYSTEM.uploadTargetWindowId = null;
            if(!document.getElementById('global-upload-file')) {
                const inputFile = document.createElement('input');
                inputFile.type = 'file';
                inputFile.id = 'global-upload-file';
                inputFile.multiple = true; // 支持多选
                inputFile.hidden = true;
                inputFile.onchange = (e) => handleUploadFiles(e.target.files);
                document.body.appendChild(inputFile);
            }

            // 2. 创建上传文件夹控件
            if(!document.getElementById('global-upload-folder')) {
                const inputFolder = document.createElement('input');
                inputFolder.type = 'file';
                inputFolder.id = 'global-upload-folder';
                inputFolder.webkitdirectory = true; // 关键：允许选择文件夹
                inputFolder.hidden = true;
                inputFolder.onchange = (e) => handleUploadFiles(e.target.files);
                document.body.appendChild(inputFolder);
            }
        }

        // 处理 Input 选择的文件 (扁平化列表，包含路径信息)
        function handleUploadFiles(fileList) {
            if (!fileList || fileList.length === 0) return;
            
            const files = Array.from(fileList);
            const total = files.length;
            let count = 0;
            let successCount = 0;
            let errorCount = 0;
            // 上传目标在开始时确定，上传过程中再次打开上传对话框也不会写错位置。
            const targetPath = SYSTEM.uploadTargetPath;
            const targetWindowId = SYSTEM.uploadTargetWindowId;
            const refresh = () => {
                if (targetWindowId) folderRefresh(targetWindowId);
                else refreshDesktop();
            };

            // 修复(#19)：以"完成数"统计，目录创建/写入失败都计为完成但不计成功，
            // 并如实通知用户，避免目录创建失败后仍写文件、却提示"上传完成"。
            const onItemDone = (ok) => {
                count++;
                if(ok) successCount++; else errorCount++;
            };

            // JISHENG FS：分段上传。每段最多约 32 MB / 200 个文件，只把当前这一段读进内存
            // （以前会把所有文件同时读进内存），每段用一次批量写入完成：
            // 建目录 → 写文件 → 回写文件原始修改时间（同一个文件里前一步失败，后面的步骤跳过）。
            (async () => {
                const MAX_BYTES = 32 * 1024 * 1024, MAX_FILES = 200;
                let index = 0;
                while (index < files.length) {
                    const chunk = [];
                    let bytes = 0;
                    while (index < files.length && chunk.length < MAX_FILES) {
                        const size = files[index].size || 0;
                        if (chunk.length && bytes + size > MAX_BYTES) break;
                        chunk.push(files[index]); bytes += size; index++;
                    }
                    const datas = await Promise.all(chunk.map(file => file.arrayBuffer().catch(() => null)));
                    const ops = [], owners = [];
                    chunk.forEach((file, i) => {
                        // 如果是上传文件夹，file.webkitRelativePath 会包含 "Folder/Sub/file.txt"
                        // 如果是上传文件，通常只是 "file.txt"
                        const relPath = file.webkitRelativePath || file.name;
                        if (!datas[i]) { console.error('读取上传文件失败:', file.name); onItemDone(false); return; }
                        const fullPath = targetPath + '/' + relPath;
                        const group = 'u' + i;
                        owners.push({ relPath, first: ops.length });
                        ops.push({ op: 'mkdirp', path: fullPath.substring(0, fullPath.lastIndexOf('/')), group });
                        ops.push({ op: 'writeFile', path: fullPath, data: datas[i], group });
                        // 保留原始修改时间：上传后用文件本机的 lastModified 回写，
                        // 否则虚拟 FS 会把 mtime 置为当前时间，导致"修改日期全没了"。
                        if (file.lastModified) ops.push({ op: 'utimes', path: fullPath, atime: file.lastModified, mtime: file.lastModified, group });
                    });
                    let results;
                    try { results = ops.length ? await SYSTEM.jfs.batch(ops) : []; }
                    catch (err) { results = ops.map(() => ({ ok: false, error: err })); }
                    owners.forEach(({ relPath, first }) => {
                        const dirResult = results[first], writeResult = results[first + 1];
                        if (!dirResult || !dirResult.ok) { console.error('上传目录创建失败:', relPath, dirResult && dirResult.error); onItemDone(false); return; }
                        if (!writeResult || !writeResult.ok) { console.error('上传写入失败:', relPath, writeResult && writeResult.error); onItemDone(false); return; }
                        onItemDone(true);
                    });
                    if (count < total) refresh();
                }
                refresh();
                if(errorCount > 0) Notify.error('部分失败', `成功导入 ${successCount} 个，失败 ${errorCount} 个`);
                else Notify.success('上传完成', `成功导入 ${successCount} 个项目`);
            })();
            
            // 清空 value 以便下次能选同一个文件
            document.getElementById('global-upload-file').value = '';
            document.getElementById('global-upload-folder').value = '';
        }

        // === 时钟 ===
        // 性能：只在文字真正变化时写 DOM（每分钟一次），并对齐到整分钟。
        // 以前每秒写一次 innerText，任务栏（40px 毛玻璃）每秒都要重新排版和重绘。
        let clockLast = '', clockTimer = 0;
        function updateClock() {
            clearTimeout(clockTimer);
            const d = new Date();
            let hours = d.getHours();
            const period = hours >= 12 ? '下午' : '上午';
            hours = hours % 12 || 12;
            const text = `${period} ${hours}:${String(d.getMinutes()).padStart(2, '0')}|${d.toLocaleDateString('zh-CN')}`;
            if (text !== clockLast) {
                clockLast = text;
                const [t, dt] = text.split('|');
                document.getElementById('time').textContent = t;
                document.getElementById('date').textContent = dt;
                const clockEl = document.getElementById('clock');
                if (clockEl) clockEl.title = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][d.getDay()]}`;
                if (SYSTEM.calendarOpen && typeof updateCalendarNow === 'function') updateCalendarNow();
            }
            clockTimer = setTimeout(updateClock, 60000 - (Date.now() % 60000) + 20);
        }
        updateClock();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') updateClock(); });

        // === 日历面板 ===
        // 打开时总是回到“本月”；点日期可选中并显示星期 / 农历 / 距今天数；
        // 键盘：方向键按天/周移动，PageUp/PageDown 换月，Home 回到今天，Esc 关闭；滚轮换月。
        const CAL = { sel: null, wheelAt: 0 };
        const CAL_WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        let calLunarFmt;
        const CAL_LUNAR_DAY = n => {
            const d = '一二三四五六七八九十';
            if (n <= 10) return '初' + d[n - 1];
            if (n < 20) return '十' + d[n - 11];
            if (n === 20) return '二十';
            if (n < 30) return '廿' + d[n - 21];
            return '三十';
        };
        function calLunar(d) {
            try {
                if (calLunarFmt === undefined) calLunarFmt = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { month: 'long', day: 'numeric' });
                const parts = calLunarFmt.formatToParts(d);
                const month = (parts.find(p => p.type === 'month') || {}).value || '';
                const day = (parts.find(p => p.type === 'day') || {}).value || '';
                if (!month || !day || /\d/.test(month)) return '';   // 不支持农历历法的环境会退回公历数字月份，直接不显示
                // ICU 给出的农历“日”通常是阿拉伯数字（如 8），转换成习惯写法（初八）
                const n = parseInt(day, 10);
                const dayText = isNaN(n) ? day : CAL_LUNAR_DAY(n);
                return '农历' + month + dayText;
            } catch (e) { calLunarFmt = null; return ''; }
        }
        function calSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

        function updateCalendarNow() {
            const d = new Date();
            const h = d.getHours();
            const timeEl = document.getElementById('cal-now-time');
            if (!timeEl) return;
            timeEl.innerHTML = `<small>${h >= 12 ? '下午' : '上午'}</small>${h % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
            document.getElementById('cal-now-date').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${CAL_WEEK[d.getDay()]}`;
            document.getElementById('cal-now-lunar').textContent = calLunar(d);
        }

        function setCalendarOpen(open, opts = {}) {
            const panel = document.getElementById('calendar-panel');
            const clock = document.getElementById('clock');
            if (!panel || (!!open === !!SYSTEM.calendarOpen && !opts.force)) return;
            SYSTEM.calendarOpen = !!open;
            panel.classList.toggle('open', SYSTEM.calendarOpen);
            if (clock) { clock.classList.toggle('open', SYSTEM.calendarOpen); clock.setAttribute('aria-expanded', SYSTEM.calendarOpen ? 'true' : 'false'); }
            if (SYSTEM.calendarOpen) {
                setStartOpen(false);
                closeCtx();
                const now = new Date();
                SYSTEM.currentMonth = now.getMonth();
                SYSTEM.currentYear = now.getFullYear();
                CAL.sel = null;
                updateCalendarNow();
                renderCalendar();
                if (opts.keyboard) requestAnimationFrame(() => calFocusCell());
            } else {
                if (opts.restoreFocus && clock) clock.focus({ preventScroll: true });
                else if (panel.contains(document.activeElement)) document.activeElement.blur();
            }
        }
        function toggleCalendar(opts) { setCalendarOpen(!SYSTEM.calendarOpen, opts || {}); }

        function changeMonth(delta) {
            SYSTEM.currentMonth += delta;
            if (SYSTEM.currentMonth > 11) { SYSTEM.currentMonth = 0; SYSTEM.currentYear++; }
            if (SYSTEM.currentMonth < 0) { SYSTEM.currentMonth = 11; SYSTEM.currentYear--; }
            renderCalendar();
        }

        function calGoToday() {
            const now = new Date();
            SYSTEM.currentMonth = now.getMonth();
            SYSTEM.currentYear = now.getFullYear();
            CAL.sel = null;
            renderCalendar();
            calFocusCell();
        }

        // 选中某天（可跨月），并把焦点留在该天
        function calSelect(d, focus) {
            CAL.sel = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            SYSTEM.currentYear = d.getFullYear();
            SYSTEM.currentMonth = d.getMonth();
            renderCalendar();
            if (focus) calFocusCell();
        }
        function calFocusCell() {
            const cell = document.querySelector('#calendar-days .calendar-day[tabindex="0"]');
            if (cell) cell.focus({ preventScroll: true });
        }

        function renderCalendar() {
            const year = SYSTEM.currentYear;
            const month = SYSTEM.currentMonth;
            const today = new Date();
            document.getElementById('calendar-title').textContent = `${year}年${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const start = new Date(year, month, 1 - firstDay);
            const sel = CAL.sel;
            // 键盘焦点所在格：选中日 > 今天（若在本月）> 本月 1 日
            const focusDay = (sel && sel.getMonth() === month && sel.getFullYear() === year) ? sel
                : (today.getMonth() === month && today.getFullYear() === year) ? today : new Date(year, month, 1);

            let html = '';
            for (let i = 0; i < 42; i++) {
                const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
                const cls = ['calendar-day'];
                if (d.getMonth() !== month) cls.push('other-month');
                const isToday = calSameDay(d, today);
                if (isToday) cls.push('today');
                if (sel && calSameDay(d, sel)) cls.push('selected');
                const label = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${CAL_WEEK[d.getDay()]}${isToday ? '，今天' : ''}`;
                html += `<button type="button" class="${cls.join(' ')}" data-date="${d.getFullYear()}-${d.getMonth()}-${d.getDate()}" tabindex="${calSameDay(d, focusDay) ? 0 : -1}" aria-label="${label}"${isToday ? ' aria-current="date"' : ''}><span>${d.getDate()}</span></button>`;
            }
            document.getElementById('calendar-days').innerHTML = html;

            const todayBtn = document.getElementById('cal-today');
            if (todayBtn) todayBtn.disabled = (month === today.getMonth() && year === today.getFullYear() && (!sel || calSameDay(sel, today)));

            // 选中日信息
            const info = document.getElementById('cal-info');
            if (info) {
                const d = sel || today;
                const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - t0) / 86400000);
                const rel = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === -1 ? '昨天' : diff > 0 ? `${diff} 天后` : `${-diff} 天前`;
                const lunar = calLunar(d);
                const yearPart = d.getFullYear() !== today.getFullYear() ? `${d.getFullYear()}年` : '';
                info.innerHTML = `<span>${yearPart}${d.getMonth() + 1}月${d.getDate()}日 ${CAL_WEEK[d.getDay()]}${lunar ? ' · ' + lunar : ''}</span><b>${rel}</b>`;
            }
        }

        (function initCalendarPanel() {
            const panel = document.getElementById('calendar-panel');
            const days = document.getElementById('calendar-days');
            if (!panel || !days) return;
            days.addEventListener('click', e => {
                const cell = e.target.closest('.calendar-day');
                if (!cell) return;
                const [y, m, d] = cell.dataset.date.split('-').map(Number);
                calSelect(new Date(y, m, d), true);
            });
            panel.addEventListener('keydown', e => {
                const cell = e.target.closest && e.target.closest('.calendar-day');
                const base = cell ? (() => { const [y, m, d] = cell.dataset.date.split('-').map(Number); return new Date(y, m, d); })() : null;
                const move = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
                if (base && move) {
                    e.preventDefault();
                    calSelect(new Date(base.getFullYear(), base.getMonth(), base.getDate() + move), true);
                } else if (e.key === 'PageUp' || e.key === 'PageDown') {
                    e.preventDefault();
                    const ref = base || new Date(SYSTEM.currentYear, SYSTEM.currentMonth, 1);
                    const step = e.key === 'PageUp' ? -1 : 1;
                    const dim = new Date(ref.getFullYear(), ref.getMonth() + step + 1, 0).getDate();
                    calSelect(new Date(ref.getFullYear(), ref.getMonth() + step, Math.min(ref.getDate(), dim)), true);
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    calGoToday();
                }
            });
            panel.querySelector('.cal-body').addEventListener('wheel', e => {
                if (Math.abs(e.deltaY) < 4) return;
                e.preventDefault();
                const now = Date.now();
                if (now - CAL.wheelAt < 220) return;   // 触控板一次滑动会产生很多 wheel 事件
                CAL.wheelAt = now;
                changeMonth(e.deltaY > 0 ? 1 : -1);
            }, { passive: false });
        })();

        // === 桌面渲染 ===
        // ===============================================
        // 新增/替换的核心交互逻辑 (拖拽、框选、右键、文件夹)
        // ===============================================

        // 1. 读取位置配置
        function loadIconPositions(callback) {
            if(!SYSTEM.mounted) { callback(); return; }
            SYSTEM.fs.readFile(SYSTEM.iconPositionsPath, 'utf8', (err, data) => {
                if(!err && data) {
                    try { SYSTEM.iconPositions = JSON.parse(data); } catch(e) { SYSTEM.iconPositions = {}; }
                }
                callback();
            });
        }

        function saveIconPositions() {
            if(!SYSTEM.mounted) return;
            SYSTEM.fs.writeFile(SYSTEM.iconPositionsPath, JSON.stringify(SYSTEM.iconPositions), () => {});
        }

        // 2. 替换原有的 refreshDesktop (改为绝对定位布局)
        async function refreshDesktop() {
            SYSTEM._desktopRenderedAt = Date.now();
            const container = document.getElementById('desktop-icons');
            container.innerHTML = '';
            
            // 加载已保存的挂载文件夹
            if (Object.keys(SYSTEM.mountedFolders).length === 0) {
                try {
                    await loadMountedFolders();
                } catch (e) {
                    console.error('加载挂载文件夹失败:', e);
                }
            }
            
            loadIconPositions(() => {
                // 系统固定应用；隐藏设置只影响快捷方式，桌面、开始菜单和任务栏保持一致。
                const systemApps = SYSTEM_APP_DEFS
                    .filter(app => !isSystemAppHidden(app.key))
                    .map(app => ({
                        id: app.desktopId, name: app.name, action: app.action,
                        icon: iconBody(app.icon), key: app.key
                    }));

                // 排列逻辑
                const maxPerColumn = Math.max(1, Math.floor((window.innerHeight - 80) / SYSTEM.gridSize));
                let index = 0;

                const getNextPos = () => {
                    const col = Math.floor(index / maxPerColumn);
                    const row = index % maxPerColumn;
                    index++;
                    return { x: 24 + col * SYSTEM.gridSize, y: 24 + row * SYSTEM.gridSize };
                };

                // 渲染系统应用（设置应用由清单标记为不可隐藏）
                systemApps.forEach(app => {
                    const defaultPos = getNextPos();
                    const pos = SYSTEM.iconPositions[app.id] || defaultPos;
                    container.appendChild(createIconElement(app.id, app.name, app.icon, app.action, pos, 'app', null, app.key));
                });

                // 渲染用户文件
                if(SYSTEM.mounted) {
                    SYSTEM.fs.readdir(SYSTEM.desktopPath, (err, files) => {
                        if(err) return;
                        files.forEach(file => {
                            const fileId = 'file-' + file;
                            const defaultPos = getNextPos();
                            const pos = SYSTEM.iconPositions[fileId] || defaultPos;
                            
                            let iconSvg = iconBody(fileIconName(file, false));
                            let type = 'file';

                            // 异步检查是否为文件夹（同时检测HTML是否为JISHENG OS应用）
                            SYSTEM.fs.stat(SYSTEM.desktopPath + '/' + file, (err, stats) => {
                                if(!err && stats.isDirectory()) {
                                    iconSvg = iconBody('fileFolder');
                                    container.appendChild(createIconElement(fileId, file, iconSvg, `openFolderWindow('${file}')`, pos, 'folder', file));
                                } else if(file.match(/\.html?$/i)) {
                                    // HTML文件：异步读取内容检测是否为JISHENG OS应用
                                    SYSTEM.fs.readFile(SYSTEM.desktopPath + '/' + file, 'utf8', (err, data) => {
                                        let displayName = file;
                                        let displayIcon = iconSvg;
                                        if(!err && data) {
                                            const appConfig = parseJishengApp(data, file);
                                            if(appConfig) {
                                                displayName = appConfig.name;
                                                // 自定义图标是完整 <svg>（parseJishengApp 已清洗过），
                                                // createIconElement 会原样使用，不再剥离外层标签
                                                displayIcon = appConfig.icon || iconBody('appUnknown');
                                            }
                                        }
                                        container.appendChild(createIconElement(fileId, displayName, displayIcon, `openFile('${file}')`, pos, 'file', file));
                                    });
                                } else {
                                    container.appendChild(createIconElement(fileId, file, iconSvg, `openFile('${file}')`, pos, 'file', file));
                                }
                            });
                        });
                    });
                }
                
                // 渲染挂载的本地文件夹
                Object.keys(SYSTEM.mountedFolders).forEach(folderId => {
                    const folderInfo = SYSTEM.mountedFolders[folderId];
                    const fileId = folderId;
                    const defaultPos = getNextPos();
                    const pos = SYSTEM.iconPositions[fileId] || defaultPos;
                    
                    container.appendChild(createLocalFolderIconElement(fileId, folderInfo.name, iconBody('uiEject'), folderId, pos));
                });
                injectStaticIcons();
            });
            
            initDesktopEvents();
        }

        // 用于桌面/文件管理器的单击模式；组合键仍保留选择行为，拖拽松手不会误触发打开。
        function shouldOpenFromSingleClick(event, el) {
            if (SYSTEM.clickBehavior !== 'single' || !el) return false;
            if (event && (event.ctrlKey || event.shiftKey || (event.detail && event.detail > 1))) return false;
            const now = Date.now();
            if (el._ignoreActivationUntil && now < el._ignoreActivationUntil) return false;
            const isTouch = (event && event.pointerType === 'touch') ||
                (el._lastTouchStartAt && now - el._lastTouchStartAt < 1000);
            if (isTouch) {
                if (el._lastSingleClickOpenAt && now - el._lastSingleClickOpenAt < 320) return false;
                el._lastSingleClickOpenAt = now;
            }
            return true;
        }

        let _lastDesktopTouchTapEl = null;
        let _lastDesktopTouchTapAt = 0;
        function handleDesktopIconTouchStart(event, el, startHandler) {
            const now = Date.now();
            el._lastTouchStartAt = now;
            if (SYSTEM.clickBehavior === 'double') {
                if (_lastDesktopTouchTapEl === el && now - _lastDesktopTouchTapAt < 350) {
                    _lastDesktopTouchTapEl = null;
                    _lastDesktopTouchTapAt = 0;
                    event.preventDefault();
                    event.stopPropagation();
                    el._suppressNextDblClick = true;
                    setTimeout(() => { el._suppressNextDblClick = false; }, 450);
                    activateDesktopIcon(el);
                    return;
                }
                _lastDesktopTouchTapEl = el;
                _lastDesktopTouchTapAt = now;
            } else {
                _lastDesktopTouchTapEl = null;
                _lastDesktopTouchTapAt = 0;
            }
            startHandler(event);
        }

        function activateDesktopIcon(el) {
            if (el && typeof el._jishengOpen === 'function') el._jishengOpen();
        }

        // 3. 创建图标 DOM 元素 (绑定交互事件)
        function createIconElement(id, name, iconSvg, action, pos, type = 'app', filename = null, systemAppKey = null) {
            const el = document.createElement('div');
            el.className = 'desktop-icon';
            el.id = id;
            if (systemAppKey) el.dataset.systemApp = systemAppKey;
            el._jishengOpenAction = action;
            if(filename) el.dataset.filename = filename;
            // 修复(#4)：标记图标是否为文件夹，供拖放投放目标判定使用，
            // 避免把文件拖到普通文件图标上时误判为"放入文件夹"。
            el.dataset.isdir = (type === 'folder') ? 'true' : 'false';
            el.style.left = pos.x + 'px';
            el.style.top = pos.y + 'px';
            
            // 图标：集中式图标库给的是 <path> 内部片段 → 套统一外壳；
            // JISHENG-OS-APP 应用的自定义图标给的是完整 <svg>（自带 viewBox/配色）→ 原样使用，
            // 不能再嵌套一层、更不能套 .icon-svg（那是描边风格的样式，里面写死 fill:none，会把实心图标洗没）。
            el.innerHTML = (iconSvg && iconSvg.indexOf('<svg') !== -1
                    ? iconSvg
                    : `<svg class="icon-svg xl" viewBox="0 0 24 24">${iconSvg}</svg>`)
                + `<div class="label">${escapeHtml(name)}</div>`;   // 修复：名称按纯文本显示（原来文件名里的 HTML 会被执行）
            
            const handleStart = (e) => {
                if(e.button === 2) return;
                
                e.stopPropagation();
                
                if(e.ctrlKey) {
                    toggleIconSelection(el);
                } else if(!SYSTEM.selectedIcons.includes(id)) {
                    clearSelection();
                    selectIcon(el);
                }
                
                if(!longPressTriggered) {
                    startIconDrag(e, el);
                } else {
                    startIconDrag(e, el, true);
                }
            };

            el.onmousedown = handleStart;
            el.ontouchstart = (e) => handleDesktopIconTouchStart(e, el, handleStart);

            if(filename) {
                el.setAttribute('draggable', 'true');
                el.onmouseenter = () => {
                    if(filename) hoverPreloadForDrag(SYSTEM.desktopPath + '/' + filename, filename);
                };
                el.addEventListener('mouseleave', cancelHoverPreload);
                el.ondragstart = (e) => {
                    e.stopPropagation();
                    if(longPressTriggered) {
                        handleNativeDragStart(e, filename);
                    } else {
                        e.preventDefault();
                    }
                };
                el.ondragend = (e) => {
                    handleNativeDragEnd(e);
                    el.style.outline = 'none';
                };
            }

            el.oncontextmenu = (e) => {
                e.preventDefault(); e.stopPropagation();
                if(!SYSTEM.selectedIcons.includes(id)) {
                    clearSelection();
                    selectIcon(el);
                }
                const pos = getClientXY(e);
                showIconContextMenu(pos.x, pos.y);
            };

            // 安全的动作执行方式，避免eval注入风险。右键菜单始终可以显式打开。
            el._jishengOpen = () => {
                if (action === 'openBrowser()') {
                    openBrowser();
                } else if (action === 'openNotepad()') {
                    openNotepad();
                } else if (action === 'openCalculator()') {
                    openCalculator();
                } else if (action === 'openPaint()') {
                    openPaint();
                } else if (action === 'openSettings()') {
                    openSettings();
                } else if (action === 'openV86()') {
                    openV86();
                } else if (action === 'openCodeEditor()') {
                    openCodeEditor();
                } else if (action === 'openFileExplorer()') {
                    openFileExplorer();
                } else if (action.startsWith('openFolderWindow(')) {
                    const folderName = action.match(/openFolderWindow\('(.*)'\)/)?.[1];
                    if (folderName != null) openFolderWindow(folderName);
                } else if (action.startsWith('openFile(')) {
                    const filename = action.match(/openFile\('(.*)'\)/)?.[1];
                    if (filename != null) openFile(filename);
                }
                clearSelection();
            };
            el.onclick = (e) => {
                if (shouldOpenFromSingleClick(e, el)) activateDesktopIcon(el);
            };
            el.ondblclick = (e) => {
                if (SYSTEM.clickBehavior !== 'double' || el._suppressNextDblClick) return;
                activateDesktopIcon(el);
            };
            
            return el;
        }

        // 3.5 创建本地文件夹图标 DOM 元素
        function createLocalFolderIconElement(id, name, iconSvg, folderId, pos) {
            const el = document.createElement('div');
            el.className = 'desktop-icon';
            el.id = id;
            el.dataset.localFolder = folderId;
            el.dataset.isdir = 'true'; // 挂载文件夹本质是目录
            el.style.left = pos.x + 'px';
            el.style.top = pos.y + 'px';
            
            // 图标：集中式图标库给的是 <path> 内部片段 → 套统一外壳；
            // JISHENG-OS-APP 应用的自定义图标给的是完整 <svg>（自带 viewBox/配色）→ 原样使用，
            // 不能再嵌套一层、更不能套 .icon-svg（那是描边风格的样式，里面写死 fill:none，会把实心图标洗没）。
            el.innerHTML = (iconSvg && iconSvg.indexOf('<svg') !== -1
                    ? iconSvg
                    : `<svg class="icon-svg xl" viewBox="0 0 24 24">${iconSvg}</svg>`)
                + `<div class="label">${escapeHtml(name)}</div>`;   // 修复：名称按纯文本显示（原来文件名里的 HTML 会被执行）
            
            const handleStart = (e) => {
                if(e.button === 2) return;
                e.stopPropagation();
                if(e.ctrlKey) {
                    toggleIconSelection(el);
                } else if(!SYSTEM.selectedIcons.includes(id)) {
                    clearSelection();
                    selectIcon(el);
                }
                
                if(!longPressTriggered) {
                    startIconDrag(e, el);
                } else {
                    startIconDrag(e, el, true);
                }
            };

            el.onmousedown = handleStart;
            el.ontouchstart = (e) => handleDesktopIconTouchStart(e, el, handleStart);
            el._jishengOpen = () => { openLocalFolder(folderId); clearSelection(); };
            el.onclick = (e) => {
                if (shouldOpenFromSingleClick(e, el)) activateDesktopIcon(el);
            };

            el.oncontextmenu = (e) => {
                e.preventDefault(); e.stopPropagation();
                if(!SYSTEM.selectedIcons.includes(id)) {
                    clearSelection();
                    selectIcon(el);
                }
                const pos = getClientXY(e);
                showLocalFolderContextMenu(pos.x, pos.y, folderId, name);
            };

            el.ondblclick = () => {
                if (SYSTEM.clickBehavior === 'double' && !el._suppressNextDblClick) activateDesktopIcon(el);
            };
            
            return el;
        }

        // 本地文件夹右键菜单
        function showLocalFolderContextMenu(x, y, folderId, name) {
            const folderInfo = SYSTEM.mountedFolders[folderId] || SYSTEM.localFolders[folderId];
            const isDisconnected = folderInfo && folderInfo.disconnected;
            const cm = document.getElementById('context-menu');
            cm.innerHTML = `
                <div class="context-item" onclick="openLocalFolder('${folderId}'); closeCtx()">
                    ${icon('uiOpen','sm')}
                    <span>打开</span>
                </div>
                <div class="context-divider"></div>
                ${isDisconnected ? `<div class="context-item" onclick="remountFolder('${folderId}'); closeCtx()" style="color:var(--accent-cyan)">
                    ${icon('uiEject','sm')}
                    <span>重新挂载</span>
                </div>` : ''}
                <div class="context-item" onclick="unmountLocalFolder('${folderId}'); closeCtx()" style="color:var(--win-close-red)">
                    ${icon('uiEject','sm')}
                    <span>${isDisconnected ? '忘记此文件夹' : '卸载挂载'}</span>
                </div>
            `;
            showCtx(x, y);
        }

        // 4. 图标拖拽逻辑 (Windows 风格)
        let dragState = null;
        function startIconDrag(e, el, isNativeDragMode = false) {
            if (e.touches && e.touches.length > 1) return;

            const pos = getClientXY(e);

            const rect = el.getBoundingClientRect();
            dragState = {
                startX: pos.x, startY: pos.y,
                icons: [], hasMoved: false,
                el: el,
                isNativeDragMode: isNativeDragMode
            };
            
            SYSTEM.selectedIcons.forEach(id => {
                const icon = document.getElementById(id);
                if(icon) {
                    dragState.icons.push({
                        el: icon, id: id,
                        startLeft: icon.offsetLeft, startTop: icon.offsetTop
                    });
                }
            });

            longPressTriggered = false;
            if(longPressTimer) clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                longPressTriggered = true;
                if(dragState && dragState.el && el.dataset.filename) {
                    nativeDragHelper.style.display = 'block';
                    nativeDragHelper.style.left = (pos.x - 40) + 'px';
                    nativeDragHelper.style.top = (pos.y - 45) + 'px';
                    
                    nativeDragHelper.ondragstart = (ev) => {
                        handleNativeDragStart(ev, el.dataset.filename);
                    };
                    
                    dragState.el.style.outline = '2px solid rgba(0, 120, 212, 0.5)';
                }
            }, 400);

            if(!isNativeDragMode) {
                document.addEventListener('mousemove', onIconDragMove);
                document.addEventListener('mouseup', onIconDragEnd);
                document.addEventListener('touchmove', onIconDragMove, { passive: false });
                document.addEventListener('touchend', onIconDragEnd);
            } else {
                document.addEventListener('mouseup', onIconDragEnd);
                document.addEventListener('touchend', onIconDragEnd);
            }
        }

        function onIconDragMove(e) {
            if(!dragState) return;

            // 鼠标在浏览器窗口外松开后又移回页面：按键已松，直接收尾，
            // 否则图标会一直粘在指针上。
            if(e.type === 'mousemove' && e.buttons === 0) {
                onIconDragEnd(e);
                return;
            }

            if(e.type === 'touchmove') e.preventDefault();

            const pos = getClientXY(e);
            const dx = pos.x - dragState.startX;
            const dy = pos.y - dragState.startY;

            if (e.type === 'touchmove' && (Math.abs(dx) > 5 || Math.abs(dy) > 5) && _lastDesktopTouchTapEl === dragState.el) {
                _lastDesktopTouchTapEl = null;
                _lastDesktopTouchTapAt = 0;
            }

            if(!dragState.hasMoved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
                dragState.hasMoved = true;
                // 将图标从桌面容器移到 body，脱离桌面层叠上下文，确保浮在所有窗口上层
                const container = document.getElementById('desktop-icons');
                dragState.icons.forEach(i => {
                    const rect = i.el.getBoundingClientRect();
                    // 记录屏幕坐标作为 fixed 定位的起点
                    i.screenStartLeft = rect.left;
                    i.screenStartTop = rect.top;
                    i.el.classList.add('dragging');
                    i.el.style.position = 'fixed';
                    i.el.style.left = rect.left + 'px';
                    i.el.style.top = rect.top + 'px';
                    document.body.appendChild(i.el);
                });
                dragState._movedToBody = true;
            }

            if(dragState.hasMoved) {
                requestAnimationFrame(() => {
                    if(!dragState) return;
                    dragState.icons.forEach(i => {
                        i.el.style.left = (i.screenStartLeft + dx) + 'px';
                        i.el.style.top = (i.screenStartTop + dy) + 'px';
                    });
                });
                // 实时高亮将要落入的目标（文件夹图标 / 文件夹窗口）
                updateDropHighlight(pos.x, pos.y, dragState.icons.map(i => i.el));
            }
        }

        function onIconDragEnd(e) {
            if (dragState && dragState.hasMoved && dragState.el) {
                dragState.el._ignoreActivationUntil = Date.now() + (e.type === 'touchend' ? 420 : 120);
            }
            nativeDragHelper.style.display = 'none';
            endDropHighlight();
            
            document.removeEventListener('mousemove', onIconDragMove);
            document.removeEventListener('mouseup', onIconDragEnd);
            document.removeEventListener('touchmove', onIconDragMove);
            document.removeEventListener('touchend', onIconDragEnd);
            
            if(longPressTimer) clearTimeout(longPressTimer);
            longPressTriggered = false;

            if(dragState && !dragState.isNativeDragMode && dragState.hasMoved) {
                // 保存引用，因为 dragState 会在后面被置 null
                const icons = dragState.icons;
                const movedToBody = dragState._movedToBody;

                // 修复：必须在图标"移回桌面容器、去掉 .dragging（pointer-events:none）"之前判定投放目标，
                // 否则 elementFromPoint 会命中被拖拽的图标自身，导致拖到桌面文件夹图标上判定失败。
                // 判定规则与拖动过程中的高亮（findDropTargetEl）完全一致：看到哪里亮，就放进哪里。
                const pos = getClientXY(e);
                const dropTarget = (pos.x != null && pos.y != null)
                    ? resolveDesktopDropTarget(pos.x, pos.y, icons.map(i => i.el))
                    : null;

                // === 先将图标移回桌面容器，恢复 absolute 定位 ===
                const container = document.getElementById('desktop-icons');
                if (movedToBody) {
                    icons.forEach(i => {
                        i.el.classList.remove('dragging');
                        i.el.style.position = 'absolute';
                        // 将 fixed 坐标转换为相对于 desktop-icons 的 absolute 坐标
                        const containerRect = container.getBoundingClientRect();
                        const currentLeft = parseFloat(i.el.style.left) || 0;
                        const currentTop = parseFloat(i.el.style.top) || 0;
                        i.el.style.left = (currentLeft - containerRect.left) + 'px';
                        i.el.style.top = (currentTop - containerRect.top) + 'px';
                        container.appendChild(i.el);
                    });
                }

                // === 拖到了文件夹（窗口内容区 / 窗口里的子文件夹 / 桌面文件夹图标 / 挂载文件夹图标）===
                let movedToFolder = false;
                if (dropTarget) {
                    const fileIcons = icons.filter(i => i.el.dataset.filename);
                    if (fileIcons.length > 0) {
                        moveDesktopFilesToFolder(fileIcons, dropTarget.path, dropTarget.name);
                        movedToFolder = true;
                    }
                }

                if (!movedToFolder) {
                    // 使用 requestAnimationFrame 确保 DOM 布局完成后再读取 offsetLeft/offsetTop
                    requestAnimationFrame(() => {
                        const maxW = window.innerWidth - 90;
                        const maxH = window.innerHeight - 100;

                        icons.forEach(i => {
                            i.el.classList.remove('dragging');
                            i.el.style.outline = 'none';
                            let x = Math.round(i.el.offsetLeft / SYSTEM.gridSize) * SYSTEM.gridSize + 24;
                            let y = Math.round(i.el.offsetTop / SYSTEM.gridSize) * SYSTEM.gridSize + 24;

                            x = Math.max(24, Math.min(x, maxW));
                            y = Math.max(24, Math.min(y, maxH));

                            i.el.style.transition = 'all 0.2s';
                            i.el.style.left = x + 'px';
                            i.el.style.top = y + 'px';
                            setTimeout(() => i.el.style.transition = '', 200);

                            SYSTEM.iconPositions[i.id] = {x, y};
                        });
                        saveIconPositions();
                    });
                } else {
                    icons.forEach(i => {
                        i.el.classList.remove('dragging');
                        i.el.style.outline = 'none';
                    });
                }
            }
            dragState = null;
        }

        // 解析"桌面图标拖拽松手"时的投放目标，返回 { path, name } 或 null。
        // 与拖动中的高亮保持一致：
        //   1) 文件夹窗口里的子文件夹项 → 该子文件夹
        //   2) 桌面上的文件夹图标        → 桌面/该文件夹
        //   3) 桌面上的挂载本地文件夹图标 → 其挂载路径
        //   4) 文件夹窗口内容区          → 该窗口当前所在目录（currentPath，支持已进入子目录）
        // 普通文件图标、非文件夹窗口（记事本等）都不是有效目标。
        function resolveDesktopDropTarget(x, y, excludeEls) {
            const t = findDropTargetEl(x, y, excludeEls);
            if (!t) return null;

            if (t.classList.contains('folder-item') || t.classList.contains('folder-grid-item')) {
                const p = t.dataset.path;
                if (!p || t.dataset.isdir !== 'true') return null;
                return { path: p, name: t.dataset.filename || p.split('/').pop() };
            }

            if (t.classList.contains('desktop-icon')) {
                if (t.dataset.localFolder) {
                    const info = SYSTEM.mountedFolders && SYSTEM.mountedFolders[t.dataset.localFolder];
                    if (!info || info.disconnected) return null;
                    return { path: info.mountPath || ('/mnt/local/' + info.name), name: info.name };
                }
                if (t.dataset.filename && t.dataset.isdir === 'true') {
                    return { path: SYSTEM.desktopPath + '/' + t.dataset.filename, name: t.dataset.filename };
                }
                return null;
            }

            if (t.id && t.id.indexOf('folder-content-') === 0) {
                const st = SYSTEM.folderWindowStates && SYSTEM.folderWindowStates[t.id.replace('folder-content-', '')];
                if (st && st.currentPath) {
                    return { path: st.currentPath, name: st.currentPath.split('/').pop() || st.folderName || '文件夹' };
                }
            }
            return null;
        }

        // 校验：src 下的每一个条目在 dest 中都存在（用于"复制后删除源"之前的安全检查，防止丢数据）
        function verifyTreeCopied(src, dest, cb) {
            SYSTEM.fs.readdir(src, (err, names) => {
                if (err) { cb(false); return; }
                if (!names.length) { cb(true); return; }
                let pending = names.length, ok = true;
                const done = (good) => { if (!good) ok = false; if (--pending === 0) cb(ok); };
                names.forEach(n => {
                    SYSTEM.fs.stat(src + '/' + n, (sErr, sSt) => {
                        if (sErr || !sSt) { done(false); return; }
                        SYSTEM.fs.stat(dest + '/' + n, (dErr, dSt) => {
                            if (dErr || !dSt) { done(false); return; }
                            const sDir = typeof sSt.isDirectory === 'function' ? sSt.isDirectory() : !!sSt.isDirectory;
                            if (sDir) verifyTreeCopied(src + '/' + n, dest + '/' + n, done);
                            else done(true);
                        });
                    });
                });
            });
        }

        // 将桌面上的文件 / 文件夹移动到指定文件夹
        // 修复：
        //  - 原实现只做 readFile → writeFile → unlink：文件的修改日期被刷成"现在"，文件夹直接 EISDIR 失败；
        //  - 现在优先用 fs.rename（内核已包装：会把修改日期缓存连同整棵子树迁移到新路径），
        //    rename 失败（如跨挂载点）时回退：文件 = 读 → 写 → 回写原 mtime → 删源；
        //    文件夹 = copyFolderRecursive（逐级保留 mtime）→ 校验完整 → 删源；
        //  - 防止把文件夹移进它自己或其子文件夹；同名冲突时文件可覆盖、文件夹可合并、类型不同则拒绝。
        function moveDesktopFilesToFolder(fileIcons, targetPath, targetFolderName) {
            const normTarget = String(targetPath).replace(/\/+$/, '') || '/';
            const desktopNorm = String(SYSTEM.desktopPath).replace(/\/+$/, '');
            const isDirStat = (st) => !!st && (typeof st.isDirectory === 'function' ? st.isDirectory() : !!st.isDirectory);
            const total = fileIcons.length;
            let movedCount = 0, skippedCount = 0, errorCount = 0;
            const errorMsgs = [];

            const finish = () => {
                const srcPaths = fileIcons.map(icon => SYSTEM.desktopPath + '/' + icon.el.dataset.filename);
                refreshAllAffectedWindows(normTarget, srcPaths, true);
                if (errorCount > 0) {
                    Notify.warning('部分失败', `成功 ${movedCount} 个，失败 ${errorCount} 个` + (errorMsgs.length ? `：${errorMsgs.slice(0, 2).join('；')}` : ''));
                } else if (movedCount > 0) {
                    Notify.success('移动成功', `已将 ${movedCount} 个项目移动到 "${targetFolderName}"`);
                }
            };

            const processNext = (index) => {
                if (index >= total) { finish(); return; }

                const icon = fileIcons[index];
                const filename = icon.el.dataset.filename;
                const srcPath = SYSTEM.desktopPath + '/' + filename;
                const destPath = normTarget + '/' + filename;
                const next = () => processNext(index + 1);
                const fail = (msg, err) => {
                    errorCount++;
                    errorMsgs.push(`"${filename}" ${msg}`);
                    console.error('移动到文件夹失败:', filename, msg, err || '');
                    next();
                };
                const onMoved = () => {
                    movedCount++;
                    icon.el.remove();
                    delete SYSTEM.iconPositions[icon.id];
                    saveIconPositions();
                    next();
                };

                // 目标就是桌面本身（例如打开的文件夹窗口正停在桌面目录）：原地不动
                if (normTarget === desktopNorm || srcPath === destPath) { skippedCount++; next(); return; }
                // 不能把文件夹移动到它自身或它的子文件夹里（否则复制回退会无限递归）
                if (normTarget === srcPath || normTarget.indexOf(srcPath + '/') === 0) {
                    skippedCount++;
                    Notify.warning('无法移动', `不能将 "${filename}" 移动到它自身或其子文件夹中`);
                    next();
                    return;
                }

                SYSTEM.fs.stat(srcPath, (sErr, sStats) => {
                    if (sErr || !sStats) { fail('无法访问', sErr); return; }
                    const srcIsDir = isDirStat(sStats);
                    // 源的修改时间（经内核包装的 stat，已包含缓存中的原始日期）
                    const srcMtime = sStats.mtime || null;

                    // —— 文件：rename，失败则 读→写→回写 mtime→删源 ——
                    const moveFile = () => {
                        SYSTEM.fs.rename(srcPath, destPath, (renameErr) => {
                            if (!renameErr) { onMoved(); return; }
                            SYSTEM.fs.readFile(srcPath, (readErr, data) => {
                                if (readErr) { fail('读取失败', readErr); return; }
                                SYSTEM.fs.writeFile(destPath, data, (writeErr) => {
                                    if (writeErr) { fail('写入失败', writeErr); return; }
                                    if (srcMtime && SYSTEM.fs.utimes) {
                                        try { SYSTEM.fs.utimes(destPath, srcMtime, srcMtime, () => {}); } catch (_) {}
                                    }
                                    SYSTEM.fs.unlink(srcPath, (unlinkErr) => {
                                        if (unlinkErr) { fail('已复制到目标，但删除桌面原文件失败', unlinkErr); return; }
                                        onMoved();
                                    });
                                });
                            });
                        });
                    };

                    // —— 文件夹：复制（保留 mtime）→ 校验 → 删源 ——
                    const copyThenDeleteDir = () => {
                        copyFolderRecursive(srcPath, destPath, (copyErr) => {
                            if (copyErr) { fail('复制失败', copyErr); return; }
                            verifyTreeCopied(srcPath, destPath, (ok) => {
                                if (!ok) { fail('复制不完整，已保留桌面上的原文件夹'); return; }
                                // 合并到已存在的目标文件夹时，copyFolderRecursive 会把目标文件夹日期改成源的日期——
                                // 这正是"移动"的语义（被移动的那个文件夹日期保持不变）
                                deleteFolderRecursive(srcPath, (delErr) => {
                                    if (delErr) console.error('移动文件夹：删除源失败', filename, delErr);
                                    onMoved();
                                });
                            });
                        });
                    };

                    const moveDir = (destExists) => {
                        if (destExists) { copyThenDeleteDir(); return; }   // 合并：rename 不能覆盖目录
                        SYSTEM.fs.rename(srcPath, destPath, (renameErr) => {
                            if (!renameErr) { onMoved(); return; }
                            copyThenDeleteDir();                          // 跨挂载点等情况
                        });
                    };

                    SYSTEM.fs.stat(destPath, async (dErr, dStats) => {
                        const destExists = !dErr && !!dStats;
                        if (destExists) {
                            const destIsDir = isDirStat(dStats);
                            if (destIsDir !== srcIsDir) {
                                fail(`目标位置已存在同名${destIsDir ? '文件夹' : '文件'}，无法覆盖`);
                                return;
                            }
                            const ok = await SysDialog.confirm({
                                title: srcIsDir ? '文件夹已存在' : '文件已存在',
                                icon: 'uiWarning', danger: true,
                                okText: srcIsDir ? '合并' : '覆盖',
                                message: srcIsDir
                                    ? `文件夹 "${filename}" 已存在于 "${targetFolderName}"，是否合并？（同名文件将被覆盖）`
                                    : `文件 "${filename}" 已存在于 "${targetFolderName}"，是否覆盖？`
                            });
                            if (!ok) { skippedCount++; next(); return; }
                        }
                        if (srcIsDir) moveDir(destExists); else moveFile();
                    });
                });
            };

            processNext(0);
        }

        // 5. 框选与选择逻辑
        function initDesktopEvents() {
            const desktop = document.getElementById('desktop');
            const box = document.getElementById('selection-box');
            let isSelecting = false, startX, startY;

            const handleStart = (e) => {
                if(e.target !== desktop && e.target !== document.getElementById('desktop-icons')) return;
                if(e.button === 2) return;

                clearSelection();
                isSelecting = true;
                
                const pos = getClientXY(e);
                startX = pos.x; 
                startY = pos.y;
                
                box.style.display = 'block';
                box.style.width = '0'; box.style.height = '0';
                box.style.left = startX + 'px'; box.style.top = startY + 'px';
            };

            const handleMove = (e) => {
                if(!isSelecting) return;
                
                if(e.type === 'touchmove') e.preventDefault();
                
                const pos = getClientXY(e);
                const curX = pos.x; 
                const curY = pos.y;
                
                const left = Math.min(startX, curX), top = Math.min(startY, curY);
                const width = Math.abs(startX - curX), height = Math.abs(startY - curY);
                
                box.style.left = left + 'px'; box.style.top = top + 'px';
                box.style.width = width + 'px'; box.style.height = height + 'px';

                document.querySelectorAll('.desktop-icon').forEach(icon => {
                    const r = icon.getBoundingClientRect();
                    const intersect = !(r.right < left || r.left > left+width || r.bottom < top || r.top > top+height);
                    if(intersect) selectIcon(icon); else deselectIcon(icon);
                });
            };

            const handleEnd = () => {
                isSelecting = false; 
                box.style.display = 'none';
            };

            // 先移除旧的事件监听器，防止重复注册
            document.removeEventListener('mousemove', handleMove);
            document.removeEventListener('touchmove', handleMove);
            document.removeEventListener('mouseup', handleEnd);
            document.removeEventListener('touchend', handleEnd);

            desktop.onmousedown = handleStart;
            desktop.ontouchstart = handleStart;

            document.addEventListener('mousemove', handleMove);
            document.addEventListener('touchmove', handleMove, {passive: false});

            document.addEventListener('mouseup', handleEnd);
            document.addEventListener('touchend', handleEnd);
            
            desktop.ondragover = e => {
                e.preventDefault();
                // 自己拖出去的东西又拖回系统内：不接收，光标显示"不可放置"
                if (isInternalNativeDrag(e)) { try { e.dataTransfer.dropEffect = 'none'; } catch(_) {} }
            };
            desktop.ondrop = async (e) => {
                e.preventDefault();

                // 拖出到真实桌面的过程中又放回系统内部 —— 什么都不做
                if (isInternalNativeDrag(e)) return;

                // === 定义防抖刷新函数 (核心修复) ===
                // 只有当文件停止写入 200ms 后，才执行一次刷新
                let refreshTimer = null;
                const debouncedRefresh = () => {
                    if (refreshTimer) clearTimeout(refreshTimer);
                    refreshTimer = setTimeout(() => {
                        refreshDesktop();
                        Notify.success('导入完成', '所有文件已更新');
                    }, 200);
                };

                // 1. 处理系统内部文件拖拽
                const dragData = e.dataTransfer.getData('text/plain');
                if (dragData) {
                    try {
                        const { srcPath, filename } = JSON.parse(dragData);
                        if (srcPath && filename) {
                            const destPath = SYSTEM.desktopPath + '/' + filename;
                            // 拖回原位置（已在桌面）无需处理
                            if (srcPath === destPath) return;
                            // 修复(#11)：先判断源是文件还是目录。
                            // 目录不能用 readFile，需要递归复制，否则会静默失败。
                            SYSTEM.fs.stat(srcPath, (statErr, stats) => {
                                if (statErr || !stats) { Notify.error('移动失败', '无法访问源项目'); return; }
                                const isDir = stats.isDirectory ? (typeof stats.isDirectory === 'function' ? stats.isDirectory() : stats.isDirectory) : false;
                                const afterDone = () => {
                                    SYSTEM.iconPositions['file-' + filename] = { x: e.clientX - 40, y: e.clientY - 40 };
                                    saveIconPositions();
                                    refreshDesktop();
                                };
                                if (isDir) {
                                    copyFolderRecursive(srcPath, destPath, (copyErr) => {
                                        if (copyErr) { Notify.error('移动失败', copyErr.message); return; }
                                        afterDone();
                                    });
                                } else {
                                    SYSTEM.fs.readFile(srcPath, (err, data) => {
                                        if (err) { Notify.error('移动失败', err.message); return; }
                                        SYSTEM.fs.writeFile(destPath, data, (wErr) => {
                                            if (wErr) { Notify.error('移动失败', wErr.message); return; }
                                            // 保留源文件原始修改时间（stats 来自包装过的 stat，已含缓存值）
                                            if (stats.mtime && SYSTEM.fs.utimes) {
                                                try { SYSTEM.fs.utimes(destPath, stats.mtime, stats.mtime, () => {}); } catch(_) {}
                                            }
                                            afterDone();
                                        });
                                    });
                                }
                            });
                        }
                    } catch (e) { }
                    return;
                }

                // 2. 处理外部拖拽 (应用防抖逻辑)
                const items = e.dataTransfer.items;
                if (items && items.length > 0) {
                    let processCount = 0;
                    
                    // 递归扫描函数
                    const traverseFileTree = (item, path) => {
                        path = path || "";
                        if (item.isFile) {
                            item.file((file) => {
                                const reader = new FileReader();
                                reader.onload = (ev) => {
                                    const buffer = SYSTEM.Buffer.from(ev.target.result);
                                    const fullPath = SYSTEM.desktopPath + (path ? '/' + path : '') + '/' + file.name;
                                    const parentDir = fullPath.substring(0, fullPath.lastIndexOf('/'));
                                    
                                    ensureDir(parentDir).then(() => {
                                        SYSTEM.fs.writeFile(fullPath, buffer, (wErr) => {
                                            // 保留拖入文件的原始修改时间
                                            if (!wErr && file.lastModified && SYSTEM.fs.utimes) {
                                                try { SYSTEM.fs.utimes(fullPath, file.lastModified, file.lastModified, () => {}); } catch(_) {}
                                            }
                                            processCount++;
                                            // 如果是根目录文件，记录位置
                                            if(!path) {
                                                SYSTEM.iconPositions['file-' + file.name] = { x: e.clientX - 40 + (processCount*10), y: e.clientY - 40 + (processCount*10) };
                                                saveIconPositions();
                                            }
                                            
                                            // 【重点】这里不再直接调用 refreshDesktop()
                                            // 而是调用防抖函数，防止图标重叠变粗
                                            debouncedRefresh();
                                        });
                                    });
                                };
                                reader.readAsArrayBuffer(file);
                            });
                        } else if (item.isDirectory) {
                            const dirPath = (path ? path + '/' : '') + item.name;
                            const fullDirPath = SYSTEM.desktopPath + '/' + dirPath;
                            
                            if(!path) {
                                SYSTEM.iconPositions['file-' + item.name] = { x: e.clientX - 40, y: e.clientY - 40 };
                                saveIconPositions();
                            }

                            ensureDir(fullDirPath).then(() => {
                                // 保留拖入文件夹的原始修改时间（Chromium 支持 Entry.getMetadata；不支持的浏览器静默跳过）。
                                // mtimeCache 是按路径覆盖的，后续写入子文件不会把它冲掉，所以这里直接写即可。
                                try {
                                    if (typeof item.getMetadata === 'function' && SYSTEM.fs.utimes) {
                                        item.getMetadata((md) => {
                                            const t = md && md.modificationTime ? new Date(md.modificationTime).getTime() : 0;
                                            if (t && !isNaN(t)) {
                                                try { SYSTEM.fs.utimes(fullDirPath, t, t, () => {}); } catch(_) {}
                                                debouncedRefresh();
                                            }
                                        }, () => {});
                                    }
                                } catch(_) {}
                                // 文件夹创建后也调用防抖刷新
                                debouncedRefresh();
                                
                                const dirReader = item.createReader();
                                const readEntries = () => {
                                    dirReader.readEntries((entries) => {
                                        if (entries.length > 0) {
                                            entries.forEach((entry) => traverseFileTree(entry, dirPath));
                                            readEntries();
                                        }
                                    });
                                };
                                readEntries();
                            });
                        }
                    };

                    for (let i = 0; i < items.length; i++) {
                        const item = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
                        if (item) traverseFileTree(item);
                    }
                    
                    Notify.info('正在处理', '开始导入文件结构...');
                }
            };
        }

        // 辅助函数：选择/取消选择
        function selectIcon(el) {
            if(!SYSTEM.selectedIcons.includes(el.id)) {
                SYSTEM.selectedIcons.push(el.id);
                el.classList.add('selected');
            }
        }
        function deselectIcon(el) {
            const idx = SYSTEM.selectedIcons.indexOf(el.id);
            if(idx > -1) { SYSTEM.selectedIcons.splice(idx, 1); el.classList.remove('selected'); }
        }
        function toggleIconSelection(el) {
            if(SYSTEM.selectedIcons.includes(el.id)) deselectIcon(el); else selectIcon(el);
        }
        function clearSelection() {
            SYSTEM.selectedIcons.forEach(id => document.getElementById(id)?.classList.remove('selected'));
            SYSTEM.selectedIcons = [];
        }

        // 6. 新的右键菜单逻辑 (支持多选)
        function showIconContextMenu(x, y) {
            const cm = document.getElementById('context-menu');
            
            const targetEl = document.elementFromPoint(x, y)?.closest('.desktop-icon');
            if (!targetEl) return;

            const targetId = targetEl.id;
            const isSystemApp = !targetId.startsWith('file-') && !targetEl.dataset.localFolder;
            const isLocalFolder = !!targetEl.dataset.localFolder;
            
            if (isSystemApp) {
                cm.innerHTML = `
                    <div class="context-item" onclick="activateDesktopIcon(document.getElementById('${targetId}')); closeCtx()">
                        ${icon('uiOpen','sm')}
                        <span>打开</span>
                    </div>
                `;
                showCtx(x, y);
                return;
            }

            const selectedFiles = SYSTEM.selectedIcons.filter(id => id.startsWith('file-') || document.getElementById(id)?.dataset.localFolder);
            const count = selectedFiles.length;
            
            const filename = targetEl.dataset.filename;
            
            let html = '';
            
            html += `
                <div class="context-item" onclick="activateDesktopIcon(document.getElementById('${targetId}')); closeCtx()">
                    ${icon('uiOpen','sm')}
                    <span>打开</span>
                </div>
            `;

            // 「打开方式」：仅单选、非挂载文件夹、且为可指定打开方式的文件类型时显示
            if (!isLocalFolder && filename && count <= 1 && canOpenWith(filename)) {
                const dfFullPath = escapeAttr(SYSTEM.desktopPath + '/' + filename);
                const dfFilename = escapeAttr(filename);
                html += `<div class="context-divider"></div>` + buildOpenWithMenu(dfFullPath, dfFilename, filename);
            }

            // 「设为桌面壁纸」：仅单选的图片文件显示
            if (!isLocalFolder && filename && count <= 1 && isImageFile(filename)) {
                const wpPathArg = escapeAttr(JSON.stringify(SYSTEM.desktopPath + '/' + filename));
                const wpNameArg = escapeAttr(JSON.stringify(filename));
                html += `<div class="context-divider"></div>
                <div class="context-item" onclick="setWallpaperFromPath(${wpPathArg}, ${wpNameArg}); closeCtx()">
                    ${icon('uiWallpaperCtx','sm')}
                    <span>设为桌面壁纸</span>
                </div>`;
            }

            if (!isLocalFolder && filename && isArchiveFile(filename)) {
                html += `
                <div class="context-item" onclick="extractZip('${filename}'); closeCtx()">
                    ${icon('uiExtractSimple','sm')}
                    <span>解压</span>
                </div>`;
            }

            html += `<div class="context-divider"></div>`;

            // 添加复制/剪切选项
            const countLabel = count > 1 ? ` (${count})` : '';
            html += `
                <div class="context-item" onclick="copySelectedDesktopItems(); closeCtx()">
                    ${icon('uiCopy','sm')}
                    <span>复制${countLabel}</span>
                </div>
                <div class="context-item" onclick="cutSelectedDesktopItems(); closeCtx()">
                    ${icon('uiCut','sm')}
                    <span>剪切${countLabel}</span>
                </div>
            `;

            if (count > 1) {
                html += `
                    <div class="context-divider"></div>
                    <div class="context-item" onclick="downloadSelectedFiles(); closeCtx()">
                        ${icon('uiDownload','sm')}
                        <span>下载选中 (${count})</span>
                    </div>
                    <div class="context-item" onclick="deleteSelected(); closeCtx()" style="color:var(--win-close-red)">
                        ${icon('uiDelete','sm')}
                        <span>删除选中 (${count})</span>
                    </div>
                `;
            } else {
                if (isLocalFolder) {
                    const folderId = targetEl.dataset.localFolder;
                    html += `
                        <div class="context-item" onclick="unmountLocalFolder('${folderId}'); closeCtx()" style="color:var(--win-close-red)">
                            ${icon('uiEject','sm')}
                            <span>卸载挂载</span>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="context-item" onclick="downloadFile('${filename}'); closeCtx()">
                            ${icon('uiDownload','sm')}
                            <span>下载</span>
                        </div>
                        <div class="context-item" onclick="renameDesktopFile('${filename}'); closeCtx()">
                            ${icon('uiRename','sm')}
                            <span>重命名</span>
                        </div>
                        <div class="context-item" onclick="deleteFile('${filename}'); closeCtx()" style="color:var(--win-close-red)">
                            ${icon('uiDeleteSimple','sm')}
                            <span>删除</span>
                        </div>
