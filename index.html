                                    <button class="npx-btn" data-mode="strip" title="长条阅读（漫画）">${icon('uiRows')}<span class="lbl">长条</span></button>
                                </span>
                                <span class="npx-sp"></span>
                                <span class="imv-info"></span>
                                <button class="npx-btn icon" data-act="full" title="全屏 (F)">${icon('uiFullscreen')}</button>
                            </div>
                            <div class="imv-stage">
                                <img alt="" draggable="false">
                                <button class="imv-nav prev" data-act="prev" title="上一张">${icon('uiChevronLeft')}</button>
                                <button class="imv-nav next" data-act="next" title="下一张">${icon('uiChevronRight')}</button>
                                <div class="imv-msg"></div>
                            </div>
                            <div class="imv-strip" style="display:none"></div>
                        </div>`,
                    onInit: (w, winId) => {
                        const $ = q => w.querySelector(q);
                        const stage = $('.imv-stage'), img = $('.imv-stage > img'), msg = $('.imv-msg'), strip = $('.imv-strip');
                        const posEl = $('.imv-pos'), zoomEl = $('.imv-zoom'), infoEl = $('.imv-info'), titleEl = w.querySelector('.window-title-text');
                        let idx = Math.max(0, list.indexOf(targetFilename));
                        let closed = false;
                        // —— 读取与缓存 ——
                        const cache = new Map();   // name -> Promise<{url,size}>
                        const sizes = {};
                        const load = name => {
                            if (cache.has(name)) { const p = cache.get(name); cache.delete(name); cache.set(name, p); return p; }
                            const p = new Promise(resolve => SYSTEM.fs.readFile(folderPath + '/' + name, (e, data) => {
                                if (e || closed) { resolve(null); return; }
                                const ext = (name.split('.').pop() || '').toLowerCase();
                                resolve({ url: URL.createObjectURL(new Blob([data], { type: IMG_MIME[ext] || '' })), size: data.length || data.byteLength || 0 });
                            }));
                            cache.set(name, p);
                            return p;
                        };
                        const keep = new Set();
                        const trim = () => {   // 单张模式只保留最近 8 张
                            if (mode !== 'single') return;
                            while (cache.size > 8) {
                                const k = [...cache.keys()].find(n => !keep.has(n));
                                if (!k) break;
                                const p = cache.get(k); cache.delete(k);
                                p.then(r => r && URL.revokeObjectURL(r.url));
                            }
                        };
                        const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b >= 1024 ? Math.round(b / 1024) + ' KB' : b + ' B';
                        // —— 单张模式 ——
                        const v = { s: 1, x: 0, y: 0, rot: 0, fit: true, nw: 0, nh: 0 };
                        const dims = () => (v.rot % 180 ? [v.nh, v.nw] : [v.nw, v.nh]);
                        const fitScale = () => { const [iw, ih] = dims(); if (!iw) return 1; return Math.min(1, (stage.clientWidth - 24) / iw, (stage.clientHeight - 24) / ih); };
                        const apply = () => {
                            const [iw, ih] = dims();
                            // 小于窗口时居中，大于窗口时限制平移范围
                            const W = stage.clientWidth, H = stage.clientHeight, dw = iw * v.s, dh = ih * v.s;
                            v.x = dw <= W ? (W - dw) / 2 : Math.min(0, Math.max(W - dw, v.x));
                            v.y = dh <= H ? (H - dh) / 2 : Math.min(0, Math.max(H - dh, v.y));
                            // 旋转后的平移补偿：先按旋转中心转，再放到 (x, y)
                            const r = v.rot % 360, ox = r === 90 ? v.nh * v.s : r === 180 ? v.nw * v.s : 0, oy = r === 180 ? v.nh * v.s : r === 270 ? v.nw * v.s : 0;
                            img.style.transform = `translate(${v.x + ox}px, ${v.y + oy}px) rotate(${r}deg) scale(${v.s})`;
                            zoomEl.textContent = Math.round(v.s * 100) + '%';
                            stage.classList.toggle('grab', dw > W + 1 || dh > H + 1);
                            stage.classList.toggle('pixel', v.s >= 3);
                        };
                        const setFit = () => { v.fit = true; v.s = fitScale(); apply(); };
                        const zoomAt = (ns, cx, cy) => {
                            ns = Math.max(0.05, Math.min(16, ns));
                            if (cx == null) { cx = stage.clientWidth / 2; cy = stage.clientHeight / 2; }
                            v.x = cx - (cx - v.x) * ns / v.s; v.y = cy - (cy - v.y) * ns / v.s; v.s = ns; v.fit = false; apply();
                        };
                        const STEPS = [0.05, 0.1, 0.15, 0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2, 3, 4, 6, 8, 12, 16];
                        const step = d => { const cur = v.s; const n = d > 0 ? STEPS.find(z => z > cur * 1.01) : [...STEPS].reverse().find(z => z < cur * 0.99); zoomAt(n || cur); };
                        let showSeq = 0;
                        const show = async i => {
                            idx = (i + list.length) % list.length;
                            const name = list[idx], seq = ++showSeq;
                            posEl.textContent = `${idx + 1} / ${list.length}`;
                            if (titleEl) titleEl.textContent = '图片查看器 - ' + name;
                            w.querySelectorAll('[data-act=prev],[data-act=next]').forEach(b => b.disabled = list.length < 2);
                            keep.clear(); [idx - 1, idx, idx + 1].forEach(k => keep.add(list[(k + list.length) % list.length]));
                            if (mode !== 'single') return;
                            msg.textContent = '';
                            const r = await load(name);
                            if (seq !== showSeq || closed) return;
                            if (!r) { img.style.visibility = 'hidden'; msg.textContent = '无法读取这张图片'; infoEl.textContent = name; return; }
                            sizes[name] = r.size;
                            const tmp = new Image();
                            tmp.onload = () => {
                                if (seq !== showSeq || closed) return;
                                img.src = r.url; img.style.visibility = '';
                                v.nw = tmp.naturalWidth || 300; v.nh = tmp.naturalHeight || 300; v.rot = 0;
                                img.style.width = v.nw + 'px'; img.style.height = v.nh + 'px';
                                infoEl.textContent = `${name} · ${tmp.naturalWidth}×${tmp.naturalHeight} · ${fmtSize(r.size)}`;
                                infoEl.title = name;
                                setFit();
                                // 预读前后各一张
                                if (list.length > 1) { load(list[(idx + 1) % list.length]); load(list[(idx - 1 + list.length) % list.length]); }
                                trim();
                            };
                            tmp.onerror = () => { if (seq === showSeq) { img.style.visibility = 'hidden'; msg.textContent = '不支持的图片格式或文件已损坏'; infoEl.textContent = name; } };
                            tmp.src = r.url;
                        };
                        // 拖动平移 / 双击
                        let drag = null;
                        stage.addEventListener('pointerdown', e => {
                            if (e.target.closest('.imv-nav') || e.button !== 0) return;
                            drag = { x: e.clientX, y: e.clientY, vx: v.x, vy: v.y };
                            stage.setPointerCapture(e.pointerId); stage.classList.add('grabbing');
                        });
                        stage.addEventListener('pointermove', e => { if (!drag) return; v.x = drag.vx + e.clientX - drag.x; v.y = drag.vy + e.clientY - drag.y; v.fit = false; apply(); });
                        const endDrag = () => { drag = null; stage.classList.remove('grabbing'); };
                        stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
                        stage.addEventListener('dblclick', e => {
                            if (e.target.closest('.imv-nav')) return;
                            const r = stage.getBoundingClientRect();
                            if (v.fit && Math.abs(v.s - 1) > 0.01) zoomAt(1, e.clientX - r.left, e.clientY - r.top); else setFit();
                        });
                        stage.addEventListener('wheel', e => {
                            e.preventDefault();
                            const r = stage.getBoundingClientRect();
                            zoomAt(v.s * Math.pow(1.0015, -e.deltaY), e.clientX - r.left, e.clientY - r.top);
                        }, { passive: false });
                        new ResizeObserver(() => { if (mode === 'single') v.fit ? setFit() : apply(); }).observe(stage);
                        // —— 长条模式 ——
                        let io = null, stripBuilt = false;
                        const buildStrip = () => {
                            if (stripBuilt) return;
                            stripBuilt = true;
                            strip.innerHTML = list.map((n, i) => `<div class="pg" data-i="${i}">${escapeHtml(n)}</div>`).join('');
                            io = new IntersectionObserver(ents => ents.forEach(en => {
                                if (!en.isIntersecting) return;
                                const pg = en.target; io.unobserve(pg);
                                load(list[+pg.dataset.i]).then(r => {
                                    if (!r || closed) { pg.textContent = '无法读取：' + list[+pg.dataset.i]; return; }
                                    const im = new Image(); im.alt = list[+pg.dataset.i]; im.draggable = false;
                                    im.onload = () => { pg.textContent = ''; pg.classList.add('ok'); pg.appendChild(im); };
                                    im.onerror = () => { pg.textContent = '无法显示：' + list[+pg.dataset.i]; };
                                    im.src = r.url;
                                });
                            }), { root: strip, rootMargin: '1200px 0px' });
                            strip.querySelectorAll('.pg').forEach(pg => io.observe(pg));
                        };
                        let stripTick = 0;
                        strip.addEventListener('scroll', () => {
                            if (stripTick) return;
                            stripTick = requestAnimationFrame(() => {
                                stripTick = 0;
                                const mid = strip.scrollTop + strip.clientHeight / 3;
                                const pgs = strip.children; let i = 0;
                                for (let k = 0; k < pgs.length; k++) { if (pgs[k].offsetTop <= mid) i = k; else break; }
                                if (i !== idx) { idx = i; posEl.textContent = `${idx + 1} / ${list.length}`; if (titleEl) titleEl.textContent = '图片查看器 - ' + list[idx]; infoEl.textContent = list[idx]; }
                            });
                        }, { passive: true });
                        const stripGo = i => { idx = (i + list.length) % list.length; const pg = strip.children[idx]; if (pg) pg.scrollIntoView({ block: 'start' }); posEl.textContent = `${idx + 1} / ${list.length}`; };
                        // —— 模式切换 ——
                        const setMode = (m, save) => {
                            mode = m;
                            if (save) try { localStorage.setItem(IMV_MODE_KEY, m); } catch (_) {}
                            w.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
                            $('.imv-single-tools').style.display = m === 'single' ? 'contents' : 'none';
                            stage.style.display = m === 'single' ? '' : 'none';
                            strip.style.display = m === 'strip' ? '' : 'none';
                            if (m === 'strip') { buildStrip(); infoEl.textContent = list[idx]; requestAnimationFrame(() => stripGo(idx)); }
                            else show(idx);
                        };
                        const go = d => mode === 'single' ? show(idx + d) : stripGo(idx + d);
                        w.querySelectorAll('[data-act=prev]').forEach(b => b.onclick = () => go(-1));
                        w.querySelectorAll('[data-act=next]').forEach(b => b.onclick = () => go(1));
                        $('[data-act=zin]').onclick = () => step(1);
                        $('[data-act=zout]').onclick = () => step(-1);
                        $('[data-act=fit]').onclick = setFit;
                        zoomEl.onclick = () => (v.fit && Math.abs(v.s - 1) > 0.01) ? zoomAt(1) : setFit();
                        $('[data-act=rot]').onclick = () => { v.rot = (v.rot + 90) % 360; setFit(); };
                        $('[data-act=full]').onclick = () => toggleWinFullscreen(winId, 'manga');
                        w.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode, true));
                        const onKey = e => {
                            if (!w.classList.contains('focused') || w.classList.contains('minimized') || e.ctrlKey || e.metaKey || e.altKey) return;
                            const t = e.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
                            if (document.querySelector('.sys-dialog-overlay')) return;
                            const k = e.key; let hit = true;
                            if (k === 'ArrowLeft' || k === 'PageUp') go(-1);
                            else if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && mode === 'single')) go(1);
                            else if (k === 'Home') mode === 'single' ? show(0) : stripGo(0);
                            else if (k === 'End') mode === 'single' ? show(list.length - 1) : stripGo(list.length - 1);
                            else if (k === 'f' || k === 'F') toggleWinFullscreen(winId, 'manga');
                            else if (k === 'Escape' && w.classList.contains('truly-fullscreen')) toggleWinFullscreen(winId, 'manga');
                            else if (mode !== 'single') hit = false;
                            else if (k === '+' || k === '=') step(1);
                            else if (k === '-') step(-1);
                            else if (k === '0') setFit();
                            else if (k === '1') zoomAt(1);
                            else if (k === 'r' || k === 'R') { v.rot = (v.rot + 90) % 360; setFit(); }
                            else hit = false;
                            if (hit) e.preventDefault();
                        };
                        document.addEventListener('keydown', onKey);
                        w.cleanup = () => {
                            closed = true;
                            document.removeEventListener('keydown', onKey);
                            if (io) io.disconnect();
                            cache.forEach(p => p.then(r => r && URL.revokeObjectURL(r.url)));
                            cache.clear();
                        };
                        setMode(mode, false);
                    }
                });
            });
        }

        // === V86 虚拟机应用 ===
        function openV86(diskPath) {
            const winId = createWindow({
                title: 'V86 虚拟机',
                winType: 'v86',
                iconHtml: icon('appVM', 'sm'),
                width: 800, height: 600,
                content: `
                    <div class="npx v86-app">
                        <div class="npx-bar v86-toolbar" role="toolbar" aria-label="虚拟机工具栏">
                            <input type="file" id="v86-file-${SYSTEM.idCounter+1}" accept=".img,.iso,.bin" style="display:none">
                            <button class="npx-btn" onclick="document.getElementById('v86-file-${SYSTEM.idCounter+1}').click()" title="选择 .img / .iso / .bin 镜像">${icon('uiUpload')}<span class="lbl">加载镜像</span></button>
                            <span class="npx-sep"></span>
                            <button class="npx-btn" id="v86-pause-${SYSTEM.idCounter+1}" disabled title="暂停 / 继续">${icon('uiPause')}<span class="lbl">暂停</span></button>
                            <button class="npx-btn" id="v86-reset-${SYSTEM.idCounter+1}" disabled title="重启虚拟机">${icon('uiBrowserRefresh')}<span class="lbl">重置</span></button>
                            <span class="npx-sp"></span>
                            <span class="npx-status"><i></i><span class="main" id="v86-status-${SYSTEM.idCounter+1}">就绪</span></span>
                        </div>
                        <div class="v86-screen-container" id="v86-screen-${SYSTEM.idCounter+1}">
                            <div style="white-space: pre; font: 14px monospace; line-height: 14px; display: none;"></div>
                            <canvas style="display:none"></canvas>
                            <div class="v86-empty" id="v86-placeholder-${SYSTEM.idCounter+1}">
                                ${icon('uiMonitor','xl')}
                                <p class="t">还没有运行的虚拟机</p>
                                <p class="d">加载一个软盘或光盘镜像（.img / .iso / .bin）即可启动</p>
                                <button class="npx-btn v86-empty-btn" onclick="document.getElementById('v86-file-${SYSTEM.idCounter+1}').click()">${icon('uiUpload')}<span>选择镜像…</span></button>
                            </div>
                        </div>
                    </div>
                `,
                onInit: (w, id) => {
                    let emulator = null;
                    const screenContainer = document.getElementById(`v86-screen-${id}`);
                    const placeholder = document.getElementById(`v86-placeholder-${id}`);
                    const statusText = document.getElementById(`v86-status-${id}`);
                    const fileInput = document.getElementById(`v86-file-${id}`);
                    const resetBtn = document.getElementById(`v86-reset-${id}`);
                    const pauseBtn = document.getElementById(`v86-pause-${id}`);
                    let paused = false;
                    const statusBox = statusText.parentElement;
                    const setRunning = on => {
                        pauseBtn.disabled = resetBtn.disabled = !on;
                        paused = false;
                        pauseBtn.innerHTML = icon('uiPause') + '<span class="lbl">暂停</span>';
                        statusBox.classList.toggle('saved', on); statusBox.classList.remove('dirty');
                    };
                    const updateStatus = (msg, showNotify = false) => {
                        statusText.innerText = msg;
                        if (showNotify) {
                            Notify.info('V86', msg);
                        }
                    };

                    // 鼠标锁定功能
                    const lockMouse = async () => {
                        if (!emulator) return;
                        try {
                            await screenContainer.requestPointerLock();
                        } catch (err) {
                            console.log('鼠标锁定失败:', err);
                        }
                    };

                    const unlockMouse = () => {
                        if (document.pointerLockElement === screenContainer) {
                            document.exitPointerLock();
                        }
                    };

                    // 监听指针锁定变化
                    const onPointerLockChange = () => {
                        if (document.pointerLockElement === screenContainer) {
                            screenContainer.classList.add('locked');
                        } else {
                            screenContainer.classList.remove('locked');
                        }
                    };

                    document.addEventListener('pointerlockchange', onPointerLockChange);

                    // 点击屏幕锁定鼠标
                    screenContainer.addEventListener('click', (e) => {
                        if (emulator && document.pointerLockElement !== screenContainer) {
                            lockMouse();
                        }
                    });

                    // 清理函数
                    // 修复：原来挂在 w.onDestroy（DOM 元素）上，而 closeWin 只调用 element.cleanup，
                    // 导致关掉窗口后虚拟机仍在后台运行、持续占用 CPU 和内存。
                    w.cleanup = () => {
                        unlockMouse();
                        document.removeEventListener('pointerlockchange', onPointerLockChange);
                        // 修复：关闭窗口时销毁虚拟机实例，避免其在后台继续占用 CPU/内存
                        if (emulator) {
                            try { emulator.destroy ? emulator.destroy() : emulator.stop(); } catch (e) {}
                            emulator = null;
                        }
                    };

                    const initV86 = (fileName, buffer) => {
                        placeholder.style.display = 'none';

                        // 修复：不再删除/重建 canvas。V86 要求 screen_container 内
                        // 「文本终端 div + canvas」两个占位符保持存在且相对顺序不变，
                        // 由 V86 自己在文本/图形模式间切换它们的显隐。
                        // 这里仅复用已有占位符，让 canvas 可见（display 留给 V86 管理）。
                        const textScreen = screenContainer.querySelector('div[style*="white-space"]');
                        const canvas = screenContainer.querySelector('canvas');
                        if (canvas) canvas.style.display = '';
                        if (textScreen) textScreen.style.display = '';

                        // 如果已有实例（重新加载镜像），先销毁旧实例避免重复运行/内存泄漏
                        if (emulator) {
                            try { emulator.destroy ? emulator.destroy() : emulator.stop(); } catch (e) {}
                            emulator = null;
                        }

                        const V86Constructor = window.V86Starter || window.V86;
                        if (!V86Constructor) {
                            updateStatus('V86 库未加载', true);
                            return;
                        }

                        const settings = {
                            // 修复：WASM 锁定到与 libv86.js 相同的版本 0.5.319（避免版本错配导致静默黑屏）
                            wasm_path: "https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm",
                            // 修复：npm 包自 0.5.x 起已移除 bios 目录，原来的 npm/.../bios/*.bin 会 404 导致无法开机；
                            // 改为指向 GitHub 仓库 copy/v86 的固定 commit 的 bios 文件。
                            bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin" },
                            vga_bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin" },
                            screen_container: screenContainer,
                            memory_size: 64 * 1024 * 1024,
                            vga_memory_size: 8 * 1024 * 1024,
                            autostart: true
                        };

                        if (fileName.toLowerCase().endsWith('.iso')) {
                            settings.cdrom = { buffer: buffer };
                            updateStatus('正在从 CD-ROM 启动...');
                        } else {
                            settings.fda = { buffer: buffer };
                            updateStatus('正在从软盘启动...');
                        }

                        try {
                            emulator = new V86Constructor(settings);
                            setRunning(true);
                            updateStatus('虚拟机运行中: ' + fileName, true);

                            // 串口输出缓冲后整行打印到浏览器控制台。
                            // 修复：浏览器环境没有 process，原来的 process.stdout 会抛 ReferenceError。
                            let serialLine = '';
                            emulator.add_listener("serial0-output-char", function(char) {
                                if (char === '\n') {
                                    console.log('[V86 Serial]', serialLine);
                                    serialLine = '';
                                } else {
                                    serialLine += char;
                                }
                            });

                        } catch (err) {
                            console.error(err);
                            updateStatus('启动失败: ' + err.message, true);
                            setRunning(false);
                            placeholder.style.display = '';
                        }
                    };

                    fileInput.onchange = (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        const reader = new FileReader();
                        updateStatus('正在读取文件...');
                        
                        reader.onload = (ev) => {
                            initV86(file.name, ev.target.result);
                        };
                        reader.readAsArrayBuffer(file);
                    };

                    // 从虚拟文件系统加载镜像（双击 iso/img 时传入 diskPath）
                    if (diskPath) {
                        const fname = diskPath.split('/').pop();
                        updateStatus('正在从虚拟文件系统读取: ' + fname);
                        SYSTEM.fs.readFile(diskPath, (err, data) => {
                            if (err) { updateStatus('读取镜像失败: ' + err.message, true); return; }
                            // 文件系统返回 Uint8Array，转为 ArrayBuffer 供 V86 使用
                            const ab = data.buffer
                                ? data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength)
                                : data;
                            initV86(fname, ab);
                        });
                    }

                    resetBtn.onclick = () => {
                        if (emulator) {
                            emulator.restart();
                            setRunning(true);
                            updateStatus('虚拟机已重置', true);
                        } else {
                            updateStatus('请先加载镜像', true);
                        }
                    };

                    pauseBtn.onclick = () => {
                        if (!emulator) {
                            updateStatus('请先加载镜像', true);
                            return;
                        }
                        paused = !paused;
                        if (paused) emulator.stop(); else emulator.run();
                        pauseBtn.innerHTML = icon(paused ? 'uiPlay' : 'uiPause') + `<span class="lbl">${paused ? '继续' : '暂停'}</span>`;
                        statusBox.classList.toggle('dirty', paused); statusBox.classList.toggle('saved', !paused);
                        updateStatus(paused ? '虚拟机已暂停' : '虚拟机运行中', false);
                    };
                }
            });
        }

        // ========== 代码编辑器 ==========
        // 新增：saveDir 参数，使从文件夹/桌面用代码编辑器打开的文件，保存时写回源目录
        /* ============================================================================
           移动端“全选”修复（CodeMirror 5，手机上为 inputStyle: contenteditable）
           症状 1：全选后只选中“屏幕里这一段”。
                  原因：CM5 只把可见区 ±viewportMargin(默认 10) 行渲染进 DOM，系统菜单的“全选”
                  是 DOM 级全选，DOM 里没有的行选不到。
           症状 2：(Android Chrome) 全选后选区瞬间消失、系统复制菜单被关闭。
                  原因：选区锚点落进行号节点，命中 CM5 pollSelection 里的 Android gutter 回退分支
                  （模拟 Backspace + blur + focus）。行号 user-select:none 即可避免（CSS 已有，这里再兜底）。
           方案：监听 selectionchange，当 DOM 选区覆盖了整个“已渲染区”、而文档还有未渲染的行时，
                  提升为 cm.execCommand('selectAll')。CM 复制/剪切时用的是自己的选区
                  (cm.getSelections())，因此复制到的是全文；滚动后新渲染的行也处于选中态。
           桌面端 (inputStyle: textarea) Ctrl+A 本来就是全文，函数直接返回不做处理。
           返回值：解除监听的函数。
           ============================================================================ */
        function fixMobileSelectAll(cm, rootSelector) {
            if (!cm || !cm.options || cm.options.inputStyle !== 'contenteditable') return function () {};
            var scope = rootSelector || '.CodeMirror';
            if (!document.getElementById('cm-mobile-selectall-css')) {
                var st = document.createElement('style');
                st.id = 'cm-mobile-selectall-css';
                st.textContent =
                    scope + ' .CodeMirror-gutters, ' + scope + ' .CodeMirror-gutters *, ' +
                    scope + ' .CodeMirror-gutter-wrapper, ' + scope + ' .CodeMirror-gutter-wrapper *, ' +
                    scope + ' .CodeMirror-linenumber{user-select:none!important;-webkit-user-select:none!important;-webkit-touch-callout:none!important}' +
                    scope + ' .CodeMirror-lines, ' + scope + ' pre.CodeMirror-line, ' + scope + ' pre.CodeMirror-line *' +
                    '{user-select:text!important;-webkit-user-select:text!important;-webkit-touch-callout:default!important}';
                document.head.appendChild(st);
            }
            var host = cm.display.lineDiv;      // .CodeMirror-code：只包含“已渲染”的行
            var busy = false, removed = false;
            function isWholeDocSelected() {
                var r = cm.listSelections()[0];
                if (!r) return false;
                var from = r.from(), to = r.to(), last = cm.lastLine();
                return from.line === cm.firstLine() && from.ch === 0 &&
                       to.line === last && to.ch === cm.getLine(last).length;
            }
            function off() {
                if (removed) return;
                removed = true;
                document.removeEventListener('selectionchange', onSel);
            }
            function onSel() {
                if (busy) return;
                if (!document.body.contains(cm.getWrapperElement())) { off(); return; }   // 编辑器已销毁，自动解除
                if (!cm.state.focused && document.activeElement !== cm.getInputField()) return;
                var s = document.getSelection();
                if (!s || !s.rangeCount || s.isCollapsed) return;
                if (!host.contains(s.anchorNode) || !host.contains(s.focusNode)) return;
                var first = host.firstElementChild, last = host.lastElementChild;
                if (!first || !last) return;
                var r = s.getRangeAt(0);
                if (!(r.intersectsNode(first) && r.intersectsNode(last))) return;       // 没盖住整个渲染区 → 普通选择，不管
                var vp = cm.getViewport();
                if (vp.from <= cm.firstLine() && vp.to >= cm.lineCount()) return;      // 全文都已渲染 → DOM 全选本来就是真全选
                if (isWholeDocSelected()) return;                                      // 已是整文档选区（CM 回写 DOM 时会再触发一次）
                var domChars = s.toString().replace(/\s+/g, '').length;
                var hostChars = host.textContent.replace(/\s+/g, '').length;
                if (domChars < hostChars * 0.9) return;                                // 只是碰巧首尾相交的局部选区
                busy = true;
                setTimeout(function () {
                    try { cm.operation(function () { cm.execCommand('selectAll'); }); }
                    finally { busy = false; }
                }, 0);
            }
            document.addEventListener('selectionchange', onSel);
            return off;
        }

        // ======== Markdown 预览渲染：内置轻量解析器（零依赖、离线可用） ========
        function mdEscapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function mdRenderInline(text) {
            let s = mdEscapeHtml(text);
            // 行内代码先占位，内部不再解析其它语法
            const codeSpans = [];
            s = s.replace(/`([^`]+)`/g, (m, c) => { codeSpans.push('<code>' + c + '</code>'); return '\u0000' + (codeSpans.length - 1) + '\u0000'; });
            // 图片 / 链接 / 自动链接
            s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^)]*&quot;)?\)/g, '<img alt="$1" src="$2">');
            s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^)]*&quot;)?\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            s = s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
            // 粗体 / 斜体 / 删除线
            s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
            s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
            s = s.replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s).,;:!?])/g, '$1<em>$2</em>');
            s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
            // 还原行内代码
            s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => codeSpans[+i]);
            return s;
        }

        function mdRenderBlocks(md) {
            const lines = String(md).replace(/\r\n?/g, '\n').split('\n');
            const n = lines.length;
            const isBlank = (l) => /^\s*$/.test(l);
            const isTableSep = (l) => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
            const splitRow = (l) => {
                let t = l.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            };
            let html = '';
            let i = 0;
            while (i < n) {
                const line = lines[i];
                if (isBlank(line)) { i++; continue; }
                // 围栏代码块 ``` / ~~~
                const fence = line.match(/^\s*(```+|~~~+)\s*([^\s`]*)/);
                if (fence) {
                    const closeRe = fence[1][0] === '`' ? /^\s*```/ : /^\s*~~~/;
                    const lang = fence[2] || '';
                    i++;
                    const buf = [];
                    while (i < n && !closeRe.test(lines[i])) { buf.push(lines[i]); i++; }
                    i++; // 跳过结束围栏
                    html += '<pre><code' + (lang ? ' class="lang-' + mdEscapeHtml(lang) + '"' : '') + '>' + mdEscapeHtml(buf.join('\n')) + '</code></pre>';
                    continue;
                }
                // 标题
                const h = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
                if (h) { const lv = h[1].length; html += '<h' + lv + '>' + mdRenderInline(h[2]) + '</h' + lv + '>'; i++; continue; }
                // 分隔线
                if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { html += '<hr>'; i++; continue; }
                // 引用块（可嵌套，递归解析）
                if (/^\s*>/.test(line)) {
                    const buf = [];
                    while (i < n && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
                    html += '<blockquote>' + mdRenderBlocks(buf.join('\n')) + '</blockquote>';
                    continue;
                }
                // 表格（GFM）
                if (line.indexOf('|') !== -1 && i + 1 < n && isTableSep(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(c => {
                        const L = c.startsWith(':'), R = c.endsWith(':');
                        return L && R ? 'center' : R ? 'right' : L ? 'left' : '';
                    });
                    i += 2;
                    const thead = '<tr>' + headers.map((c, k) => '<th' + (aligns[k] ? ' style="text-align:' + aligns[k] + '"' : '') + '>' + mdRenderInline(c) + '</th>').join('') + '</tr>';
                    let tbody = '';
                    while (i < n && lines[i].indexOf('|') !== -1 && !isBlank(lines[i])) {
                        tbody += '<tr>' + splitRow(lines[i]).map((c, k) => '<td' + (aligns[k] ? ' style="text-align:' + aligns[k] + '"' : '') + '>' + mdRenderInline(c) + '</td>').join('') + '</tr>';
                        i++;
                    }
                    html += '<table><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>';
                    continue;
                }
                // 列表（有序/无序，按缩进嵌套，支持任务清单）
                if (/^(\s*)([-*+]|\d+[.)])\s+/.test(line)) {
                    const items = [];
                    while (i < n) {
                        const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
                        if (m) {
                            items.push({ indent: m[1].replace(/\t/g, '    ').length, ordered: /\d/.test(m[2]), text: m[3] });
                            i++;
                        } else if (isBlank(lines[i])) {
                            if (i + 1 < n && /^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i + 1])) { i++; } else break;
                        } else if (/^\s{2,}\S/.test(lines[i]) && items.length) {
                            items[items.length - 1].text += '\n' + lines[i].trim();
                            i++;
                        } else break;
                    }
                    let out = '';
                    const stack = [];
                    items.forEach(it => {
                        let txt = it.text, task = '';
                        const tm = txt.match(/^\[([ xX])\]\s+([\s\S]*)$/);
                        if (tm) { task = '<input type="checkbox" disabled' + (tm[1] !== ' ' ? ' checked' : '') + '> '; txt = tm[2]; }
                        while (stack.length && it.indent < stack[stack.length - 1].indent) {
                            out += stack.pop().ordered ? '</li></ol>' : '</li></ul>';
                        }
                        // 同级但列表类型变化（无序 ↔ 有序）：关闭当前列表另起新列表
                        if (stack.length && it.indent === stack[stack.length - 1].indent && it.ordered !== stack[stack.length - 1].ordered) {
                            out += stack.pop().ordered ? '</li></ol>' : '</li></ul>';
                        }
                        if (!stack.length || it.indent > stack[stack.length - 1].indent) {
                            stack.push({ indent: it.indent, ordered: it.ordered });
                            out += it.ordered ? '<ol>' : '<ul>';
                        } else {
                            out += '</li>';
                        }
                        out += '<li>' + task + mdRenderInline(txt).replace(/\n/g, '<br>');
                    });
                    while (stack.length) { out += stack.pop().ordered ? '</li></ol>' : '</li></ul>'; }
                    html += out;
                    continue;
                }
                // 普通段落：收集到空行或下一个块级元素为止
                const buf = [line];
                i++;
                while (i < n && !isBlank(lines[i]) && !/^\s*(#{1,6}\s|>|```|~~~)/.test(lines[i]) && !/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                html += '<p>' + buf.map(mdRenderInline).join('<br>') + '</p>';
            }
            return html;
        }

        function renderMarkdownToHtml(md) {
            return mdRenderBlocks(md);
        }

        // 把渲染结果包装成带 GitHub 暗色样式的完整 HTML 文档（用于编辑器预览 iframe / 新窗口打开）

        }
