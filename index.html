        // === 任务栏：键盘、右键菜单、长按、网络状态 ===
        function taskbarAppDef(el) {
            const key = el && el.dataset && el.dataset.systemApp;
            return key ? SYSTEM_APP_DEFS.find(d => d.key === key) : null;
        }
        function showTaskbarMenu(target, x) {
            const bar = document.querySelector('.taskbar');
            const y = bar.getBoundingClientRect().top - 4;   // 从任务栏顶边向上弹出
            const running = target.closest('.taskbar-running-item');
            const pinned = target.closest('.taskbar-icon.pinned');
            const mobile = window.innerWidth <= 600;
            if (running) {
                const id = parseInt(running.dataset.winId, 10);
                const win = SYSTEM.windows.find(w => w.id === id);
                if (!win) return;
                const focused = win.element.classList.contains('focused') && !win.minimized;
                const items = [];
                if (win.minimized) items.push({ icon: 'uiTbRestore', label: '还原窗口', act: () => focusWin(id) });
                else if (!focused) items.push({ icon: 'uiTbRestore', label: '切换到此窗口', act: () => focusWin(id) });
                if (!win.minimized) items.push({ icon: 'uiMinimize', label: '最小化', act: () => minimizeWin(id) });
                if (!mobile) items.push({ icon: 'uiMaximize', label: (win.maximized || win.snapped) ? '还原大小' : '最大化', act: () => { focusWin(id); maximizeWin(id); } });
                items.push('-', { icon: 'uiClose', label: '关闭窗口', danger: true, act: () => closeWin(id) });
                openCtxMenu(items, x, y);
            } else if (pinned) {
                const def = taskbarAppDef(pinned);
                const name = pinned.getAttribute('aria-label') || pinned.title || '应用';
                openCtxMenu([
                    { icon: def ? def.icon : 'uiOpen', label: '打开' + name, act: () => pinned.click() },
                    '-',
                    { icon: 'stxLayoutGrid', label: '管理应用快捷方式…', act: () => openSettings('apps') }
                ], x, y);
            } else if (!target.closest('.tb-notification')) {
                const locked = typeof AeroPeek !== 'undefined' && AeroPeek.isDesktopLocked;
                openCtxMenu([
                    { icon: 'uiMonitor', label: locked ? '恢复窗口' : '显示桌面', disabled: !locked && !SYSTEM.windows.length, act: () => aeroPeekDesktopClick() },
                    { icon: 'stxPalette', label: '个性化设置…', act: () => openSettings('personal') }
                ], x, y);
            }
        }

        (function initTaskbar() {
            const bar = document.querySelector('.taskbar');
            if (!bar) return;
            // role="button" 的 div：回车 / 空格 = 点击
            bar.addEventListener('keydown', e => {
                const t = e.target;
                if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button') {
                    e.preventDefault();
                    if (t.classList.contains('start-btn')) toggleStartMenu({ keyboard: true });
                    else if (t.id === 'clock') toggleCalendar({ keyboard: true });
                    else t.click();
                } else if ((e.key === 'Delete') && t.classList && t.classList.contains('taskbar-running-item')) {
                    e.preventDefault();
                    closeWin(parseInt(t.dataset.winId, 10));
                }
            });
            bar.addEventListener('contextmenu', e => {
                e.preventDefault();
                e.stopPropagation();
                if (lp.timer) { clearTimeout(lp.timer); lp.timer = 0; }
                showTaskbarMenu(e.target, e.clientX);
            });
            // 长按（iOS Safari 不触发 contextmenu）
            const lp = { timer: 0, x: 0, y: 0, fired: false };
            bar.addEventListener('pointerdown', e => {
                if (e.pointerType !== 'touch') return;
                const t = e.target.closest('.taskbar-running-item, .taskbar-icon.pinned');
                if (!t) return;
                lp.x = e.clientX; lp.y = e.clientY; lp.fired = false;
                clearTimeout(lp.timer);
                lp.timer = setTimeout(() => { lp.timer = 0; lp.fired = true; showTaskbarMenu(t, lp.x); }, 520);
            });
            const cancel = e => {
                if (!lp.timer) return;
                if (e.type === 'pointermove' && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) < 10) return;
                clearTimeout(lp.timer); lp.timer = 0;
            };
            bar.addEventListener('pointermove', cancel);
            bar.addEventListener('pointerup', cancel);
            bar.addEventListener('pointercancel', cancel);
            // 长按弹出菜单后，松手产生的那次 click 不能再去切换/启动窗口
            bar.addEventListener('click', e => {
                if (lp.fired) { lp.fired = false; e.preventDefault(); e.stopPropagation(); }
            }, true);
        })();

        function updateNetworkTray(announce) {
            const el = document.getElementById('tray-wifi');
            if (!el) return;
            const online = navigator.onLine !== false;
            el.classList.toggle('offline', !online);
            el.innerHTML = icon(online ? 'uiWifi' : 'uiWifiOff');
            el.title = online ? '网络：已连接' : '网络：已断开（离线）';
            el.setAttribute('aria-label', el.title);
            if (announce) {
                if (online) Notify.success('网络已恢复');
                else Notify.warning('网络已断开', '必应壁纸、浏览器、V86 等联网功能暂时不可用');
            }
        }
        updateNetworkTray(false);
        window.addEventListener('online', () => updateNetworkTray(true));
        window.addEventListener('offline', () => updateNetworkTray(true));

        // === 弹出层的全局关闭与键盘 ===
        // 用 pointerdown（捕获阶段）判断“点在外面”：有些窗口内部会 stopPropagation 掉 click，
        // 以前点进这些区域时开始菜单/日历关不掉。composedPath 在元素被重新渲染后仍然可靠（日历点日期会重绘）。
        document.addEventListener('pointerdown', e => {
            const path = e.composedPath ? e.composedPath() : [];
            const inside = sel => path.some(n => n && n.matches && n.matches(sel));
            if (!inside('.context-menu')) closeCtx();
            if (SYSTEM.startOpen && !inside('.start-menu') && !inside('.start-btn')) setStartOpen(false);
            if (SYSTEM.calendarOpen && !inside('.calendar-panel') && !inside('.clock')) setCalendarOpen(false);
        }, true);
        // 点进 iframe（浏览器、HTML 预览、应用窗口）时 document 收不到 pointerdown，只会触发 window blur
        window.addEventListener('blur', () => {
            setTimeout(() => {
                const ae = document.activeElement;
                if (ae && ae.tagName === 'IFRAME') { closeCtx(); setStartOpen(false); setCalendarOpen(false); }
            }, 0);
        });
        document.addEventListener('keydown', e => {
            if (document.querySelector('.sys-dialog-overlay')) return;   // 系统对话框自己处理按键
            const cm = document.getElementById('context-menu');
            const stop = () => { e.preventDefault(); e.stopPropagation(); };
            if (cm && cm.classList.contains('open')) {
                const items = ctxItems();
                if (e.key === 'Escape') { stop(); closeCtx({ restoreFocus: true }); }
                else if (e.key === 'ArrowDown') { stop(); ctxSetActive(CTX.active + 1); }
                else if (e.key === 'ArrowUp') { stop(); ctxSetActive(CTX.active < 0 ? items.length - 1 : CTX.active - 1); }
                else if (e.key === 'Home') { stop(); ctxSetActive(0); }
                else if (e.key === 'End') { stop(); ctxSetActive(items.length - 1); }
                else if ((e.key === 'Enter' || e.key === ' ') && CTX.active >= 0 && items[CTX.active]) { stop(); items[CTX.active].click(); }
                else if (e.key === 'Tab') { stop(); closeCtx({ restoreFocus: true }); }
                return;
            }
            if (e.key === 'Escape') {
                if (SYSTEM.startOpen) {
                    const input = document.getElementById('start-search');
                    stop();
                    if (input && document.activeElement === input && input.value) { input.value = ''; startFilter(''); }
                    else setStartOpen(false, { restoreFocus: true });
                } else if (SYSTEM.calendarOpen) { stop(); setCalendarOpen(false, { restoreFocus: true }); }
            }
        }, true);


        // === 窗口系统 (完整适配版) ===
        function createWindow(opts) {
            const id = ++SYSTEM.idCounter;
            const isMobile = window.innerWidth <= 768; // 检测手机
            // 创建即最大化：手机端本来就全屏；桌面端由 opts.maximized 决定
            // （JISHENG-OS-APP 应用窗口传 true —— 应用一律最大化打开，想缩小直接点标题栏最大化按钮或用边缘拖拽）
            const startMaximized = isMobile || opts.maximized === true;
            
            const w = document.createElement('div');
            w.id = 'win-' + id;
            
            // 如果是手机或调用方要求，自动添加 maximized 类
            w.className = `window ultra-glass focused ${startMaximized ? 'maximized' : ''}`;
            
            // 始终写明几何尺寸（含手机端）。
            // 以前手机端不写 style，一旦取消最大化窗口就没有 width/height/left/top，
            // 变成"自动宽度"的绝对定位元素，往右拖就会被重新布局成不断延伸的样子。
            {
                const areaW = window.innerWidth;
                const areaH = window.innerHeight - 48; // 任务栏
                const W = Math.max(280, Math.min(opts.width || 700, areaW - 20));
                const H = Math.max(200, Math.min(opts.height || 500, areaH - 20));
                const step = SYSTEM.windows.length * 25;
                const L = Math.max(0, Math.min(100 + step, areaW - W - 10));
                const T = Math.max(0, Math.min(50 + step, areaH - H - 10));
                w.style.cssText = `width:${W}px;height:${H}px;top:${T}px;left:${L}px;`;
            }
            // 创建即最大化的窗口：把上面算出来的几何尺寸留作"还原"目标。
            // 用户点标题栏最大化按钮取消最大化时会精确回到这套尺寸（restoreWindowGeometry 用它），
            // 也随时可以拖窗口边缘自己调大小。
            const savedPos = (startMaximized && !isMobile) ? w.style.cssText : null;
            
            w.innerHTML = `
                <div class="title-bar">
                    <div class="title-bar-left">
                        <div class="window-icon">${opts.iconHtml || ''}</div>
                        <div class="window-title-text">${escapeHtml(opts.title || 'Window')}</div>
                    </div>
                    <div class="window-controls">
                        <!-- 新增的全屏按钮，位于最小化之前 -->
                        <div class="win-btn" onclick="toggleWinFullscreen(${id}, '${opts.winType || 'default'}')">${icon('uiFullscreen')}</div>
                        <div class="win-btn" onclick="minimizeWin(${id})">${icon('uiMinimize')}</div>
                        <div class="win-btn" onclick="maximizeWin(${id})">${icon('uiMaximize')}</div>
                        <div class="win-btn close" onclick="closeWin(${id})">${icon('uiClose')}</div>
                    </div>
                </div>
                ${opts.winType === 'manga' ? `<div class="manga-exit-btn" onclick="toggleWinFullscreen(${id}, 'manga')">×</div>` : ''}
                ${opts.content}
                <div class="resize-handle n"></div><div class="resize-handle s"></div>
                <div class="resize-handle e"></div><div class="resize-handle w"></div>
                <div class="resize-handle ne"></div><div class="resize-handle nw"></div>
                <div class="resize-handle sw"></div><div class="resize-handle se"></div>
            `;
            
            document.getElementById('windows-container').appendChild(w);
            
            const winObj = { id, element: w, title: opts.title, minimized: false, maximized: startMaximized, savedPos, iconHtml: opts.iconHtml };
            SYSTEM.windows.push(winObj);
            
            makeDraggable(w, id);
            makeResizable(w);
            focusWin(id);
            
            if(opts.onInit) opts.onInit(w, id);
            
            return id;
        }

        // 这里的函数必须定义在全局，否则 HTML onclick 找不到
        window.closeWin = function(id) {
            // 修复：Aero Peek 高亮/虚化/透明态使用 !important 会覆盖关闭动画的 opacity，导致卡在 0.9 收缩状态
            // 点掉蓝色框窗口时若仍在 Peek 态，需先彻底清除再开始动画
            try { clearAeroPeekEffects(); } catch(e) {}
            // 兼容桌面预览的透明态与 pending 定时器
            SYSTEM.windows.forEach(win => {
                if (win.element) win.element.classList.remove('aero-peek-transparent');
            });
            if (AeroPeek.previewTimer) { clearTimeout(AeroPeek.previewTimer); AeroPeek.previewTimer = null; }
            if (AeroPeek.previewHideTimer) { clearTimeout(AeroPeek.previewHideTimer); AeroPeek.previewHideTimer = null; }
            AeroPeek.isDesktopPeeking = false;
            AeroPeek.currentPreviewWinId = null;
            if (AeroPeek.savedWindowStates && AeroPeek.savedWindowStates.length) {
                AeroPeek.savedWindowStates = AeroPeek.savedWindowStates.filter(s => s.id !== id);
            }
            const w = document.getElementById('win-' + id);
            if(w) {
                // 确保该窗口本身的 Peek 类已移除，并强制重排使样式生效后再开启动画（不移除 minimized，避免已最小化窗口闪烁）
                w.classList.remove('aero-peek-dim','aero-peek-highlight','aero-peek-transparent');
                void w.offsetWidth;
                // 调用清理函数（如果存在）
                if(w.cleanup) {
                    w.cleanup();
                }
                
                // 调用onDestroy回调（如果存在）
                const winObj = SYSTEM.windows.find(win => win.id === id);
                if(winObj && winObj.onDestroy) {
                    winObj.onDestroy();
                }
                
                w.style.transition = 'transform 0.2s, opacity 0.2s';
                w.style.transform = 'scale(0.9)';
                w.style.opacity = '0';
                setTimeout(() => w.remove(), 200);
            }
            SYSTEM.windows = SYSTEM.windows.filter(win => win.id !== id);
            setTimeout(updateTaskbarRunningItems, 30);
        };

        window.minimizeWin = function(id) {

            if (AeroPeek.previewTimer) { clearTimeout(AeroPeek.previewTimer); AeroPeek.previewTimer = null; }
            AeroPeek.isDesktopPeeking = false;
            const win = SYSTEM.windows.find(w => w.id === id);
            if(win) {

                win.element.classList.add('minimized');

        window.maximizeWin = function(id) {

            } else {

        window.focusWin = function(id) {
            try { clearAeroPeekEffects(); } catch(e) {}
            if (AeroPeek.previewTimer) { clearTimeout(AeroPeek.previewTimer); AeroPeek.previewTimer = null; }
            AeroPeek.isDesktopPeeking = false;

        // =====================================================================
        // Aero Snap：拖到屏幕左/右边缘贴半屏，拖到顶部最大化
        // =====================================================================
        const SNAP_EDGE = 16;   // 左右边缘触发宽度
        const SNAP_TOP  = 10;   // 顶部触发高度
        const TASKBAR_H = 48;

        function snapZoneAt(x, y) {
            if (window.innerWidth <= 600) return null;       // 手机竖屏窗口本来就是全屏
            if (y <= SNAP_TOP) return 'max';
            if (x <= SNAP_EDGE) return 'left';
            if (x >= window.innerWidth - SNAP_EDGE) return 'right';
            return null;
        }

        function getSnapPreviewEl() {
            let el = document.getElementById('snap-preview');
            if (!el) {
                el = document.createElement('div');
                el.id = 'snap-preview';
                document.body.appendChild(el);
            }
            return el;
        }

        function showSnapPreview(kind) {
            const el = getSnapPreviewEl();
            if (!kind) { el.classList.remove('show'); return; }
            const W = window.innerWidth, H = window.innerHeight - TASKBAR_H;
            const box = kind === 'left'  ? [0, 0, W / 2, H]
                      : kind === 'right' ? [W / 2, 0, W / 2, H]
                      :                    [0, 0, W, H];
            el.style.left   = (box[0] + 6) + 'px';
            el.style.top    = (box[1] + 6) + 'px';
            el.style.width  = (box[2] - 12) + 'px';
            el.style.height = (box[3] - 12) + 'px';
            el.classList.add('show');
        }

        function isWinSnapped(win) {
            return !!(win && (win.maximized || win.snapped));
        }

        // 贴边 / 最大化
        function applySnapToWindow(win, kind) {
            if (!win) return;
            const el = win.element;
            // 第一次离开自由状态时记住原来的几何，便于还原
            if (!isWinSnapped(win)) win.savedPos = el.style.cssText;

            el.classList.add('snapping');
            el.classList.remove('maximized', 'snap-left', 'snap-right');
            if (kind === 'max') {
                el.classList.add('maximized');
                win.maximized = true; win.snapped = null;
            } else {
                el.classList.add(kind === 'left' ? 'snap-left' : 'snap-right');
                win.snapped = kind; win.maximized = false;
            }
            setTimeout(() => el.classList.remove('snapping'), 260);
        }

        // 还原到贴边之前的大小/位置
        function restoreWindowGeometry(win, animate = true) {
            if (!win) return;
            const el = win.element;
            const z = el.style.zIndex;
            if (animate) el.classList.add('snapping');
            el.classList.remove('maximized', 'snap-left', 'snap-right');
            win.maximized = false;
            win.snapped = null;
            if (win.savedPos) el.style.cssText = win.savedPos;
            el.style.zIndex = z;
            // 兜底：没有记录过几何（例如手机端创建时就是最大化）时给一套合理默认值
            if (!el.style.width)  el.style.width  = Math.max(280, Math.min(760, window.innerWidth - 40)) + 'px';
            if (!el.style.height) el.style.height = Math.max(200, Math.min(520, window.innerHeight - TASKBAR_H - 40)) + 'px';
            if (!el.style.left)   el.style.left   = '40px';
            if (!el.style.top)    el.style.top    = '40px';

        // 视口变化（旋转屏幕 / 改窗口大小）后把窗口收回可视范围，避免留在屏幕外
        window.addEventListener('resize', () => {
            const maxW = window.innerWidth;
            const maxH = window.innerHeight - TASKBAR_H;
            SYSTEM.windows.forEach(win => {
                const el = win.element;
                if (!el || isWinSnapped(win) || el.classList.contains('truly-fullscreen')) return;
                const w = Math.max(260, Math.min(el.offsetWidth, maxW - 10));
                const h = Math.max(180, Math.min(el.offsetHeight, maxH - 10));
                el.style.width  = w + 'px';
                el.style.height = h + 'px';
                el.style.left = Math.max(-w + 100, Math.min(el.offsetLeft, maxW - 100)) + 'px';
                el.style.top  = Math.max(0, Math.min(el.offsetTop, maxH - 30)) + 'px';
            });
        });

        // === 修复后的拖拽逻辑 (完美支持手机/平板) ===
        function makeDraggable(el, id) {
            const titleBar = el.querySelector('.title-bar');
            let isDragging = false, startX, startY, startLeft, startTop;
            let dragPointerId = null;
            let hasMoved = false, snapZone = null;
            // 性能：指针事件可能比屏幕刷新更频繁（高回报率鼠标 500–1000Hz），位置写入合并到每帧一次；
            // 窗口尺寸在拖动开始时读一次，避免每次移动都在写入 left/top 后立刻读 offsetWidth 导致强制同步布局。
            let dragRaf = 0, dragPending = null, dragW = 0, dragH = 0;
            const flushDrag = () => {
                dragRaf = 0;
                if (!dragPending) return;
                el.style.left = dragPending.l + 'px';
                el.style.top = dragPending.t + 'px';
                showSnapPreview(dragPending.zone);
                dragPending = null;
            };
            
            // 获取触摸或鼠标坐标
            const getCoords = (e) => {
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            };

            const start = (e) => {
                // 如果点的是按钮，直接返回，不触发拖拽
                if(e.target.closest('.win-btn')) return;

                // 手机竖屏：窗口由 CSS 强制全屏，不允许拖动
                // 注意：阈值 600 与 CSS 媒体查询保持一致，平板/横屏(>600)允许拖动
                if(window.innerWidth <= 600) return;
                // 已最大化/贴边的窗口允许拖动——拖动即"拽下来还原"（Aero Snap 标准行为）
                
                // 处理 Pointer Events
                if (e.pointerId !== undefined) {
                    if (dragPointerId === null) {
                        dragPointerId = e.pointerId;
                        e.target.setPointerCapture(e.pointerId);
                    } else {
                        return; // 已经有活动的拖拽指针
                    }
                }
                
                isDragging = true;
                hasMoved = false;
                snapZone = null;
                const p = getCoords(e);
                startX = p.x; startY = p.y;
                startLeft = el.offsetLeft; startTop = el.offsetTop;

                focusWin(id);
                
                // === 修复：创建全屏透明遮罩，防止iframe偷走鼠标事件导致拖拽卡顿 ===
                // 参考 V1 版本的 #drag-cover 方案
                // 当窗口内含 iframe（浏览器、HTML编辑器等）时，鼠标移入内容区域
                // 会被 iframe 捕获事件，导致拖拽停止。全屏遮罩物理阻挡 iframe 接收事件。
                let dragCover = document.getElementById('drag-cover');
                if (!dragCover) {
                    dragCover = document.createElement('div');
                    dragCover.id = 'drag-cover';
                    dragCover.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:auto;';
                    document.body.appendChild(dragCover);
                }
            };
            
            const move = (e) => {
                if(!isDragging) return;
                
                // 验证指针ID
                if (e.pointerId !== undefined && e.pointerId !== dragPointerId) {
                    return;
                }
                
                // 只有在真正拖拽时，才阻止屏幕滚动
                if(e.cancelable) e.preventDefault();
                
                const p = getCoords(e);
                let dx = p.x - startX;
                let dy = p.y - startY;

                if (!hasMoved) {
                    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
                    hasMoved = true;

                    // Aero Snap：把最大化/贴边的窗口"拽下来"还原，
                    // 并让它按抓取比例挂在指针下面，手感和 Windows 一致。
                    const win = SYSTEM.windows.find(w => w.id === id);
                    if (isWinSnapped(win)) {
                        const r = el.getBoundingClientRect();
                        const ratio = (startX - r.left) / Math.max(1, r.width);
                        restoreWindowGeometry(win, false);
                        const w2 = el.offsetWidth;
                        startLeft = Math.round(p.x - w2 * ratio);
                        startTop = Math.max(0, Math.round(p.y - 18));
                        startX = p.x; startY = p.y;
                        dx = 0; dy = 0;
                    }
                    dragW = el.offsetWidth; dragH = el.offsetHeight;
                }

                let newLeft = startLeft + dx;
                let newTop = startTop + dy;

                // 屏幕边界限制：防止窗口被拖出屏幕
                const screenW = window.innerWidth;
                const screenH = window.innerHeight;
                const taskbarH = TASKBAR_H;
                const winW = dragW;

                // 上边界
                newTop = Math.max(0, newTop);
                // 左边界（允许窗口大部分出去，但保留一部分可抓取）
                newLeft = Math.max(-winW + 100, newLeft);
                // 右边界
                newLeft = Math.min(screenW - 100, newLeft);
                // 下边界（不超过任务栏）
                newTop = Math.min(screenH - taskbarH - 30, newTop);

                // Aero Snap：贴边落点预览
                snapZone = snapZoneAt(p.x, p.y);
                dragPending = { l: newLeft, t: newTop, zone: snapZone };
                if (!dragRaf) dragRaf = requestAnimationFrame(flushDrag);
            };
            
            const end = (e) => {
                if (!isDragging) return;
                
                // 验证指针ID
                if (e.pointerId !== undefined && e.pointerId !== dragPointerId) {
                    return;
                }
                
                isDragging = false;
                dragPointerId = null;
                if (dragRaf) { cancelAnimationFrame(dragRaf); flushDrag(); }

                // === Aero Snap：松手时吸附 ===
                showSnapPreview(null);
                if (snapZone) {
                    applySnapToWindow(SYSTEM.windows.find(w => w.id === id), snapZone);
                    snapZone = null;
                }
                hasMoved = false;

                // === 修复：移除全屏遮罩，恢复iframe正常交互 ===
                const dragCover = document.getElementById('drag-cover');
                if (dragCover) dragCover.remove();
            };
            
            // 绑定事件 (仅绑定在标题栏上，不影响内容区域的点击)
            
            // 使用 Pointer Events API（统一处理鼠标和触摸）
            if (window.PointerEvent) {
                titleBar.addEventListener('pointerdown', start, { passive: false });
                titleBar.addEventListener('pointermove', move, { passive: false });
                titleBar.addEventListener('pointerup', end);
                titleBar.addEventListener('pointercancel', end);
                titleBar.addEventListener('pointerleave', end);
            } else {
                // 备用：鼠标事件
                titleBar.addEventListener('mousedown', start);
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', end);
                
                // 备用：触摸事件
                titleBar.addEventListener('touchstart', start, { passive: false });
                document.addEventListener('touchmove', move, { passive: false });
                document.addEventListener('touchend', end);
                document.addEventListener('touchcancel', end);
            }
            
            // 点击窗口任意位置聚焦（但不触发拖拽）
            // 性能：原来 mousedown / touchstart / pointerdown 三个监听每次点击都各调一次 focusWin（遍历全部窗口 + 刷新任务栏）；
            // 现在只用一个 pointerdown，并且窗口已在最前时直接跳过。
            const focusOnPress = () => {
                if (el.classList.contains('focused') && !el.classList.contains('minimized') && !AeroPeek.isDesktopPeeking) return;
                focusWin(id);
            };
            if (window.PointerEvent) el.addEventListener('pointerdown', focusOnPress, { passive: true });
            else { el.addEventListener('mousedown', focusOnPress); el.addEventListener('touchstart', focusOnPress, { passive: true }); }
        }

        function makeResizable(el) {
            // 手机竖屏（窗口由 CSS 强制全屏）不需要缩放；阈值与拖拽保持一致。
            // 以前这里是 <=768 且只监听鼠标事件，所以平板/横屏手机"能拖标题栏但没法改大小"。
            if(window.innerWidth <= 600) return;

            const handles = el.querySelectorAll('.resize-handle');
            handles.forEach(h => {
                let resizing = false, pid = null;
                let startX, startY, startW, startH, startL, startT, dir;
                // 性能：缩放会让窗口内容整体重排（文件夹里上千行时尤其明显），每帧最多应用一次
                let sizeRaf = 0, sizePending = null;
                const flushSize = () => {
                    sizeRaf = 0;
                    const q = sizePending; sizePending = null;
                    if (!q) return;
                    el.style.width = q.w + 'px';
                    el.style.height = q.h + 'px';
                    if (q.l !== null) el.style.left = q.l + 'px';
                    if (q.t !== null) el.style.top = q.t + 'px';
                };

                const getCoords = (e) => {
                    if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                    return { x: e.clientX, y: e.clientY };
                };

                const onDown = (e) => {
                    if (e.button !== undefined && e.button > 0) return;
                    const win = SYSTEM.windows.find(w => w.element === el);
                    // 最大化状态不允许拉伸
                    if (win && win.maximized) return;
                    // 贴边（半屏）状态允许拉伸：先把 CSS 里 !important 的半屏尺寸
                    // 固化成行内样式并脱离贴边态，之后按普通窗口处理
                    if (win && win.snapped) {
                        const r0 = el.getBoundingClientRect();
                        el.classList.remove('snap-left', 'snap-right', 'snapping');
                        win.snapped = null;
                        el.style.left   = Math.round(r0.left) + 'px';
                        el.style.top    = Math.round(r0.top) + 'px';
                        el.style.width  = Math.round(r0.width) + 'px';
                        el.style.height = Math.round(r0.height) + 'px';
                    }

                    const p = getCoords(e);
                    resizing = true;
                    startX = p.x; startY = p.y;
                    startW = el.offsetWidth; startH = el.offsetHeight;
                    startL = el.offsetLeft;  startT = el.offsetTop;
                    dir = h.className.split(' ')[1];

                    if (e.pointerId !== undefined) {
                        pid = e.pointerId;
                        try { h.setPointerCapture(e.pointerId); } catch(_) {}
                    }
                    if (e.cancelable) e.preventDefault();
                    e.stopPropagation();

                    const winObj = SYSTEM.windows.find(w => w.element === el);
                    if (winObj) focusWin(winObj.id);

                    // 全屏透明遮罩：防止 iframe 偷走事件导致拉伸中断
                    let resizeCover = document.getElementById('resize-cover');
                    if (!resizeCover) {
                        resizeCover = document.createElement('div');
                        resizeCover.id = 'resize-cover';
                        resizeCover.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:auto;touch-action:none;cursor:' + getComputedStyle(h).cursor;
                        document.body.appendChild(resizeCover);
                    }
                };

                const onMove = (e) => {
                    if(!resizing) return;
                    if (e.pointerId !== undefined && pid !== null && e.pointerId !== pid) return;
                    if (e.cancelable) e.preventDefault();

                    const p = getCoords(e);
                    const dx = p.x - startX, dy = p.y - startY;

                    const screenW = window.innerWidth;
                    const screenH = window.innerHeight;
                    // 小屏幕上 400x300 的下限会让窗口根本缩不动，按视口收紧
                    const MIN_W = Math.min(400, Math.max(240, screenW - 40));
                    const MIN_H = Math.min(300, Math.max(180, screenH - TASKBAR_H - 40));

                    let newW = startW, newH = startH, newL = startL, newT = startT;

                    if(dir.includes('e')) newW = startW + dx;
                    if(dir.includes('s')) newH = startH + dy;
                    if(dir.includes('w')) { newW = startW - dx; newL = startL + dx; }
                    if(dir.includes('n')) { newH = startH - dy; newT = startT + dy; }

                    // 限制最小尺寸
                    if(newW < MIN_W) {
                        if(dir.includes('w')) newL = startL + (startW - MIN_W);
                        newW = MIN_W;
                    }
                    if(newH < MIN_H) {
                        if(dir.includes('n')) newT = startT + (startH - MIN_H);
                        newH = MIN_H;
                    }

                    // 屏幕边界限制
                    if(newT < 0) {
                        if(dir.includes('n')) newH = startH + startT;
                        newT = 0;
                    }
                    if(newL < 0) {
                        if(dir.includes('w')) newW = startW + startL;
                        newL = 0;
                    }
                    if(newT + newH > screenH - TASKBAR_H) {
                        if(dir.includes('s')) newH = screenH - TASKBAR_H - newT;
                    }
                    if(newL + newW > screenW) {
                        if(dir.includes('e')) newW = screenW - newL;
                    }
                    if(newW < MIN_W) newW = MIN_W;
                    if(newH < MIN_H) newH = MIN_H;

                    sizePending = { w: newW, h: newH, l: dir.includes('w') ? newL : null, t: dir.includes('n') ? newT : null };
                    if (!sizeRaf) sizeRaf = requestAnimationFrame(flushSize);
                };

                const onUp = (e) => {
                    if(!resizing) return;
                    if (e && e.pointerId !== undefined && pid !== null && e.pointerId !== pid) return;
                    resizing = false;
                    if (sizeRaf) { cancelAnimationFrame(sizeRaf); flushSize(); }
                    if (pid !== null) { try { h.releasePointerCapture(pid); } catch(_) {} pid = null; }
                    const resizeCover = document.getElementById('resize-cover');
                    if (resizeCover) resizeCover.remove();
                };

                if (window.PointerEvent) {
                    // 指针事件统一覆盖鼠标 / 触摸 / 触控笔 —— 移动端也能改窗口大小
                    h.addEventListener('pointerdown', onDown, { passive: false });
                    h.addEventListener('pointermove', onMove, { passive: false });
                    h.addEventListener('pointerup', onUp);
                    h.addEventListener('pointercancel', onUp);
                } else {
                    h.addEventListener('mousedown', onDown);
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                    h.addEventListener('touchstart', onDown, { passive: false });
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onUp);
                    document.addEventListener('touchcancel', onUp);
                }
            });
        }

        // === 应用程序 ===
        // ownedBlobUrl：由调用方创建、交给浏览器窗口“拥有”的 Blob URL，关窗时释放（修复打开本地 HTML / 用浏览器打开 的内存泄漏）
        function openBrowser(initialUrl, ownedBlobUrl = null) {
            const startUrl = initialUrl || 'https://www.wikipedia.org';
            
            const id = createWindow({
                title: '浏览器',
                winType: 'browser',

                content: `
                    <div class="browser-nav">

                        <button class="nav-btn" id="nav-forward-${SYSTEM.idCounter+1}">${icon('uiChevronRight')}</button>
                        <button class="nav-btn" id="nav-refresh-${SYSTEM.idCounter+1}">${icon('uiBrowserRefresh','sm')}</button>
                        <div class="address-bar">

                    </div>
                    <div class="content-area" style="position:relative;">
                        <div class="loading-overlay active" id="loading-${SYSTEM.idCounter+1}"><div class="spinner"></div></div>
                        <!-- 注意：故意不设 sandbox 限制以保证最佳性能和兼容性，请勿添加 -->
                        <iframe id="browser-frame-${SYSTEM.idCounter+1}" src="${startUrl}"></iframe>
                    </div>
                `,
                onInit: (w, winId) => {
                    if (ownedBlobUrl) w.cleanup = () => URL.revokeObjectURL(ownedBlobUrl);
                    const urlInput = document.getElementById('url-input-' + winId);
                    const frame = document.getElementById('browser-frame-' + winId);
                    const loading = document.getElementById('loading-' + winId);
                    const goBtn = document.getElementById('nav-go-' + winId);
                    const refreshBtn = document.getElementById('nav-refresh-' + winId);
                    const backBtn = document.getElementById('nav-back-' + winId);
                    const fwdBtn = document.getElementById('nav-forward-' + winId);
                    
                    // 历史栈数据
                    let historyStack = [startUrl];
                    let currentIndex = 0;
                    
                    // 修复：UI更新不再设置 disabled 属性，而是仅改变透明度视觉效果
                    const updateUI = () => {
                        // 如果没有后退历史，降低透明度，但不禁用点击
                        backBtn.style.opacity = currentIndex === 0 ? '0.3' : '1';
                        backBtn.style.cursor = currentIndex === 0 ? 'default' : 'pointer'; // 没历史时显示普通鼠标，有历史显示手型
                        
                        // 如果没有前进历史，降低透明度
                        fwdBtn.style.opacity = currentIndex === historyStack.length - 1 ? '0.3' : '1';
                        fwdBtn.style.cursor = currentIndex === historyStack.length - 1 ? 'default' : 'pointer';
                        
                        urlInput.value = historyStack[currentIndex];
                    };

                    const loadFrame = (url) => {
                        loading.classList.add('active');
                        frame.src = url;
                    };

                    const navigate = () => {
                        let url = urlInput.value.trim();
                        if(!url.startsWith('http') && !url.startsWith('blob:') && !url.startsWith('file:')) {
                            url = 'https://' + url;
                        }
                        
                        if (url !== historyStack[currentIndex]) {
                            historyStack = historyStack.slice(0, currentIndex + 1);
                            historyStack.push(url);
                            currentIndex++;
                        }
                        
                        updateUI();
                        loadFrame(url);
                    };
                    
                    urlInput.onkeydown = e => { if(e.key === 'Enter') navigate(); };
                    goBtn.onclick = navigate;
                    
                    refreshBtn.onclick = () => { 
                        loading.classList.add('active'); 
                        // 强制刷新 iframe
                        const currentUrl = frame.src;
                        frame.src = 'about:blank';
                        setTimeout(() => { frame.src = currentUrl; }, 10);
                    };
                    
                    frame.onload = () => loading.classList.remove('active');

                    // 后退逻辑：点击不再被阻挡，内部判断是否有动作
                    backBtn.onclick = () => { 
                        if (currentIndex > 0) {
                            currentIndex--;
                            const prevUrl = historyStack[currentIndex];
                            loadFrame(prevUrl);
                            updateUI();
                        }
                    };

                    // 前进逻辑
                    fwdBtn.onclick = () => { 
                        if (currentIndex < historyStack.length - 1) {
                            currentIndex++;
                            const nextUrl = historyStack[currentIndex];
                            loadFrame(nextUrl);
                            updateUI();
                        }
                    };
                    
                    updateUI();
                }
            });
        }

        // CSV 表格查看器
        // CSV 解析（RFC 4180）：引号内的逗号/换行/双引号、CRLF、UTF-8 BOM；自动识别 , ; Tab | 分隔符。
        function csvDetectDelimiter(text) {
            const line = []; let q = false;
            for (let i = 0; i < text.length && i < 20000; i++) { const c = text[i]; if (c === '"') q = !q; else if (!q && (c === '\n' || c === '\r')) break; else if (!q) line.push(c); }
            let best = ',', n = 0;
            [',', ';', '\t', '|'].forEach(d => { const k = line.filter(c => c === d).length; if (k > n) { n = k; best = d; } });
            return best;
        }
        function csvParse(text, delim) {
            text = String(text || '').replace(/^\uFEFF/, '');
            delim = delim || csvDetectDelimiter(text);
            const rows = []; let row = [], cell = '', q = false, i = 0;
            const n = text.length;
            while (i < n) {
                const c = text[i];
                if (q) {
                    if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i += 2; continue; } q = false; i++; continue; }
                    cell += c; i++; continue;
                }
                if (c === '"' && cell === '') { q = true; i++; continue; }
                if (c === delim) { row.push(cell); cell = ''; i++; continue; }
                if (c === '\r' || c === '\n') {
                    row.push(cell); cell = '';
                    if (!(row.length === 1 && row[0] === '')) rows.push(row);
                    row = [];
                    i += (c === '\r' && text[i + 1] === '\n') ? 2 : 1; continue;
                }
                cell += c; i++;
            }
            row.push(cell);
            if (!(row.length === 1 && row[0] === '')) rows.push(row);
            return { rows, delim };
        }

        // 「首行表头」全局开关：在任意 CSV 里点一次，之后打开的所有 CSV 都按这个设置；已打开的 CSV 窗口同步切换。
        // localStorage 存 '1' / '0'；从没点过时按文件自动判断（首行全是数字就不当表头）。
        const CSV_HEADER_KEY = 'JSOS_CSV_HEADER';
        function csvHeaderGet() {
            try { const v = localStorage.getItem(CSV_HEADER_KEY); return v === '1' ? true : v === '0' ? false : undefined; } catch (e) { return undefined; }
        }
        function csvHeaderSet(val) {
            try { localStorage.setItem(CSV_HEADER_KEY, val ? '1' : '0'); } catch (e) {}
            window.dispatchEvent(new CustomEvent('jsos-csv-header', { detail: !!val }));
        }

        function openCSVViewer(content = '', filename = '未命名.csv', saveDir = null) {

            return createWindow({

                            <button class="npx-btn on" data-act="table" title="表格视图">${icon('uiTable')}<span class="lbl">表格</span></button>
                            <button class="npx-btn" data-act="source" title="编辑源码">${icon('uiCode')}<span class="lbl">源码</span></button>
                            <span class="npx-sep"></span>
                            <button class="npx-btn on" data-act="header" title="把第一行当作表头（对所有 CSV 文件生效）">${icon('uiPanelTop')}<span class="lbl">首行表头</span></button>
                            <label class="csvx-search" title="筛选行 (Ctrl+F)">${icon('uiSearch')}<input type="search" placeholder="筛选…" spellcheck="false"></label>
