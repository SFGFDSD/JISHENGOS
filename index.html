        // 补上新建文件夹功能的具体实现
        async function createNewFolder() {
            const name = await SysDialog.prompt({ title: '新建文件夹', icon: 'uiNewFolder', label: '文件夹名称', value: '新建文件夹', okText: '创建', validate: SysDialog.nameValidator('文件夹名称') });
            if (!name) return;
            const path = SYSTEM.desktopPath + '/' + name;
            SYSTEM.fs.mkdir(path, (err) => {
                if (err) Notify.error("创建失败", err.message);
                else {
                    refreshDesktop();
                    Notify.success("成功", "文件夹创建成功");
                }
            });
        }

        // 新建 HTML 文档：在 dirPath 下创建一个空的 .html 文件，并直接用 HTML 编辑器打开（保存会写回这个文件）。
        // 双击 .html 是在浏览器里打开，空文件只会显示白页，所以新建后直接进入编辑器。
        async function createNewHtmlFile(dirPath, windowId) {
            if (!dirPath) return;
            const input = await SysDialog.prompt({ title: '新建 HTML 文档', icon: 'uiNewHtml', label: '文件名称', value: '新建 HTML 文档.html', okText: '创建', validate: SysDialog.nameValidator('文件名称') });
            if (!input) return;
            const name = /\.html?$/i.test(input) ? input : input + '.html';
            const path = dirPath + '/' + name;
            SYSTEM.fs.stat(path, (statErr) => {
                if (!statErr) { Notify.error('创建失败', `"${name}" 已存在`); return; }
                SYSTEM.fs.writeFile(path, '', (err) => {
                    if (err) { Notify.error('创建失败', err.message); return; }
                    if (windowId && SYSTEM.folderWindowStates && SYSTEM.folderWindowStates[windowId]) renderFolderContent(windowId);
                    refreshDesktop();
                    openCodeEditor('', name, dirPath);
                });
            });
        }

        // === JISHENG OS 应用识别 ===
        // 新版应用标记：一个 HTML 注释里只要两样东西 —— 应用名 + 从任何地方复制来的 SVG。
        // 不用 JSON、不用转义引号、不用写宽高（应用窗口一律最大化打开）。
        //
        //   <!--
        //   JISHENG-OS-APP
        //   NAME: 计算器
        //   <svg viewBox="0 0 24 24">…原样粘贴…</svg>
        //   -->
        //
        // 解析规则（都是宽松容错的，认不出来的行直接忽略）：
        //   · 标记必须写在 HTML 注释（<!-- -->）里，且落在文件前 100 行内；
        //     标记在注释里的位置随意，注释上方写标题/说明文字都不影响。
        //   · 应用名：NAME/应用名/名称/标题/名字/APP/TITLE 等键名 + : ： = ，或者直接写在标记名后面。
        //   · 图标键（与应用名键对称）：SVG图标/图标/SVG/ICON + : ： = ，写了它就从这一行往后找图标。
        //   · 图标两种粘贴都认：
        //       ① 完整 <svg>…</svg>（说明文字里写的 <svg 字样会被跳过）；
        //       ② 只有内部图形 <rect/> <path/> …（没有外层 svg）→ 自动包一层 0 0 24 24 的 svg，
        //          并按线框图标渲染（补 fill="none" stroke="currentColor"），不会变成被填满的白块。
        //   · 旧版 JSON 标记依旧兼容，只是 width/height 不再生效。
        //   · 粘贴的图标若自带 <!-- -->，外层注释会被提前截断（HTML 注释不能嵌套）——
        //     这里不做跨注释捞回，只兜底补 </svg>；请直接删掉图标里的注释。
        const APP_NAME_KEYS = 'JISHENG-OS-APP|APPNAME|APP|NAME|TITLE|应用名|应用名称|名称|名字|标题|软件名|程序名';
        const APP_NAME_LINE_RE = new RegExp('^(?:' + APP_NAME_KEYS + ')\\s*(?:[:：=＝]\\s*(.*)|\\s+(.+))$', 'i');
        // 只有内部图形、没有外层 <svg> 时，能认出来的图形标签
        const APP_SHAPE_RE = /<(path|circle|rect|ellipse|line|polyline|polygon|g|use|text|defs|symbol|clipPath|mask|linearGradient|radialGradient|pattern|filter|style)\b/i;
        // 图标键：和"应用名："对称的写法 —— SVG图标：<svg …> / 图标： / ICON:
        // 作用不只是好看：写了它，解析器就从这一行开始找图标，注释前面提到的 SVG 不会被误选。
        const APP_ICON_KEYS = 'SVGICON|APPICON|ICON|SVG图标|应用图标|软件图标|程序图标|图标|SVG';
        const APP_ICON_LINE_RE = new RegExp('^(?:' + APP_ICON_KEYS + ')\\s*(?:[:：=＝]\\s*(.*)|\\s+(.+))?$', 'i');
        const APP_ICON_ANY_RE = new RegExp('^[ \\t]*(?:' + APP_ICON_KEYS + ')[ \\t]*(?:[:：=＝][ \\t]*|$)', 'im');
        // 旧版 JSON 标记的兼容探测
        const APP_JSON_RE = /^\s*[:：]?\s*(\{[\s\S]*\})\s*$/;

        /** 这一行是不是"图标键"行（图标键不参与应用名解析） */
        function isAppIconKeyLine(line) {
            return APP_ICON_LINE_RE.test(String(line || '').trim());
        }

        /**
         * 图标键在注释正文里的位置（没有则返回 -1）
         * 找到后从这里往后找图标 —— "SVG图标："下面贴什么就用什么，前面提过的 SVG 不参与。
         * @param {string} body - 注释正文
         * @returns {number}
         */
        function findAppIconStart(body) {
            const m = APP_ICON_ANY_RE.exec(String(body || ''));
            return m ? m.index : -1;
        }

        /** 应用标记的搜索范围：只在前 100 行里找（大文件不做全文扫描） */
        const APP_MARKER_LINE_LIMIT = 100;

        /**
         * 找出应用标记所在的注释
         * 标记可以出现在注释里的任何位置（注释上方写标题、说明都不影响）。
         * @param {string} htmlContent - HTML 文件内容
         * @returns {string|null} 注释正文（标记名本身也在里面）；找不到则返回 null
         */
        function findAppComment(htmlContent) {
            // 只在前 100 行里找标记，避免大文件全文正则；
            // split+join 出来的前缀与原文完全一致，所以下标可以直接用在原文上。
            // 标记要在前 100 行内，但注释里粘贴的 SVG 可以一直延伸到第 100 行之后。
            const head = htmlContent.split('\n').slice(0, APP_MARKER_LINE_LIMIT).join('\n');
            const re = /JISHENG-OS-APP/gi;
            let m;
            while ((m = re.exec(head))) {
                const at = m.index;
                const open = htmlContent.lastIndexOf('<!--', at);
                if (open === -1) continue;                                   // 前面没有注释开头 → 不在注释里
                if (htmlContent.slice(open, at).indexOf('-->') !== -1) continue; // 中间已经闭合过 → 不在注释里
                const close = htmlContent.indexOf('-->', at);
                if (close === -1) continue;
                return htmlContent.slice(open + 4, close);
            }
            return null;
        }

        /**
         * 取出第一段"看得像图标"的 <svg>…</svg>
         * 按标签配对计数，嵌套 <svg> 也能正确闭合，自闭合 <svg/> 也不会吃错东西。
         * @param {string} source
         * @returns {string|null}
         */
        function extractFirstSvg(source) {
            const text = String(source || '');
            const start = text.search(/<svg\b/i);
            if (start === -1) return null;
            const tagRE = /<\/?svg\b[^>]*>/gi;
            tagRE.lastIndex = start;
            let depth = 0, m;
            while ((m = tagRE.exec(text))) {
                if (m[0].slice(0, 2) === '</') {
                    depth--;
                    if (depth <= 0) return text.slice(start, m.index + m[0].length);
                } else if (/\/>\s*$/.test(m[0])) {
                    if (depth === 0) return m[0];   // <svg .../> 自闭合
                    depth++;
                } else {
                    depth++;
                }
            }
            return text.slice(start);   // 没有闭合标签：先取到末尾，交给 repairSvgAcrossComment 处理
        }

        /** SVG 是否已经完整（有 </svg> 收尾，或者本身就是 <svg .../> 自闭合） */
        function isCompleteSvg(text) {
            const t = String(text || '').trim();
            return /<\/svg\s*>/i.test(t) || /^<svg\b[^>]*\/>$/.test(t);
        }

        /**
         * 判断这段文本"是不是一个图标"，而不是说明文字里顺口写的 <svg 字样。
         * 图标源码里的标签/属性都是 ASCII；说明文字里往往带省略号、中文。
         */
        function looksLikeAppSvg(text) {
            const t = String(text || '').trim();
            const open = /^<svg\b[^>]*\/?>/i.exec(t);
            if (!open) return false;
            if (!/^[\x20-\x7E]*$/.test(open[0])) return false;   // 开标签里混进中文/省略号 → 说明文字
            if (/\/>$/.test(open[0])) return true;               // <svg ... /> 自闭合
            const after = t.slice(open[0].length);
            if (after && !/^\s*</.test(after)) return false;     // 开标签后面应直接跟子标签，而不是说明文字
            return APP_SHAPE_RE.test(t);
        }

        /**
         * 兜底：SVG 少写 </svg> 时补上（顺手砍掉没闭合的 <!-- 残尾）。
         * 万一用户粘贴的图标自带 <!-- -->（外层注释会被提前截断），也只让图标少一截内容，
         * 不会连带把后面的桌面标签"吞"进 SVG 里。
         * 跨注释把剩余内容捞回来那种修复已按需求去掉：直接让用户删掉图标里的注释即可。
         */
        function closeIncompleteSvg(svgText) {
            let text = String(svgText || '');
            const openComment = text.lastIndexOf('<!--');
            if (openComment !== -1 && text.indexOf('-->', openComment) === -1) text = text.slice(0, openComment);
            return text + '</svg>';
        }

        /**
         * 把用户粘贴的 SVG "洗"成能在系统外壳里稳定显示的样子：
         *   · 补 xmlns；补 class="app-custom-icon"（尺寸交给系统 CSS，不再写死宽高）
         *   · 写死了 width/height 又没有 viewBox 的，用它们换算 viewBox，保证等比缩放
         *   · 配色兜底：完全没写 fill/stroke 的按时实心图标补 fill="currentColor"；
         *     线框图标补 fill="none" stroke="currentColor"，没写描边宽度再补 stroke-width="1.5"（系统官方值）；
         *     自己写了颜色的原样不动。
         * @param {string} svg
         * @returns {string|null}
         */
        function polishAppSvg(svg) {
            if (!svg) return null;
            const openEnd = svg.indexOf('>');
            if (openEnd === -1) return null;
            let tag = svg.slice(0, openEnd + 1);
            const body = svg.slice(openEnd + 1);
            const selfClose = /\/\s*>$/.test(tag);   // <svg .../> 自闭合
            tag = tag.replace(/\/?\s*>$/, '');       // 统一去掉收尾的 > 或 /> ，最后再补回

            if (!/\sviewBox\s*=/i.test(tag)) {
                const w = (tag.match(/\swidth\s*=\s*["']?\s*([\d.]+)/i) || [])[1];
                const h = (tag.match(/\sheight\s*=\s*["']?\s*([\d.]+)/i) || [])[1];
                if (w && h) tag = tag.replace(/^<svg/i, `<svg viewBox="0 0 ${w} ${h}"`);
            }
            // 尺寸交给容器（.app-custom-icon / .desktop-icon / .window-icon），删掉粘贴来的固定宽高
            tag = tag.replace(/\s(?:width|height)\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
            if (!/\sxmlns\s*=/i.test(tag)) tag = tag.replace(/^<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
            if (/\sclass\s*=/i.test(tag)) {
                tag = tag.replace(/\sclass\s*=\s*(?:"([^"]*)"|'([^']*)')/i, (mm, a, b) => ` class="${((a || b || '') + ' app-custom-icon').trim()}"`);
            } else {
                tag = tag.replace(/^<svg/i, '<svg class="app-custom-icon"');
            }

            const hasColor   = (t) => /\sfill\s*=|\sstroke\s*=|\sstyle\s*=\s*["'][^"']*(?:fill|stroke)/i.test(t);
            const hasFill    = (t) => /\sfill\s*=|\sstyle\s*=\s*["'][^"']*fill/i.test(t);
            const hasStroke  = (t) => /\sstroke\s*=|\sstyle\s*=\s*["'][^"']*stroke/i.test(t);
            const hasStrokeW = (t) => /stroke-width\s*[:=]/i.test(t);
            const fillIsNone = (t) => /fill\s*[:=]\s*["']?\s*none/i.test(t);
            if (!hasColor(tag) && !hasColor(body)) {
                // 一点颜色信息都没有 → 按实心图标（和 SVG 默认 fill 行为一致，Simple Icons 那类图标就长这样）
                tag += ' fill="currentColor"';
            } else {
                // 有颜色信息：
                //   · 没有任何 fill → 补 fill="none"，否则 SVG 默认的黑色会把图形填成实心块（白块那个 bug 的根源）
                //   · 确认是线框图标（fill="none"）→ 缺 stroke 补 stroke="currentColor"、缺宽度补系统官方 1.5
                //   · 本来就写着 fill（实心/多色图标）→ 什么都不动，别给它加描边
                const missingFill = !hasFill(tag) && !hasFill(body);
                const lineFrame = missingFill || fillIsNone(tag) || fillIsNone(body);
                let inject = '';
                if (missingFill) inject += ' fill="none"';
                if (lineFrame) {
                    if (!hasStroke(tag) && !hasStroke(body)) inject += ' stroke="currentColor"';
                    if (!hasStrokeW(tag) && !hasStrokeW(body)) inject += ' stroke-width="' + APP_ICON_STROKE_WIDTH + '"';
                }
                if (inject) tag += inject;   // 追加在原有属性后面，输出更好读
            }
            return tag + (selfClose ? '/>' : '>') + body;
        }

        /**
         * 只粘贴了内部图形（没有外层 <svg>）时能认出来的图形标签。
         * 每一行必须是"纯标签"，像"把 <path> 图形贴这里"这种说明文字不会被当成图标。
         */
        const FRAGMENT_TAGS = 'path|circle|rect|ellipse|line|polyline|polygon|g|use|defs|symbol|clipPath|mask|linearGradient|radialGradient|stop|pattern|filter';
        const FRAGMENT_BLOCK_RE = new RegExp('^\\s*(?:<?/?(?:' + FRAGMENT_TAGS + ')\\b[^<>]*?/?>\\s*)+$', 'i');
        // 裸图形片段的默认画法：线框（描边）。从 Lucide / Feather / Tabler 这类线框图标站复制内部图形时，
        // fill="none" stroke=… 这些属性在父级 <svg> 上、不会被一起复制过来，所以必须由我们补上，
        // 否则圆角矩形会被当成实心块填充 —— 也就是"粘贴进去变成一个白块"的那个 bug。
        // 描边宽度用系统官方值（与 .icon-svg 的默认 stroke-width: 1.5 保持一致），想改就改这一行。
        const APP_ICON_STROKE_WIDTH = '1.5';
        const FRAGMENT_STROKE_ATTRS = 'fill="none" stroke="currentColor" stroke-width="' + APP_ICON_STROKE_WIDTH + '" stroke-linecap="round" stroke-linejoin="round"';

        /**
         * 从注释里找"连续成块"的裸图形（没有外层 <svg> 的粘贴内容）
         * @param {string} source
         * @returns {string|null} 完整的 <svg> 字符串
         */
        function buildFragmentIcon(source) {
            const lines = String(source || '').split(/\r?\n/);
            const block = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (!FRAGMENT_BLOCK_RE.test(line)) {
                    if (block.length) break;   // 图形块结束，后面的说明文字/其它内容不参与
                    continue;
                }
                block.push(line.trim());
            }
            if (!block.length) return null;
            const fragment = block.join('');
            // 片段自己写了颜色就听它的：有 stroke → 线框；只有 fill → 实心；什么都没写 → 线框（最常见来源）
            let attrs = FRAGMENT_STROKE_ATTRS;
            if (!/\sstroke\s*=/i.test(fragment) && /\sfill\s*=/i.test(fragment)) attrs = 'fill="currentColor" stroke="none"';
            return polishAppSvg('<svg viewBox="0 0 24 24" ' + attrs + '>' + fragment + '</svg>');
        }

        /**
         * 从一段文本里抓出图标：
         *   ① 第一个"看得像图标"的完整 <svg>…</svg>（说明文字里写的 <svg 字样会被跳过）；
         *   ② 只粘贴了 <path>/<circle> 这类内部图形时，自动补一层 <svg viewBox="0 0 24 24">（按线框渲染）。
         * @param {string} source - 待扫描的文本（一般是注释正文）
         * @returns {string|null} 完整的 <svg> 字符串
         */
        function buildAppIcon(source) {
            const text = String(source || '');
            let from = 0;
            while (from < text.length) {
                const at = text.toLowerCase().indexOf('<svg', from);
                if (at === -1) break;
                from = at + 4;
                let svgText = extractFirstSvg(text.slice(at));
                if (!svgText) continue;
                if (!isCompleteSvg(svgText)) svgText = closeIncompleteSvg(svgText);
                if (looksLikeAppSvg(svgText)) return polishAppSvg(svgText);
            }
            return buildFragmentIcon(text);
        }

        /**
         * 名字行的合法写法（键名大小写不敏感，冒号/等号/全角冒号都行）：
         *   ① NAME: 计算器      ② 应用名：计算器      ③ NAME:（冒号后留空 → 名字写在下一行）
         * 认不出来的行（装饰线、说明文字、SVG 内容）一律忽略。
         * @param {string} line
         * @returns {string|null} 名字；'' 表示"键名后面是空的"；null 表示这行不认识
         */
        function appNameFromLine(line) {
            const m = APP_NAME_LINE_RE.exec(String(line || '').trim());
            if (!m) return null;
            return String((m[1] !== undefined ? m[1] : m[2]) || '').trim();
        }

        /**
         * 值里出现这些字样，基本是在写"提示/占位符"，不是真名字。
         * 有了它，像"应用名 ↓ 写在这里"这种自解释模板也不会被当成名字。
         */
        function looksLikeAppNameHint(value) {
            const v = String(value || '').trim();
            if (!v) return true;
            if (/^[←→↑↓⇦⇨⇧⇩⤴⤵><=~^|·•\-—…:：=＝!！?？]+$/.test(v)) return true;      // 纯箭头/分隔符号
            if (/[←→↑↓⇦⇨⇧⇩⤴⤵]/.test(v)) return true;                             // 出现箭头 → 是示意，不是名字
            if (/(写|填|粘贴|复制|放)(在|到|入)?(这|下面|上面|此处|这里)/.test(v)) return true;
            if (/^(这里|此处|应用名|应用名称|名称|名字|你的应用名|XX+|XXX?)$/i.test(v)) return true;
            if (/^[（(\[【<].{0,10}[）)\]】>]$/.test(v) && /(应?用?名|名称|名字|填|写|这里)/.test(v)) return true;
            return false;
        }

        /** 装饰线（===== / ----- / *****）不算名字 */
        function isDecorationLine(line) {
            return /^[=\-*_~#·•\s]+$/.test(String(line || '')) || /[=]{4,}|[-]{4,}/.test(String(line || ''));
        }

        /**
         * 从注释正文里挑应用名
         * 顺序：① 标记同一行写的内容 → ② 认得出的键名行 → ③ SVG 上方最近的一行普通文字
         * @param {string} body - 注释正文
         * @returns {string|null}
         */
        function parseAppNameFromComment(body) {
            const lines = String(body || '').split(/\r?\n/);
            // 标记所在的那一行：标记名后面的内容就是"同一行写法"
            let markerLine = -1;
            for (let i = 0; i < lines.length; i++) {
                if (/JISHENG-OS-APP/i.test(lines[i])) { markerLine = i; break; }
            }
            const head = markerLine === -1 ? ''
                : lines[markerLine].replace(/[\s\S]*?JISHENG-OS-APP[ \t]*/i, '').replace(/^[:：=＝][ \t]*/, '').trim();
            // 同一行直接写名字：<!-- JISHENG-OS-APP: 计算器 -->
            // 排除两种"不是名字"的情况：以标签开头（把 SVG 贴到了标记后面）、以及 JSON 对象（旧格式）
            if (head && !/^</.test(head) && !/<svg\b/i.test(head) && !/^\{/.test(head) && appNameFromLine(head) === null) return head;

            const others = lines.filter((_, i) => i !== markerLine);
            const keys = markerLine === -1 ? lines : [head].concat(others);

            // ② 键名行（含"键名后面留空 → 取下一行"的写法）
            for (let i = 0; i < keys.length; i++) {
                if (isAppIconKeyLine(keys[i])) continue;   // "SVG图标：…"是图标键，不当应用名
                const val = appNameFromLine(keys[i]);
                if (val === null) continue;
                if (val && !looksLikeAppNameHint(val)) return val;   // 值是提示文字 → 当没写，继续往下找
                for (let j = i + 1; j < keys.length; j++) {
                    const next = keys[j].trim();
                    if (!next || next.includes('<') || looksLikeAppNameHint(next) || isAppIconKeyLine(next)) continue;
                    if (appNameFromLine(next) !== null) break;
                    return next;
                }
            }

            // ③ 一个键名都没写：取图标上方最近的一行普通文字（最省事的写法）
            const raw = String(body || '');
            const svgAt = raw.search(/<svg\b/i);
            const headLines = svgAt === -1 ? lines : lines.slice(0, raw.slice(0, svgAt).split(/\r?\n/).length);
            for (let i = headLines.length - 1; i >= 0; i--) {
                const v = headLines[i].trim();
                if (!v || v.includes('<') || /JISHENG-OS-APP/i.test(v) || isDecorationLine(v) || isAppIconKeyLine(v)) continue;
                const parsed = appNameFromLine(v);
                const candidate = parsed === null ? v : parsed;
                if (!candidate || looksLikeAppNameHint(candidate)) continue;
                return candidate;
            }
            return null;
        }

        /** 收拾名字：合并空白、去掉成对引号、限制长度（名字会进标题栏/任务栏/桌面标签） */
        function cleanAppName(raw) {
            let s = String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim();
            while (s.length > 1 && /^["'“”‘’]/.test(s) && /["'“”‘’]$/.test(s)) s = s.slice(1, -1).trim();
            return s.slice(0, 60);
        }

        /**
         * 解析 HTML 文件中的 JISHENG OS 应用标记
         *
         * 只要注释里出现 JISHENG-OS-APP，这个文件就按"应用"打开（窗口无地址栏、默认最大化）；
         * 名字和图标能解析出来就用，解析不出来就用 <title>/文件名 + 系统默认问号图标兜底。
         * 标记要在前 100 行内；注释里的 SVG 再长也没关系（可以一路延伸下去）。
         *
         * @param {string} htmlContent - HTML文件内容
         * @param {string} [filename] - 文件名（没写名字时的兜底）
         * @returns {Object|null} 应用配置 { name, icon }；不是应用则返回 null
         */
        function parseJishengApp(htmlContent, filename) {
            if (!htmlContent) return null;
            const body = findAppComment(htmlContent);
            if (body === null) return null;

            let name = null;
            let icon = null;

            // ① 旧版 JSON 标记照旧兼容：<!-- JISHENG-OS-APP: {"name":"…","icon":"<svg …>"} -->
            //   （body 里含标记名本身，先把它剥掉再判断是不是纯 JSON）
            const json = body.replace(/^[\s\S]*?JISHENG-OS-APP[ \t]*/i, '').match(APP_JSON_RE);
            if (json) {
                try {
                    const cfg = JSON.parse(json[1]);
                    if (cfg && cfg.name) {
                        name = cleanAppName(cfg.name);
                        icon = buildAppIcon(cfg.icon);
                    }
                } catch (e) {
                    // 不是合法 JSON 就当新版格式继续解析（新版本来就不要求 JSON）
                }
            }

            // ② 新版：标记里直接挑名字 + 抓 SVG
            if (!name) name = cleanAppName(parseAppNameFromComment(body));
            if (!icon) {
                // 写了"SVG图标："就从那一行往后找；没找到再退回整段注释找
                const iconStart = findAppIconStart(body);
                if (iconStart >= 0) icon = buildAppIcon(body.slice(iconStart));
            }
            if (!icon) icon = buildAppIcon(body);

            // ③ 兜底：<title> → 文件名（去掉扩展名）→ 未命名应用
            if (!name) {
                const title = (htmlContent.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1];
                name = cleanAppName((title || '').split(/\s+[-–—|·]\s+/)[0])
                    || cleanAppName(String(filename || '').replace(/\.[a-z0-9]+$/i, ''))
                    || '未命名应用';
            }

            // 名字会进 innerHTML（标题栏/任务栏/桌面标签），转义一下更稳
            return { name: escapeHtml(name), icon: icon || null };
        }

        /**
         * 作为 JISHENG OS 应用打开 HTML 文件（无地址栏、默认最大化）
         * @param {string} htmlContent - HTML文件内容
         * @param {Object} appConfig - 应用配置 { name, icon }
         * @param {string} filename - 文件名
         */
        function openJishengApp(htmlContent, appConfig, filename) {
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            // 应用图标：标记里带 SVG 就用它（parseJishengApp 已清洗成完整 <svg>），
            // 没有则回退到集中式图标库的 appUnknown 问号图标
            const iconHtml = appConfig.icon || icon('appUnknown', 'sm');

            createWindow({
                title: appConfig.name,
                iconHtml: iconHtml,
                // 应用窗口没必要让用户先看见一个小窗口：一律最大化打开。
                // 想改尺寸？点标题栏的最大化按钮还原（回到下面这套默认几何），或者直接拖窗口边缘。
                maximized: true,
                width: 1000,
                height: 700,
                content: `
                    <div class="content-area dark" style="position:relative;flex:1;">
                        <div class="loading-overlay active"><div class="spinner"></div></div>
                        <!-- 注意：故意不设 sandbox 限制以保证最佳性能和兼容性，请勿添加 -->
                        <iframe src="${url}" style="width:100%;height:100%;border:none;" onload="this.previousElementSibling.classList.remove('active')"></iframe>
                    </div>
                `,
                // 修复内存泄漏：关窗时释放承载整个 HTML 文件的 Blob URL（原来从不释放）
                onInit: (w) => { w.cleanup = () => URL.revokeObjectURL(url); }
            });
        }


        // === 文件操作 ===
        function openFile(filename) {
            // 直接转接给通用打开函数，保证逻辑统一
            const fullPath = SYSTEM.desktopPath + '/' + filename;
            openFileFromPath(fullPath, filename);
        }

        // 通用的文件打开逻辑 (现在支持桌面文件和文件夹内的文件)
        function openFileFromPath(fullPath, filename) {
            // 先检查路径是文件还是目录
            SYSTEM.fs.stat(fullPath, (err, stats) => {
                if (err) { 
                    Notify.error('无法访问', err.message); 
                    return; 
                }
                const isDir = stats.isDirectory ? (typeof stats.isDirectory === 'function' ? stats.isDirectory() : stats.isDirectory) : false;
                if (isDir) {
                    // 是目录，用文件夹窗口打开
                    const pathParts = fullPath.split('/');
                    const folderName = pathParts[pathParts.length - 1];
                    const parentPath = pathParts.slice(0, -1).join('/') || SYSTEM.desktopPath;
                    openFolderWindow(folderName, parentPath);
                    return;
                }

                // 磁盘镜像（iso/img）：双击即用 V86 虚拟机打开
                if(filename.match(/\.(iso|img)$/i)) {
                    openV86(fullPath);
                    return;
                }

                // 1. 处理 HTML 文件
                if(filename.match(/\.html?$/i)) {
                SYSTEM.fs.readFile(fullPath, 'utf8', (err, data) => {
                    if(err) { Notify.error('打开失败', err.message); return; }
                    
                    // 检测是否为 JISHENG OS 应用（传文件名：标记里没写应用名时用它兜底）
                    const appConfig = parseJishengApp(data, filename);
                    if (appConfig) {
                        // 作为独立应用打开（无地址栏）
                        openJishengApp(data, appConfig, filename);
                        Notify.success('正在打开', `已启动应用: ${appConfig.name}`);
                    } else {
                        // 普通HTML文件，用浏览器打开
                        const blob = new Blob([data], { type: 'text/html' });
                        const url = URL.createObjectURL(blob);
                        openBrowser(url, url);
                        Notify.success('正在打开', '已在浏览器中加载 HTML 文件');
                    }
                });
            }
            // 2. 处理图片文件 (改为调用漫画查看器)
            else if(IMG_EXT_RE.test(filename)) {
                openMangaViewer(fullPath, filename);
            }
            // 3. 处理 CSV 文件 (使用表格查看器)
            else if(filename.match(/\.csv$/i)) {
                SYSTEM.fs.readFile(fullPath, 'utf8', (err, data) => {
                    if(err) { Notify.error('打开失败', err.message); return; }
                    // 修复：传入文件所在目录，保存时写回原文件（原来总是写到桌面）
                    openCSVViewer(data, filename, fullPath.substring(0, fullPath.lastIndexOf('/')) || SYSTEM.desktopPath);
                });
            }
            // 4. 处理文本文件
            else if(filename.match(/\.(txt|md)$/i)) {
                SYSTEM.fs.readFile(fullPath, 'utf8', (err, data) => {
                    if(err) { Notify.error('打开失败', err.message); return; }
                    // 修复(Bug B)：传入文件所在目录，使另存为/保存默认写回原目录而非桌面。
                    const dir = fullPath.substring(0, fullPath.lastIndexOf('/')) || SYSTEM.desktopPath;
                    openNotepad(data, filename, dir);
                });
            } 
            // 4. 处理压缩文件 (支持 zip/7z/rar/tar/gz 等格式)
            else if(isArchiveFile(filename)) {
                extractArchive(fullPath);
            } 
            // 5. 处理 PDF 文件
            else if(filename.match(/\.pdf$/i)) {
                SYSTEM.fs.readFile(fullPath, (err, data) => {
                    if(err) { Notify.error('打开失败', err.message); return; }
                    const base64 = SYSTEM.Buffer.from(data).toString('base64');
                    const dataUrl = `data:application/pdf;base64,${base64}`;
                    
                    createWindow({
                        title: filename,
                        iconHtml: icon('filePdf','sm'),
                        width: 800, height: 600,
                        content: `<div class="content-area dark" style="overflow:hidden">
                            <!-- 注意：故意不设 sandbox 限制以保证最佳性能和兼容性，请勿添加 -->
                            <iframe src="${dataUrl}" style="width:100%;height:100%;border:none"></iframe>
                        </div>`
                    });
                });
            }
            // 6. 处理 MP4 视频文件
            else if(filename.match(/\.mp4$/i)) {
                SYSTEM.fs.readFile(fullPath, (err, data) => {
                    if(err) { Notify.error('打开失败', err.message); return; }
                    const base64 = SYSTEM.Buffer.from(data).toString('base64');
                    const dataUrl = `data:video/mp4;base64,${base64}`;
                    
                    createWindow({
                        title: filename,
                        iconHtml: icon('fileVideo','sm'),
                        width: 800, height: 600,
                        content: `<div class="content-area dark" style="display:flex;align-items:center;justify-content:center;overflow:hidden">
                            <video src="${dataUrl}" controls autoplay style="max-width:100%;max-height:100%"></video>
                        </div>`
                    });
                });
            }
            // 7. 处理音频文件 (MP3/M4A)
            else if(filename.match(/\.(mp3|m4a)$/i)) {
                SYSTEM.fs.readFile(fullPath, (err, data) => {
                    if(err) { Notify.error('打开失败', err.message); return; }
                    const base64 = SYSTEM.Buffer.from(data).toString('base64');
                    const ext = filename.match(/\.(mp3|m4a)$/i)[1].toLowerCase();
                    const mimeType = ext === 'm4a' ? 'audio/mp4' : 'audio/mpeg';
                    const dataUrl = `data:${mimeType};base64,${base64}`;
                    
                    createWindow({
                        title: filename,
                        iconHtml: icon('fileAudio','sm'),
                        width: 500, height: 200,
                        content: `<div class="content-area dark" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden">
                            <div style="margin-bottom:20px;color:var(--text-muted);font-size:14px">${filename}</div>
                            <audio src="${dataUrl}" controls autoplay style="width:100%"></audio>
                        </div>`
                    });
                });
            }
            // 8. 其他文件类型 - 尝试用记事本打开
            else {
                SYSTEM.fs.readFile(fullPath, 'utf8', (err, data) => {
                    if(err) { 
                        Notify.warning('不支持的格式', '暂时无法打开此类型文件'); 
                        return; 
                    }
                    // 修复(#1)：传入第三个参数 fullPath 所在目录，
                    // 使未知类型文件用记事本打开后保存仍写回原目录而非桌面。
                    const dir = fullPath.substring(0, fullPath.lastIndexOf('/')) || SYSTEM.desktopPath;
                    openNotepad(data, filename, dir);
                    Notify.info('文本模式', '已使用记事本打开该文件');
                });
            }
            }); // end stat callback
        }

        // ============================================
        // 「打开方式」功能增强：指定用某个应用打开文件
        // ============================================

        // 用代码编辑器打开（保存回源目录）
        function openWithEditor(fullPath, filename) {
            SYSTEM.fs.readFile(fullPath, 'utf8', (err, data) => {
                if (err) { Notify.error('打开失败', err.message); return; }
                const dir = fullPath.substring(0, fullPath.lastIndexOf('/')) || SYSTEM.desktopPath;
                openCodeEditor(data, filename, dir);
                Notify.success('正在打开', `已在代码编辑器中打开 "${filename}"`);
            });
        }

        // 用记事本（文本）打开（保存回源目录）
        function openWithNotepad(fullPath, filename) {
            SYSTEM.fs.readFile(fullPath, 'utf8', (err, data) => {
                if (err) { Notify.error('打开失败', err.message); return; }
                const dir = fullPath.substring(0, fullPath.lastIndexOf('/')) || SYSTEM.desktopPath;
                openNotepad(data, filename, dir);
                Notify.success('正在打开', `已用记事本打开 "${filename}"`);
            });
        }

        // 用浏览器打开（按 MIME 生成 Blob URL，HTML/图片/PDF 等均可在浏览器中查看）
        function openWithBrowser(fullPath, filename) {
            const ext = (filename || '').split('.').pop().toLowerCase();
            const mimeMap = {
                html: 'text/html', htm: 'text/html', svg: 'image/svg+xml',
                txt: 'text/plain', md: 'text/plain', css: 'text/css', js: 'text/javascript',
                json: 'application/json', xml: 'application/xml', csv: 'text/csv',
                pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
                gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp'
            };
            const mime = mimeMap[ext] || 'application/octet-stream';
            SYSTEM.fs.readFile(fullPath, (err, data) => {
                if (err) { Notify.error('打开失败', err.message); return; }
                const blob = new Blob([data], { type: mime });
                const url = URL.createObjectURL(blob);
                openBrowser(url, url);
                Notify.success('正在打开', `已在浏览器中打开 "${filename}"`);
            });
        }

        // ============================================
        // 「设为桌面壁纸」：图片文件右键菜单
        // ============================================
        const WALLPAPER_IMAGE_MIME = {
            jpg: 'image/jpeg', jpeg: 'image/jpeg', jfif: 'image/jpeg', png: 'image/png',
            gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp', svg: 'image/svg+xml',
            avif: 'image/avif', ico: 'image/x-icon'
        };

        function isImageFile(filename) {
            const ext = String(filename || '').split('.').pop().toLowerCase();
            return String(filename || '').includes('.') && Object.prototype.hasOwnProperty.call(WALLPAPER_IMAGE_MIME, ext);
        }

        // 读取虚拟文件系统中的图片，转为 Data URL 后设置为壁纸并持久化
        // （与「上传本地图片」相同，保存 Data URL，源文件删除/改名后壁纸依然有效）
        function setWallpaperFromPath(fullPath, filename) {
            if (!SYSTEM.fs) { Notify.error('设置失败', '文件系统尚未就绪'); return; }
            const name = filename || String(fullPath).split('/').pop();
            const ext = name.split('.').pop().toLowerCase();
            const mime = WALLPAPER_IMAGE_MIME[ext] || 'image/png';
            SYSTEM.fs.stat(fullPath, (err, stats) => {
                if (err) { Notify.error('设置失败', err.message); return; }
                const isDir = typeof stats.isDirectory === 'function' ? stats.isDirectory() : !!stats.isDirectory;
                if (isDir) { Notify.warning('设置失败', '所选项目不是图片文件'); return; }
                SYSTEM.fs.readFile(fullPath, (err, data) => {
                    if (err) { Notify.error('设置失败', err.message); return; }
                    let dataUrl;
                    try {
                        const base64 = SYSTEM.Buffer.from(data).toString('base64');
                        dataUrl = `data:${mime};base64,${base64}`;
                    } catch (e) {
                        Notify.error('设置失败', e.message || '图片读取失败');
                        return;
                    }
                    // 先预加载校验图片可解码，避免损坏文件导致桌面变空白
                    const img = new Image();
                    img.onload = () => {
                        const wasDaily = wpApplyCustom(dataUrl, name);
                        Notify.success('壁纸已更换', `已将 "${name}" 设为桌面壁纸${wasDaily ? '，必应每日壁纸已关闭' : ''}`);
                    };
                    img.onerror = () => Notify.error('设置失败', `"${name}" 无法作为图片解码`);
                    img.src = dataUrl;
                });
            });
        }

        // 仅这几类文件提供「打开方式」子菜单：HTML / CSS / JS / JSON / MD
        // 其他类型（图片、PDF、压缩包、音视频等）不显示，没有意义。
        function canOpenWith(filename) {
            return /\.(html?|css|js|json|md)$/i.test(filename);
        }

        // 生成「打开方式」三项菜单 HTML（传入已转义的路径/文件名）
        // 上述 5 类文件统一提供：代码编辑器 / 浏览器 / 记事本 三项。
        function buildOpenWithMenu(safeFullPath, safeFilename, filename) {
            return `
                <div class="context-item" onclick="openWithEditor('${safeFullPath}', '${safeFilename}'); closeCtx()">
                    ${icon('uiCode','sm')}
                    <span>用代码编辑器打开</span>
                </div>
                <div class="context-item" onclick="openWithBrowser('${safeFullPath}', '${safeFilename}'); closeCtx()">
                    ${icon('uiBrowserCtx','sm')}
                    <span>用浏览器打开</span>
                </div>
                <div class="context-item" onclick="openWithNotepad('${safeFullPath}', '${safeFilename}'); closeCtx()">
                    ${icon('uiNewFile','sm')}
                    <span>用记事本打开</span>
                </div>`;
        }

        async function deleteFile(filename) {
            if (!(await SysDialog.confirm({ title: '删除', icon: 'uiDelete', danger: true, okText: '删除', message: `确定删除 "${filename}" 吗？` }))) return;
            const path = SYSTEM.desktopPath + '/' + filename;
            
            SYSTEM.fs.stat(path, (err, stats) => {
                if(err) { Notify.error('删除失败', err.message); return; }
                
                if(stats.isDirectory()) {
                    deleteFolderRecursive(path, () => {
                        refreshDesktop();
                        Notify.success('删除成功', `文件夹 "${filename}" 已删除`);
                    });
                } else {
                    SYSTEM.fs.unlink(path, (err) => {
                        if(err) { Notify.error('删除失败', err.message); return; }
                        refreshDesktop();
                        Notify.success('删除成功', `文件 "${filename}" 已删除`);
                    });
                }
            });
        }

        function deleteFolderRecursive(path, callback) {
            // JISHENG FS：根卷内（且子树里没有挂载点）一个事务删除整棵树，日期记录随后整棵清掉。
            if (SYSTEM.fs && typeof SYSTEM.fs._rmTree === 'function' && SYSTEM.fs._isNativeTree(path)) {
                const cb = typeof callback === 'function' ? callback : function() {};
                SYSTEM.fs._rmTree(path, true).then(() => {
                    try { SYSTEM.dropMtimeCache(path); } catch (_) {}
                    cb(null);
                }, err => cb(err));
                return;
            }
            SYSTEM.fs.readdir(path, (err, files) => {
                if(err) { callback(err); return; }
                
                let pending = files.length;
                if(!pending) {
                    SYSTEM.fs.rmdir(path, callback);
                    return;
                }
                
                files.forEach(file => {
                    const curPath = path + '/' + file;
                    SYSTEM.fs.stat(curPath, (err, stats) => {
                        if(err) {
                            // 如果出错，跳过当前文件，继续处理其他文件
                            if(--pending === 0) SYSTEM.fs.rmdir(path, callback);
                            return;
                        }
                        if(stats.isDirectory()) {
                            deleteFolderRecursive(curPath, () => {
                                if(--pending === 0) SYSTEM.fs.rmdir(path, callback);
                            });
                        } else {
                            SYSTEM.fs.unlink(curPath, () => {
                                if(--pending === 0) SYSTEM.fs.rmdir(path, callback);
                            });
                        }
                    });
                });
            });
        }

        // ============================================
        // 统一解压函数 - 支持 zip/7z/rar/tar/gz 等格式
        // ============================================

        function isArchiveFile(filename) {
            return /\.(zip|7z|rar|tar|gz|bz2|xz|cab|tgz)$/i.test(filename);
        }

        function getArchiveType(filename) {
            const ext = filename.toLowerCase().split('.').pop();
            if (ext === 'zip') return 'zip';
            if (['7z', 'rar', 'tar', 'gz', 'bz2', 'xz', 'cab', 'tgz'].includes(ext)) return '7z';
            return 'unknown';
        }

        // JSZip 把 ZIP 的 DOS 时间按 UTC 解析，而 ZIP 规范中 DOS 时间应为本地时间。
        // 这里把 UTC 分量重新解释成本地时间，使解压后显示与压缩包内记录一致。
        function fixZipReadDate(date) {
            if (!date || !(date instanceof Date) || isNaN(date.getTime())) return date;
            return new Date(
                date.getUTCFullYear(),
                date.getUTCMonth(),
                date.getUTCDate(),
                date.getUTCHours(),
                date.getUTCMinutes(),
                date.getUTCSeconds()
            );
        }

        // 生成 ZIP 时做逆操作：把本地时间分量转成 UTC 分量传给 JSZip，
        // 让外部工具（以及修复后的解压）看到的日期保持正确。
        function prepareZipWriteDate(date) {
            if (!date || !(date instanceof Date) || isNaN(date.getTime())) return date;
            return new Date(Date.UTC(
                date.getFullYear(),
                date.getMonth(),
                date.getDate(),
                date.getHours(),
                date.getMinutes(),
                date.getSeconds()
            ));
        }

        async function extractArchive(filePath) {
            const filename = filePath.split('/').pop();
            const folderName = filename.replace(/\.(zip|7z|rar|tar|gz|bz2|xz|cab|tgz)$/i, '');
            const parentDir = filePath.substring(0, filePath.lastIndexOf('/'));
            const targetDir = parentDir + '/' + folderName;
            const archiveType = getArchiveType(filename);

            const progressEl = document.createElement('div');
            progressEl.className = 'extract-progress';
            // 新版解压弹窗：同款玻璃 + 图标 + 文件名 + 百分比 + 渐变光感进度条
            const escHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            progressEl.innerHTML = `
                <div class="extract-head">
                    <div class="extract-icon">${icon('uiExtractSimple')}</div>
                    <div class="extract-titles">
                        <div class="extract-title">正在解压</div>
                        <div class="extract-filename" title="${escHtml(filename)}">${escHtml(filename)}</div>
                    </div>
                    <div class="extract-percent" id="extract-percent">5%</div>
                </div>
                <div class="extract-bar-wrap"><div class="bar"><div class="bar-fill" id="extract-bar"></div></div></div>
                <p class="extract-status" id="extract-status">读取压缩包...</p>
            `;
            document.body.appendChild(progressEl);

            const updateProgress = (percent) => {
                const p = Math.max(0, Math.min(100, Math.round(percent)));
                const bar = document.getElementById('extract-bar');
                const pct = document.getElementById('extract-percent');
                if (bar) bar.style.width = p + '%';
                if (pct) pct.innerText = p + '%';
            };
            const updateStatus = (text) => {
                const status = document.getElementById('extract-status');
                if (status) status.innerText = text;
            };
            const closeProgress = () => {
                if (!progressEl || !progressEl.parentElement) return;
                progressEl.classList.add('out');
                setTimeout(() => progressEl.remove(), 170);
            };

            try {
                updateStatus('读取压缩包...');
                updateProgress(5);
                
                const fileData = await new Promise((resolve, reject) => {
                    SYSTEM.fs.readFile(filePath, (err, data) => {
                        if (err) reject(err);
                        else resolve(data);
                    });
                });

                await new Promise(resolve => {
                    SYSTEM.fs.mkdir(targetDir, () => resolve());
                });

                let extractedFiles = [];

                if (archiveType === 'zip') {
                    updateStatus('解析 ZIP 结构...');
                    updateProgress(10);
                    
                    const zip = await JSZip.loadAsync(fileData);
                    const entries = Object.keys(zip.files);
                    const fileEntries = entries.filter(name => !zip.files[name].dir);
                    const total = fileEntries.length;

                    for (let i = 0; i < fileEntries.length; i++) {
                        const relativePath = fileEntries[i];
                        const zipEntry = zip.files[relativePath];
                        
                        updateStatus(relativePath);
                        updateProgress(10 + (i / total) * 85);
                        
                        const content = await zipEntry.async('arraybuffer');
                        extractedFiles.push({
                            path: relativePath,
                            data: new Uint8Array(content),
                            mtime: fixZipReadDate(zipEntry.date)
                        });
                    }

                    // 收集目录条目（统一创建并设置原始修改时间）
                    for (const dirPath of entries.filter(name => zip.files[name].dir)) {
                        extractedFiles.push({
                            path: dirPath.replace(/\/$/, ''),
                            dir: true,
                            mtime: fixZipReadDate(zip.files[dirPath].date)
                        });
                    }
                } else if (archiveType === '7z') {
                    if (!window.sevenZipReady) {
                        throw new Error('7z引擎未加载，请刷新页面重试');
                    }
                    
                    updateStatus('使用 7z 引擎解压...');
                    updateProgress(20);
                    
                    extractedFiles = await window.sevenZipEngine.extract(fileData, filename);
                    updateProgress(90);
                    
                    window.sevenZipEngine.cleanup();
                } else {
                    throw new Error('不支持的压缩格式');
                }

                // 修复：避免双层嵌套（Project.zip 内含 Project/ 时解压到 /desktop/Project 会得到 /desktop/Project/Project）
                // 若所有条目均位于单一顶层目录且该目录名与压缩包名一致，则剥离前缀，直接将内容解压到 targetDir
                let _topDirMtimeForTarget = null;
                if (folderName && extractedFiles.length > 0) {
                    const allInPrefix = extractedFiles.every(f => f.path === folderName || f.path.startsWith(folderName + '/'));
                    if (allInPrefix) {
                        const topEntry = extractedFiles.find(f => f.path === folderName && f.dir);
                        if (topEntry && topEntry.mtime) {
                            const ms = topEntry.mtime instanceof Date ? topEntry.mtime.getTime() : Number(topEntry.mtime);
                            if (!isNaN(ms) && ms > 0) _topDirMtimeForTarget = ms;
                        }
                        extractedFiles.forEach(f => {
                            if (f.path === folderName) f.path = '';
                            else if (f.path.startsWith(folderName + '/')) f.path = f.path.slice(folderName.length + 1);
                        });
                        extractedFiles = extractedFiles.filter(f => f.path !== '');
                    }
                }

                updateStatus('写入文件...');
                // 修复：文件夹修改时间应保留原始时间，而非全部变为解压时刻（当前时间）
                // 1) 收集显式目录的原始 mtime；2) 隐式父目录用内部文件的最大 mtime 兜底；3) 先写所有文件，最后按深度从深到浅回写目录 mtime
                const dirMtimeMap = new Map();
                for (const f of extractedFiles) {
                    if (f.dir && f.mtime) {
                        const p = targetDir + '/' + f.path;
                        const ms = f.mtime instanceof Date ? f.mtime.getTime() : Number(f.mtime);
                        if (!isNaN(ms) && ms > 0) dirMtimeMap.set(p, ms);
                    }
                }
                const explicitDirSet = new Set(dirMtimeMap.keys());
                for (const f of extractedFiles) {
                    if (f.dir) continue;
                    const fileMs = f.mtime instanceof Date ? f.mtime.getTime() : Number(f.mtime);
                    if (isNaN(fileMs) || fileMs <= 0) continue;
                    let parent = targetDir + '/' + f.path;
                    parent = parent.substring(0, parent.lastIndexOf('/'));
                    while (parent && parent.startsWith(targetDir)) {
                        if (!dirMtimeMap.has(parent)) dirMtimeMap.set(parent, fileMs);
                        else if (!explicitDirSet.has(parent)) {
                            const cur = dirMtimeMap.get(parent);
                            if (fileMs > cur) dirMtimeMap.set(parent, fileMs);
                        }
                        if (parent === targetDir) break;
                        parent = parent.substring(0, parent.lastIndexOf('/'));
                    }
                }
                let targetDirMtime = null;
                if (_topDirMtimeForTarget && !isNaN(_topDirMtimeForTarget) && _topDirMtimeForTarget > 0) {
                    targetDirMtime = _topDirMtimeForTarget;
                    // 剥离前缀时，targetDir 即为原顶层文件夹，其时间应直接使用包内顶层目录的时间
                    dirMtimeMap.set(targetDir, targetDirMtime);
                } else {
                    try {
                        const s = await new Promise(res => SYSTEM.fs.stat(filePath, (e, st) => res(st)));
                        if (s && s.mtime) targetDirMtime = s.mtime instanceof Date ? s.mtime.getTime() : Number(s.mtime);
                    } catch(e) {}
                    if (targetDirMtime && !isNaN(targetDirMtime) && targetDirMtime > 0 && !dirMtimeMap.has(targetDir)) {
                        dirMtimeMap.set(targetDir, targetDirMtime);
                    }
                }

                // JISHENG FS：全部文件和目录一次交给批量写入（根卷内每段一个事务，目录索引只写一次）。
                // 规则与以前逐个调用完全相同：目录创建失败 → 停止并报错；单个文件写入失败 → 跳过继续；
                // 文件写完后回写压缩包里记录的修改时间。
                const ops = [];
                for (const file of extractedFiles) {
                    const fullPath = targetDir + '/' + file.path;
                    if (file.dir) { ops.push({ op: 'mkdirp', path: fullPath, stop: true }); continue; }
                    ops.push({ op: 'mkdirp', path: fullPath.substring(0, fullPath.lastIndexOf('/')), stop: true });
                    ops.push({ op: 'writeFile', path: fullPath, data: file.data });
                    if (file.mtime) {
                        const mtimeMs = file.mtime instanceof Date ? file.mtime.getTime() : Number(file.mtime);
                        if (!isNaN(mtimeMs) && mtimeMs > 0) ops.push({ op: 'utimes', path: fullPath, atime: mtimeMs, mtime: mtimeMs });
                    }
                }
                const results = await SYSTEM.jfs.batch(ops, { onProgress: (done, all) => updateProgress(90 + (done / all) * 10) });
                const fatal = ops.findIndex((op, i) => op.stop && results[i] && results[i].ok === false);
                if (fatal !== -1) throw results[fatal].error;

                // 按深度从深到浅回写目录 mtime，避免被子文件创建刷为最新
                const sortedDirs = Array.from(dirMtimeMap.entries()).sort((a, b) => b[0].length - a[0].length);
                await SYSTEM.jfs.batch(sortedDirs.map(([dirPath, mtimeMs]) => ({ op: 'utimes', path: dirPath, atime: mtimeMs, mtime: mtimeMs })));

                closeProgress();
                Notify.success('解压完成', `已解压 ${extractedFiles.length} 个文件到 "${folderName}"`);
                
                if (typeof refreshDesktop === 'function') refreshDesktop();
                if (typeof loadDirectory === 'function') loadDirectory(parentDir);
                // 修复(#10)：传入 parentDir，使解压后打开的文件夹窗口路径正确
                // （压缩包在子文件夹/挂载目录时也能正确显示内容）。
                if (typeof openFolderWindow === 'function') openFolderWindow(folderName, parentDir);

            } catch (e) {
                closeProgress();
                Notify.error('解压失败', e.message);
                console.error('解压错误:', e);
            }
        }

        function extractZip(filename) {
            const path = SYSTEM.desktopPath + '/' + filename.split('/').pop();
            extractArchive(path);
        }

        function extractZipFromPath(filePath) {
            extractArchive(filePath);
        }

        async function ensureDir(path) {
            // JISHENG FS：根卷路径在一个事务里逐级创建（以前每一级都要 mkdir 失败一次再 stat 一次）。
            if (SYSTEM.fs && typeof SYSTEM.fs._mkdirp === 'function' && !SYSTEM.fs._route(path).backend) {
                await SYSTEM.fs._mkdirp(path);
                return;
            }
            const parts = path.split('/').filter(p => p);
            let current = '';
            for(const part of parts) {
                current += '/' + part;
                const dir = current;
                // 修复(#19 配套)：mkdir 出错时，若该路径已存在且为目录则忽略，
                // 否则向上抛出，让调用方（如上传）能感知失败、不再写入文件。
                await new Promise((resolve, reject) => {
                    SYSTEM.fs.mkdir(dir, (err) => {
                        if(!err) { resolve(); return; }
                        SYSTEM.fs.stat(dir, (statErr, stats) => {
                            const isDir = stats && (typeof stats.isDirectory === 'function' ? stats.isDirectory() : stats.isDirectory);
                            if(!statErr && isDir) resolve();
                            else reject(err);
                        });
                    });
                });
            }
        }

        // === 文件夹窗口 (V3 风格逻辑) ===


        // === 右键菜单 ===
        // 所有右键菜单（桌面 / 图标 / 文件夹窗口 / 任务栏）都共用 #context-menu 和 showCtx(x, y)。
        // showCtx 统一负责：定位（贴边时翻转到光标另一侧，而不是压在光标下面）、危险项着色、
        // ARIA 角色、键盘操作（↑↓ Home End 回车 空格 Esc Tab）。
        const CTX = { active: -1, returnFocus: null };
        const CTX_DANGER_RE = /^(删除|永久删除|卸载挂载|忘记此文件夹|关闭窗口)/;

        function ctxItems() {
            return Array.from(document.querySelectorAll('#context-menu .context-item'))
                .filter(it => !it.classList.contains('disabled') && it.getAttribute('aria-disabled') !== 'true' && it.offsetParent !== null);
        }
        function ctxSetActive(idx, fromMouse) {
            const items = ctxItems();
            items.forEach(it => it.classList.remove('kb-active'));
            if (!items.length) { CTX.active = -1; return; }
            CTX.active = (idx + items.length) % items.length;
            const it = items[CTX.active];
            it.classList.add('kb-active');
            if (!fromMouse) it.scrollIntoView({ block: 'nearest' });
        }

        function closeCtx(opts) {
            const cm = document.getElementById('context-menu');
            if (!cm) return;
            const wasOpen = cm.classList.contains('open');
            cm.classList.remove('open');
            cm.querySelectorAll('.kb-active').forEach(it => it.classList.remove('kb-active'));
            CTX.active = -1;
            if (wasOpen && opts && opts.restoreFocus && CTX.returnFocus && CTX.returnFocus.isConnected) {
                try { CTX.returnFocus.focus({ preventScroll: true }); } catch (e) {}
            }
            if (wasOpen) CTX.returnFocus = null;
        }

        // 统一整理菜单项：危险项（旧代码用内联红色）改为 .danger，删除类操作统一标红
        function enhanceCtxItems(cm) {
            cm.setAttribute('role', 'menu');
            cm.querySelectorAll('.context-item').forEach(it => {
                it.setAttribute('role', 'menuitem');
                it.tabIndex = -1;
                const c = it.style.color || '';
                if (/win-close-red|#e81123|\bred\b/i.test(c)) { it.classList.add('danger'); it.style.color = ''; }
                else if (/accent-cyan/.test(c)) { it.classList.add('accent'); it.style.color = ''; }
                it.querySelectorAll('span[style*="win-close-red"]').forEach(sp => { it.classList.add('danger'); sp.style.color = ''; });
                const label = (it.textContent || '').trim();
                if (CTX_DANGER_RE.test(label)) it.classList.add('danger');
                if (it.classList.contains('disabled')) it.setAttribute('aria-disabled', 'true');
            });
            cm.querySelectorAll('.context-divider').forEach(d => d.setAttribute('role', 'separator'));
        }

        function showCtx(x, y, opts = {}) {
            const cm = document.getElementById('context-menu');
            setStartOpen(false);
            setCalendarOpen(false);
            enhanceCtxItems(cm);
            const ae = document.activeElement;
            CTX.returnFocus = (ae && ae !== document.body && !cm.contains(ae)) ? ae : null;

            // 先放到左上角测量真实尺寸（offsetWidth/Height 不受打开动画的 scale 影响）
            cm.classList.remove('open');
            cm.style.left = '0px';
            cm.style.top = '0px';
            cm.scrollTop = 0;
            const w = cm.offsetWidth || 240, h = cm.offsetHeight || 200;
            const vw = window.innerWidth, vh = window.innerHeight, M = 8;
            let left = x, top = y, ox = 'left', oy = 'top';
            // 右侧放不下 → 翻到光标左侧；两侧都放不下 → 贴边
            if (left + w > vw - M) { left = x - w; ox = 'right'; }
            if (left < M) { left = Math.max(M, Math.min(x, vw - w - M)); ox = 'left'; }
            // 下方放不下 → 翻到光标上方；上下都放不下 → 贴顶，菜单内部滚动
            if (top + h > vh - M) { top = y - h; oy = 'bottom'; }
            if (top < M) { top = Math.max(M, Math.min(y, vh - h - M)); oy = 'top'; }
            cm.style.left = Math.round(left) + 'px';
            cm.style.top = Math.round(top) + 'px';
            cm.style.setProperty('--cm-origin', `${oy} ${ox}`);
            void cm.offsetWidth;   // 让打开动画每次都从头播放
            cm.classList.add('open');
            CTX.active = -1;
            if (opts.keyboard) ctxSetActive(0);
        }

        // 通用：用数据描述生成菜单（任务栏菜单使用；旧菜单仍然是 innerHTML + showCtx）
        // items: [{ icon, label, act, danger, disabled }] 或 '-'（分隔线）
        function openCtxMenu(items, x, y, opts) {
            const cm = document.getElementById('context-menu');
            cm.innerHTML = items.map((it, i) => it === '-'
                ? '<div class="context-divider"></div>'

        // === 挂载本地文件夹功能 (统一文件系统架构) ===
        const MOUNTED_FOLDERS_DB = 'MountedFoldersDB';
        const MOUNTED_FOLDERS_STORE = 'folders';
        let mountedFoldersDB = null;

        async function initMountedFoldersDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(MOUNTED_FOLDERS_DB, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => { mountedFoldersDB = request.result; resolve(mountedFoldersDB); };
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(MOUNTED_FOLDERS_STORE)) {
                        db.createObjectStore(MOUNTED_FOLDERS_STORE, { keyPath: 'id' });
                    }
                };
            });
        }

        async function saveMountedFolder(folderId, folderName, dirHandle, mountPath) {
            if (!mountedFoldersDB) await initMountedFoldersDB();
            return new Promise((resolve, reject) => {
                const tx = mountedFoldersDB.transaction([MOUNTED_FOLDERS_STORE], 'readwrite');
                const store = tx.objectStore(MOUNTED_FOLDERS_STORE);
                store.put({ id: folderId, name: folderName, handle: dirHandle, mountPath: mountPath });
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function loadMountedFolders() {
            if (!mountedFoldersDB) await initMountedFoldersDB();
            return new Promise((resolve, reject) => {
                const tx = mountedFoldersDB.transaction([MOUNTED_FOLDERS_STORE], 'readonly');
                const store = tx.objectStore(MOUNTED_FOLDERS_STORE);
                const request = store.getAll();
                request.onsuccess = async () => {
                    const folders = request.result;
                    for (const folder of folders) {
                        try {
                            if (folder.handle && typeof folder.handle.queryPermission === 'function') {
                                const perm = await folder.handle.queryPermission({ mode: 'readwrite' });
                                if (perm === 'granted') {
                                    const mountPath = folder.mountPath || ('/mnt/local/' + folder.name);
                                    await mountFSA(folder.handle, mountPath, folder.id, folder.name);
                                } else {
                                    // Permission prompts require an explicit user gesture. Keep the
                                    // saved handle visible as disconnected until the user remounts or forgets it.
                                    SYSTEM.mountedFolders[folder.id] = { handle: folder.handle, name: folder.name, id: folder.id, mountPath: folder.mountPath || ('/mnt/local/' + folder.name), disconnected: true };
                                }
                            } else {
                                SYSTEM.mountedFolders[folder.id] = { handle: folder.handle, name: folder.name, id: folder.id, mountPath: folder.mountPath || ('/mnt/local/' + folder.name), disconnected: true };
                            }
                        } catch (e) {
                            SYSTEM.mountedFolders[folder.id] = { handle: folder.handle, name: folder.name, id: folder.id, mountPath: folder.mountPath || ('/mnt/local/' + folder.name), disconnected: true };
                        }
                    }
                    resolve();
                };
                request.onerror = () => reject(request.error);
            });
        }

        async function removeMountedFolder(folderId) {
            if (!mountedFoldersDB) await initMountedFoldersDB();
            return new Promise((resolve, reject) => {
                const tx = mountedFoldersDB.transaction([MOUNTED_FOLDERS_STORE], 'readwrite');
                tx.objectStore(MOUNTED_FOLDERS_STORE).delete(folderId);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        // 将 FileSystemDirectoryHandle 挂载到系统文件空间
        function mountFSA(dirHandle, mountPath, folderId, folderName) {
            return new Promise((resolve, reject) => {
                FileSystemAccessFS.Create({ handle: dirHandle }, (err, fsa) => {
                    if (err || !fsa) { reject(err || new Error('Failed to create FSA')); return; }
                    SYSTEM.rootFs.mount(mountPath, fsa);
                    SYSTEM.mountedFolders[folderId] = { handle: dirHandle, name: folderName, id: folderId, mountPath: mountPath };
                    // 兼容旧代码
                    SYSTEM.localFolders[folderId] = { handle: dirHandle, name: folderName, id: folderId, mountPath: mountPath };
                    resolve();
                });
            });
        }

                const folderName = dirHandle.name;
                const folderId = 'local-folder-' + Date.now();
                const mountPath = '/mnt/local/' + folderName;
                
                await mountFSA(dirHandle, mountPath, folderId, folderName);

        async function remountFolder(folderId, openAfterMount = false) {
            const folderInfo = SYSTEM.mountedFolders[folderId] || SYSTEM.localFolders[folderId];
            if (!folderInfo || !folderInfo.disconnected) return false;
            try {
                if (!folderInfo.handle || typeof folderInfo.handle.requestPermission !== 'function') {
                    Notify.warning('无法重新挂载', '浏览器未保存可用的文件夹授权');
                    return false;
                }
                const perm = await folderInfo.handle.requestPermission({ mode: 'readwrite' });
                if (perm !== 'granted') {
                    Notify.warning('需要授权', '未获得本地文件夹访问权限');
                    return false;
                }
                const mountPath = folderInfo.mountPath || ('/mnt/local/' + folderInfo.name);
                await mountFSA(folderInfo.handle, mountPath, folderInfo.id, folderInfo.name);
                delete SYSTEM.mountedFolders[folderInfo.id].disconnected;
                Notify.success('重新挂载成功', `已挂载: ${folderInfo.name}`);
                refreshDesktop();
                if (openAfterMount) {
                    const pathParts = mountPath.split('/');
                    const fName = pathParts[pathParts.length - 1];
                    const parentPath = pathParts.slice(0, -1).join('/') || '/';
                    openFolderWindow(fName, parentPath);
                }
                return true;
            } catch (e) {
                console.error('重新挂载失败:', e);
                Notify.error('重新挂载失败', e.message || String(e));
                return false;
            }
        }

        async function openLocalFolder(folderId) {

            if (!folderInfo) {

                return;
            }
            if (folderInfo.disconnected) {
                await remountFolder(folderId, true);
                return;
            }
            const mountPath = folderInfo.mountPath || ('/mnt/local/' + folderInfo.name);
            const pathParts = mountPath.split('/');
            const folderName = pathParts[pathParts.length - 1];
            const parentPath = pathParts.slice(0, -1).join('/') || '/';
            openFolderWindow(folderName, parentPath);
        }

                // 递归导出目录
        async function exportDirectoryRecursive(dirHandle, destPath) {
            return new Promise((resolve, reject) => {
                SYSTEM.fs.mkdir(destPath, async (err) => {
                    if (err && err.code !== 'EEXIST') {
                        reject(err);
                        return;
                    }
                    
                    try {
                        for await (const [name, handle] of dirHandle.entries()) {
                            const itemPath = destPath + '/' + name;
                            
                            if (handle.kind === 'file') {
                                const file = await handle.getFile();
                                const content = await file.arrayBuffer();
                                await new Promise((res, rej) => {
                                    SYSTEM.fs.writeFile(itemPath, Buffer.from(content), (e) => {
                                        if (e) rej(e);
                                        else res();
                                    });
                                });
                            } else {
                                await exportDirectoryRecursive(handle, itemPath);
                            }
                        }
                        resolve();
                    } catch (e) {
                        reject(e);
                    }
                });
            });
        }

        function downloadFolderItem(windowId, filename) {
            const contentArea = document.getElementById('folder-content-' + windowId);

            const state = SYSTEM.folderWindowStates?.[windowId];
            const folderName = state ? state.folderName : contentArea.closest('.window').querySelector('.window-title-text').innerText;

        function downloadFileInternal(filePath, filename) {
            SYSTEM.fs.stat(filePath, (err, stats) => {
                if(err) {
                    return;
                }
                
                if(stats.isDirectory()) {
                    // 文件夹：打包为 zip 下载
                    const zip = new JSZip();
                    const folderDate = prepareZipWriteDate(new Date(stats.mtime || Date.now()));
                    try { zip.file(filename + "/", "", { dir: true, date: folderDate }); } catch(e) {}
                    const rootFolder = zip.folder(filename);
                    try { const fe = zip.files[filename + "/"]; if (fe) fe.date = folderDate; } catch(e) {}
                    addFolderToZipSync(rootFolder, filePath, () => {
                        zip.generateAsync({ type: 'blob', compression: 'DEFLATE' })
                        .then(blob => {
                            const a = document.createElement('a');
                            a.href = URL.createObjectURL(blob);
                            a.download = filename + '.zip';
                            a.click();
                            URL.revokeObjectURL(a.href);
                        });
                    });
                } else {
                    // 普通文件：直接下载
                    SYSTEM.fs.readFile(filePath, (err, data) => {
                        if(err) {
                            return;
                        }
                        const blob = new Blob([data]);
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = filename;
                        a.click();
                        URL.revokeObjectURL(a.href);
                    });
                }
            });
        }

        function downloadSelectedFiles() {
            const selectedIds = SYSTEM.selectedIcons.filter(id => id.startsWith('file-'));
            if(selectedIds.length === 0) return;
            
            const files = selectedIds.map(id => {
                const el = document.getElementById(id);
                return el ? el.dataset.filename : null;
            }).filter(f => f);
            
            if(files.length === 0) return;
            
            if(files.length === 1) {
                downloadFile(files[0]);
                return;
            }
            
            const zip = new JSZip();
            let processedCount = 0;
            
            files.forEach(filename => {
                const filePath = SYSTEM.desktopPath + '/' + filename;
                SYSTEM.fs.stat(filePath, (err, stats) => {
                    if(err) {
                        processedCount++;
                        if(processedCount === files.length) {
                            generateAndDownloadZip(zip, 'selected_files');
                        }
                        return;
                    }
                    
                    if(stats.isDirectory()) {
                        const folderDate = prepareZipWriteDate(new Date(stats.mtime || Date.now()));
                        try { zip.file(filename + "/", "", { dir: true, date: folderDate }); } catch(e) {}
                        const folder = zip.folder(filename);
                        try { const fe = zip.files[filename + "/"]; if (fe) fe.date = folderDate; } catch(e) {}
                        addFolderToZipSync(folder, filePath, () => {
                            processedCount++;
                            if(processedCount === files.length) {
                                generateAndDownloadZip(zip, 'selected_files');
                            }
                        });
                    } else {
                        SYSTEM.fs.readFile(filePath, (err, data) => {
                            if(!err) {
                                zip.file(filename, data, { date: prepareZipWriteDate(new Date(stats.mtime || Date.now())) });
                            }
                            processedCount++;
                            if(processedCount === files.length) {
                                generateAndDownloadZip(zip, 'selected_files');
                            }
                        });
                    }
                });
            });
        }

        function startFilter(raw) {

            document.querySelectorAll('#start-menu .menu-item').forEach(it => {
                const hay = (it.textContent + ' ' + (it.dataset.keywords || '')).toLowerCase();
                const match = !q || hay.includes(q);
                it.classList.toggle('sm-filtered', !match);
                it.classList.remove('sm-first');

            if (!menu) return;
            menu.addEventListener('click', e => {
                const t = e.target.closest('[data-launch]');
                if (!t) return;
                const fn = window[t.dataset.launch];
                setStartOpen(false);
                if (typeof fn === 'function') fn();
            });
            if (input) {
                input.addEventListener('input', () => startFilter(input.value));
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const first = startVisibleItems()[0];
                        if (first && input.value.trim()) first.click();
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        const first = startVisibleItems()[0];
                        if (first) first.focus();
                    }
                });
            }
            // 图标之间的方向键导航（3 列网格）
            menu.querySelector('.menu-grid').addEventListener('keydown', e => {
                const items = startVisibleItems();
                const i = items.indexOf(document.activeElement);
                if (i < 0) return;
                const cols = getComputedStyle(e.currentTarget).gridTemplateColumns.split(' ').length || 3;
                let j = null;
                if (e.key === 'ArrowRight') j = Math.min(items.length - 1, i + 1);
                else if (e.key === 'ArrowLeft') j = Math.max(0, i - 1);
                else if (e.key === 'ArrowDown') j = Math.min(items.length - 1, i + cols);
                else if (e.key === 'ArrowUp') { if (i - cols < 0) { e.preventDefault(); input && input.focus(); return; } j = i - cols; }
                else if (e.key === 'Home') j = 0;
                else if (e.key === 'End') j = items.length - 1;
                else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && e.key !== ' ' && input) { input.focus(); return; }  // 直接打字 = 搜索
